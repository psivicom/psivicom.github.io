<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WENDY // Voice & Text Cognitive Interface</title>
  <style>
    :root {
      --bg: #07090e;
      --card: #0f141f;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.4);
      --text: #e2e8f0;
      --text-muted: #8492a6;
      --wendy-msg: #162032;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    
    header { width: 100%; max-width: 800px; padding: 1.2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }
    .logo { font-weight: 700; letter-spacing: 2px; color: var(--accent); font-size: 1.1rem; }
    .status-badge { font-size: 0.75rem; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }

    /* Neural Orb Visualizer */
    .orb-container { display: flex; flex-direction: column; align-items: center; margin: 1.2rem 0; }
    .orb { width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, var(--accent) 0%, rgba(0,240,255,0.1) 70%, transparent 100%); box-shadow: 0 0 35px var(--accent-glow); transition: all 0.3s ease; animation: pulse 3s infinite ease-in-out; }
    .orb.listening { background: radial-gradient(circle, #ff0055 0%, rgba(255,0,85,0.2) 70%, transparent 100%); box-shadow: 0 0 50px rgba(255,0,85,0.6); animation: pulse-fast 1s infinite ease-in-out; }
    .orb.speaking { background: radial-gradient(circle, #00ff88 0%, rgba(0,255,136,0.2) 70%, transparent 100%); box-shadow: 0 0 50px rgba(0,255,136,0.6); animation: speak-glow 1.2s infinite alternate; }
    
    @keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes pulse-fast { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1.15); } }
    @keyframes speak-glow { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.1); filter: brightness(1.3); } }

    /* Dialogue Window */
    .dialogue-window { width: 100%; max-width: 800px; flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 80%; padding: 12px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #000; font-weight: 500; border-bottom-right-radius: 4px; }
    .msg.wendy { align-self: flex-start; background: var(--wendy-msg); border: 1px solid rgba(255,255,255,0.06); border-bottom-left-radius: 4px; }
    .msg.wendy pre { background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; margin-top: 8px; font-family: monospace; color: var(--accent); font-size: 0.9rem; overflow-x: auto; }

    /* Controls Bar */
    .controls { width: 100%; max-width: 800px; padding: 1.2rem; display: flex; gap: 0.75rem; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); }
    input[type="text"] { flex: 1; background: var(--card); border: 1px solid rgba(255,255,255,0.15); padding: 14px 18px; border-radius: 30px; color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    input[type="text"]:focus { border-color: var(--accent); }
    
    button { background: var(--card); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 14px 18px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 600; transition: all 0.2s; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.mic-btn.active { background: #ff0055; border-color: #ff0055; color: #fff; }
    button.send-btn { background: var(--accent); color: #000; border: none; }
    button.send-btn:hover { background: #00c7d4; color: #000; }
  </style>
</head>
<body>

  <header>
    <a href="/" class="back-link">← Return to PSIVI.COM</a>
    <div class="logo">WENDY // COGNITIVE CORE</div>
    <div class="status-badge" id="voiceStatus">Voice + Text Active</div>
  </header>

  <div class="orb-container">
    <div class="orb" id="orb"></div>
  </div>

  <div class="dialogue-window" id="chat">
    <div class="msg wendy">
      Hello! I am WENDY, your autonomous cognitive AI on <code>psivi.com</code>. 
      You can type or speak to me directly. Try: <em>"What is (1+√5)÷2?"</em>
    </div>
  </div>

  <div class="controls">
    <button class="mic-btn" id="micBtn" title="Hold or Toggle Voice">🎤 Voice</button>
    <input type="text" id="userInput" placeholder="Ask WENDY an equation or question..." autocomplete="off">
    <button class="send-btn" id="sendBtn">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const orb = document.getElementById('orb');
    const voiceStatus = document.getElementById('voiceStatus');

    let isListening = false;

    // 1. Math & Cognitive Engine
    function evaluateQuery(text) {
      const clean = text.toLowerCase().trim();

      // Golden ratio detection: (1+√5)/2 or (1+sqrt(5))/2
      if (clean.includes("1+√5") || clean.includes("1+sqrt(5)") || clean.includes("golden ratio") || clean.includes("phi")) {
        const phi = (1 + Math.sqrt(5)) / 2;
        return {
          spoken: `The result is approximately ${phi.toFixed(6)}. That is the Golden Ratio, denoted by the Greek letter Phi.`,
          display: `<strong>Mathematical Derivation:</strong> (1 + √5) ÷ 2<br>` +
                   `<strong>Value (Φ):</strong> ${phi}<br>` +
                   `<pre>Minimal Polynomial: x² - x - 1 = 0\n` +
                   `Continued Fraction: [1; 1, 1, 1, 1, ...]\n` +
                   `Substrate Role: Used in WENDY's spiral memory ring buffers.</pre>`
        };
      }

      // General math evaluator
      try {
        let mathStr = clean.replace(/÷/g, '/').replace(/×/g, '*').replace(/√/g, 'Math.sqrt');
        mathStr = mathStr.replace(/sqrt\(([^)]+)\)/g, 'Math.sqrt($1)');
        mathStr = mathStr.replace(/calculate|what is|compute|solve/g, '').replace(/\?/g, '').trim();

        if (/^[0-9+\-*/().\sMath.sqrt]+$/.test(mathStr)) {
          const val = Function(`'use strict'; return (${mathStr})`)();
          return {
            spoken: `The answer is ${val}`,
            display: `<strong>Result:</strong> ${val}`
          };
        }
      } catch (e) {}

      // Default cognitive response
      return {
        spoken: `I have ingested your query into my cognitive loop.`,
        display: `Perception loop processed: "${text}".`
      };
    }

    // 2. Add Message to UI
    function appendMsg(sender, htmlContent) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerHTML = htmlContent;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    // 3. Speech Synthesis (WENDY Speaks Aloud)
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.05;
      utterance.rate = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.name.includes("Google") || v.name.includes("Samantha") || v.name.includes("Natural"));
      if (preferred) utterance.voice = preferred;

      utterance.onstart = () => orb.className = 'orb speaking';
      utterance.onend = () => orb.className = 'orb';
      utterance.onerror = () => orb.className = 'orb';

      window.speechSynthesis.speak(utterance);
    }

    // 4. Handle Submissions
    function handleQuery(text) {
      if (!text.trim()) return;
      appendMsg('user', text);
      userInput.value = '';

      const response = evaluateQuery(text);
      setTimeout(() => {
        appendMsg('wendy', response.display);
        speak(response.spoken);
      }, 250);
    }

    sendBtn.addEventListener('click', () => handleQuery(userInput.value));
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleQuery(userInput.value);
    });

    // 5. Speech Recognition (WENDY Listens to Voice)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('active');
        orb.className = 'orb listening';
        voiceStatus.innerText = 'Listening...';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        handleQuery(transcript);
      };

      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('active');
        orb.className = 'orb';
        voiceStatus.innerText = 'Voice + Text Active';
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
        orb.className = 'orb';
        voiceStatus.innerText = 'Voice + Text Active';
      };

      micBtn.addEventListener('click', () => {
        if (isListening) {
          recognition.stop();
        } else {
          recognition.start();
        }
      });
    } else {
      micBtn.style.display = 'none';
      voiceStatus.innerText = 'Text Mode (Browser speech unsupported)';
    }
  </script>
</body>
</html>
