<title>WENDY &mdash; Sovereign Voice Face | PSIVI.COM</title>
<meta name="description" content="WENDY: sovereign browser face. Local Whisper ears, WebGPU reflex brain, spoken voice. No cloud. No keys. RFC 1001 sensory organ of PSIVI.COM.">
<style>
  :root{
    --navy:#0A1931; --navy-2:#0d2145; --ink:#060f20;
    --cyan:#00D4FF; --cyan-soft:rgba(0,212,255,.14); --klein:#002FA7;
    --text:#e4e4e7; --dim:#71717a; --bright:#fafafa;
    --ok:#2fd575; --warn:#ffb454; --err:#ff6b6b;
    --mono:ui-monospace,'Optimistic Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Optimistic',system-ui,-apple-system,'Segoe UI',sans-serif;
    --serif:'IBM Plex Serif',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(0,47,167,.22), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(0,212,255,.07), transparent 55%),
      var(--navy);
    color:var(--text); font-family:var(--sans);
    display:flex; flex-direction:column; min-height:100dvh;
  }
  /* ---- header ---- */
  header{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:14px 18px; border-bottom:1px solid rgba(0,212,255,.16);
    background:linear-gradient(180deg, rgba(0,212,255,.05), transparent);
  }
  .sigil{
    width:34px;height:34px;border-radius:9px;flex:0 0 auto;
    background:conic-gradient(from 210deg, var(--klein), var(--cyan), var(--klein));
    box-shadow:0 0 18px rgba(0,212,255,.35), inset 0 0 8px rgba(0,0,0,.5);
  }
  h1{font-size:17px;letter-spacing:.24em;font-weight:600;color:var(--bright)}
  h1 small{display:block;font-size:10px;letter-spacing:.32em;color:var(--cyan);font-weight:500;margin-top:2px}
  .spacer{flex:1}
  .chip{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    border:1px solid rgba(0,212,255,.25);border-radius:999px;
    padding:5px 11px;color:var(--cyan);background:var(--cyan-soft);
    white-space:nowrap;
  }
  .chip b{color:var(--bright);font-weight:600}
  #zulu{min-width:21ch;text-align:right}
  /* ---- banner ---- */
  #banner{display:none;padding:10px 18px;font-family:var(--mono);font-size:12px;line-height:1.5}
  #banner.warn{display:block;background:rgba(255,180,84,.09);color:var(--warn);border-bottom:1px solid rgba(255,180,84,.25)}
  #banner a{color:var(--cyan)}
  /* ---- main ---- */
  main{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;padding:16px 18px;max-width:1180px;width:100%;margin:0 auto}
  @media(max-width:880px){ main{grid-template-columns:1fr} }
  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0)) , var(--navy-2);
    border:1px solid rgba(0,212,255,.14); border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.35); overflow:hidden; display:flex; flex-direction:column;
  }
  .panel h2{
    font-size:10.5px;letter-spacing:.3em;color:var(--dim);font-weight:600;
    padding:11px 16px;border-bottom:1px solid rgba(0,212,255,.10);
    display:flex;align-items:center;gap:8px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);box-shadow:0 0 8px currentColor;flex:0 0 auto}
  .dot.live{background:var(--cyan);color:var(--cyan);animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* orb + stage */
  #stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 8px}
  #orbWrap{position:relative;width:min(210px,52vw);aspect-ratio:1}
  #orb{width:100%;height:100%;display:block}
  #orbState{
    position:absolute;inset:auto 0 -6px 0;text-align:center;
    font-family:var(--mono);font-size:11px;letter-spacing:.42em;color:var(--cyan);
  }
  /* chat */
  #chat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;min-height:180px}
  .turn{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.55;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  .turn.you{align-self:flex-end;background:var(--klein);color:var(--bright);border-bottom-right-radius:4px}
