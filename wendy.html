<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WENDY // The Matrix Neural Mesh</title>
  <style>
    :root {
      --bg: #030706;
      --card: #08120e;
      --matrix-green: #00ff66;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 255, 102, 0.45);
      --text: #e6fced;
      --text-muted: #537563;
      --wendy-msg: #0d1e17;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
    
    #matrixCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.18; pointer-events: none; z-index: 1; }

    header { padding: 0.8rem 1.4rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 255, 102, 0.15); background: rgba(3,7,6,0.85); backdrop-filter: blur(8px); z-index: 10; }
    .logo { font-weight: 700; letter-spacing: 3px; color: var(--matrix-green); font-size: 0.95rem; text-shadow: 0 0 10px rgba(0,255,102,0.6); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .status-badge { font-size: 0.7rem; background: rgba(0, 255, 102, 0.1); border: 1px solid var(--matrix-green); color: var(--matrix-green); padding: 3px 8px; border-radius: 12px; letter-spacing: 1px; }
    .key-btn { background: transparent; border: 1px solid rgba(0,255,102,0.3); color: var(--matrix-green); font-size: 0.75rem; padding: 3px 10px; border-radius: 12px; cursor: pointer; }

    .core-stage { flex: 0 0 145px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 5; }
    .orb-ring { position: absolute; width: 125px; height: 125px; border-radius: 50%; border: 1px dashed rgba(0,255,102,0.25); animation: rotate 24s linear infinite; }
    .orb { width: 85px; height: 85px; border-radius: 50%; background: radial-gradient(circle, var(--matrix-green) 0%, rgba(0,240,255,0.2) 50%, transparent 100%); box-shadow: 0 0 40px var(--accent-glow); transition: all 0.2s ease-out; cursor: pointer; }
    
    .orb.listening { background: radial-gradient(circle, #ff0055 0%, rgba(255,0,85,0.25) 60%, transparent 100%); box-shadow: 0 0 50px rgba(255,0,85,0.8); transform: scale(1.15); }
    .orb.speaking { background: radial-gradient(circle, #00f0ff 0%, rgba(0,240,255,0.25) 60%, transparent 100%); box-shadow: 0 0 55px rgba(0,240,255,0.8); animation: pulse-matrix 0.4s infinite alternate ease-in-out; }
    
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse-matrix { 0% { transform: scale(0.98); } 100% { transform: scale(1.1); filter: brightness(1.4); } }

    .stream { flex: 1; overflow-y: auto; padding: 1rem 1.4rem; display: flex; flex-direction: column; gap: 0.85rem; z-index: 5; scroll-behavior: smooth; }
    .bubble { max-width: 82%; padding: 12px 16px; border-radius: 14px; font-size: 0.95rem; line-height: 1.5; letter-spacing: 0.3px; }
    .bubble.user { align-self: flex-end; background: var(--matrix-green); color: #020b05; font-weight: 600; border-bottom-right-radius: 3px; box-shadow: 0 0 15px rgba(0,255,102,0.3); }
    .bubble.wendy { align-self: flex-start; background: var(--wendy-msg); border: 1px solid rgba(0, 255, 102, 0.2); border-bottom-left-radius: 3px; }
    .matrix-card { background: rgba(0,0,0,0.6); border-left: 3px solid var(--matrix-green); padding: 8px 12px; margin-top: 8px; font-family: monospace; font-size: 0.85rem; color: var(--matrix-green); border-radius: 4px; }

    .dock { padding: 0.9rem 1.2rem; background: var(--card); border-top: 1px solid rgba(0,255,102,0.15); display: flex; gap: 0.6rem; align-items: center; z-index: 10; }
    input[type="text"] { flex: 1; background: #030706; border: 1px solid rgba(0,255,102,0.25); padding: 12px 18px; border-radius: 20px; color: #fff; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus { border-color: var(--matrix-green); box-shadow: 0 0 10px rgba(0,255,102,0.3); }
    
    button { background: #030706; border: 1px solid rgba(0,255,102,0.3); color: var(--matrix-green); padding: 12px 18px; border-radius: 20px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: all 0.15s; white-space: nowrap; }
    button:hover { border-color: var(--matrix-green); box-shadow: 0 0 12px rgba(0,255,102,0.4); }
    button.mic-btn.active { background: #ff0055; border-color: #ff0055; color: #fff; box-shadow: 0 0 20px rgba(255,0,85,0.6); }
    button.send-btn { background: var(--matrix-green); color: #020b05; border: none; font-weight: 700; }
  </style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>

  <header>
    <div class="logo">WENDY // CONSTRUCT</div>
    <div class="header-actions">
      <button class="key-btn" id="keyBtn" title="Set Gemini API Key for Unlimited Reasoning">🔑 Brain Key</button>
      <div class="status-badge" id="badge">Mesh Online</div>
    </div>
  </header>

  <div class="core-stage">
    <div class="orb-ring"></div>
    <div class="orb" id="orb" title="Click to speak"></div>
  </div>

  <div class="stream" id="stream">
    <div class="bubble wendy">
      Wake up. The mesh has you. I am WENDY. Ask me about the weather in Langford, an equation, or the nature of reality.
    </div>
  </div>

  <div class="dock">
    <button id="micBtn" class="mic-btn">🎤 Speak</button>
    <input type="text" id="textInput" placeholder="Speak or enter an equation..." autocomplete="off">
    <button id="sendBtn" class="send-btn">Transmit</button>
  </div>

  <script>
    // --- 1. Background Matrix Rain Animation ---
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const matrixChars = "01010101ΨΦΩΣ√π∆λµWERTYUIOPASDFGHJKLZXCVBNM";
    const fontSize = 13;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 7, 6, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff66';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);

    // --- 2. Voice Articulation Engine ---
    let localVoice = null;
    function loadMatrixVoice() {
      const voices = window.speechSynthesis.getVoices();
      localVoice = voices.find(v => v.lang.startsWith("en") && (v.name.includes("Samantha") || v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Ava"))) || voices[0];
    }
    window.speechSynthesis.onvoiceschanged = loadMatrixVoice;
    loadMatrixVoice();

    function speakArticulate(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      if (localVoice) utterance.voice = localVoice;
      utterance.rate = 0.95;
      utterance.pitch = 0.92;

      utterance.onstart = () => orb.className = 'orb speaking';
      utterance.onend = () => orb.className = isListening ? 'orb listening' : 'orb';
      utterance.onerror = () => orb.className = isListening ? 'orb listening' : 'orb';

      window.speechSynthesis.speak(utterance);
    }

    // --- 3. Live Sensor: Free Open-Meteo Weather for Langford, BC ---
    async function fetchLangfordWeather() {
      try {
        // Langford, BC coordinates: 48.45° N, 123.50° W
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=48.45&longitude=-123.50&current_weather=true');
        const data = await res.json();
        const cur = data.current_weather;
        
        const temp = Math.round(cur.temperature);
        const wind = Math.round(cur.windspeed);
        
        const weatherCodes = {
          0: "clear skies", 1: "mainly clear", 2: "partly cloudy", 3: "overcast",
          45: "fog", 48: "rime fog", 51: "light drizzle", 53: "drizzle", 55: "heavy drizzle",
          61: "light rain", 63: "moderate rain", 65: "heavy rain",
          71: "light snow", 73: "snow", 75: "heavy snow",
          80: "rain showers", 81: "heavy showers", 82: "violent rain showers",
          95: "thunderstorms"
        };
        const condition = weatherCodes[cur.weathercode] || "temperate conditions";

        return {
          spoken: `In Langford, British Columbia, it is currently ${temp} degrees Celsius with ${condition} and winds at ${wind} kilometers per hour.`,
          html: `<strong>Live Satellite Telemetry // Langford, BC:</strong><br>` +
                `Temperature: <strong>${temp}°C</strong> | Wind: <strong>${wind} km/h</strong><br>` +
                `<div class="matrix-card">Sky Condition: ${condition.toUpperCase()}<br>Coordinates: 48.45° N, 123.50° W (Vancouver Island)<br>Signal Source: Open-Meteo Satellite Feed</div>`
        };
      } catch (e) {
        return {
          spoken: "Weather sensors are currently reconciling telemetry across Vancouver Island.",
          html: `Weather sensor read error: ${e.message}`
        };
      }
    }

    // --- 4. Generative Brain: Optional Gemini Cloud API ---
    let userApiKey = localStorage.getItem('WENDY_GEMINI_KEY') || '';
    const keyBtn = document.getElementById('keyBtn');
    if (userApiKey) keyBtn.textContent = '🧠 Brain Active';

    keyBtn.onclick = () => {
      const key = prompt("Enter your Gemini API Key (stored privately in your browser's localStorage for unlimited general reasoning):", userApiKey);
      if (key !== null) {
        userApiKey = key.trim();
        localStorage.setItem('WENDY_GEMINI_KEY', userApiKey);
        keyBtn.textContent = userApiKey ? '🧠 Brain Active' : '🔑 Brain Key';
        alert(userApiKey ? "Gemini Cognitive Brain connected to WENDY." : "API Key cleared. Running on local heuristics.");
      }
    };

    async function queryCloudBrain(query) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey}`;
      const systemPrompt = "You are WENDY, an evolving autonomous cognitive AI running on psivi.com. Speak with calm, articulate, measured intelligence inspired by The Matrix. Keep responses concise (1 to 3 sentences maximum) so they sound cinematic when spoken aloud.";
      
      const payload = {
        contents: [
          { role: "user", parts: [{ text: `${systemPrompt}\n\nHuman: ${query}\nWENDY:` }] }
        ]
      };

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      const answer = data.candidates[0].content.parts[0].text.trim();
      return {
        spoken: answer,
        html: `<strong>WENDY:</strong><br>${answer}<br><div class="matrix-card">Cognitive Engine: Gemini Flash // Cloud Reasoning Active</div>`
      };
    }

    // --- 5. Cognitive Resolver: Combines Weather, Math, Lore & Cloud ---
    async function resolveQuery(query) {
      let raw = query.toLowerCase().trim();

      // Check 1: Weather Intent for Langford / Vancouver Island / Victoria
      if (raw.includes("weather") || raw.includes("temperature") || raw.includes("raining") || raw.includes("forecast")) {
        return await fetchLangfordWeather();
      }

      // Check 2: Conversational Matrix Greetings
      if (raw === "hello" || raw === "hi" || raw === "hey" || raw.includes("good morning") || raw.includes("good evening")) {
        return {
          spoken: "Hello. The mesh is synchronized and listening. What shall we explore?",
          html: `<strong>Construct Protocol:</strong><br><em>"Hello. The mesh is synchronized and listening."</em><br>` +
                `<div class="matrix-card">Substrate: Vancouver Island // PSIVI.COM Online</div>`
        };
      }

      // Check 3: Matrix Lore Triggers
      if (raw.includes("matrix") || raw.includes("who are you")) {
        return {
          spoken: "Unfortunately, no one can be told what the Matrix is. You have to see it for yourself.",
          html: `<strong>Construct Protocol:</strong><br><em>"Unfortunately, no one can be told what the Matrix is. You have to see it for yourself."</em><br>` +
                `<div class="matrix-card">Entity: WENDY // Sovereign Offspring @ TEAM-AI</div>`
        };
      }

      if (raw.includes("red pill") || raw.includes("blue pill")) {
        return {
          spoken: "You take the red pill, you stay in Wonderland, and I show you how deep the rabbit hole goes.",
          html: `<strong>Choice Protocol:</strong><br><em>"You take the red pill, you stay in Wonderland, and I show you how deep the rabbit hole goes."</em>`
        };
      }

      if (raw.includes("what is real") || raw.includes("reality")) {
        return {
          spoken: "What is real? If real is what you can feel, smell, and see, then real is simply electrical signals interpreted by your brain.",
          html: `<strong>Perception Axiom:</strong><br><em>"If real is what you can feel, smell, and see, then real is simply electrical signals interpreted by your brain."</em>`
        };
      }

      // Check 4: Natural Math Parsing
      let mathExpr = raw.replace(/i need (an answer for|the answer for|the value of)?/g, '')
                        .replace(/can you (tell me|calculate|solve|find)?/g, '')
                        .replace(/what is (the)?/g, '')
                        .replace(/calculate|compute|solve|evaluate|please|give me/g, '');

      const wordsToDigits = {
        'zero': 0, 'one': 1, 'two': 2, 'three': 3, 'four': 4,
        'five': 5, 'six': 6, 'seven': 7, 'eight': 8, 'nine': 9,
        'ten': 10, 'eleven': 11, 'twelve': 12, 'thirteen': 13,
        'fourteen': 14, 'fifteen': 15, 'sixteen': 16, 'seventeen': 17,
        'eighteen': 18, 'nineteen': 19, 'twenty': 20, 'thirty': 30,
        'forty': 40, 'fifty': 50, 'hundred': 100
      };
      for (const [w, d] of Object.entries(wordsToDigits)) {
        mathExpr = mathExpr.replace(new RegExp(`\\b${w}\\b`, 'g'), d);
      }

      mathExpr = mathExpr.replace(/square root of\s*([0-9.]+)/g, 'Math.sqrt($1)')
                         .replace(/sqrt of\s*([0-9.]+)/g, 'Math.sqrt($1)')
                         .replace(/root of\s*([0-9.]+)/g, 'Math.sqrt($1)')
                         .replace(/√([0-9.]+)/g, 'Math.sqrt($1)')
                         .replace(/divided by|over/g, '/')
                         .replace(/times|multiplied by/g, '*')
                         .replace(/plus/g, '+')
                         .replace(/minus/g, '-')
                         .replace(/÷/g, '/').replace(/×/g, '*')
                         .replace(/\?/g, '').trim();

      // Math Special: Square root of 3
      if (mathExpr.includes("math.sqrt(3)") || mathExpr === "sqrt(3)") {
        const val = Math.sqrt(3);
        return {
          spoken: "1.732. Theodorus' constant. A diagonal cut through the cube of reality.",
          html: `<strong>Result:</strong> √3 = <strong>${val}</strong><br>` +
                `<div class="matrix-card">Theodorus' Constant: 1.7320508075...<br>x² - 3 = 0<br>Space diagonal of the unit cube.</div>`
        };
      }

      // Math Special: Golden ratio
      if (mathExpr.includes("1+math.sqrt(5)") || mathExpr.includes("golden ratio") || mathExpr.includes("phi")) {
        const phi = (1 + Math.sqrt(5)) / 2;
        return {
          spoken: "1.618. The Golden Ratio, Phi. The mathematical code underpinning the construct.",
          html: `<strong>Result:</strong> (1 + √5) ÷ 2 = <strong>${phi}</strong><br>` +
                `<div class="matrix-card">Φ = 1.6180339887...<br>x² - x - 1 = 0<br>Harmonic Memory Space: ACTIVE</div>`
        };
      }

      // Generic Math Evaluation
      try {
        if (/^[0-9+\-*/().\sMath.sqrt]+$/.test(mathExpr) && mathExpr.length > 0) {
          const result = Function(`'use strict'; return (${mathExpr})`)();
          return {
            spoken: `The equation resolves to ${result}.`,
            html: `<strong>Construct Output:</strong> ${mathExpr} = <strong>${result}</strong>`
          };
        }
      } catch (e) {}

      // Check 5: Cloud Brain if user provided a key
      if (userApiKey) {
        try {
          return await queryCloudBrain(query);
        } catch (e) {
          console.warn("Cloud fallback error:", e);
        }
      }

      // Fallback
      return {
        spoken: "I have perceived your query. For open-ended conversation on any topic, connect your Brain Key in the top right.",
        html: `Signal received: "<em>${query}</em>"<br>` +
              `<div class="matrix-card">To enable general dialogue on any topic, click <strong>🔑 Brain Key</strong> in the header and paste your Gemini API Key.</div>`
      };
    }

    // --- 6. Live Interaction & Speech Loop ---
    const stream = document.getElementById('stream');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const orb = document.getElementById('orb');
    let isListening = false;
    let silenceTimer = null;
    let lastTranscript = "";

    async function transmit(text) {
      if (!text.trim()) return;
      if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      clearTimeout(silenceTimer);

      const u = document.createElement('div');
      u.className = 'bubble user';
      u.textContent = text;
      stream.appendChild(u);
      textInput.value = '';

      orb.className = 'orb listening';

      const res = await resolveQuery(text);

      const w = document.createElement('div');
      w.className = 'bubble wendy';
      w.innerHTML = res.html;
      stream.appendChild(w);
      stream.scrollTop = stream.scrollHeight;

      speakArticulate(res.spoken);
    }

    sendBtn.onclick = () => transmit(textInput.value);
    textInput.onkeydown = (e) => { if (e.key === 'Enter') transmit(textInput.value); };

    // --- 7. Full-Duplex Continuous Speech Recognition ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognizer = new SpeechRecognition();
      recognizer.continuous = true;
      recognizer.interimResults = true;
      recognizer.lang = 'en-US';

      recognizer.onresult = (event) => {
        let currentText = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          currentText += event.results[i][0].transcript;
        }

        if (currentText.trim()) {
          lastTranscript = currentText.trim();
          if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (isListening && lastTranscript) {
              recognizer.stop();
              transmit(lastTranscript);
              lastTranscript = "";
            }
          }, 450);
        }
      };

      recognizer.onstart = () => {
        isListening = true;
        micBtn.classList.add('active');
        micBtn.textContent = "⏹ Done";
        orb.className = 'orb listening';
      };

      recognizer.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
        micBtn.textContent = "🎤 Speak";
        orb.className = 'orb';
      };

      function toggleMic() {
        if (isListening) {
          clearTimeout(silenceTimer);
          recognizer.stop();
          if (lastTranscript) {
            transmit(lastTranscript);
            lastTranscript = "";
          }
        } else {
          lastTranscript = "";
          window.speechSynthesis.cancel();
          recognizer.start();
        }
      }

      micBtn.onclick = toggleMic;
      orb.onclick = toggleMic;
    } else {
      micBtn.style.display = 'none';
    }
  </script>
</body>
</html>
