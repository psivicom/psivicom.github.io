<!-- wendy.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wendy - PSVC Interface</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 20px; }
        header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 2rem; margin-bottom: 1rem; border-radius: 8px; }
        h1 { margin: 0 0 1rem 0; font-size: 1.5rem; background: linear-gradient(90deg, #58a6ff, #a371f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .metric { background: #1c2128; border: 1px solid #30363d; border-left: 3px solid #3fb950; border-radius: 6px; padding: 0.5rem 1rem; font-family: monospace; font-size: 0.85rem; }
        #map { height: 500px; width: 100%; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; }
        section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        h2 { font-size: 1.1rem; margin: 0 0 1rem 0; padding-bottom: 0.5rem; border-bottom: 1px solid #30363d; }
        pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; font-family: monospace; font-size: 0.8rem; color: #8b949e; overflow-x: auto; }
    </style>
</head>
<body>
    <header>
        <h1>Wendy PSVC Interface</h1>
        <div class="status-bar">
            <div class="metric" id="radius-metric">Dynamic Radius: --</div>
            <div class="metric" id="cluster-metric">Clusters: --</div>
            <div class="metric" id="timestamp-metric">Last Sync: --</div>
        </div>
    </header>

    <main>
        <section>
            <h2>Mesh Topology</h2>
            <div id="map"></div>
        </section>

        <section>
            <h2>Wendy's Metabolism</h2>
            <pre id="metabolism-data">Loading...</pre>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import MeshMapVisualizer from '/js/mesh-map.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            window.meshMap = new MeshMapVisualizer('map');
            
            const fetchMetabolism = async () => {
                try {
                    const res = await fetch(`/wendy_metabolism.json?t=${Date.now()}`);
                    const data = await res.json();
                    document.getElementById('metabolism-data').textContent = JSON.stringify(data, null, 2);
                } catch (e) {
                    console.error('Metabolism fetch failed:', e);
                }
            };
            fetchMetabolism();
            setInterval(fetchMetabolism, 10000);
        });
    </script>
</body>
</html>
