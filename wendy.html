<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL FOR MOBILE: Prevents zooming issues and ensures proper scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PSIVI | WENDY MISSION CONTROL</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0a0a0a;
            --border-color: #333;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent-green: #00ff41; /* Terminal Green */
            --accent-red: #ff3333;   /* Alert Red */
            --accent-blue: #00ccff;  /* Data Blue */
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* Allow vertical scroll, hide horizontal */
        }

        /* HEADER */
        header {
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #111, #050505);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (min-width: 768px) {
            h1 { font-size: 1.2rem; letter-spacing: 2px; }
            header { padding: 1rem 2rem; }
        }

        .status-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            animation: pulse-border 2s infinite;
            white-space: nowrap;
        }
        
        .status-badge.error {
            border-color: var(--accent-red);
            color: var(--accent-red);
            animation: none;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 65, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0); }
        }

        /* MAIN GRID */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr; 
            gap: 1rem;
            padding: 1rem;
            width: 100%;
        }

        @media (min-width: 768px) {
            main {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 1.5rem;
                padding: 2rem;
            }
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: border-color 0.3s ease;
            min-height: 120px;
        }

        .card:hover {
            border-color: var(--accent-blue);
        }

        .card-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: auto;
            word-break: break-word;
        }

        @media (min-width: 768px) {
            .card-value { font-size: 2rem; }
        }

        .card-sub {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* SPECIFIC CARDS */
        .breath-card {
            grid-column: 1 / -1; 
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: space-between;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .breath-card {
                flex-direction: row;
                align-items: center;
            }
        }

        .visualizer-container {
            width: 100%;
            height: 150px;
            position: relative;
            background: #000;
            border: 1px solid #222;
            border-radius: 4px;
            overflow: hidden;
            order: 2;
        }

        @media (min-width: 768px) {
            .visualizer-container {
                height: 100px;
                order: 0;
                flex: 1;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .metrics-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            order: 1;
        }

        @media (min-width: 768px) {
            .metrics-row {
                flex-direction: column;
                justify-content: center;
                width: 200px;
                order: 0;
            }
        }

        .metric-group {
            text-align: center;
        }

        .big-number {
            font-size: 2rem;
            line-height: 1;
            color: var(--accent-green);
        }

        @media (min-width: 768px) {
            .big-number { font-size: 3rem; }
        }

        .unit {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* LOG CONSOLE */
        .console-card {
            grid-column: 1 / -1;
            height: 200px;
            background: #000;
            border: 1px solid #333;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent-green);
            overflow-y: scroll;
            padding: 0.5rem;
            border-radius: 4px;
        }

        @media (min-width: 768px) {
            .console-card {
                font-size: 0.85rem;
                padding: 1rem;
            }
        }

        .log-entry {
            margin-bottom: 0.4rem;
            opacity: 0.8;
            word-wrap: break-word;
        }
        .log-entry:last-child { opacity: 1; font-weight: bold; }
        .log-time { color: var(--text-secondary); margin-right: 0.5rem; }
        .log-msg { color: var(--text-primary); }
        .log-error { color: var(--accent-red); }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 1rem;
            font-size: 0.65rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: center;
        }

        @media (min-width: 768px) {
            footer {
                flex-direction: row;
                justify-content: space-between;
                padding: 1rem 2rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:0.5rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00ff41" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
        <h1>WENDY // CTRL</h1>
    </div>
    <div class="status-badge" id="system-status">INIT...</div>
</header>

<main id="dashboard-grid">
    
    <!-- BREATH VISUALIZER -->
    <div class="card breath-card">
        <div class="metrics-row">
            <div class="metric-group">
                <div class="card-label">Phase</div>
                <div class="big-number" id="val-phase">--</div>
                <div class="unit">/ 1.0</div>
            </div>
            
            <div class="metric-group">
                <div class="card-label">Intensity</div>
                <div class="big-number" id="val-intensity" style="color:var(--accent-blue)">--</div>
                <div class="unit">% Energy</div>
            </div>
        </div>
        
        <div class="visualizer-container">
            <canvas id="wave-canvas"></canvas>
        </div>
    </div>

    <!-- METABOLICS -->
    <div class="card">
        <div class="card-label">Breathing Period</div>
        <div class="card-value" id="val-period">--</div>
        <div class="card-sub">Minutes per cycle</div>
    </div>

    <div class="card">
        <div class="card-label">Total Cycles</div>
        <div class="card-value" id="val-cycles">--</div>
        <div class="card-sub">Lifetime breaths</div>
    </div>

    <div class="card">
        <div class="card-label">Last Action</div>
        <div class="card-value" id="val-action" style="font-size:1.2rem; word-break:break-all;">--</div>
        <div class="card-sub" id="val-reason">Waiting...</div>
    </div>

    <div class="card">
        <div class="card-label">Learned Weights</div>
        <div class="card-value" id="val-weights-summary" style="font-size:0.9rem; font-family:var(--font-mono);">--</div>
        <div class="card-sub" id="val-agents-list">Def: 1.0 | Exp: 1.0</div>
    </div>

    <!-- TELEMETRY LOG -->
    <div class="card console-card" id="telemetry-log">
        <div class="log-entry"><span class="log-time">[--:--]</span><span class="log-msg">Connecting...</span></div>
    </div>

</main>

<footer>
    <div>Source: psivicom.github.io/src/wendy_metabolism.json</div>
    <div id="last-update">Updated: Never</div>
</footer>

<script>
    // CONFIG
    const REPO_OWNER = 'psivicom';
    const REPO_NAME = 'psivicom.github.io';
    const BRANCH = 'main';
    const FILE_PATH = 'src/wendy_metabolism.json';
    const REFRESH_INTERVAL_MS = 5000; 

    // DOM ELEMENTS
    const els = {
        status: document.getElementById('system-status'),
        phase: document.getElementById('val-phase'),
        intensity: document.getElementById('val-intensity'),
        period: document.getElementById('val-period'),
        cycles: document.getElementById('val-cycles'),
        action: document.getElementById('val-action'),
        reason: document.getElementById('val-reason'),
        weightsSummary: document.getElementById('val-weights-summary'),
        agentsList: document.getElementById('val-agents-list'),
        log: document.getElementById('telemetry-log'),
        lastUpdate: document.getElementById('last-update')
    };

    // CANVAS SETUP WITH RETINA SUPPORT
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');
    let waveOffset = 0;
    let currentPhase = 0;
    let animationId = null;

    function resizeCanvas() {
        const container = canvas.parentElement;
        const rect = container.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        
        canvas.logicalWidth = rect.width;
        canvas.logicalHeight = rect.height;
    }

    window.addEventListener('resize', () => {
        resizeCanvas();
        drawWave(currentPhase);
    });
    
    setTimeout(resizeCanvas, 100);

    function drawWave(phase) {
        if (!canvas.logicalWidth) return;
        
        const w = canvas.logicalWidth;
        const h = canvas.logicalHeight;
        const mid = h / 2;
        
        ctx.clearRect(0, 0, w, h);
        
        // Draw Grid Lines
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0; i<w; i+=20) { ctx.moveTo(i, 0); ctx.lineTo(i, h); }
        for(let i=0; i<h; i+=20) { ctx.moveTo(0, i); ctx.lineTo(w, i); }
        ctx.stroke();

        // Draw Sine Wave
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ff41';
        
        ctx.beginPath();
        const frequency = Math.PI * 2 / w;
        
        for (let x = 0; x <= w; x++) {
            const angle = (x / w) * Math.PI * 2 + waveOffset;
            const y = mid - Math.sin(angle) * (mid * 0.8);
            
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        
        // Draw Current Position Indicator
        const posX = phase * w;
        const posAngle = (posX / w) * Math.PI * 2 + waveOffset;
        const posY = mid - Math.sin(posAngle) * (mid * 0.8);
        
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(posX, posY, 4, 0, Math.PI * 2);
        ctx.fill();
        
        waveOffset += 0.02;
        animationId = requestAnimationFrame(() => drawWave(phase));
    }

    // LOGGING HELPER
    function addLog(msg, type = 'info') {
        const now = new Date().toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute:'2-digit'});
        const div = document.createElement('div');
        div.className = 'log-entry';
        const msgClass = type === 'error' ? 'log-error' : 'log-msg';
        div.innerHTML = `<span class="log-time">[${now}]</span><span class="${msgClass}">${msg}</span>`;
        els.log.prepend(div);
        
        if (els.log.children.length > 50) {
            els.log.removeChild(els.log.lastChild);
        }
    }

    // FETCH DATA
    async function fetchTelemetry() {
        try {
            // Add cache buster to force fresh data
            const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${FILE_PATH}?t=${Date.now()}`;
            
            addLog(`Fetching: ${url.substring(0, 50)}...`);
            
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const text = await response.text();
            
            // Debug: Print first 100 chars of raw JSON to verify structure
            addLog(`Raw Response Length: ${text.length}`);
            
            const data = JSON.parse(text);
            
            updateUI(data);
            
            els.status.textContent = "LIVE";
            els.status.classList.remove('error');
            
        } catch (error) {
            console.error(error);
            els.status.textContent = "ERR";
            els.status.classList.add('error');
            addLog(`CRITICAL ERROR: ${error.message}`, 'error');
            
            // If it's a network error, suggest CORS or URL issue
            if (error.name === 'TypeError' && error.message.includes('fetch')) {
                 addLog("Hint: Check Console (F12) for CORS or Network blocks.", 'error');
            }
        }
    }

    function updateUI(data) {
        // Flexible Parsing Helper
        const getVal = (obj, keys, defaultVal) => {
            for (const k of keys) {
                if (obj[k] !== undefined && obj[k] !== null) return obj[k];
            }
            return defaultVal;
        };

        // Update Numbers with fallbacks for common naming variations
        const phase = getVal(data, ['phase'], 0);
        const intensity = getVal(data, ['intensity'], 0);
        const period = getVal(data, ['period_minutes', 'current_period_minutes', 'base_period_minutes'], '--');
        const cycles = getVal(data, ['total_cycles_completed', 'cycles_done'], 0);
        
        els.phase.textContent = typeof phase === 'number' ? phase.toFixed(4) : phase;
        els.intensity.textContent = typeof intensity === 'number' ? (intensity * 100).toFixed(1) + '%' : intensity;
        els.period.textContent = period;
        els.cycles.textContent = cycles;
        
        // Determine Action Color
        let actionColor = 'var(--text-primary)';
        const shouldAct = String(getVal(data, ['should_act'], 'false')).toLowerCase() === 'true';
        const actionStr = getVal(data, ['action'], 'IDLE');
        
        if (shouldAct) {
            if (['SCAN', 'EVOLVE'].includes(actionStr)) actionColor = 'var(--accent-red)';
            else if (['MAINTAIN', 'EXPLORE'].includes(actionStr)) actionColor = 'var(--accent-blue)';
            else actionColor = 'var(--accent-green)';
        }
        
        els.action.textContent = actionStr;
        els.action.style.color = actionColor;
        els.reason.textContent = getVal(data, ['reason'], 'Unknown State');

        // Learned Weights Display
        const lw = data.learned_weights || {};
        const defW = lw.defense_weight || 1.0;
        const expW = lw.explore_weight || 1.0;
        const stress = lw.stress_accumulator || 0.0;
        
        els.weightsSummary.textContent = `D:${defW.toFixed(2)} E:${expW.toFixed(2)}`;
        els.agentsList.textContent = `Stress: ${stress.toFixed(2)}`;

        // Timestamp
        els.lastUpdate.textContent = `Sync: ${new Date().toLocaleTimeString()}`;

        // Start Visualizer Loop
        currentPhase = parseFloat(phase) || 0;
        if (!animationId) {
            drawWave(currentPhase);
        }
    }

    // INIT
    addLog("Mission Control Online.");
    addLog("Establishing link...");
    
    fetchTelemetry();
    setInterval(fetchTelemetry, REFRESH_INTERVAL_MS);

</script>

</body>
</html>
