<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WENDY · VOICE</title>
<style>
  body { background: #05080F; color: #E6F1FF; font-family: 'IBM Plex Mono', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .container { width: 100%; max-width: 800px; padding: 40px; }
  .voice-box { border-left: 2px solid #00D4FF; padding-left: 20px; min-height: 200px; white-space: pre-wrap; font-size: 18px; line-height: 1.6; }
  .meta { color: #9FB3C8; font-size: 12px; margin-bottom: 20px; letter-spacing: 0.1em; }
  .input-area { margin-top: 40px; border-top: 1px solid #00D4FF33; padding-top: 20px; }
  textarea { width: 100%; background: transparent; border: none; color: #00FF9D; font-family: inherit; font-size: 16px; outline: none; resize: none; height: 100px; }
  button { background: transparent; border: 1px solid #00D4FF; color: #00D4FF; padding: 10px 20px; cursor: pointer; font-family: inherit; margin-top: 10px; transition: all 0.2s; }
  button:hover { background: #00D4FF; color: #05080F; }
</style>
</head>
<body>
<div class="container">
  <div class="meta">WENDY · LIVE VOICE STREAM · <span id="status">WAITING</span></div>
  <div class="voice-box" id="voice">...</div>
  
  <div class="input-area">
    <textarea id="reply" placeholder="Type your reply here..."></textarea>
    <button onclick="sendReply()">TRANSMIT TO QUEUE</button>
  </div>
</div>

<script>
const VOICE_URL = '/data/voice.json';
const voiceEl = document.getElementById('voice');
const statusEl = document.getElementById('status');
let lastTimestamp = '';

async function checkVoice() {
  try {
    const res = await fetch(VOICE_URL + '?t=' + Date.now());
    if (!res.ok) return;
    const data = await res.json();
    
    // Only update if the content has actually changed
    if (data.timestamp !== lastTimestamp) {
      voiceEl.textContent = data.message || "Silence.";
      lastTimestamp = data.timestamp;
      statusEl.textContent = "SPEAKING";
      setTimeout(() => statusEl.textContent = "LISTENING", 2000);
    }
  } catch (e) { statusEl.textContent = "OFFLINE"; }
}

async function sendReply() {
  const text = document.getElementById('reply').value;
  if (!text) return;
  
  // In a real minimalist setup, you might use a simple backend or 
  // even just manually create the file. For now, we simulate the queue drop.
  alert("Reply queued for Wendy's next metabolic cycle.");
  document.getElementById('reply').value = '';
}

// Check every 2 seconds
setInterval(checkVoice, 2000);
checkVoice();
</script>
</body>
</html>
