[package]
name = "wendy-core"
version = "0.1.0"
edition = "2021"
authors = ["Louis-Philippe Audette <emperor@psivi.com>"]
description = "WENDY Core: Autonomous symbolic math engine and Python/Rust bridge orchestrator."
license = "EUPL-1.2"

# NOTE: No [lib] block here. This package builds the main binary (src/main.rs).

[dependencies]
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
