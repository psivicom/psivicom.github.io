[package]
name = "wendy-core"
version = "0.1.0"
edition = "2021"
authors = ["Louis-Philippe Audette <emperor@psivi.com>"]
description = "WENDY: A GPU-free, autonomous symbolic math AI engine utilizing the Gemini protocol."

[dependencies]
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = "0.4"
