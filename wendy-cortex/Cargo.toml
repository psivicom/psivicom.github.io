[package]
name = "wendy-cortex"
version = "0.4.0"
edition = "2021"
authors = ["Louis-Philippe Audette <emperor@psivi.com>"]
description = "WENDY Cortex: Tokio-driven Hebbian substrate with Gemini IPC"
license = "EUPL-1.2"

# =========================================================================
# BINARIES: The Four Pillars of the WENDY Organism
# =========================================================================

# Primary IPC Daemon (main.rs) — listens on port 1966
# Automatically compiled from src/main.rs

[[bin]]
name = "wendy-crystalline-executor"
path = "src/crystalline_executor.rs"

[[bin]]
name = "wendy-autonomous-core"
path = "src/autonomous_core.rs"

[[bin]]
name = "wendy-ouroboros-bridge"
path = "src/ouroboros_bridge.rs"

[[bin]]
name = "wendy-mobile-airgap"
path = "src/mobile_airgap.rs"

[[bin]]
name = "wendy-rust-bridge"
path = "src/rust_bridge.rs"

[[bin]]
name = "wendy-synapse-orchestrator"
path = "src/synapse_orchestrator.rs"

# =========================================================================
# DEPENDENCIES
# =========================================================================

[dependencies]
# Async runtime for the IPC server, airgap watcher, and Gemini daemon
tokio = { version = "1.36", features = ["full"] }

# Strict Zulu time formatting with millisecond precision
time = { version = "0.3", features = ["macros", "formatting"] }
chrono = "0.4"

# Structured logging and environment filtering
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "json"] }

# JSON serialization for the IPC Payload bridge
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling and context propagation
anyhow = "1.0"

# Cryptographic hashing for epistemic verification
sha2 = "0.10"

# Regular expressions for boundary validation and pattern matching
regex = "1.10"

# =========================================================================
# RELEASE PROFILE: Maximum Optimization
# =========================================================================

[profile.release]
opt-level = 3              # Maximum optimization level
lto = "fat"                # Link-time optimization across all crates
codegen-units = 1          # Single codegen unit for better optimization
panic = "abort"            # Abort on panic (no unwinding, smaller binary)
strip = true               # Strip debug symbols from release binary

# =========================================================================
# DEV PROFILE: Debug builds with full information
# =========================================================================

[profile.dev]
opt-level = 0              # No optimization for fast compilation
debug = true               # Full debug information
lto = false                # No LTO for faster builds
