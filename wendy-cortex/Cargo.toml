[package]
name = "wendy-cortex"
version = "0.1.0"
edition = "2021"
authors = ["Louis-Philippe Audette <emperor@psivi.com>"]
description = "WENDY Crystalline Cortex: Hot-swappable native artifacts for Earth Observation."
license = "EUPL-1.2"

[lib]
name = "wendy_cortex"
# cdylib creates the real .so/.dll/.dylib artifact Python can load via ctypes
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
