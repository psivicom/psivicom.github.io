[package]
name = "wendy-cortex"
version = "0.2.0"
edition = "2021"
authors = ["Louis-Philippe Audette <emperor@psivi.com>"]
description = "WENDY Crystalline Cortex: Hard real-time, numerically stable Earth Observation math."
license = "EUPL-1.2"

[lib]
name = "wendy_cortex"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
