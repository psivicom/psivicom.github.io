# config/psivi_dns.yaml
# SPDX-License-Identifier: EUPL-1.2
# PSIVI-DNS Server Configuration

server:
  bind: "0.0.0.0"
  port: 5353

zone_dir: "data/dns_zones"

# Optional: Upstream DNS server for forwarding queries not in the local zone
upstream:
  host: null
  port: 53

# Bloom filter size (64 KB default, can be increased for larger zones)
bloom_size_bytes: 65536

# Logging
logging:
  level: "INFO"
  format: "%(levelname)s:%(name)s:%(message)s"
