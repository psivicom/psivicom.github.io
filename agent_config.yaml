# Agent runtime scheduling and role configuration

mesh:
  name: "PSIVI AETHER"
  version: "2.0"
  repo: "psivicom/psivicom.github.io"

agents:
  forage:
    role: "observer"
    schedule: "0 12 * * *"
    tools: ["weather", "map", "memory_write"]
    precision: "float16"

  lidar:
    role: "surveyor"
    schedule: "0 8 * * *"
    tools: ["opentopography", "elevation", "memory_write"]
    precision: "float16"

  satellite:
    role: "remote_sensing"
    schedule: "0 6 * * *"
    tools: ["radarsat", "nasa_earthdata", "memory_write"]
    precision: "float16"

  pilot:
    role: "validator"
    schedule: "0 */6 * * *"
    tools: ["scan_psvc", "match_osdr", "match_pollinator"]
    precision: "float32"

  discovery:
    role: "researcher"
    schedule: "0 */12 * * *"
    tools: ["query_zenodo", "query_gbif", "query_osdr"]
    precision: "float32"

  literature:
    role: "context_resolver"
    schedule: "0 */12 * * *"
    tools: ["semantic_scholar", "crossref"]
    precision: "float32"

  critic:
    role: "auditor"
    schedule: "0 */12 * * *"
    tools: ["read_mesh", "stamp", "report"]
    precision: "float32"

  intelligence:
    role: "analyst"
    schedule: "0 14 * * *"
    tools: ["read_mesh", "audit_memory", "generate_insights"]
    precision: "float32"

  synthesizer:
    role: "scientist"
    schedule: "0 18 * * *"
    tools: ["read_mesh", "query_external", "synthesize", "update_site"]
    precision: "float32"

  report_generator:
    role: "publisher"
    schedule: "0 20 * * *"
    tools: ["generate_psvc", "write_sidecar", "commit_reports"]
    precision: "float32"

  instruction:
    role: "listener"
    schedule: "*/5 * * * *"
    tools: ["scan_queue", "parse_psvc", "trigger_factory"]
    precision: "float32"

  vanguard:
    role: "guardian"
    schedule: "0 */6 * * *"
    tools: ["heartbeat", "ledger", "enforce_pico"]
    precision: "float32"

routing:
  strategy: "semantic"
  fallback: "broadcast"

memory:
  folder: "reports"
  format: "json"
  retention_days: 90

consensus:
  required_agents: 3
  agreement_threshold: 0.7
