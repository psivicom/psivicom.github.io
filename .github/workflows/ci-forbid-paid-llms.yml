name: Block Paid LLMs & Secret Patterns

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  forbid-paid-llms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for forbidden patterns
        shell: bash
        run: |
          set -euo pipefail

          patterns=(
            "OPENAI_API_KEY"
            "GEMINI_API_KEY"
            "ANTHROPIC_API_KEY"
            "AZURE_OPENAI"
            "OPENAI"
            "GEMINI"
            "ANTHROPIC"
            "github_pat_"
            "ghp_"
            "AKIA"
            "ASIA"
            "AWS_SECRET_ACCESS_KEY"
            "BEGIN RSA PRIVATE KEY"
            "BEGIN OPENSSH PRIVATE KEY"
            "BEGIN PGP PRIVATE KEY"
            "GOOGLE_APPLICATION_CREDENTIALS"
            "oauth_token"
            "api_key"
          )

          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
            git diff --name-only "$base_ref" "$head_ref" > changed.txt
          else
            git diff --name-only HEAD~1 HEAD > changed.txt || true
          fi

          fail=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue

            for pat in "${patterns[@]}"; do
              if grep -nE "$pat" "$file" >/dev/null 2>&1; then
                echo "Forbidden pattern found in $file: $pat"
                fail=1
              fi
            done
          done < changed.txt

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "This PR violates the repository policy in COPILOT_POLICY.md."
            echo "No paid LLM APIs, billable keys, or secrets are allowed in the repo."
            exit 1
          fi

      - name: Disallow issue-creating workflow changes without review
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
            diff_args=("$base_ref" "$head_ref")
          else
            diff_args=("HEAD~1" "HEAD")
          fi

          if git diff --name-only "${diff_args[@]}" 2>/dev/null \
            | grep -E '^\.github/workflows/' >/dev/null 2>&1; then
            if git diff "${diff_args[@]}" -- .github/workflows 2>/dev/null \
              | grep -nE 'issues: write|createComment|createIssue|issues\.create|issues/create' >/dev/null; then
              echo "Workflow changes found that create issues or comments without explicit maintainer review."
              echo "This violates COPILOT_POLICY.md."
              exit 1
            fi
          fi
