name: WENDY Reflexive Cortex (Autonomous Heartbeat)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/core/*.zig'
      - '.github/workflows/*.yml'

permissions:
  contents: write

jobs:
  reflexive-heal:
    name: Autonomous Entropy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # CRITICAL: Use the Fine-Grained PAT to bypass GitHub's workflow modification block
          token: ${{ secrets.WENDY_AUDITOR_PAT }}
          fetch-depth: 0

      - name: Install Zig Toolchain
        run: |
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o z.tar.xz
          tar -xf z.tar.xz
          sudo mv zig-linux-x86_64-0.13.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Execute Reflexive Cortex
        env:
          GITHUB_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          python3 src/agents/reflexive_cortex.py
