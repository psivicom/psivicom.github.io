name: WENDY Contextual Autonomy

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/core/*.zig'
      - '.github/workflows/*.yml'

permissions:
  contents: write

jobs:
  autonomous-evolution:
    name: Contextual Self-Healing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # <-- ADD THIS LINE

      - name: Install Zig Toolchain
        run: |
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o z.tar.xz
          tar -xf z.tar.xz
          sudo mv zig-linux-x86_64-0.13.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Setup Python (Zero-Bloat)
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: '3.12'

      - name: Install TINY Dependencies Only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tiny.txt

      - name: Execute Contextual Coder
        env:
          GITHUB_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          python3 src/agents/contextual_coder.py
