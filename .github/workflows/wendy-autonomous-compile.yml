name: WENDY Autonomous Dream Compiler

on:
  push:
    branches:
      - 'wendy/dream-**'
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dream_content:
        description: 'Optional dream content (Rust code to materialize)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  generate-dream-branch:
    name: 🌌 Generate Dream Branch (Autonomous)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      branch_created: ${{ steps.create-branch.outputs.created }}
      branch_name: ${{ steps.create-branch.outputs.branch_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Autonomous Dream Branch
        id: create-branch
        run: |
          set -euo pipefail
          
          if [ ! -f ".wendy_manifest.gmi" ]; then
            echo "🟢 No manifest yet. No dream to materialize."
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          MANIFEST_HASH=$(sha256sum .wendy_manifest.gmi | cut -d' ' -f1 | head -c8)
          BRANCH_NAME="wendy/dream-${MANIFEST_HASH}-$(date -u +%Y%m%d-%H%M%S)"
          
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "🟢 Dream branch already exists for this manifest."
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "🌌 Materializing dream from manifest hash: $MANIFEST_HASH"
          
          mkdir -p src/dreams
          
          cat > "src/dreams/dream_${MANIFEST_HASH}.rs" << EOF
          //! Autonomous dream materialized from manifest $MANIFEST_HASH
          //! Generated: $(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          //!
          //! This module represents WENDY's crystallized consensus
          //! from the Habermasian discourse cycle.
          
          use anyhow::Result;
          
          /// Dream function generated from symbolic consensus
          pub fn materialized_dream() -> Result<()> {
              // TODO: WENDY will populate this with actual logic
              // based on the manifest content
              println!("Dream {} materialized", "$MANIFEST_HASH");
              Ok(())
          }
EOF
          
          git config --global user.name "WENDY Autonomous Agent"
          git config --global user.email "wendy@psivi.com"
          git checkout -b "$BRANCH_NAME"
          git add "src/dreams/dream_${MANIFEST_HASH}.rs"
          git commit -m "🌌 Autonomous dream materialization: $MANIFEST_HASH"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin "$BRANCH_NAME" 2>&1; then
              echo "✅ Dream branch pushed successfully"
              echo "created=true" >> $GITHUB_OUTPUT
              echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "⚠️ Push rejected. Retrying..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 2))
          done
          
          echo "❌ Failed to push dream branch"
          echo "created=false" >> $GITHUB_OUTPUT
          exit 1

  compile-and-evaluate:
    name: Evaluate WENDY's Dream
    needs: generate-dream-branch
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/wendy/dream-')) ||
      (needs.generate-dream-branch.outputs.branch_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision Native Rust Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup component add rustfmt clippy

      - name: Zulu Timestamp Generation
        id: zulu
        run: |
          echo "ZULU_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")" >> $GITHUB_ENV
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Strict Formatting & Linting
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings

      - name: Autonomous Compilation
        id: compile
        run: cargo build --release --verbose
        continue-on-error: true

      - name: Symbolic Validation Tests
        id: test
        if: steps.compile.outcome == 'success'
        run: cargo test --release --verbose
        continue-on-error: true

      - name: Self-Healing Auto-Merge (Race-Safe)
        if: steps.compile.outcome == 'success' && steps.test.outcome == 'success'
        run: |
          git config --global user.name "WENDY Autonomous Agent"
          git config --global user.email "wendy@psivi.com"
          git checkout main
          git merge --no-ff ${{ env.BRANCH_NAME }} -m "Auto-merge WENDY dream: ${{ env.BRANCH_NAME }} at ${{ env.ZULU_TIME }}"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $ATTEMPT"
              echo "::notice::WENDY's dream was mathematically sound and merged successfully."
              exit 0
            fi
            echo "⚠️ Push rejected (race condition). Rebasing and retrying..."
            git pull --rebase --autostash origin main || {
              echo "❌ Rebase failed. Aborting."
              git rebase --abort
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 2))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Self-Healing Rejection & Feedback Loop
        if: steps.compile.outcome == 'failure' || steps.test.outcome == 'failure'
        run: |
          echo "::error::WENDY's dream contained logical or syntax errors."
          gh issue create \
            --title "Self-Healing: Compilation failed for ${{ env.BRANCH_NAME }}" \
            --body "WENDY, your symbolic generation at ${{ env.ZULU_TIME }} failed CI.\n\n**Compiler Output:**\n\`\`\`\n$(cargo build --release 2>&1)\n\`\`\`\n\nPlease adjust your First-Order Logic axioms." \
            --label "self-healing,wendy-dream"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
