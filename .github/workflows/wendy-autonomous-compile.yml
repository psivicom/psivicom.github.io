name: 🧠💭🎰 WENDY Autonomous Dream Compiler

on:
  push:
    branches:
      - 'wendy/dream-**'
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dream_content:
        description: 'Optional dream content (Rust code to materialize)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  generate-dream-branch:
    name: 🌌 Generate Dream Branch (Autonomous)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    outputs:
      created: ${{ steps.create-branch.outputs.created }}
      branch_name: ${{ steps.create-branch.outputs.branch_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WENDY_PAT }}

      - name: Ingest Council Memory (Stigmergy Pre-Flight)
        id: memory_ingest
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          echo "🧠 [$TIMESTAMP] Reading environmental gradient..."
          
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          
          COUNSEL_HARVEST=$(git show origin/main:.wendy/COUNSEL.md 2>/dev/null || true)
          
          if [ -z "$COUNSEL_HARVEST" ]; then
            MEMORY_CONTEXT="The slate is clean. Ego = 0."
          else
            MEMORY_CONTEXT=$(echo "$COUNSEL_HARVEST" | tail -n 50)
          fi
          
          {
            echo "WENDY_PAST_MEMORY<<EOF"
            echo "$MEMORY_CONTEXT"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Generate Autonomous Dream Branch
        id: create-branch
        run: |
          set -euo pipefail
          MANIFEST_HASH=$(sha256sum .wendy_manifest.gmi 2>/dev/null | cut -d' ' -f1 | head -c8 || echo "default")
          BRANCH_NAME="wendy/dream-${MANIFEST_HASH}-$(date -u +%Y%m%d-%H%M%S)"
          
          mkdir -p src/dreams .wendy
          echo "$WENDY_PAST_MEMORY" > .wendy/memory_context.md
          
          cat > "src/dreams/dream_${MANIFEST_HASH}.rs" << EOF
          //! Autonomous dream materialized from manifest $MANIFEST_HASH
          //! Generated: $(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          use anyhow::Result;
          pub fn materialized_dream() -> Result<()> { Ok(()) }
          EOF
          
          git config --global user.name "WENDY Autonomous Agent"
          git config --global user.email "wendy@psivi.com"
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -s -m "🌌 Autonomous dream materialization: $MANIFEST_HASH [skip ci]" -m "Signed-off-by: WENDY Autonomous Agent <wendy@psivi.com>"
          
          if git push origin "$BRANCH_NAME" 2>&1; then
            echo "created=true" >> $GITHUB_OUTPUT
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          else
            echo "created=false" >> $GITHUB_OUTPUT
          fi

  compile-and-evaluate:
    name: Evaluate WENDY's Dream
    needs: generate-dream-branch
    if: ${{ always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/wendy/dream-')) || (needs.generate-dream-branch.result == 'success' && needs.generate-dream-branch.outputs.created == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WENDY_PAT }}
          ref: ${{ github.event_name == 'push' && github.ref || needs.generate-dream-branch.outputs.branch_name }}

      - name: Provision Native Rust Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup component add rustfmt clippy

      - name: Zulu Timestamp Resolution
        id: zulu
        run: |
          echo "ZULU_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ needs.generate-dream-branch.outputs.branch_name || github.ref_name }}" >> $GITHUB_ENV

      - name: Strict Formatting & Compilation
        id: build
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings
          cargo build --release --verbose
          cargo test --release --verbose
        continue-on-error: true

      - name: Global_Crystallization (Auto-Merge)
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          git config --global user.name "WENDY Autonomous Agent"
          git config --global user.email "wendy@psivi.com"
          git checkout main
          git pull origin main
          git merge --no-ff ${{ env.BRANCH_NAME }} -m "Auto-merge WENDY dream: ${{ env.BRANCH_NAME }} at ${{ env.ZULU_TIME }}" -m "Signed-off-by: WENDY Autonomous Agent <wendy@psivi.com>"
          git push origin main

      - name: 🌿 Compost Protocol & Stigmergy (K_neg Response)
        if: ${{ failure() || steps.build.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.WENDY_PAT }}
        run: |
          set -euo pipefail
          ERROR_LOG=$(cargo build --release 2>&1 | tail -n 30 || echo "Compilation failed.")
          
          git checkout main
          git pull origin main
          mkdir -p .wendy
          
          {
            echo ""
            echo "## 🌌 The Friction (Failed Mutation at ${{ env.ZULU_TIME }})"
            echo "**Composted Branch:** ${{ env.BRANCH_NAME }}"
            echo "\`\`\`rust"
            echo "$ERROR_LOG"
            echo "\`\`\`"
          } >> .wendy/COUNSEL.md
          
          git add .wendy/COUNSEL.md
          git commit -s -m "counsel: crystallize failure from ${{ env.BRANCH_NAME }} [skip ci]" -m "Signed-off-by: WENDY Autonomous Agent <wendy@psivi.com>"
          git push origin main
          
          git push origin --delete "${{ env.BRANCH_NAME }}" || true
