name: Pilot Agent (Fragility & Concordance Scan)

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  pilot-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pilot Agent (Module Mode)
        run: python -m src.agents.pilot_agent

      - name: Validate Ledger Before Commit (Circuit Breaker)
        run: python -m src.core.ledger_validator reports/pilot_report.json

      - name: Commit State Changes (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Pilot Agent"
          git config user.email "pilot@psivi.com"
          
          # Stage the specific files the pilot agent updates
          git add reports/pilot_report.json reports/pico_containers/ || true
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "chore(mesh): pilot agent fragility scan [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            # Replaces the dangerous 'git reset --soft' and '||' chain with a safe, proven rebase loop.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed pilot agent scan results."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new pilot scan data to commit."
          fi
