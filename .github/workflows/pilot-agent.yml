name: Pilot Agent (Fragility & Concordance Scan)

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  pilot-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Pilot Agent
        run: python -m src.agents.pilot_agent

      - name: Validate Ledger Before Commit (Circuit Breaker)
        run: python -m src.core.ledger_validator reports/pilot_report.json

      - name: Commit State Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(mesh): pilot agent fragility scan"
          branch: main
