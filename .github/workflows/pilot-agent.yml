# .github/workflows/pilot-agent.yml
name: Pilot Agent (Fragility & Concordance Scan)

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  pilot-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Pilot Agent
        run: python src/agents/pilot_agent.py

      - name: Validate Ledger Before Commit (Circuit Breaker)
        run: python src/core/ledger_validator.py reports/pilot_report.json

      - name: Commit State Changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(mesh): pilot agent fragility scan"
          branch: main
