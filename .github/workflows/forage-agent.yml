name: Forage Agent

on:
  schedule:
    - cron: '0 12 * * *' # Noon UTC (5 AM PST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forage-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Forage Agent
        run: |
          pip install requests matplotlib
          python src/agents/forage_agent.py

      - name: Commit Map, Report, and Vector Memory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Forage Agent"
          git config user.email "forage-agent@users.noreply.github.com"
          git add maps/ reports/ mesh_state.json vector_mesh.py
          git diff --staged --quiet || git commit -m "forage: generated forecast map, report, and vector memory"
          git push
