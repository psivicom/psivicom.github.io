name: Forage Agent

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forage-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Forage Agent # or Intelligence Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.forage_agent # or src.agents.intelligence_agent
      - name: Commit Map, Report, and Vector Memory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Forage Agent"
          git config user.email "forage-agent@users.noreply.github.com"
          git add maps/ reports/ mesh_state.json
          git diff --staged --quiet || git commit -m "forage: generated forecast map, report, and vector memory"
          git push
