name: Forage Agent

on:
  schedule:
    - cron: '0 12 * * *' # Daily at noon for proactive data foraging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forage-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Forage Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.forage_agent

      - name: Commit Map, Report, and Vector Memory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Forage Agent"
          git config user.email "forage-agent@users.noreply.github.com"
          git add maps/ reports/ mesh_state.json
          git diff --staged --quiet || git commit -m "forage: generated forecast map, report, and vector memory"
          git push
