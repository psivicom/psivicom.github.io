name: build-docs-styled
on:
  push:
    branches: [main]
    paths: 
      - 'docs/osdmp.md'
      - 'docs/template.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - list files
        run: |
          ls -la docs/
          echo "---"
          ls -la .github/workflows/ || echo "no workflows folder"

      - uses: pandoc/actions/setup@v1

      - name: Build styled osdmp.html
        run: |
          set -e
          echo "Converting md to fragment..."
          pandoc docs/osdmp.md -f gfm -t html5 --no-highlight -o /tmp/body.html
          echo "Fragment built:"
          head -20 /tmp/body.html

          echo "Injecting into template..."
          python3 << 'PY'
          import os, sys
          tpl_path = 'docs/template.html'
          body_path = '/tmp/body.html'
          out_path = 'docs/osdmp.html'

          if not os.path.exists(tpl_path):
              print(f"ERROR: {tpl_path} not found! Listing docs/")
              print(os.listdir('docs'))
              sys.exit(1)
          if not os.path.exists(body_path):
              print(f"ERROR: {body_path} not found")
              sys.exit(1)

          with open(tpl_path,'r', encoding='utf-8') as f:
              template = f.read()
          with open(body_path,'r', encoding='utf-8') as f:
              body = f.read()

          # inject
          marker = '<!-- PANDOC_BODY -->'
          if marker in template:
              out = template.replace(marker, body)
          else:
              print("WARNING: marker not found, appending")
              out = template.replace('</body>', body + '\n</body>')

          # SPDX header
          if 'SPDX-License-Identifier' not in out[:600]:
              out = "<!-- SPDX-License-Identifier: CC-BY-4.0 -->\n" + out

          with open(out_path,'w', encoding='utf-8') as f:
              f.write(out)
          print(f"Wrote {out_path} OK, size {len(out)}")
          PY

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-build styled osdmp.html from md [skip ci]"
          file_pattern: docs/osdmp.html
