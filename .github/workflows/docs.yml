name: build-docs-styled
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pandoc/actions/setup@v1

      - name: Normalize filename (fix uppercase OSDMP.md)
        run: |
          echo "Checking docs folder..."
          ls -la docs/
          # If uppercase exists, merge it into lowercase
          if [ -f "docs/OSDMP.md" ] && [ -f "docs/osdmp.md" ]; then
            echo "Both OSDMP.md and osdmp.md exist - merging uppercase into lowercase"
            # if uppercase is newer, copy it over lowercase
            if [ "docs/OSDMP.md" -nt "docs/osdmp.md" ]; then
              echo "Uppercase is newer, copying content to lowercase"
              cat docs/OSDMP.md > docs/osdmp.md
            fi
            echo "Removing uppercase duplicate"
            rm docs/OSDMP.md
          elif [ -f "docs/OSDMP.md" ] && [ ! -f "docs/osdmp.md" ]; then
            echo "Only uppercase exists - renaming to lowercase"
            mv docs/OSDMP.md docs/osdmp.md
          else
            echo "Lowercase ok"
          fi
          ls -la docs/

      - name: Build styled osdmp.html
        run: |
          set -e
          pandoc docs/osdmp.md -f gfm -t html5 --no-highlight -o /tmp/body.html
          python3 << 'PY'
          import os
          tpl_path = 'docs/template.html'
          body_path = '/tmp/body.html'
          out_path = 'docs/osdmp.html'

          with open(tpl_path,'r', encoding='utf-8') as f:
              template = f.read()
          with open(body_path,'r', encoding='utf-8') as f:
              body = f.read()

          marker = '<!-- PANDOC_BODY -->'
          if marker in template:
              out = template.replace(marker, body)
          else:
              out = template.replace('</body>', body + '\n</body>')

          if 'SPDX-License-Identifier' not in out[:600]:
              out = "<!-- SPDX-License-Identifier: CC-BY-4.0 -->\n" + out

          with open(out_path,'w', encoding='utf-8') as f:
              f.write(out)
          print(f"Built {out_path}")
          PY

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-build styled osdmp.html + normalize case [skip ci]"
          file_pattern: |
            docs/osdmp.md
            docs/osdmp.html
