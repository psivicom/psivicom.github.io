# .github/workflows/workflow-integrity.yml
name: Workflow Integrity

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integrity-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Compile Source Tree
        run: python -m compileall src/

      - name: Verify Zulu Clock
        run: python src/core/zulu_clock.py
