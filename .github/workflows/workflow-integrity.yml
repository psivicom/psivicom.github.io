name: Workflow Integrity

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read # Explicitly declare read-only access for the entire workflow

jobs:
  integrity-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1 # Optimized: Read-only validation doesn't need full history

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compile Source Tree (Syntax Validation)
        run: |
          echo "🔍 Compiling Python source tree to verify syntax integrity..."
          # -q (quiet) ensures logs only show actual errors, keeping CI output clean
          python -m compileall -q src/
          echo "✅ Python syntax validation passed."

      - name: Verify Zulu Clock Synchronization
        run: |
          echo "⚡ Verifying Zulu time synchronization..."
          CURRENT_ZULU=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          echo "✅ System clock is synchronized to Zulu time: ${CURRENT_ZULU}"
          
