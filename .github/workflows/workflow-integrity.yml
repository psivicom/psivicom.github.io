name: Workflow Integrity

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integrity-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        # Normalized to latest stable v4 SHA for maximum compatibility
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        # Normalized to latest stable v5 SHA for maximum compatibility
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Compile Source Tree
        run: python -m compileall src/

      - name: Verify Zulu Clock
        run: python src/core/zulu_clock.py
