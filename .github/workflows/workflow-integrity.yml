name: Workflow Integrity

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integrity-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python (For Source Compilation Only)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compile Source Tree
        run: python -m compileall src/

      - name: Verify Zulu Clock (Native Bash - Zero Overhead)
        run: |
          echo "⚡ Verifying Zulu time synchronization..."
          CURRENT_ZULU=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          echo "✅ System clock is synchronized to Zulu time: ${CURRENT_ZULU}"
          
          # Optional: If you need to actively fix/sweep files during integrity checks, 
          # uncomment the 3 lines below to use the Go harmonizer instead.
          # echo "🧹 Running native Go timestamp harmonizer..."
          # cd wendy-go
          # go run cmd/fix-zulu/main.go ../
