name: Workflow Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # <-- Add this line to enable the manual "Run workflow" button

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Validator Dependencies
        run: pip install pyyaml

      - name: Validate Workflow Targets
        run: python tools/validate_workflows.py
