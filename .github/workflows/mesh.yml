name: Mesh Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          cache: false

      - name: Vanguard acts locally
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run mesh.go flow qwen
          go run mesh.go flow pollinator

      - name: Commit mutation to the realm
        run: |
          git config user.name "PSIVI Mesh"
          git config user.email "mesh@psivicom.local"
          git add mesh_state.json
          # Only commit if the file actually changed
          git diff --staged --quiet || git commit -m "mesh: pheromone deposited $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
