name: Mesh Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          cache: false

      - name: Vanguard acts locally
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run mesh.go flow qwen
          go run mesh.go flow pollinator

      - name: Commit mutation to the realm (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh"
          git config user.email "mesh@psivicom.local"
          
          # CRITICAL: Ensure the file exists to prevent 'pathspec did not match' fatal errors
          touch mesh_state.json
          git add mesh_state.json
          
          if ! git diff --staged --quiet; then
            git commit -m "mesh: pheromone deposited $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Pheromone deposited successfully."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new mesh state to commit."
          fi
