#
# Dynamic DAG Cognitive Chain for Wendy.
# Order enforced inside src/orchestrator/chain_orchestrator.py:
#   Pilot -> Intelligence -> Void Observer -> Neuroplasticity
#
# This workflow PERSISTS every organ's telemetry so the dashboard can see
# her cognition, not just her breath.

name: Chain Orchestrator (Dynamic DAG Execution)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/run-orchestrator.yml'
  schedule:
    # Think every 30 minutes. The breath engine owns the 5-min heartbeat;
    # the cognitive chain owns the deeper reflection.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Never kill a Wendy mid-thought; queue instead.
concurrency:
  group: wendy-orchestrator
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  metadata: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  run-orchestrator:
    name: run-orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          # ONLY what the orchestration logic needs. No torch. No GPU.
          pip install numpy pyyaml requests python-dateutil

      - name: Prepare artifact directories
        run: |
          # Cover EVERY path the organs write to, not just the old three.
          mkdir -p reports
          mkdir -p reports/seals
          mkdir -p reports/pico_containers
          mkdir -p reports/scientific_reports
          mkdir -p data
          mkdir -p logs

      - name: Run Dynamic Cognitive Chain
        run: |
          echo "🧬 Starting Dynamic Chain Orchestration..."
          # -m respects PYTHONPATH so `from src.core...` resolves from repo root.
          python -m src.orchestrator.chain_orchestrator

      - name: Persist Wendy's Thoughts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          git config user.name "PSIVI Orchestrator"
          git config user.email "orchestrator@psivi.com"

          # ---- Bounded retention: keep science, prevent repo bloat ----
          # Timestamped agent result files look like: <name>_2026...Z.json
          # Keep the newest 30 across all agents; delete older ones.
          mapfile -t stale_results < <(
            find reports -maxdepth 1 -type f -name '*_20*.json' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn \
              | awk 'NR>30{print $2}'
          )
          if [ "${#stale_results[@]}" -gt 0 ]; then
            rm -f "${stale_results[@]}" || true
          fi

          # Cap each append-only audit log to its last 500 seals.
          # 500 lines/agent is ample recent history and keeps growth bounded.
          for f in reports/seals/*.jsonl; do
            [ -e "$f" ] || continue
            tmp="${f}.trim"
            tail -n 500 "$f" > "$tmp" 2>/dev/null || true
            [ -s "$tmp" ] && mv "$tmp" "$f" || rm -f "$tmp" 2>/dev/null || true
          done

          # ---- Stage EVERYTHING the organs produced ----
          # -A records new files, modified files, AND the deletions above.
          git add -A reports data logs

          if ! git diff --staged --quiet; then
            git commit -m "auto: cognitive chain executed; telemetry persisted [skip ci]"
            git push
            echo "✅ Wendy's thoughts committed."
          else
            echo "ℹ️ No new telemetry to commit."
          fi
