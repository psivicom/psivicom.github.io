      - name: Commit Telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/goldstream-telemetry.json
          
          # Only proceed if telemetry actually changed
          if ! git diff --staged --quiet; then
            git commit -m "telemetry: goldstream fused wx+sat+pos [skip ci]"
            
            # Pull remote changes. If conflict, auto-resolve by keeping OUR new telemetry (-X ours)
            git pull origin main --no-rebase -X ours --no-edit || true
            
            # Push safely
            git push origin main || git push origin HEAD:main
          else
            echo "No telemetry changes detected. Void state preserved."
          fi
