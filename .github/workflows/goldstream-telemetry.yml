name: Goldstream Integrated Telemetry

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fuse-telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install sgp4 requests beautifulsoup4 lxml

      - name: Ensure API directory exists
        run: mkdir -p api

      - name: Fetch & Fuse Telemetry
        run: |
          python3 << 'PYEOF'
          import json, datetime, requests
          from bs4 import BeautifulSoup

          # === 1. GPS POSITION (Goldstream Apiary) ===
          LAT, LON = 48.4500, -123.5000

          # === 2. ENVIRONMENT CANADA WEATHER ===
          wx_url = "https://dd.weather.gc.ca/citypage_weather/xml/BC/s0000775_e.xml"
          try:
              wx = requests.get(wx_url, timeout=10).text
              soup = BeautifulSoup(wx, 'html.parser')
              temp_el = soup.find('temperature')
              rh_el = soup.find('relative_humidity')
              temp = temp_el.text if temp_el else '--'
              rh = rh_el.text if rh_el else '--'
          except Exception:
              temp, rh = '--', '--'

          # === 3. SATELLITE PASSES (Placeholder until full SGP4 integrated) ===
          next_pass = {"sat": "ISS", "aos": "--:--Z", "el": 0}

          # === FUSE & WRITE (Zulu ms precision per AXIOM_6) ===
          telemetry = {
              "updated": datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              "position": {"lat": LAT, "lon": LON},
              "weather": {"temp_c": temp, "rh_pct": rh},
              "next_sat_pass": next_pass
          }

          with open('api/goldstream-telemetry.json', 'w') as f:
              json.dump(telemetry, f)
          PYEOF

      - name: Commit Telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/goldstream-telemetry.json
          git diff --staged --quiet || git commit -m "telemetry: goldstream fused wx+sat+pos [skip ci]"
          git pull --rebase origin main || true
          git push
