name: Goldstream Integrated Telemetry

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fuse-telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install sgp4 requests beautifulsoup4 lxml

      - name: Ensure API directory exists
        run: mkdir -p api

      - name: Fetch & Fuse Telemetry
        run: |
          python3 << 'PYEOF'
          import json, datetime, requests, math
          from bs4 import BeautifulSoup
          from sgp4.api import Satrec, WGS72

          # === GOLDSTREAM MEADOW OBSERVER ===
          LAT = 48.4500
          LON = -123.5000
          ALT_KM = 0.015
          TERRAIN_MASK_DEG = 8.0  # Mountains block below this elevation

          # === TARGET SATELLITES ===
          TARGETS = {
              'ISS': '25544',
              'RADARSAT-2': '32393',
              'RCM-1': '44369',
              'RCM-2': '44370',
              'RCM-3': '44371',
              'SENTINEL-2A': '40940',
              'SENTINEL-2B': '42709',
              'LANDSAT-8': '39084',
              'LANDSAT-9': '49260',
              'PLEIADES-NEO-1': '48954',
              'PLEIADES-NEO-2': '51022',
              'SPOT-7': '40265',
              'TERRA': '25994',
              'AQUA': '27424',
              'SUOMI-NPP': '37849'
          }

          def gmst(dt):
              d = (dt - datetime.datetime(2000, 1, 1, 12, tzinfo=datetime.timezone.utc)).total_seconds() / 86400.0
              return math.fmod(280.46061837 + 360.98564736629 * d, 360.0)

          def eci_to_topocentric(eci_pos, lat_deg, lon_deg, alt_km, dt):
              lat = math.radians(lat_deg)
              lon = math.radians(lon_deg)
              theta = math.radians(gmst(dt)) + lon
              sin_lat = math.sin(lat)
              cos_lat = math.cos(lat)
              sin_theta = math.sin(theta)
              cos_theta = math.cos(theta)
              r_earth = 6378.137
              rx = (r_earth + alt_km) * cos_lat * cos_theta
              ry = (r_earth + alt_km) * cos_lat * sin_theta
              rz = (r_earth + alt_km) * sin_lat
              dx = eci_pos[0] - rx
              dy = eci_pos[1] - ry
              dz = eci_pos[2] - rz
              top_s = sin_lat * cos_theta * dx + sin_lat * sin_theta * dy - cos_lat * dz
              top_e = -sin_theta * dx + cos_theta * dy
              top_z = cos_lat * cos_theta * dx + cos_lat * sin_theta * dy + sin_lat * dz
              rng = math.sqrt(top_s**2 + top_e**2 + top_z**2)
              if rng < 1e-10:
                  return 90.0, 0.0, rng
              el = math.degrees(math.asin(top_z / rng))
              az = math.degrees(math.atan2(-top_e, top_s)) % 360.0
              return el, az, rng

          # === FETCH LIVE TLEs ===
          tle_url = "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle"
          try:
              tle_text = requests.get(tle_url, timeout=15).text.strip().split('\n')
          except Exception:
              tle_text = []

          tle_map = {}
          i = 0
          while i < len(tle_text) - 2:
              name = tle_text[i].strip()
              line1 = tle_text[i+1].strip()
              line2 = tle_text[i+2].strip()
              if line1.startswith('1 ') and line2.startswith('2 '):
                  cat_id = line1[2:7].strip()
                  tle_map[cat_id] = (name, line1, line2)
                  i += 3
              else:
                  i += 1

          # === PROPAGATE ALL TARGETS ===
          now = datetime.datetime.now(datetime.timezone.utc)
          visible = []
          for sat_name, norad_id in TARGETS.items():
              if norad_id not in tle_map:
                  continue
              _, l1, l2 = tle_map[norad_id]
              try:
                  sat = Satrec.twoline2rv(l1, l2, WGS72)
                  jd = sat.jdsatepoch
                  fr = (now - datetime.datetime(now.year, now.month, now.day, tzinfo=datetime.timezone.utc)).total_seconds() / 86400.0
                  from sgp4.api import jday
                  jd_now, fr_now = jday(now.year, now.month, now.day, now.hour, now.minute, now.second + now.microsecond/1e6)
                  e, r, v = sat.sgp4(jd_now, fr_now)
                  if e != 0 or r is None:
                      continue
                  el, az, rng = eci_to_topocentric(r, LAT, LON, ALT_KM, now)
                  if el >= TERRAIN_MASK_DEG:
                      visible.append({
                          "sat": sat_name,
                          "el": round(el, 1),
                          "az": round(az, 1),
                          "rng_km": round(rng, 1)
                      })
              except Exception:
                  continue

          visible.sort(key=lambda x: x['el'], reverse=True)
          best = visible[0] if visible else {"sat": "NONE", "aos": "--:--Z", "el": 0}
          if visible:
              best_str = f"{best['sat']} ↑{best['el']}° AZ{best['az']}°"
          else:
              best_str = "NO VIS ↑--°"

          # === ENVIRONMENT CANADA WEATHER ===
          wx_url = "https://dd.weather.gc.ca/citypage_weather/xml/BC/s0000775_e.xml"
          try:
              wx = requests.get(wx_url, timeout=10).text
              soup = BeautifulSoup(wx, 'html.parser')
              temp_el = soup.find('temperature')
              rh_el = soup.find('relative_humidity')
              temp = temp_el.text if temp_el else '--'
              rh = rh_el.text if rh_el else '--'
          except Exception:
              temp, rh = '--', '--'

          # === WRITE TELEMETRY ===
          ts = datetime.datetime.now(datetime.timezone.utc)
          telemetry = {
              "updated": ts.strftime('%Y-%m-%dT%H:%M:%S.') + f'{ts.microsecond // 1000:03d}Z',
              "position": {"lat": LAT, "lon": LON, "alt_km": ALT_KM, "terrain_mask_deg": TERRAIN_MASK_DEG},
              "weather": {"temp_c": temp, "rh_pct": rh},
              "next_sat_pass": {
                  "display": best_str,
                  "sat": best['sat'],
                  "el": best['el'],
                  "az": best.get('az', 0),
                  "rng_km": best.get('rng_km', 0)
              },
              "all_visible": visible[:5],
              "visible_count": len(visible)
          }

          with open('api/goldstream-telemetry.json', 'w') as f:
              json.dump(telemetry, f)
          PYEOF

      - name: Commit Telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/goldstream-telemetry.json
          git diff --staged --quiet || git commit -m "telemetry: goldstream fused wx+sat+pos [skip ci]"
          git pull --rebase origin main || true
          git push
