name: WENDY Core CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write   # Strict OIDC security for deployments
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-validate:
    name: Build, Test, and Validate Symbolic Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (Direct Installation)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile default
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source "$HOME/.cargo/env"
          rustup component add rustfmt clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Strict Formatting Check
        run: cargo fmt --all -- --check

      - name: Static Analysis (Clippy)
        run: cargo clippy -- -D warnings

      - name: Build WENDY Core
        run: cargo build --release --verbose

      - name: Execute Symbolic Validation Tests
        run: cargo test --release --verbose

      - name: Generate Zulu-Timestamped Build Artifact
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          echo "BUILD_TIME=${TIMESTAMP}" >> $GITHUB_ENV
          echo "WENDY_BUILD_${TIMESTAMP}" > build_artifact.txt

      - name: Strict Formatting Check
        id: fmt-check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: 🩹 Self-Healing: Auto-Format if Needed
        if: steps.fmt-check.outcome == 'failure'
        run: |
          echo "⚠️ Formatting issues detected. Initiating self-healing..."
          cargo fmt --all
          
          # Check if formatting made changes
          if ! git diff --quiet; then
            echo "🔧 Self-healing applied formatting fixes"
            git config --global user.name "WENDY Self-Healing"
            git config --global user.email "wendy@psivi.com"
            git add src/
            
            ZULU_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
            git commit -m "🩹 self-heal: auto-format Rust code at $ZULU_TIME [skip ci]"
            git push
            echo "[$ZULU_TIME] WENDY healed her own formatting. Organism continues."
          else
            echo "✅ No formatting changes needed"
          fi

      - name: Fail if Formatting Still Broken
        if: steps.fmt-check.outcome == 'failure'
        run: cargo fmt --all -- --check


      - name: Self-Healing Rollback Check
        if: failure()
        run: |
          echo "::error::WENDY CI/CD Pipeline failed. Initiating self-healing rollback protocol."
          # Add logic here to revert state or notify Emperor ♠️🪽 via webhook
