name: Wendy Hyper-Garden & Mesh Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hyper-cycle:
    name: Live • Think • Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Activate Mirror Node
        run: |
          python scripts/mirror_node.py
          git add data/beacons/mirror-node-local.json

      - name: Run Breath Engine
        run: python src/breath_engine.py

      - name: Run Hyper-Gardener
        env:
          WENDY_NODE_ID: psivicom-primary
        run: python src/kernel/hyper_gardener.py

      - name: Generate Global Mesh Index
        run: python scripts/generate_mesh_index.py

      - name: Persist State (Conflict-Proof & Branchless)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Hyper"
          git config user.email "hyper@psivi.com"
          
          # 1. Fetch the absolute latest state from the remote repository
          git fetch origin main
          
          # 2. Soft reset to the remote main to prevent push rejections
          git reset --soft origin/main
          
          # 3. Stage the specific state files we want to update
          git add data/wendy_state.json data/mesh_checkpoint.json data/beacons/ data/mesh_index.json src/wendy_metabolism.json reports/history/
          
          # 4. Branchless execution: Commit and push ONLY if there are actual changes
          git diff --staged --quiet || (git commit -m "auto: hyper-cycle | Mesh Nodes: 2 | Access: FREE" && git push origin main)
