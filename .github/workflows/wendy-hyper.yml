name: Wendy Hyper-Garden & Mesh Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hyper-cycle:
    name: Live • Think • Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # CRITICAL: Fetch full history so rebase works

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🫁 Run Breath Engine (Instant Local-First Update)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/breath_engine.py

      - name: 🧬 Run Hyper-Gardener (Self-Healing & Consensus)
        env:
          PYTHONPATH: ${{ github.workspace }}
          WENDY_NODE_ID: psivicom-primary
        run: python src/kernel/hyper_gardener.py

      - name: 🌐 Generate Global Mesh Index
        run: python scripts/generate_mesh_index.py

      - name: 💾 Persist Evolution & Topology
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Hyper"
          git config user.email "hyper@psivi.com"
          git add data/wendy_state.json data/mesh_checkpoint.json data/beacons/ data/mesh_index.json src/wendy_metabolism.json reports/history/
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: hyper-cycle | Mesh Nodes: 1 | Access: FREE"
            
            # CRITICAL FIX: Pull latest changes and rebase to prevent concurrent push rejections
            git pull --rebase origin main
            
            git push
            echo "✅ Evolution & Topology Committed."
          else
            echo "💤 Static Equilibrium."
          fi
