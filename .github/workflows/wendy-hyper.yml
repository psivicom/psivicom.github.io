name: Wendy Hyper-Garden & Mesh Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hyper-cycle:
    name: Live • Think • Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Activate Mirror Node
        run: |
          python scripts/mirror_node.py
          git add data/beacons/mirror-node-local.json

      - name: Run Breath Engine
        run: python src/breath_engine.py

      - name: Run Hyper-Gardener
        env:
          WENDY_NODE_ID: psivicom-primary
        run: python src/kernel/hyper_gardener.py

      - name: Generate Global Mesh Index
        run: python scripts/generate_mesh_index.py

      - name: Persist State (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Hyper"
          git config user.email "hyper@psivi.com"
          
          # Stage the specific state files we want to update
          git add data/wendy_state.json data/mesh_checkpoint.json data/beacons/ data/mesh_index.json src/wendy_metabolism.json reports/history/
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "auto: hyper-cycle | Mesh Nodes: 2 | Access: FREE [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            # Replaces the dangerous 'git reset --soft' and '||' chain with a safe, proven rebase loop.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed hyper-cycle state."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new hyper-cycle state to commit."
          fi
