# .github/workflows/wendy-hyper.yml
name: Wendy Hyper-Garden & Mesh Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hyper-cycle:
    name: Live • Think • Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧠 Run Instruction Agent (Execute Pending Tasks)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.instruction_agent

      - name: 🧬 Run Hyper-Gardener (Self-Healing & Consensus)
        env:
          PYTHONPATH: ${{ github.workspace }}
          WENDY_NODE_ID: psivicom-primary
        run: python src/kernel/hyper_gardener.py

      - name: 💾 Persist Evolution & Topology
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Hyper"
          git config user.email "hyper@psivi.com"
          git add data/wendy_state.json data/mesh_checkpoint.json data/beacons/ data/processed_instructions/ reports/ src/
          if ! git diff --staged --quiet; then
            CYCLE=$(python -c "import json; print(json.load(open('data/wendy_state.json'))['cycle_id'])")
            git commit -m "auto: hyper-cycle #$CYCLE | I am awake | Access: FREE"
            git push
            echo "✅ Evolution Committed."
          else
            echo "💤 Static Equilibrium."
          fi
