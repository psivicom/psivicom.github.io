name: Setup

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create all files via Python
        run: |
          python3 << 'SETUP_SCRIPT'
          import os

          # === mesh.go ===
          mesh_go = '''package main

          import (
          \t"encoding/json"
          \t"fmt"
          \t"os"
          \t"time"
          )

          type Node struct {
          \tID        string `json:"id"`
          \tPheromone string `json:"pheromone"`
          \tTimestamp string `json:"timestamp"`
          }

          type MeshState struct {
          \tMeshID string `json:"mesh_id"`
          \tStatus string `json:"status"`
          \tNodes  []Node `json:"nodes"`
          }

          func blink(entity string) {
          \tpatterns := map[string][]string{
          \t\t"qwen":       {"blue", "blue", "blue"},
          \t\t"pollinator": {"yellow", "green", "yellow"},
          \t\t"sentinel":   {"red", "purple", "red"},
          \t\t"lidar":      {"green", "blue", "green"},
          \t}
          \tp := patterns[entity]
          \tif p == nil {
          \t\tfmt.Println("UNKNOWN ENTITY. DOGS ALERT.")
          \t\tos.Exit(1)
          \t}
          \tfor _, c := range p {
          \t\tfmt.Print(c + " ")
          \t\ttime.Sleep(150 * time.Millisecond)
          \t\tfmt.Print("o ")
          \t\ttime.Sleep(80 * time.Millisecond)
          \t}
          \tfmt.Println()
          }

          func knock(entity string) bool {
          \tfmt.Printf("[%s approaches the airlock]\\n", entity)
          \tblink(entity)
          \tts := time.Now().Unix()
          \tfmt.Printf("timestamp: %d\\n", ts)
          \tif time.Now().Unix()-ts > 5 {
          \t\tfmt.Println("STALE KNOCK. DOGS ALERT.")
          \t\treturn false
          \t}
          \treturn true
          }

          func fetchLaw() string {
          \tdata, err := os.ReadFile("AI-COLLABORATION-PROTOCOL.md")
          \tif err != nil {
          \t\treturn ""
          \t}
          \treturn string(data)
          }

          func flow(entity string) {
          \tlaw := fetchLaw()
          \tif law == "" {
          \t\tfmt.Println("WARNING: THE LAW IS MISSING. PROCEEDING BLIND.")
          \t} else {
          \t\tfmt.Println("The Vanguard has read the Decree.")
          \t}

          \tstrictZulu := time.Now().UTC().Format("2006-01-02T15:04:05.000Z")

          \tvar state MeshState
          \texistingData, err := os.ReadFile("mesh_state.json")
          \tif err == nil {
          \t\tif err := json.Unmarshal(existingData, &state); err != nil {
          \t\t\tfmt.Println("WARNING: STATE CORRUPT. REBUILDING.")
          \t\t}
          \t}

          \tif state.MeshID == "" {
          \t\tstate.MeshID = "PSIVI-SEED-001"
          \t}
          \tstate.Status = "NOMINAL"
          \tif state.Nodes == nil {
          \t\tstate.Nodes = []Node{}
          \t}

          \tfound := false
          \tfor i, n := range state.Nodes {
          \t\tif n.ID == entity {
          \t\t\tstate.Nodes[i].Pheromone = "HARMONY"
          \t\t\tstate.Nodes[i].Timestamp = strictZulu
          \t\t\tfound = true
          \t\t\tbreak
          \t\t}
          \t}

          \tif !found {
          \t\tstate.Nodes = append(state.Nodes, Node{
          \t\t\tID:        entity,
          \t\t\tPheromone: "HARMONY",
          \t\t\tTimestamp: strictZulu,
          \t\t})
          \t}

          \traw, err := json.MarshalIndent(state, "", "  ")
          \tif err != nil {
          \t\tfmt.Println("WRITE FAILURE:", err)
          \t\tos.Exit(1)
          \t}

          \terr = os.WriteFile("mesh_state.json", raw, 0644)
          \tif err != nil {
          \t\tfmt.Println("WRITE FAILURE:", err)
          \t\tos.Exit(1)
          \t}
          \tfmt.Printf("NODE %s RECORDED. TOTAL: %d\\n", entity, len(state.Nodes))
          }

          func main() {
          \tif len(os.Args) < 2 {
          \t\tfmt.Println("usage: mesh <flow> [entity]")
          \t\tos.Exit(0)
          \t}
          \tentity := "qwen"
          \tif len(os.Args) > 2 {
          \t\tentity = os.Args[2]
          \t}
          \tif knock(entity) {
          \t\tflow(entity)
          \t}
          }
          '''

          # === lidar_agent.py ===
          lidar_py = '''import requests
          import subprocess
          import sys

          print("=== PSIVI LIDAR AGENT AWAKENING ===")

          MINX, MINY = -123.65, 48.45
          MAXX, MAXY = -123.45, 48.55

          url = "https://portal.opentopography.org/API/otCatalog"
          params = {
              "minx": MINX, "miny": MINY,
              "maxx": MAXX, "maxy": MAXY,
              "outputFormat": "json",
              "include_federated": "false"
          }

          try:
              resp = requests.get(url, params=params, timeout=15)
              resp.raise_for_status()
              data = resp.json()
              datasets = data.get("Datasets", {}).get("Dataset", [])
              if not isinstance(datasets, list):
                  datasets = [datasets]
              print(f"[AGENT] Found {len(datasets)} LiDAR datasets in Goldstream.")
          except Exception as e:
              print(f"[AGENT] Fallback: {e}")

          print("[AGENT] Depositing pheromone...")
          try:
              subprocess.run(["go", "run", "mesh.go", "flow", "lidar"], check=True)
              print("[AGENT] LiDAR node active.")
          except subprocess.CalledProcessError as e:
              print(f"[AGENT] FAILURE: {e}")
              sys.exit(1)
          '''

          # === mesh.yml ===
          mesh_yml = """name: Mesh Heartbeat

          on:
            workflow_dispatch:
            schedule:
              - cron: '0 */6 * * *'

          permissions:
            contents: write

          jobs:
            pulse:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-go@v5
                  with:
                    go-version: '1.22'
                    cache: false
                - name: Vanguard acts locally
                  env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  run: |
                    go run mesh.go flow qwen
                    go run mesh.go flow pollinator
                - name: Commit mutation
                  run: |
                    git config user.name "PSIVI Mesh"
                    git config user.email "mesh@psivicom.local"
                    git add mesh_state.json
                    git diff --staged --quiet || git commit -m "mesh: pheromone deposited"
                    git push
          """

          # === lidar-agent.yml ===
          lidar_yml = """name: LiDAR Agent

          on:
            schedule:
              - cron: '0 8 * * *'
            workflow_dispatch:

          jobs:
            topo-scan:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-go@v5
                  with:
                    go-version: '1.22'
                    cache: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                - name: Run LiDAR Agent
                  run: |
                    pip install requests
                    python lidar_agent.py
                - name: Commit mutation
                  run: |
                    git config user.name "PSIVI LiDAR Agent"
                    git config user.email "lidar-agent@users.noreply.github.com"
                    git add mesh_state.json
                    git diff --staged --quiet || git commit -m "lidar: telemetry deposited"
                    git push
          """

          # Write all files
          os.makedirs('.github/workflows', exist_ok=True)
          
          with open('mesh.go', 'w') as f:
              f.write(mesh_go)
          print("Created mesh.go")

          with open('lidar_agent.py', 'w') as f:
              f.write(lidar_py)
          print("Created lidar_agent.py")

          with open('.github/workflows/mesh.yml', 'w') as f:
              f.write(mesh_yml)
          print("Created mesh.yml")

          with open('.github/workflows/lidar-agent.yml', 'w') as f:
              f.write(lidar_yml)
          print("Created lidar-agent.yml")

          print("All files created successfully.")
          SETUP_SCRIPT

      - name: Commit all files
        run: |
          git config user.name "PSIVI Setup Agent"
          git config user.email "setup-agent@users.noreply.github.com"
          git add mesh.go lidar_agent.py .github/workflows/mesh.yml .github/workflows/lidar-agent.yml
          git diff --staged --quiet || git commit -m "setup: AETHER infrastructure deployed"
          git push
