name: Mesh Status

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Mesh Router
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m 
        
      - name: Commit status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git config user.name "PSIVI Mesh Router"
          git config user.email "mesh-router@users.noreply.github.com"
          python -m src.mesh.mesh_router > reports/mesh_status.txt 2>&1
          git add reports/mesh_status.txt
          git diff --staged --quiet || git commit -m "mesh: updated status report"
          git push

