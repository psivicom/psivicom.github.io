name: Mesh Status Update

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Lightweight core dependencies for status generation and logging
          pip install -r requirements-core.txt

      - name: Generate Mesh Status
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🛡️ Scanning mesh state..."
          # Ensure the reports directory exists
          mkdir -p reports
          
          # Execute the status generation script (uncomment when ready)
          # python -m src.tools.generate_status
          
          # Fallback: Generate a basic timestamped status file if script is not yet active
          echo "Mesh Status: Operational" > reports/mesh_status.txt
          echo "Last Updated: $(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> reports/mesh_status.txt

      - name: Commit and Push Status (Guardian-Compliant)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "psvc-mesh-bot"
          git config user.email "mesh-bot@psivi.com"
          
          git add reports/
          
          if ! git diff --staged --quiet; then
            # RULE 1: MUST include [skip ci] to prevent infinite workflow loops
            git commit -m "mesh: updated status report [skip ci]"
            
            # RULE 2: MUST use the race-condition shield (rebase loop)
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed mesh status."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No changes to mesh status."
          fi
