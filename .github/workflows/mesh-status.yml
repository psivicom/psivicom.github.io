name: Mesh Status

on:
  schedule:
    - cron: '0 * * * *' # Hourly status check
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Mesh Router
        run: python -m src.mesh.mesh_router
        
      - name: Commit Status (Conflict-Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Router"
          git config user.email "mesh-router@users.noreply.github.com"
          
          # THESE TWO LINES ARE THE MAGIC FIX:
          git fetch origin main
          git reset --soft origin/main
          
          python -m src.mesh.mesh_router > reports/mesh_status.txt 2>&1
          git add reports/mesh_status.txt
          
          git diff --staged --quiet || (git commit -m "mesh: updated status report" && git push origin main)
