name: Mesh Status

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Mesh Router
        run: python -m src.mesh.mesh_router
        
      - name: Commit Status (Conflict-Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Router"
          git config user.email "mesh-router@users.noreply.github.com"
          
          # 1. Fetch the absolute latest state from the remote repository
          git fetch origin main
          
          # 2. Soft reset to the remote main to prevent push rejections
          git reset --soft origin/main
          
          # 3. Run the router again to capture the latest status
          python -m src.mesh.mesh_router > reports/mesh_status.txt 2>&1
          git add reports/mesh_status.txt
          
          # 4. Commit and push only if there are actual changes
          git diff --staged --quiet || (git commit -m "mesh: updated status report" && git push origin main)
