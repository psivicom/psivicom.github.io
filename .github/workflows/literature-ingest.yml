name: Literature Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Literature Agent
        run: |
          python -m src.agents.literature_agent

      - name: Commit and Push Literature Artifacts (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Literature Agent"
          git config user.email "literature@psivi.com"
          
          # CRITICAL: Ensure directories exist
          mkdir -p reports/pico_containers
          mkdir -p config
          
          # BULLETPROOF FIX: Stage ALL changes to prevent ANY unstaged change rebase errors
          git add .
          
          if ! git diff --staged --quiet; then
            echo "🚀 Committing all new literature vectors and evolved registry..."
            git commit -m "literature: ingested scientific context vectors and evolved registry [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed literature artifacts."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new literature vectors or registry changes to commit."
          fi
