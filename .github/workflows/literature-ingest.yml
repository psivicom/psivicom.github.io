name: Literature Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Run Literature Agent
        run: |
          python -m src.agents.literature_agent

      - name: Commit and Push Literature Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Literature Agent"
          git config user.email "literature@psivi.com"
          mkdir -p reports/pico_containers
          mkdir -p config
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "literature: ingested scientific context vectors and evolved registry [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed literature artifacts."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new literature vectors or registry changes to commit."
          fi
