name: Literature Ingest & Active Synthesis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  issues: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Execute Cognitive Synthesis
        run: |
          python -m src.agents.literature_agent

      - name: Commit and Push Evolved Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Literature Agent"
          git config user.email "literature@psivi.com"
          mkdir -p reports/pico_containers
          mkdir -p config
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "literature: active cognitive synthesis complete, registry evolved [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed synthesized artifacts."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new synthesis artifacts to commit."
          fi

      - name: Auto-Resolve Sensory Input Notifications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find open issues labeled 'sensory-input' and close them with active synthesis confirmation
          for issue in $(gh issue list --label "sensory-input" --state open --json number --jq '.[].number'); do
            echo "🧠 Active Synthesis: Closing issue #$issue with cognitive confirmation."
            gh issue comment "$issue" --body "✅ **Cognitive Synthesis Complete.**\n\nWENDY has successfully ingested the new external data, evolved the epistemic registry, and sealed the cognitive vectors. The loop is closed."
            gh issue close "$issue" --reason completed
          done || true
