name: Literature Ingest & Active Synthesis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  issues: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Read System Versions
        id: versions
        run: |
          echo "python_version=$(jq -r '.python.version' config/system_versions.json)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python_version }}

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Execute Cognitive Synthesis
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.literature_agent

      - name: Commit and Push Evolved Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Literature Agent"
          git config user.email "literature@psivi.com"
          mkdir -p reports/pico_containers config
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "literature: active cognitive synthesis complete [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          else
            echo "ℹ️ No new synthesis artifacts to commit."
          fi
