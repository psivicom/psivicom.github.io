name: Test Elastic Evolution

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-elastic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Elastic Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.orchestrator.psvc_provisioner
      - name: Commit test report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Elastic Test"
          git config user.email "elastic-test@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "elastic-test: verified provisioner security"
          git push
