name: WENDY 🍀 FORTH Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install FORTH
        run: sudo apt-get install -y gforth
      
      - name: Install Zig
        run: |
          wget -q https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz
          tar -xf zig-linux-x86_64-0.11.0.tar.xz
          echo "$(pwd)/zig-linux-x86_64-0.11.0" >> $GITHUB_PATH
      
      - name: Bootstrap FORTH Dictionary
        run: |
          cd wendy-cortex/forth
          if [ ! -f wendy_dictionary.fth ]; then
            echo "🧬 Dictionary not found. Bootstrapping baseline..."
            cat > wendy_dictionary.fth << 'DICTIONARY_EOF'
\ WENDY FORTH Dictionary (Bootstrapped Baseline)
\ SPDX-License-Identifier: EUPL-1.2

: mean ( addr count -- mean )
    0.0 -rot
    0 do
        dup i 8 * + f@ f+
    loop
    swap s>f f/
;

: variance ( addr count -- variance )
    2dup mean >r
    0.0 -rot
    0 do
        dup i 8 * + f@ r@ f- fdup f* f+
    loop
    nip s>f f/
    r> fdrop
;

: invent-word ( -- )
    ." 🧬 WENDY can invent new words at runtime." cr
;

: benchmark ( -- )
    100 0 do
        ." Iteration " i . cr
        invent-word
    loop
;

." ✅ WENDY FORTH Dictionary loaded. Ready for evolution." cr
DICTIONARY_EOF
            echo "✅ Bootstrapped baseline dictionary"
          fi
      
      - name: Boot Rust Cortex
        run: |
          cd wendy-cortex
          cargo build --release
          nohup ./target/release/wendy-cortex > ../wendy_ipc.log 2>&1 &
          sleep 5
      
      - name: Run FORTH Evolution
        run: |
          cd wendy-cortex/forth
          gforth evolution.fth -e "WENDY-EVOLVE" -e "bye"
      
      - name: Commit Evolutions
        run: |
          git config --global user.name "WENDY"
          git config --global user.email "wendy@psivi.com"
          git add -A
          git diff --staged --quiet || (git commit -m "🧬 evolve: FORTH-native evolution at $(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" && git push)
