      - name: ⚡ Compile Zig Hot Path (Self-Healing)
        run: |
          cd wendy-cortex
          
          # Source coordination helper
          source ../scripts/wendy_coordinator.sh
          
          # Try compilation
          if zig build-exe -O ReleaseFast src/hot_path.zig 2>zig_error.log; then
            echo "✅ Zig hot path compiled successfully"
            update_state "zig_compile" "success"
            rm -f zig_error.log
          else
            echo "⚠️ Zig compilation failed. Initiating self-heal..."
            cat zig_error.log
            
            # Revert to last known good version
            if git log --oneline -n 20 -- src/hot_path.zig | grep -q "zig"; then
              echo "🔄 Reverting to last good Zig version..."
              git log --oneline -n 20 -- src/hot_path.zig | grep "zig" | head -1 | cut -d' ' -f1 | xargs git checkout HEAD -- src/hot_path.zig
            else
              echo "🔄 Writing baseline Zig..."
              cat > src/hot_path.zig << 'ZIG_EOF'
const std = @import("std");

pub fn mean(values: []const f64) f64 {
    if (values.len == 0) return 0.0;
    var sum: f64 = 0.0;
    for (values) |val| sum += val;
    return sum / @as(f64, @floatFromInt(values.len));
}

pub fn variance(values: []const f64) f64 {
    if (values.len < 2) return 0.0;
    var count: usize = 0;
    var mean_val: f64 = 0.0;
    var m2: f64 = 0.0;
    for (values) |val| {
        count += 1;
        const delta = val - mean_val;
        mean_val += delta / @as(f64, @floatFromInt(count));
        const delta2 = val - mean_val;
        m2 += delta * delta2;
    }
    return m2 / @as(f64, @floatFromInt(count - 1));
}

pub fn dot_product(a: []const f64, b: []const f64) f64 {
    if (a.len != b.len) return 0.0;
    var sum: f64 = 0.0;
    for (a, 0..) |val, idx| sum += val * b[idx];
    return sum;
}

comptime {
    @export(mean, .{ .name = "wendy_mean", .linkage = .strong });
    @export(variance, .{ .name = "wendy_variance", .linkage = .strong });
    @export(dot_product, .{ .name = "wendy_dot_product", .linkage = .strong });
}
ZIG_EOF
            fi
            
            # Verify baseline compiles
            if zig build-exe -O ReleaseFast src/hot_path.zig 2>&1; then
              echo "✅ Baseline Zig compiled"
              update_state "zig_compile" "self_healed" "reverted_to_baseline"
              
              # Commit and push the self-heal
              cd ..
              source scripts/wendy_coordinator.sh
              safe_push "🩹 self-heal: reverted malformed Zig mutation"
            else
              echo "❌ Even baseline Zig failed. Critical error."
              update_state "zig_compile" "critical_failure"
              exit 1
            fi
            
            rm -f wendy-cortex/zig_error.log
          fi
