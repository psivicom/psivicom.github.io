name: AETHER VANGUARD Auto-Evolution

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allows you to click "Run workflow" manually in GitHub UI

jobs:
  evolve-vector-pixelizer:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to auto-commit the PROVENANCE.json update
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pytest PyYAML websockets psutil

      - name: Run Fidelity Tests
        run: pytest tests/

      - name: Generate Provenance Hash & Update Ledger
        run: |
          # Hash the core algorithm
          HASH=$(shasum -a 256 src/core/vector_pixelizer.py | awk '{print $1}')
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          # Write the new PROVENANCE.json
          cat <<EOF > PROVENANCE.json
          {
            "status": "active",
            "timestamp": "$TIMESTAMP",
            "algorithm_hash": "$HASH",
            "nist_compliance": true,
            "fair_license": "CC-BY-SA-4.0",
            "mesh_name": "AETHER VANGUARD - Goldstream Ecology",
            "auto_generated": true
          }
          EOF

      - name: Commit and Push Evolution
        run: |
          git config user.name "AETHER VANGUARD Bot"
          git config user.email "mesh-bot@psivicom.github.io"
          git add PROVENANCE.json
          # Only commit if the hash actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Auto-evolve Vector Pixelizer [Hash: $HASH]"
          git push
