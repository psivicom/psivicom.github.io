name: Mesh Evolution

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: pip install -r requirements.txt

      - name: Force Install WebSockets
        run: |
          echo "🔒 Forcing explicit installation of websockets to bypass pip resolver quirks..."
          python -m pip install --force-reinstall "websockets>=11.0"
          python -c "import websockets; print(f'✅ websockets {websockets.__version__} successfully loaded!')"

      - name: Run Mesh Brain
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.mesh.mesh_brain

      - name: Commit Evolution Report (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Evolution"
          git config user.email "evolution@psivi.com"
          git add reports/
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "evolution: executed weekly mesh brain update [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed evolution report."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new evolution data to commit."
          fi
