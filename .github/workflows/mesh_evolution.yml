name: Mesh Evolution

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Mesh Evolution
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.mesh.mesh_brain
      - name: Commit evolution report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Evolution"
          git config user.email "evolution@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "evolution: executed weekly mesh brain update"
          git push
