name: Mesh Evolution

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          echo "📦 Installing core requirements..."
          pip install -r requirements.txt
          echo "🔒 Explicitly ensuring websockets is installed..."
          pip install --upgrade websockets>=11.0

      - name: Run Mesh Brain
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.mesh.mesh_brain

      - name: Commit Evolution Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Evolution"
          git config user.email "evolution@psivi.com"
          git add reports/
          git diff --staged --quiet || (git commit -m "evolution: executed weekly mesh brain update [skip ci]" && git push)
