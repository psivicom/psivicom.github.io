name: Mesh Evolution

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: pip install -r requirements.txt

      - name: Force Install WebSockets
        run: |
          echo "🔒 Forcing explicit installation of websockets to bypass pip resolver quirks..."
          python -m pip install --force-reinstall websockets>=11.0
          python -c "import websockets; print(f'✅ websockets {websockets.__version__} successfully loaded!')"

      - name: Run Mesh Brain
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.mesh.mesh_brain

      - name: Commit Evolution Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Evolution"
          git config user.email "evolution@psivi.com"
          git add reports/
          git diff --staged --quiet || (git commit -m "evolution: executed weekly mesh brain update [skip ci]" && git push)
