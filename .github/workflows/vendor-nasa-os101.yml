name: Vendor NASA OS101 (Web-Based Build)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc unzip curl python3

      - name: Execute Cryptographic Vendor Build
        env:
          REC_ID: "10161527"
          DOI: "10.5281/zenodo.10161527"
          ZIP_NAME: "open-science-101-v-1-0-0.zip"
          PIN_MD5: "ecde9587a3c95be40eb0eb3cfa083ea5"
          PIN_SIZE: "23311809"
          DEST: "nasa-open-science"
          PROV: ".provenance/nasa-os101"
        run: |
          set -euo pipefail
          API="https://zenodo.org/api/records/${REC_ID}"
          
          zulu_ms() { date -u +"%Y-%m-%dT%H:%M:%S.%3NZ"; }
          STAMP=$(zulu_ms)
          echo "TIMESTAMP=${STAMP}" >> $GITHUB_ENV

          echo "🔍 Querying Zenodo API..."
          curl -sL "$API" -o record.json
          api_md5=$(python3 -c 'import json,sys;print(json.load(open("record.json"))["files"][0]["checksum"].replace("md5:",""))')
          api_size=$(python3 -c 'import json,sys;print(json.load(open("record.json"))["files"][0]["size"])')
          api_url=$(python3 -c 'import json,sys;print(json.load(open("record.json"))["files"][0]["links"]["self"])')

          [[ "$api_md5" == "$PIN_MD5" ]] || { echo "FATAL: MD5 mismatch"; exit 1; }
          [[ "$api_size" == "$PIN_SIZE" ]] || { echo "FATAL: Size mismatch"; exit 1; }
          echo "✅ Pin confirmed by API."

          echo "⬇️ Downloading archive..."
          curl -sL "$api_url" -o "$ZIP_NAME"
          actual_md5=$(md5sum "$ZIP_NAME" | awk '{print $1}')
          [[ "$actual_md5" == "$PIN_MD5" ]] || { echo "FATAL: Download MD5 mismatch"; exit 1; }
          ZIP_SHA=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "ZIP_SHA=${ZIP_SHA}" >> $GITHUB_ENV
          echo "✅ Cryptographic verification passed."

          echo "📦 Extracting safely (bulletproof logic)..."
          mkdir -p temp_extract
          unzip -q "$ZIP_NAME" -d temp_extract
          rm -f "$ZIP_NAME"
          
          ITEM_COUNT=$(ls -1 temp_extract | wc -l)
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "temp_extract/$(ls temp_extract)" ]; then
            mv "temp_extract/$(ls temp_extract)" "$DEST"
            rmdir temp_extract
          else
            mv temp_extract "$DEST"
          fi
          
          echo "🛡️ Generating provenance files..."
          mkdir -p "$PROV"
          ( cd "$DEST" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum ) > "$PROV/manifest.sha256"
          mv record.json "$PROV/record.json"

          cat > "$PROV/provenance.json" <<EOF
          {
            "source": "Zenodo (CERN)",
            "record": "${REC_ID}",
            "version_doi": "${DOI}",
            "version": "1.0.0",
            "license": "CC-BY-4.0",
            "md5": "${PIN_MD5}",
            "sha256": "${ZIP_SHA}",
            "retrieved_utc": "${STAMP}"
          }
          EOF

          cat > "$DEST/NOTICE.md" <<EOF
          # Attribution Notice
          
          This folder contains the NASA TOPS Open Science 101 Curriculum (Version 1.0.0).
          
          - **Original Authors:** NASA TOPS Open Science 101 Curriculum Development Team (2023)
          - **Source:** https://doi.org/${DOI}
          - **License:** Creative Commons Attribution 4.0 International (CC BY 4.0)
          
          **Modifications:** 
          This copy has been archived for future reference and will be adapted for apiary and Earth observation research by Louis-Philippe Audette. This adaptation is not endorsed by NASA.
          EOF

          cat > "$DEST/CITATION.cff" <<EOF
          cff-version: 1.2.0
          type: software
          title: "NASA TOPS Open Science 101"
          version: "1.0.0"
          doi: "${DOI}"
          license: CC-BY-4.0
          date-released: "2023-12-06"
          authors:
            - name: "NASA TOPS Open Science 101 Curriculum Development Team"
          abstract: >
            Open Science 101 v1.0.0. The open science curriculum will introduce those 
            beginning their open science journey to important definitions, tools, and 
            resources; and provide participants at all levels recommendations on best practices.
          url: "https://doi.org/${DOI}"
          EOF

          if [[ -f REUSE.toml ]] && ! grep -q "^path = \"${DEST}/\*\*\"" REUSE.toml; then
            cat >> REUSE.toml <<EOF

          [[annotations]]
          path = "${DEST}/**"
          precedence = "override"
          SPDX-FileCopyrightText = "2023 NASA TOPS Open Science 101 Curriculum Development Team"
          SPDX-License-Identifier = "CC-BY-4.0"
          EOF
          fi

          echo "🌐 Generating HTML with Trust Seals..."
          cat > tpl.html <<'TPL'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>$title$ — NASA Open Science 101 · PSIVI</title>
          <style>
          body{max-width:52rem;margin:2rem auto;padding:0 1rem;background:#0d1117;color:#e6edf3;font:16px/1.65
