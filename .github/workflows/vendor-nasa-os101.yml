name: Vendor NASA OS101 (Web-Based Build)

on:
  workflow_dispatch: # Allows you to run this manually from the GitHub UI

permissions:
  contents: write    # Required to commit and push the new files

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc unzip curl python3

      - name: Execute Cryptographic Vendor Build
        env:
          REC_ID: "10161527"
          DOI: "10.5281/zenodo.10161527"
          ZIP_NAME: "open-science-101-v-1-0-0.zip"
          PIN_MD5: "ecde9587a3c95be40eb0eb3cfa083ea5"
          PIN_SIZE: "23311809"
          DEST: "nasa-open-science"
          PROV: ".provenance/nasa-os101"
        run: |
          set -euo pipefail
          API="https://zenodo.org/api/records/${REC_ID}"
          
          zulu_ms() { date -u +"%Y-%m-%dT%H:%M:%S.%3NZ"; }
          STAMP=$(zulu_ms)
          echo "TIMESTAMP=${STAMP}" >> $GITHUB_ENV

          echo "🔍 Querying Zenodo API..."
          curl -sL "$API" -o record.json
          api_md5=$(python3 -c 'import json,sys;print(json.load(open("record.json"))["files"][0]["checksum"].replace("md5:",""))')
          api_size=$(python3 -c 'import json,sys;print(json.load(open("record.json"))["files"][0]["size"])')
          api_url=$(python3 -c 'import json,sys;print(json.load(open("record.json"))["files"][0]["links"]["self"])')

          [[ "$api_md5" == "$PIN_MD5" ]] || { echo "FATAL: MD5 mismatch"; exit 1; }
          [[ "$api_size" == "$PIN_SIZE" ]] || { echo "FATAL: Size mismatch"; exit 1; }
          echo "✅ Pin confirmed by API."

          echo "⬇️ Downloading archive..."
          curl -sL "$api_url" -o "$ZIP_NAME"
          actual_md5=$(md5sum "$ZIP_NAME" | awk '{print $1}')
          [[ "$actual_md5" == "$PIN_MD5" ]] || { echo "FATAL: Download MD5 mismatch"; exit 1; }
          ZIP_SHA=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "ZIP_SHA=${ZIP_SHA}" >> $GITHUB_ENV
          echo "✅ Cryptographic verification passed."

          echo "📦 Extracting safely..."
          unzip -q "$ZIP_NAME" -d temp_extract
          mv temp_extract/*/$DEST/ . || mv temp_extract/* . # Handle potential nested folder
          rm -rf temp_extract "$ZIP_NAME"
          
          echo "🛡️ Generating provenance files..."
          mkdir -p "$PROV"
          ( cd "$DEST" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum ) > "$PROV/manifest.sha256"
          mv record.json "$PROV/record.json"

          cat > "$PROV/provenance.json" <<EOF
          {
            "source": "Zenodo (CERN)",
            "record": "${REC_ID}",
            "version_doi": "${DOI}",
            "version": "1.0.0",
            "license": "CC-BY-4.0",
            "md5": "${PIN_MD5}",
            "sha256": "${ZIP_SHA}",
            "retrieved_utc": "${STAMP}"
          }
          EOF

          cat > "$DEST/NOTICE.md" <<EOF
          # Attribution Notice

          This folder contains the NASA TOPS Open Science 101 Curriculum (Version 1.0.0).

          - **Original Authors:** NASA TOPS Open Science 101 Curriculum Development Team (2023)
          - **Source:** https://doi.org/${DOI}
          - **License:** Creative Commons Attribution 4.0 International (CC BY 4.0)

          **Modifications:** 
          This copy has been archived for future reference and will be adapted for apiary and Earth observation research by Louis-Philippe Audette. This adaptation is not endorsed by NASA.
          EOF

          cat > "$DEST/CITATION.cff" <<EOF
          cff-version: 1.2.0
          type: software
          title: "NASA TOPS Open Science 101"
          version: "1.0.0"
          doi: "${DOI}"
          license: CC-BY-4.0
          date-released: "2023-12-06"
          authors:
            - name: "NASA TOPS Open Science 101 Curriculum Development Team"
          abstract: >
            Open Science 101 v1.0.0. The open science curriculum will introduce those 
            beginning their open science journey to important definitions, tools, and 
            resources; and provide participants at all levels recommendations on best practices.
          url: "https://doi.org/${DOI}"
          EOF

          if [[ -f REUSE.toml ]] && ! grep -q "^path = \"${DEST}/\*\*\"" REUSE.toml; then
            cat >> REUSE.toml <<EOF

          [[annotations]]
          path = "${DEST}/**"
          precedence = "override"
          SPDX-FileCopyrightText = "2023 NASA TOPS Open Science 101 Curriculum Development Team"
          SPDX-License-Identifier = "CC-BY-4.0"
          EOF
          fi

          echo "🌐 Generating HTML with Trust Seals..."
          cat > tpl.html <<'TPL'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>$title$ — NASA Open Science 101 · PSIVI</title>
          <style>
          body{max-width:52rem;margin:2rem auto;padding:0 1rem;background:#0d1117;color:#e6edf3;font:16px/1.65 system-ui,sans-serif}
          a{color:#7ee787}img{max-width:100%}table{border-collapse:collapse}td,th{border:1px solid #30363d;padding:.4rem}
          .trust-banner{margin:2rem 0 1.5rem;padding:1rem 1.25rem;border:1px solid #238636;border-radius:10px;background:linear-gradient(135deg,#0d2818 0%,#161b22 100%);display:flex;align-items:center;gap:1rem;font-size:.9rem}
          .trust-banner .seal{font-size:2rem;filter:drop-shadow(0 0 8px #2ea043)}
          .trust-banner .meta{flex:1}
          .trust-banner .meta strong{color:#7ee787;display:block;margin-bottom:.25rem}
          .trust-banner .meta code{background:#0d1117;padding:.1rem .4rem;border-radius:4px;font-size:.8rem;color:#8b949e}
          .trust-banner .verified{color:#3fb950;font-weight:600}
          footer{margin-top:3rem;border-top:1px solid #30363d;padding-top:1rem;font-size:.85rem;color:#8b949e}
          </style></head><body>
          <div class="trust-banner">
            <div class="seal">🛡️</div>
            <div class="meta">
              <strong>✅ Verified · Cryptographically Pinned</strong>
              <span class="verified">Source: <a href="https://doi.org/10.5281/zenodo.10161527">Zenodo v1.0.0</a> · License: CC BY 4.0</span><br>
              <code>MD5: ecde9587a3c95be40eb0eb3cfa083ea5</code> · <code>SHA-256: $sha256$</code><br>
              <code>Timestamp: $timestamp$</code>
            </div>
          </div>
          $body$
          <footer><p>🔐 This page is part of the NASA TOPS Open Science 101 archive, retrieved <strong>$timestamp$</strong> from the immutable Zenodo version DOI <a href="https://doi.org/10.5281/zenodo.10161527">10.5281/zenodo.10161527</a>. Integrity verified against MD5 + SHA-256 checksums. Not endorsed by NASA.</p></footer>
          </body></html>
          TPL

          ( cd "$DEST" && find . -name '*.md' ! -name 'NOTICE.md' -print0 | while IFS= read -r -d '' md; do
              pandoc "$md" -f gfm -t html5 -s --template="../tpl.html" \
                --metadata title="$(basename "$(dirname "$md")")" \
                -V sha256="${ZIP_SHA}" -V timestamp="${STAMP}" \
                -o "${md%.md}.html"
            done )

          # Generate Index
          cat > "$DEST/index.html" <<HEAD
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>NASA Open Science 101 — PSIVI Open Science Hub</title>
          <style>
          body{max-width:60rem;margin:2rem auto;padding:0 1rem;background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,sans-serif}
          a{color:#7ee787;text-decoration:none}a:hover{text-decoration:underline}
          h1{border-bottom:1px solid #30363d;padding-bottom:.5rem}
          .trust-seal{margin:2rem 0;padding:1.5rem;border:2px solid #238636;border-radius:12px;background:linear-gradient(135deg,#0d2818 0%,#161b22 100%);text-align:center}
          .trust-seal .big-seal{font-size:4rem;margin-bottom:.5rem;filter:drop-shadow(0 0 12px #2ea043)}
          .trust-seal h2{color:#3fb950;margin:0 0 .5rem;font-size:1.3rem}
          .trust-seal .verified-line{color:#7ee787;font-weight:600;margin:.5rem 0}
          .trust-seal code{background:#0d1117;padding:.2rem .5rem;border-radius:4px;font-size:.85rem;color:#8b949e;display:inline-block;margin:.2rem}
          .card{border:1px solid #30363d;border-radius:8px;padding:1rem;margin:1rem 0;background:#161b22}
          li{margin:.25rem 0}
          footer{margin-top:3rem;border-top:1px solid #30363d;padding-top:1rem;font-size:.85rem;color:#8b949e}
          </style></head><body>
          <h1>NASA Open Science 101 <small>v1.0.0</small></h1>
          <div class="trust-seal">
            <div class="big-seal">🛡️✅</div>
            <h2>Verified · Cryptographically Pinned · Publicly Auditable</h2>
            <div class="verified-line">Source: <a href="https://doi.org/10.5281/zenodo.10161527">Zenodo v1.0.0</a> · License: CC BY 4.0</div>
            <div><code>MD5: ecde9587a3c95be40eb0eb3cfa083ea5</code> <code>SHA-256: ${ZIP_SHA}</code></div>
            <div><code>Retrieved: ${STAMP}</code></div>
            <p style="margin-top:1rem;font-size:.9rem;color:#8b949e">This archive is immutable. Any visitor can independently verify the checksums against the Zenodo API. Provenance manifest: <a href="../.provenance/nasa-os101/manifest.sha256">manifest.sha256</a></p>
          </div>
          <p>Archived from the immutable Zenodo version DOI <a href="https://doi.org/10.5281/zenodo.10161527">10.5281/zenodo.10161527</a>, checksum-verified. <a href="NOTICE.md">Attribution &amp; provenance</a>.</p>
          HEAD

          for m in "$DEST"/Module_*; do
            [[ -d "$m" ]] || continue
            printf '<div class="card"><h2>%s</h2><ul>\n' "$(basename "$m" | tr '_' ' ')"
            for l in "$m"/Lesson_*; do
              [[ -d "$l" ]] || continue
              printf '<li><a href="%s/readme.html">%s</a></li>\n' "${l#"$DEST"/}" "$(basename "$l" | tr '_' ' ')"
            done
            printf '</ul></div>\n'
          done
          printf '<footer>🔐 Retrieved %s · MD5 ecde9587a3c95be40eb0eb3cfa083ea5 · SHA-256 %s · Not endorsed by NASA.</footer></body></html>\n' "${STAMP}" "${ZIP_SHA}" >> "$DEST/index.html"

          echo "💾 Committing and Pushing..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST" "$PROV" REUSE.toml
          git commit -m "chore: vendor NASA TOPS OS101 v1.0.0 (CC BY 4.0) with cryptographic proof"
          git push
          
          echo "🚀 DONE! Public at https://psivi.com/nasa-open-science/"
