name: Volunteer Mesh

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  volunteer-sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies for PyNaCl
        run: |
          # CRITICAL: PyNaCl requires libffi-dev to build its C extensions properly on Ubuntu
          sudo apt-get update
          sudo apt-get install -y libffi-dev python3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          
          # Diagnostic: Verify nacl is actually importable before proceeding
          python -c "import nacl; print('✅ PyNaCl version:', nacl.__version__)"

      - name: Execute Volunteer Worker (with Diagnostic Import)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🔍 Attempting to import SovereignPSVC..."
          # CRITICAL: This will print the EXACT underlying error (e.g., ModuleNotFoundError) 
          # instead of the misleading "cannot import name" wrapper if it fails.
          python -c "from src.core.psvc_sovereign import SovereignPSVC; print('✅ SovereignPSVC import successful!')"
          
          if [ -f "src/mesh/volunteer_worker.py" ]; then
            python -m src.mesh.volunteer_worker
          else
            echo "❌ Volunteer worker not found"
            exit 1
          fi
