name: Volunteer Mesh

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  volunteer-sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Volunteer Worker
        run: |
          if [ -f "src/mesh/volunteer_worker.py" ]; then
            python src/mesh/volunteer_worker.py
          else
            echo "Volunteer worker not found"
            exit 1
          fi

      - name: Validate Ledger Before Commit (Circuit Breaker)
        run: python src/core/ledger_validator.py reports/pilot_report.json

      - name: Commit State Changes
        uses: stefanzweifel/git-auto-commit-action@e348103e9026cc0eee72ae06630dbe30c8bf7a79 # v5
        with:
          commit_message: "chore(mesh): volunteer node sync"
          branch: main
