# .github/workflows/volunteer-mesh.yml
name: Volunteer Mesh

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  volunteer-sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Volunteer Worker
        run: |
          if [ -f "src/mesh/volunteer_worker.py" ]; then
            python src/mesh/volunteer_worker.py
          else
            echo "Volunteer worker not found"
            exit 1
          fi

      - name: Validate Ledger Before Commit (Circuit Breaker)
        run: python src/core/ledger_validator.py reports/pilot_report.json

      - name: Commit State Changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(mesh): volunteer node sync"
          branch: main
