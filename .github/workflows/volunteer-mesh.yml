name: Volunteer Mesh

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  volunteer-sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyNaCl

      - name: Execute Volunteer Worker
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -f "src/mesh/volunteer_worker.py" ]; then
            python -m src.mesh.volunteer_worker
          else
            echo "Volunteer worker not found"
            exit 1
          fi
