name: Volunteer Mesh Coordinator

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coordinate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Volunteer Worker
        run: |
          pip install numpy
          python volunteer_worker.py

      - name: Commit contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Volunteer Coordinator"
          git config user.email "volunteer@users.noreply.github.com"
          git add reports/volunteer_contributions/
          git diff --staged --quiet || git commit -m "volunteer: processed pico containers and logged contributions"
          git push
