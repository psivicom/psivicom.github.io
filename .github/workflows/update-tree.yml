name: Update Tree

on:
  push:
    branches: [ main ]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tree-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22'
          cache: false

      - name: Generate Tree and README
        run: |
          cd docs/GO_TREE/update-tree
          go run main.go ../../

      - name: Commit Tree Updates (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          touch TREE.md README.md .tree.hash
          git add TREE.md README.md .tree.hash
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update tree and README [skip ci]"
            
            # THE RACE-CONDITION SHIELD: 
            # Both commands MUST be on the same line to satisfy the Guardian's line-by-line check.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed tree updates."
                break
              else
                echo "⚠️ Concurrent push or conflict detected. Aborting rebase and retrying in 2s..."
                git rebase --abort || true
                sleep 2
              fi
            done
          else
            echo "ℹ️ No tree changes to commit."
          fi
