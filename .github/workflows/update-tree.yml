name: update-tree

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    name: update-tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # CRITICAL: WENDY_PAT required to trigger downstream CI/CD upon tree update
          token: ${{ secrets.WENDY_PAT }}
          fetch-depth: 0

      - name: Generate and Inject Tree (Pure Bash)
        run: |
          set -euo pipefail
          
          echo "🔍 Generating tree with -a (show hidden), -F (classify), and --dirsfirst..."
          
          command -v tree >/dev/null 2>&1 || { echo "❌ tree command not found"; exit 1; }
          
          tree -a --dirsfirst -F --charset utf-8 -I '.git|data|reports|docs|src|wendy-go|config|assets|maps|logs|tests|tools|_techreports|dist|js|node_modules|tree.md|tree_snippet.html' > /tmp/raw_tree.txt
          
          echo "✅ Raw tree output sample (first 30 lines):"
          head -n 30 /tmp/raw_tree.txt
          
          {
            echo '```text'
            cat /tmp/raw_tree.txt
            echo '```'
          } > tree.md
          
          awk '
          BEGIN {
            print "<div style=\"font-family:monospace; line-height:1.5; background:#002FA7; color:#ffffff; padding:24px; border-radius:12px;\">"
          }
          {
            line = $0
            sub(/\r$/, "", line)
            
            if (line ~ /^[0-9]+ directories?, [0-9]+ files?$/) next
            
            clean_line = line
            sub(/[ \t]+$/, "", clean_line)
            
            if (clean_line ~ /\/$/) {
              color = "#80BFFF"
            } else if (clean_line ~ /\.(sh|go|py)\*?$/) {
              color = "#80FF80"
            } else {
              color = "#ffffff"
            }
            
            gsub(/&/, "&amp;", line)
            gsub(/</, "&lt;", line)
            gsub(/>/, "&gt;", line)
            
            printf "  <span style=\"color:%s\">%s</span><br>\n", color, line
          }
          END {
            print "</div>"
          }' /tmp/raw_tree.txt > tree_snippet.html
          
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          
          for file in README.md index.html; do
            if [ ! -f "$file" ]; then 
              echo "⏭️ Skipping $file: File not found."
              continue
            fi
            
            if ! grep -q "<!-- AUTO_TREE_START -->" "$file"; then 
              echo "⏭️ Skipping $file: Missing <!-- AUTO_TREE_START --> marker."
              continue
            fi
            
            if [ "$file" = "README.md" ]; then
              TREE_FILE="tree.md"
            else
              TREE_FILE="tree_snippet.html"
            fi
            
            awk -v ts="$TIMESTAMP" -v tree_file="$TREE_FILE" '
              /<!-- AUTO_TREE_START -->/ {
                print "<!-- AUTO_TREE_START -->"
                print "<!-- Auto-updated by .github/workflows/update-tree.yml -->"
                print "<!-- Last updated: " ts " -->"
                
                while ((getline line < tree_file) > 0) {
                  sub(/\r$/, "", line)
                  print line
                }
                close(tree_file)
                
                print "<!-- AUTO_TREE_END -->"
                skip = 1
                next
              }
              /<!-- AUTO_TREE_END -->/ { skip = 0; next }
              !skip { print }
            ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
          done
          
          rm -f /tmp/raw_tree.txt
          echo "🎉 Tree generation and injection complete."

      - name: Commit and Push (Race-Safe)
        run: |
          set -euo pipefail
          
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "🌿 Target branch: $BRANCH_NAME"
          
          git config user.name "WENDY Autonomous Agent"
          git config user.email "wendy@psivi.com"
          
          git add -f README.md index.html tree.md tree_snippet.html 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "✅ No tree changes to commit. Files are already up to date."
            exit 0
          fi
          
          git commit -m "chore: auto-update tree via bash [skip ci]"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin "$BRANCH_NAME" 2>&1; then
              echo "✅ Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
            echo "⚠️ Push rejected (race condition). Rebasing and retrying..."
            git pull --rebase --autostash origin "$BRANCH_NAME" || {
              echo "❌ Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
          
          echo "❌ Push failed after $MAX_ATTEMPTS attempts"
          exit 1
