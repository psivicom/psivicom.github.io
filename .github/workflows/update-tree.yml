      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TREE.md README.md index.html .tree.hash
          git diff --cached --quiet || git commit -m "chore: auto-update tree, README, and index.html [skip ci]"
          git push
