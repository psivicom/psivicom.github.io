name: Update tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure tree utility is present
        run: sudo apt-get install -y tree || true

      - name: Generate tree files
        run: ./update-tree

      - name: Inject tree.md into README.md
        run: |
          awk '
            /^<!-- TREE START -->$/ { print; system("cat tree.md"); skip=1; next }
            /^<!-- TREE END -->$/   { skip=0 }
            !skip                   { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Inject tree into index.html
        run: |
          python3 << 'EOF'
          import re

          # Read the tree content
          with open('tree_clean.txt', 'r') as f:
              tree_content = f.read()

          # Read the HTML file
          with open('index.html', 'r') as f:
              html_content = f.read()

          # Define the replacement block
          replacement = f'<!-- BRENT START -->\n<pre id="brent-tree">\n{tree_content}</pre>\n<!-- BRENT END -->'

          # Use regex to replace everything between the markers
          pattern = r'<!-- BRENT START -->.*?<!-- BRENT END -->'
          new_html = re.sub(pattern, replacement, html_content, flags=re.DOTALL)

          # Write back
          with open('index.html', 'w') as f:
              f.write(new_html)
          
          print("HTML updated with pipe tree.")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TREE tree.json tree.md tree_clean.txt README.md index.html
          git diff --staged --quiet || git commit -m "Update tree" && git push
