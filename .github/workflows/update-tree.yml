name: update-tree

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    name: update-tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate Tree
        run: |
          echo "🔍 Generating tree with -a (show hidden), -F (classify), and --dirsfirst..."
          
          tree -a --dirsfirst -F --charset utf-8 -I '.git|data|reports|docs|src|wendy-go|config|assets|maps|logs|tests|tools|_techreports|dist|js|node_modules|tree.md|tree_snippet.html' > /tmp/raw_tree.txt
          
          echo "✅ Raw tree output sample (first 30 lines):"
          head -n 30 /tmp/raw_tree.txt
          
          {
            echo '```text'
            cat /tmp/raw_tree.txt
            echo '```'
          } > tree.md
          
          awk '
          BEGIN {
            print "<div style=\"font-family:monospace; line-height:1.5; background:#002FA7; color:#ffffff; padding:24px; border-radius:12px;\">"
          }
          {
            line = $0
            
            if (line ~ /^[0-9]+ directories?, [0-9]+ files?$/) next
            
            clean_line = line
            sub(/[ \t]+$/, "", clean_line)
            
            if (clean_line ~ /\/$/) {
              color = "#80BFFF"
            } else if (clean_line ~ /\.(sh|go|py)\*?$/) {
              color = "#80FF80"
            } else {
              color = "#ffffff"
            }
            
            gsub(/&/, "\\&amp;", line)
            gsub(/</, "\\&lt;", line)
            gsub(/>/, "\\&gt;", line)
            
            printf "  <span style=\"color:%s\">%s</span><br>\n", color, line
          }
          END {
            print "</div>"
          }' /tmp/raw_tree.txt > tree_snippet.html
          
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          
          for file in README.md index.html; do
            if [ "$file" = "README.md" ]; then
              TREE_FILE="tree.md"
            else
              TREE_FILE="tree_snippet.html"
            fi
            
            awk -v ts="$TIMESTAMP" -v tree_file="$TREE_FILE" '
              /<!-- AUTO_TREE_START -->/ {
                print "<!-- AUTO_TREE_START -->"
                print "<!-- Auto-updated by .github/workflows/update-tree.yml -->"
                print "<!-- Last updated: " ts " -->"
                
                while ((getline line < tree_file) > 0) {
                  print line
                }
                close(tree_file)
                
                print "<!-- AUTO_TREE_END -->"
                skip = 1
                next
              }
              /<!-- AUTO_TREE_END -->/ { skip = 0; next }
              !skip { print }
            ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
          done
          
          rm -f /tmp/raw_tree.txt
          echo "🎉 Tree generation complete. .github and archive are now visible."

      - name: Commit and Push (Race-Safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tree.md tree_snippet.html README.md index.html
          
          if git diff --cached --quiet; then
            echo "✅ No tree changes to commit"
            exit 0
          fi
          
          git commit -m "chore: auto-update tree, revealing .github with -a flag [skip ci]"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
            echo "⚠️ Push rejected (race condition). Rebasing and retrying..."
            git pull --rebase --autostash origin main || {
              echo "❌ Rebase failed. Aborting."
              git rebase --abort
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
          
          echo "❌ Push failed after $MAX_ATTEMPTS attempts"
          exit 1
