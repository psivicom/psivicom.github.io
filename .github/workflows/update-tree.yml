name: Update Repository Tree

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and Inject Tree (C-Level Speed)
        run: |
          # 1. Generate perfect tree structure in C (< 5ms). 
          # CRITICAL FIX: Added '-F' to append '/' to directories and '*' to executables.
          # Added 'tree.md|tree_snippet.html' to exclusions so they don't list themselves.
          tree --dirsfirst -F --charset utf-8 -I '.git|.github|archive|data|reports|docs|src|wendy-go|config|assets|maps|logs|tests|tools|_techreports|dist|js|node_modules|tree.md|tree_snippet.html' > /tmp/raw_tree.txt

          # 2. Build Markdown (Plain text, no bold, no ANSI)
          {
            echo '```text'
            cat /tmp/raw_tree.txt
            echo '```'
          } > tree.md

          # 3. Build Klein Blue HTML with smart syntax coloring (< 2ms via awk)
          awk '
          BEGIN {
            print "<div style=\"font-family:monospace; line-height:1.5; background:#002FA7; color:#ffffff; padding:24px; border-radius:12px;\">"
          }
          {
            line = $0
            # Skip the summary line at the bottom (e.g., "3 directories, 25 files")
            if (line ~ /^[0-9]+ directories?, [0-9]+ files?$/) next
            
            # Determine type and assign exact hex color (Relies on -F flag adding / or *)
            if (line ~ /\/$/) {
              color = "#80BFFF" # Directory (Light Blue)
            } else if (line ~ /\.(sh|go|py)\*?$/) {
              color = "#80FF80" # Script (Light Green)
            } else {
              color = "#ffffff" # File (White)
            }
            
            # Escape HTML entities to prevent rendering breaks
            gsub(/&/, "\\&amp;", line)
            gsub(/</, "\\&lt;", line)
            gsub(/>/, "\\&gt;", line)
            
            printf "  <span style=\"color:%s\">%s</span><br>\n", color, line
          }
          END {
            print "</div>"
          }' /tmp/raw_tree.txt > tree_snippet.html

          # 4. Inject into README.md and index.html (< 2ms via robust awk getline)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          
          for file in README.md index.html; do
            if [ "$file" = "README.md" ]; then
              TREE_FILE="tree.md"
            else
              TREE_FILE="tree_snippet.html"
            fi
            
            awk -v ts="$TIMESTAMP" -v tree_file="$TREE_FILE" '
              /<!-- AUTO_TREE_START -->/ {
                print "<!-- AUTO_TREE_START -->"
                print "<!-- Auto-updated by .github/workflows/update-tree.yml -->"
                print "<!-- Last updated: " ts " -->"
                
                while ((getline line < tree_file) > 0) {
                  print line
                }
                close(tree_file)
                
                print "<!-- AUTO_TREE_END -->"
                skip = 1
                next
              }
              /<!-- AUTO_TREE_END -->/ { skip = 0; next }
              !skip { print }
            ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
          done

          rm -f /tmp/raw_tree.txt
          echo "✅ Tree generated and injected with correct Klein Blue coloring."

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tree.md tree_snippet.html README.md index.html
          git diff --cached --quiet || git commit -m "chore: auto-update tree with correct directory coloring [skip ci]"
          git push
