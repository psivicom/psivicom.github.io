name: update-tree

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    name: update-tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: |
            **/go.sum

      - name: Execute Go Tree Generator (Self-Healing)
        run: |
          set -euo pipefail
          
          echo "🔍 Analyzing Go module topology..."
          
          # Scenario A: The module lives inside the cmd directory
          if [ -f "./cmd/update-tree/go.mod" ]; then
            echo "📂 Found isolated module in ./cmd/update-tree. Shifting context."
            cd ./cmd/update-tree
            go run .
            
          # Scenario B: The module lives in the repository root
          elif [ -f "go.mod" ]; then
            echo "📂 Found root module. Executing ./cmd/update-tree."
            go run ./cmd/update-tree
            
          # Scenario C: No module exists (Ephemeral Initialization)
          else
            echo "⚠️ No go.mod detected. Initializing ephemeral module to satisfy Go toolchain..."
            go mod init local.dev/update-tree
            go mod tidy || echo "⚠️ go mod tidy skipped (no external deps)."
            echo "🚀 Executing ./cmd/update-tree"
            go run ./cmd/update-tree
          fi

      - name: Inject Tree into Markdown and HTML (Safety Fallback)
        run: |
          set -euo pipefail
          
          # Only run injection if the Go program generated the files and didn't already inject them
          if [ -f "tree.md" ] && [ -f "tree_snippet.html" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
            
            for file in README.md index.html; do
              if [ ! -f "$file" ]; then continue; fi
              if ! grep -q "<!-- AUTO_TREE_START -->" "$file"; then continue; fi
              
              if [ "$file" = "README.md" ]; then 
                TREE_FILE="tree.md"
              else 
                TREE_FILE="tree_snippet.html"
              fi
              
              awk -v ts="$TIMESTAMP" -v tree_file="$TREE_FILE" '
                /<!-- AUTO_TREE_START -->/ {
                  print "<!-- AUTO_TREE_START -->"
                  print "<!-- Auto-updated by .github/workflows/update-tree.yml -->"
                  print "<!-- Last updated: " ts " -->"
                  
                  while ((getline line < tree_file) > 0) {
                    sub(/\r$/, "", line)
                    print line
                  }
                  close(tree_file)
                  
                  print "<!-- AUTO_TREE_END -->"
                  skip = 1
                  next
                }
                /<!-- AUTO_TREE_END -->/ { skip = 0; next }
                !skip { print }
              ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
            done
          fi

      - name: Commit and Push (Race-Safe)
        run: |
          set -euo pipefail
          
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "🌿 Target branch: $BRANCH_NAME"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all potential output files. '|| true' prevents failure if some are gitignored.
          git add README.md index.html tree.md tree_snippet.html || true
          
          if git diff --cached --quiet; then
            echo "✅ No tree changes to commit"
            exit 0
          fi
          
          git commit -m "chore: auto-update tree via Go [skip ci]"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin "$BRANCH_NAME" 2>&1; then
              echo "✅ Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
            echo "⚠️ Push rejected (race condition). Rebasing and retrying..."
            git pull --rebase --autostash origin "$BRANCH_NAME" || {
              echo "❌ Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
          
          echo "❌ Push failed after $MAX_ATTEMPTS attempts"
          exit 1
