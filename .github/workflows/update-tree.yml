name: update-tree

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    name: update-tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Execute Go Tree Generator (Diagnostic Mode)
        run: |
          set -euo pipefail
          
          echo "🔍 Analyzing Go module topology..."
          
          EXEC_CMD="go run ./cmd/update-tree"
          
          if [ -f "./cmd/update-tree/go.mod" ]; then
            echo "📂 Found isolated module in ./cmd/update-tree. Shifting context."
            cd ./cmd/update-tree
            EXEC_CMD="go run ."
          elif [ -f "go.mod" ]; then
            echo "📂 Found root module. Executing ./cmd/update-tree."
          else
            echo "⚠️ No go.mod detected. Initializing ephemeral module..."
            go mod init local.dev/update-tree
            go mod tidy || true
          fi
          
          echo "🚀 Compiling and running Go code..."
          # Capture both stdout and stderr to diagnose panics or compile errors
          if ! $EXEC_CMD > /tmp/go_stdout.log 2> /tmp/go_stderr.log; then
            echo "::error::❌ GO EXECUTION FAILED! Check the compiler errors or runtime panics below."
            echo "--- STDOUT ---"
            cat /tmp/go_stdout.log
            echo "--- STDERR ---"
            cat /tmp/go_stderr.log
            echo "--------------"
            echo "💡 ACTION REQUIRED: The Go code inside ./cmd/update-tree failed to compile or panicked at runtime."
            exit 1
          fi
          
          echo "✅ Go execution successful. Verifying output files..."
          if [ ! -f "tree.md" ] || [ ! -f "tree_snippet.html" ]; then
            echo "::warning::⚠️ Go code ran, but did not generate tree.md or tree_snippet.html in the root directory."
            echo "💡 ACTION REQUIRED: Ensure your Go code writes these files to the current working directory (./)."
          fi

      - name: Inject Tree into Markdown and HTML (Safety Fallback)
        run: |
          set -euo pipefail
          
          if [ ! -f "tree.md" ] || [ ! -f "tree_snippet.html" ]; then
            echo "⏭️ Skipping injection: Required tree files not found."
            exit 0
          fi
          
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          INJECTED=0
          
          for file in README.md index.html; do
            if [ ! -f "$file" ]; then continue; fi
            if ! grep -q "<!-- AUTO_TREE_START -->" "$file"; then 
              echo "⏭️ Skipping $file: Missing <!-- AUTO_TREE_START --> marker."
              continue
            fi
            
            if [ "$file" = "README.md" ]; then 
              TREE_FILE="tree.md"
            else 
              TREE_FILE="tree_snippet.html"
            fi
            
            awk -v ts="$TIMESTAMP" -v tree_file="$TREE_FILE" '
              /<!-- AUTO_TREE_START -->/ {
                print "<!-- AUTO_TREE_START -->"
                print "<!-- Auto-updated by .github/workflows/update-tree.yml -->"
                print "<!-- Last updated: " ts " -->"
                while ((getline line < tree_file) > 0) {
                  sub(/\r$/, "", line)
                  print line
                }
                close(tree_file)
                print "<!-- AUTO_TREE_END -->"
                skip = 1
                next
              }
              /<!-- AUTO_TREE_END -->/ { skip = 0; next }
              !skip { print }
            ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
            INJECTED=1
          done
          
          if [ $INJECTED -eq 0 ]; then
            echo "::warning::⚠️ No files were injected. Ensure README.md or index.html contain the <!-- AUTO_TREE_START --> markers."
          fi

      - name: Commit and Push (Race-Safe)
        run: |
          set -euo pipefail
          
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "🌿 Target branch: $BRANCH_NAME"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force add to bypass .gitignore if necessary
          git add -f README.md index.html tree.md tree_snippet.html 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "✅ No tree changes to commit. Files are already up to date."
            exit 0
          fi
          
          git commit -m "chore: auto-update tree via Go [skip ci]"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin "$BRANCH_NAME" 2>&1; then
              echo "✅ Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
            echo "⚠️ Push rejected. Rebasing..."
            git pull --rebase --autostash origin "$BRANCH_NAME" || {
              echo "❌ Rebase failed."
              git rebase --abort || true
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
          
          echo "❌ Push failed after $MAX_ATTEMPTS attempts"
          exit 1
