name: Update tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure tree utility is present
        run: sudo apt-get install -y tree || true

      - name: Generate tree files
        run: ./update-tree

      - name: Inject tree.md into README.md
        run: |
          awk '
            /^<!-- TREE START -->$/ { print; system("cat tree.md"); skip=1; next }
            /^<!-- TREE END -->$/   { skip=0 }
            !skip                   { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Inject tree into index.html
        run: |
          # Extract clean tree content (remove markdown backticks)
          sed '/^```/d' tree.md > tree_clean.txt
          
          # Use awk to inject the content between markers
          awk '
            /<!-- BRENT START -->/ { 
              print; 
              print "<pre id=\"brent-tree\">"; 
              while ((getline line < "tree_clean.txt") > 0) print line; 
              print "</pre>"; 
              skip=1; 
              next 
            }
            /<!-- BRENT END -->/   { skip=0 }
            !skip                  { print }
          ' index.html > index.tmp && mv index.tmp index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TREE tree.json tree.md README.md index.html tree_clean.txt
          git diff --staged --quiet || git commit -m "Update tree" && git push
