name: Update tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build tree binary
        run: |
          cd cmd/update-tree
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../update-tree .

      - name: Generate tree files
        run: ./update-tree

      - name: Inject tree.md into README.md
        run: |
          awk '
            /^<!-- TREE START -->$/ { print; system("cat tree.md"); skip=1; next }
            /^<!-- TREE END -->$/   { skip=0 }
            !skip                   { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Inject tree.json into index.html
        run: |
          awk '
            /<!-- BRENT START -->/ { print; print "<pre id=\"brent-tree\"></pre><script>document.getElementById(\"brent-tree\").textContent="; system("cat tree.json"); print "</script>"; skip=1; next }
            /<!-- BRENT END -->/   { skip=0 }
            !skip                  { print }
          ' index.html > index.tmp && mv index.tmp index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TREE tree.json tree.md README.md index.html update-tree
          git diff --staged --quiet || git commit -m "Update tree" && git push
