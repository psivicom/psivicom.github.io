name: Auto-Update Repository Tree

on:
  push:
    branches: [main]
    paths-ignore:
      - 'TREE.md'
      - 'README.md'
      - '.tree.hash'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.21'

      - name: Generate Tree and README
        run: |
          go run scripts/update-tree/main.go

      - name: Commit Tree Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add TREE.md README.md .tree.hash
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update tree and README [skip ci]"
            
            # CRITICAL FIX: Pull latest changes and rebase to prevent concurrent push rejections
            git pull --rebase origin main
            
            git push
            echo "✅ Tree updated successfully."
          else
            echo "ℹ️ No tree changes to commit."
          fi
