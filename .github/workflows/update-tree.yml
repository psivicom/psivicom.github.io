name: Update tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure tree utility is present
        run: sudo apt-get install -y tree || true

      - name: Generate tree files
        run: ./update-tree

      - name: Inject tree.md into README.md
        run: |
          awk '
            /^<!-- TREE START -->$/ { print; system("cat tree.md"); skip=1; next }
            /^<!-- TREE END -->$/   { skip=0 }
            !skip                   { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Inject tree into index.html
        run: |
          # Use a Python script for robust HTML injection to avoid shell quoting issues
          python3 -c "
          import re
          with open('index.html', 'r') as f: content = f.read()
          with open('tree_clean.txt', 'r') as f: tree_content = f.read()
          
          # Replace content between markers
          pattern = r'(<!-- BRENT START -->).*?(<!-- BRENT END -->)'
          replacement = r'\1\n<pre id=\"brent-tree\">\n' + tree_content + '</pre>\n\2'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          
          with open('index.html', 'w') as f: f.write(new_content)
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TREE tree.json tree.md tree_clean.txt README.md index.html
          git diff --staged --quiet || git commit -m "Update tree" && git push
