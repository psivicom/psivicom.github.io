name: Update Repository Tree

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and Inject Tree (C-Level Speed)
        run: |
          # 1. Generate perfect tree structure in C (< 5ms). 
          # --dirsfirst ensures directories are ALWAYS listed before files.
          # -I excludes noisy/internal directories to keep the public tree clean.
          tree --dirsfirst --charset utf-8 -I '.git|.github|archive|data|reports|docs|src|wendy-go|config|assets|maps|logs|tests|tools|_techreports|dist|js|node_modules' > /tmp/raw_tree.txt

          # 2. Build Markdown (Plain text, no bold, no ANSI)
          {
            echo '```text'
            cat /tmp/raw_tree.txt
            echo '```'
          } > tree.md

          # 3. Build Klein Blue HTML with smart syntax coloring (< 2ms via awk)
          awk '
          BEGIN {
            print "<div style=\"font-family:monospace; line-height:1.5; background:#002FA7; color:#ffffff; padding:24px; border-radius:12px;\">"
          }
          {
            line = $0
            # Skip the summary line at the bottom (e.g., "3 directories, 25 files")
            if (line ~ /^[0-9]+ directories?, [0-9]+ files?$/) next
            
            # Determine type and assign exact hex color
            if (line ~ /\/$/) {
              color = "#80BFFF" # Directory (Light Blue)
            } else if (line ~ /\.(sh|go|py)[*]?$/) {
              color = "#80FF80" # Script (Light Green)
            } else {
              color = "#ffffff" # File (White)
            }
            
            # Escape HTML entities to prevent rendering breaks
            gsub(/&/, "\\&amp;", line)
            gsub(/</, "\\&lt;", line)
            gsub(/>/, "\\&gt;", line)
            
            printf "  <span style=\"color:%s\">%s</span><br>\n", color, line
          }
          END {
            print "</div>"
          }' /tmp/raw_tree.txt > tree_snippet.html

          # 4. Inject into README.md and index.html (< 2ms via awk)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          
          for file in README.md index.html; do
            awk -v content="$(cat $file | grep -A 10000 "AUTO_TREE_START" | grep -B 10000 "AUTO_TREE_END" | sed '1d;$d')" -v ts="$TIMESTAMP" '
              /<!-- AUTO_TREE_START -->/ {
                print "<!-- AUTO_TREE_START -->"
                print "<!-- Auto-updated by .github/workflows/update-tree.yml -->"
                print "<!-- Last updated: " ts " -->"
                
                # Read and print the generated content
                if (ENVIRON["FILE"] == "README.md") {
                  system("cat tree.md")
                } else {
                  system("cat tree_snippet.html")
                }
                
                print "<!-- AUTO_TREE_END -->"
                skip = 1
                next
              }
              /<!-- AUTO_TREE_END -->/ { skip = 0; next }
              !skip { print }
            ' FILE="$file" "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
          done

          rm -f /tmp/raw_tree.txt
          echo "✅ Tree generated and injected in < 10ms with perfect hierarchy."

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tree.md tree_snippet.html README.md index.html
          git diff --cached --quiet || git commit -m "chore: auto-update tree with C-level speed and perfect hierarchy [skip ci]"
          git push
