name: Update Repository Tree

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x ./scripts/fast-tree.sh

      - name: Generate and Inject Tree
        run: ./scripts/fast-tree.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tree.md tree_snippet.html README.md index.html
          git diff --cached --quiet || git commit -m "chore: auto-update tree [skip ci]"
          git push
