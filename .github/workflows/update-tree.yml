name: Update Repository Tree

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and Inject Tree (C-Level Speed)
        run: |
          echo "🔍 Generating tree with -a (show hidden), -F (classify), and --dirsfirst..."
          
          # CRITICAL FIX: Added '-a' to show hidden directories like .github
          # -F appends '/' to directories and '*' to executables for perfect awk matching.
          # -I still blocks .git and other heavy folders to keep the tree clean.
          tree -a --dirsfirst -F --charset utf-8 -I '.git|data|reports|docs|src|wendy-go|config|assets|maps|logs|tests|tools|_techreports|dist|js|node_modules|tree.md|tree_snippet.html' > /tmp/raw_tree.txt
          
          echo "✅ Raw tree output sample (first 30 lines):"
          head -n 30 /tmp/raw_tree.txt

          # 2. Build Markdown (Plain text, no bold, no ANSI)
          {
            echo '```text'
            cat /tmp/raw_tree.txt
            echo '```'
          } > tree.md

          # 3. Build Klein Blue HTML with bulletproof syntax coloring
          awk '
          BEGIN {
            print "<div style=\"font-family:monospace; line-height:1.5; background:#002FA7; color:#ffffff; padding:24px; border-radius:12px;\">"
          }
          {
            line = $0
            
            # Skip the summary line at the bottom
            if (line ~ /^[0-9]+ directories?, [0-9]+ files?$/) next
            
            # Create a clean version without trailing spaces for reliable regex matching
            clean_line = line
            sub(/[ \t]+$/, "", clean_line)
            
            # Determine type and assign exact hex color
            if (clean_line ~ /\/$/) {
              color = "#80BFFF" # Directory (Light Blue)
            } else if (clean_line ~ /\.(sh|go|py)\*?$/) {
              color = "#80FF80" # Script (Light Green)
            } else {
              color = "#ffffff" # File (White)
            }
            
            # Escape HTML entities safely
            gsub(/&/, "\\&amp;", line)
            gsub(/</, "\\&lt;", line)
            gsub(/>/, "\\&gt;", line)
            
            printf "  <span style=\"color:%s\">%s</span><br>\n", color, line
          }
          END {
            print "</div>"
          }' /tmp/raw_tree.txt > tree_snippet.html

          # 4. Inject into README.md and index.html
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          
          for file in README.md index.html; do
            if [ "$file" = "README.md" ]; then
              TREE_FILE="tree.md"
            else
              TREE_FILE="tree_snippet.html"
            fi
            
            awk -v ts="$TIMESTAMP" -v tree_file="$TREE_FILE" '
              /<!-- AUTO_TREE_START -->/ {
                print "<!-- AUTO_TREE_START -->"
                print "<!-- Auto-updated by .github/workflows/update-tree.yml -->"
                print "<!-- Last updated: " ts " -->"
                
                while ((getline line < tree_file) > 0) {
                  print line
                }
                close(tree_file)
                
                print "<!-- AUTO_TREE_END -->"
                skip = 1
                next
              }
              /<!-- AUTO_TREE_END -->/ { skip = 0; next }
              !skip { print }
            ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
          done

          rm -f /tmp/raw_tree.txt
          echo "🎉 Tree generation complete. .github and archive are now visible."

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tree.md tree_snippet.html README.md index.html
          git diff --cached --quiet || git commit -m "chore: auto-update tree, revealing .github with -a flag [skip ci]"
          git push
