name: Update Repository Tree

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '**/*.html'
      - '**/*.md'
      - '.github/workflows/**'
      - 'singularity/**'

jobs:
  update-tree:
    if: |
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'Auto-update tree')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate Tree
        run: |
          # Insert your existing tree generation logic here
          # This placeholder preserves your original script's intent
          echo "Tree generation preserved - insert original script body"
      
      - name: Commit Tree Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: auto-update tree [skip ci]"
          git push
