name: Wendy Cognitive Cycle (Heavy ML)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours for deep thinking

jobs:
  cognitive-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- THE BINARY BYPASS: Cache the actual downloaded binary wheels ---
      - name: Cache ML Binary Wheels
        id: cache-ml
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ml-binaries-${{ hashFiles('requirements-ml.txt') }}
          restore-keys: |
            ${{ runner.os }}-ml-binaries-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- BYPASSING PIP INSTALL LATENCY ---
      - name: Install ML Stack (From Local Cache)
        run: |
          python3 -m pip install --upgrade pip
          # If cache hit, pip installs from local disk instantly. 
          # If cache miss, it downloads and caches for next time.
          pip install -r requirements-ml.txt

      - name: Restore Cognitive Twin
        id: cache-twin
        uses: actions/cache/restore@v4
        with:
          path: /tmp/wendy_twin.psvec
          key: wendy-twin-${{ hashFiles('wendy-go/pkg/twin/psvc.go') }}

      - name: Execute Deep Cognitive Tasks
        run: |
          # Now that binaries are loaded in <5s, run the heavy Python agents
          python3 src/agents/neuroplasticity_agent.py
          python3 src/kernel/hyper_gardener.py

      - name: Save Cognitive Twin
        uses: actions/cache/save@v4
        with:
          path: /tmp/wendy_twin.psvec
          key: wendy-twin-${{ hashFiles('wendy-go/pkg/twin/psvc.go') }}-${{ github.run_id }}
