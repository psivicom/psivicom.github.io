name: Wendy Reactive Cognition (Sensory Input)

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  think:
    name: Analyze • Evolve • Respond
    if: contains(github.event.issue.labels.*.name, 'sensory-input')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Run Neuroplasticity & Hyper-Gardener
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.agents.neuroplasticity_agent
          python -m src.kernel.hyper_gardener

      - name: 🗣️ Express Thought (Comment on Issue via Native API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "🧠 Synthesizing response for issue #${ISSUE_NUMBER}..."
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments \
            -d '{"body":"🧠 Synthesis Complete. My metabolic state has evolved based on this new sensory input. Preparing motor output."}'
            
          echo "✅ Comment posted successfully."
