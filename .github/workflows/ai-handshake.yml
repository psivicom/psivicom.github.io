name: AI Handshake Protocol (Auto-Package)

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:
  push:
    paths:
      - 'src/agents/ambassador_agent.py'

permissions:
  contents: write
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  package-handshake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Changed from 1 to 0 for safe rebasing
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Only install what is strictly needed for the ambassador logic
          pip install numpy pyyaml

      - name: Ensure Directories Exist
        run: |
          mkdir -p data/ai_handshake
          mkdir -p reports/scientific_reports

      - name: Package AI Handshake
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🤝 Packaging AI handshake protocol..."
          # CRITICAL FIX: Use -m to respect PYTHONPATH and avoid ModuleNotFoundError
          python -m src.agents.ambassador_agent

      - name: Commit Handshake Packages (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Ambassador Agent"
          git config user.email "ambassador@psivi.com"
          
          git add data/ai_handshake/
          git add reports/scientific_reports/
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "auto: packaged AI handshake protocol for external collaboration [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Handshake packages committed and pushed."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new handshake packages to commit."
          fi
