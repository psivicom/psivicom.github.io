name: Sovereign Workflow Auditor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.WENDY_AUDITOR_PAT }}

      - name: Audit and Heal Workflows
        env:
          GH_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          echo "🧠 WENDY Sovereign Workflow Auditor Initializing..."

          for FILE in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$FILE" ] || continue
            echo "🔍 Auditing $FILE..."

            grep -oE 'uses:[[:space:]]+[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+[^[:space:]]*@[^[:space:]]+' "$FILE" \
              | sed -E 's/^uses:[[:space:]]+//' \
              | grep -vE '@[0-9a-f]{40}$' \
              | sort -u \
              | while read -r ACTION_REF; do
                  OWNER=$(echo "$ACTION_REF" | cut -d'/' -f1)
                  REPO_NAME=$(echo "$ACTION_REF" | cut -d'/' -f2)
                  REF=$(echo "$ACTION_REF" | sed -E 's/^[^@]+@//')
                  ACTION_PREFIX=$(echo "$ACTION_REF" | sed -E "s/@${REF}$//")

                  echo "🔍 Resolving $OWNER/$REPO_NAME@$REF..."

                  REF_DATA=$(curl --fail --silent --show-error \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/$OWNER/$REPO_NAME/git/ref/tags/$REF" || true)

                  OBJ_TYPE=$(echo "$REF_DATA" | jq -r '.object.type // empty')
                  SHA=""

                  if [ "$OBJ_TYPE" = "tag" ]; then
                    TAG_URL=$(echo "$REF_DATA" | jq -r '.object.url')
                    SHA=$(curl --fail --silent --show-error \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      "$TAG_URL" | jq -r '.object.sha // empty')
                  elif [ "$OBJ_TYPE" = "commit" ]; then
                    SHA=$(echo "$REF_DATA" | jq -r '.object.sha // empty')
                  else
                    REF_DATA=$(curl --fail --silent --show-error \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      "https://api.github.com/repos/$OWNER/$REPO_NAME/git/ref/heads/$REF" || true)
                    OBJ_TYPE=$(echo "$REF_DATA" | jq -r '.object.type // empty')

                    if [ "$OBJ_TYPE" = "commit" ]; then
                      SHA=$(echo "$REF_DATA" | jq -r '.object.sha // empty')
                    fi
                  fi

                  if [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "✅ Found SHA: $SHA"
                    sed -i "s|$ACTION_REF|$ACTION_PREFIX@$SHA|g" "$FILE"
                  else
                    echo "❌ Could not resolve SHA for $ACTION_REF"
                  fi
                done
          done

          if git diff --quiet -- .github/workflows/; then
            echo "ℹ️ No changes needed. All workflows are sovereign."
          else
            echo "🚀 Committing sovereign heals..."
            git config user.name "WENDY Sovereign Auditor"
            git config user.email "auditor@psivi.com"
            git add .github/workflows/
            git commit -m "chore: sovereign audit - pin all actions to 40-char SHAs [skip ci]"
            git push origin HEAD:refs/heads/main
            echo "🏆 Workflows successfully healed and committed."
          fi
