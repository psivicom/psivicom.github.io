name: Auto-Fix Python Imports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Python Imports Programmatically
        run: |
          python3 << 'EOF'
          # 1. Fix forage_agent.py
          with open('src/agents/forage_agent.py', 'r') as f:
              content = f.read()
          
          # Remove the sys.path hack and its comment using exact string match
          content = content.replace("# Ensure the root directory is in the path so we can import root-level files\n", "")
          content = content.replace("sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), '../..')))\n", "")
          
          # Correct the absolute imports
          content = content.replace("from vram_mesh import VRAMMesh", "from src.mesh.vram_mesh import VRAMMesh")
          content = content.replace("from mesh_governor import MeshGovernor", "from src.mesh.mesh_governor import MeshGovernor")
          
          with open('src/agents/forage_agent.py', 'w') as f:
              f.write(content)

          # 2. Fix intelligence_agent.py
          with open('src/agents/intelligence_agent.py', 'r') as f:
              content = f.read()
          
          # Correct the absolute import
          content = content.replace("from psvc_containers import (", "from src.core.psvc_containers import (")
          
          with open('src/agents/intelligence_agent.py', 'w') as f:
              f.write(content)
          
          print("✅ String replacements applied successfully.")
          EOF

      - name: Commit Fixes
        run: |
          git config user.name "PSIVI Auto-Fix"
          git config user.email "auto-fix@users.noreply.github.com"
          git add src/agents/forage_agent.py src/agents/intelligence_agent.py
          git commit -m "chore: fix absolute imports for python -m execution" || echo "No changes to commit"
          git push
