name: Auto-Fix Python Imports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Python Imports using sed
        run: |
          echo "--- Fixing forage_agent.py ---"
          sed -i 's/from vram_mesh import VRAMMesh/from src.mesh.vram_mesh import VRAMMesh/g' src/agents/forage_agent.py
          sed -i 's/from mesh_governor import MeshGovernor/from src.mesh.mesh_governor import MeshGovernor/g' src/agents/forage_agent.py
          sed -i '/sys\.path\.insert/d' src/agents/forage_agent.py
          sed -i '/Ensure the root directory is in the path/d' src/agents/forage_agent.py
          
          echo "--- Fixing intelligence_agent.py ---"
          sed -i 's/from psvc_containers import (/from src.core.psvc_containers import (/g' src/agents/intelligence_agent.py
          
          echo "--- Verifying changes with git diff ---"
          git diff || true

      - name: Commit Fixes
        run: |
          git config user.name "PSIVI Auto-Fix"
          git config user.email "auto-fix@users.noreply.github.com"
          git add src/agents/forage_agent.py src/agents/intelligence_agent.py
          git commit -m "chore: fix absolute imports for python -m execution" || echo "No changes to commit"
          git push
