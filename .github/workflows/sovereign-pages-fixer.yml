# .github/workflows/sovereign-pages-fixer.yml
name: Sovereign Pages Fixer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Fetch SHAs and Overwrite pages.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Fetching cryptographic SHAs via gh CLI..."
          CONFIGURE_SHA=$(gh api repos/actions/configure-pages/releases/tags/v4.0.0 --jq .target_commitish)
          UPLOAD_SHA=$(gh api repos/actions/upload-pages-artifact/releases/tags/v3.0.1 --jq .target_commitish)
          DEPLOY_SHA=$(gh api repos/actions/deploy-pages/releases/tags/v4.0.5 --jq .target_commitish)
          
          echo "✅ configure-pages: $CONFIGURE_SHA"
          echo "✅ upload-pages-artifact: $UPLOAD_SHA"
          echo "✅ deploy-pages: $DEPLOY_SHA"
          
          echo "📝 Generating flawless pages.yml..."
          cat << 'YAML_EOF' > .github/workflows/pages.yml
          # .github/workflows/pages.yml
          # SPDX-License-Identifier: EUPL-1.2
          # SPDX-FileCopyrightText: 2026 Louis-Philippe Audette | PSIVI.COM
          
          name: Deploy GitHub Pages
          
          on:
            push:
              branches: ["main"]
            workflow_dispatch:
          
          permissions:
            contents: read
            pages: write
            id-token: write
          
          concurrency:
            group: "pages"
            cancel-in-progress: false
          
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
          
                - name: Setup Pages
                  uses: actions/configure-pages@SHA_PLACEHOLDER_CONFIGURE
          
                - name: Upload artifact
                  uses: actions/upload-pages-artifact@SHA_PLACEHOLDER_UPLOAD
                  with:
                    path: ./_site
          
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              needs: build
              steps:
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@SHA_PLACEHOLDER_DEPLOY
          YAML_EOF
          
          echo "🔧 Injecting verified SHAs into pages.yml..."
          sed -i "s/SHA_PLACEHOLDER_CONFIGURE/$CONFIGURE_SHA/g" .github/workflows/pages.yml
          sed -i "s/SHA_PLACEHOLDER_UPLOAD/$UPLOAD_SHA/g" .github/workflows/pages.yml
          sed -i "s/SHA_PLACEHOLDER_DEPLOY/$DEPLOY_SHA/g" .github/workflows/pages.yml
          
          echo "📄 Final pages.yml content:"
          cat .github/workflows/pages.yml
          
          echo "🚀 Committing and pushing..."
          git config user.name "PSIVI Sovereign Fixer"
          git config user.email "fixer@psivi.com"
          git add .github/workflows/pages.yml
          git commit -m "fix: use API-verified 40-char SHAs for Pages actions [skip ci]"
          git push
