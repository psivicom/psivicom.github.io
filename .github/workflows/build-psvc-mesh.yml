name: Build PSVC Mesh Containers

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/psvc_blueprints.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-containers:
    name: Vectorize Wendy's Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: 🏗️ Build PSVC Containers
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/build_psvc_mesh.py

      - name: 💾 Commit PSVC Artifacts (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Builder"
          git config user.email "builder@psivi.com"
          git add dist/*.psvc dist/*.json
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "auto: psvc-mesh | Vector containers updated [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ PSVC Containers pushed to mesh."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "💤 No changes in source code."
          fi
