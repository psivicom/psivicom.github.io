name: Wendy Sensory Input (Self-Built)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sense:
    name: Scan • Ingest • Alert
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Scan External World
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.forage_agent

      - name: 🧠 Create Cognitive Stimulus
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'SENSORY_INPUT: New Data Detected',
              body: 'Wendy has detected new external data. Ready for cognitive synthesis.',
              labels: ['sensory-input', 'priority-high']
            })
