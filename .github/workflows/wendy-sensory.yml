name: Wendy Sensory Input (Self-Built)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sense:
    name: Scan • Ingest • Alert
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Scan External World
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.forage_agent

      - name: 🧠 Create Cognitive Stimulus (Native API)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🌐 Sensory data detected. Creating cognitive stimulus issue..."
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d '{
              "title": "SENSORY_INPUT: New Data Detected",
              "body": "Wendy has detected new external data. Ready for cognitive synthesis.",
              "labels": ["sensory-input", "priority-high"]
            }'
            
          echo "✅ Cognitive stimulus issue created successfully via native API."
