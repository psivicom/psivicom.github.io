name: Wendy Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  heartbeat:
    runs-on: ubuntu-24.04 # Upgraded to match the rest of the mesh's modern standard
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Required for safe rebasing

      - name: Cache Python Virtual Environment
        id: cache-venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements-ml.txt') }}-${{ hashFiles('.python-version') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ hashFiles('requirements-ml.txt') }}-

      - name: Setup Python
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'

      - name: Build Binary Brain
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Restore Cognitive Twin
        id: cache-twin
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/wendy_twin.psvec
          key: wendy-twin-${{ hashFiles('wendy-go/pkg/twin/psvc.go') }}

      - name: Bootstrap Twin if Missing
        if: steps.cache-twin.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp
          python3 src/utils/init_twin.py /tmp/wendy_twin.psvec

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5

      - name: Tidy Go Modules (Race-Condition Proof)
        run: |
          cd wendy-go
          go mod tidy
          git config user.name "Wendy-Heartbeat"
          git config user.email "heartbeat@psivi.com"
          git add go.sum || true
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: update go.sum [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed go.sum"
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          fi

      - name: Build Wendy Core
        run: |
          cd wendy-go
          go build -o ../wendy-core ./cmd/heartbeat

      - name: Execute Cognitive Cycle
        env:
          WENDY_TWIN_PATH: /tmp/wendy_twin.psvec
          WENDY_WAL_PATH: /tmp/wendy.wal
          PATH: "${{ github.workspace }}/.venv/bin:${{ env.PATH }}"
        run: |
          ./wendy-core

      - name: Persist WAL (Race-Condition Proof)
        run: |
          mkdir -p data
          if [ -f /tmp/wendy.wal ]; then
            cat /tmp/wendy.wal >> data/wendy.wal
            git config user.name "Wendy-Heartbeat"
            git config user.email "heartbeat@psivi.com"
            git add data/wendy.wal
            
            if ! git diff --staged --quiet; then
              git commit -m "auto: wal-append [skip ci]"
              
              # THE RACE-CONDITION SHIELD:
              for i in 1 2 3; do
                if git pull --rebase origin main && git push origin main; then
                  echo "✅ Successfully pushed WAL append"
                  break
                else
                  echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                  sleep 2
                fi
              done
            fi
          fi

      - name: Save Cognitive Twin to Cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/wendy_twin.psvec
          key: wendy-twin-${{ hashFiles('wendy-go/pkg/twin/psvc.go') }}-${{ github.run_id }}
