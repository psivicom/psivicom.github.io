name: WENDY Autonomous Heartbeat

on:
  workflow_dispatch:
  schedule:
    # Runs an autonomous heartbeat every 6 hours
    - cron: '0 */6 * * *'

permissions:
  contents: write
  issues: write

jobs:
  cognitive-pulse:
    name: WENDY Cognitive Pulse
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Substrate
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Runtime Requirements
        run: |
          pip install numpy pyyaml requests

      - name: Ignite WENDY's Cognitive Pulse
        run: |
          python src/wendy.py