name: Wendy Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  heartbeat:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug List Files
        run: |
          echo "Checking wendy-go/pkg/twin/..."
          ls -la wendy-go/pkg/twin/ || echo "FOLDER MISSING"
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Core
        run: |
          cd wendy-go
          go build -o ../wendy-core ./cmd/heartbeat
          echo "Build successful!"
