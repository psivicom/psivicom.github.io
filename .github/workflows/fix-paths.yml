name: Fix Paths

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fix paths
        run: |
          find .github/workflows -name "*.yml" -not -name "fix-paths.yml" -exec sed -i -E 's/(python3? +)(forage_agent\.py|literature_agent\.py|critic_agent\.py|intelligence_agent\.py|synthesizer_agent\.py|license_agent\.py|lidar_agent\.py|satellite_agent\.py)/\1src\/agents\/\2/g' {} \;
          find .github/workflows -name "*.yml" -not -name "fix-paths.yml" -exec sed -i -E 's/(python3? +)(mesh_router\.py|mesh_governor\.py)/\1src\/orchestrator\/\2/g' {} \;
          find .github/workflows -name "*.yml" -not -name "fix-paths.yml" -exec sed -i -E 's/(python3? +)pico_containers\.py/\1psvc_containers.py/g' {} \;
          
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/workflows
          git commit -m "chore: fix workflow paths" || echo "No changes"
          git push
