name: Mesh Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vanguard acts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run mesh.go flow qwen

      - name: Commit mutation
        run: |
          git config user.name "PSIVI Mesh"
          git config user.email "mesh@psivicom.local"
          git add mesh_state.json
          git diff --staged --quiet || git commit -m "mesh: pheromone deposited $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
