# Automatically triggers report generation when instruction files are detected

name: Auto-Report Generation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/instruction_queue/**'

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
      
      - name: Run Automation Loop
        run: |
          python src/tools/auto_reporter.py
      
      - name: Commit Generated Reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Report Agent"
          git config user.email "reports@psivi.com"
          git add reports/scientific_reports/
          if ! git diff --staged --quiet; then
            git commit -m "auto: generated scientific reports from instruction queue"
            git push
          fi
