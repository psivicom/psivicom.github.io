name: Auto-Report & Instruction Handling

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/processed_instructions/**'

permissions:
  contents: write

jobs:
  handle-instructions:
    name: Handle Instructions & Generate Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Minimal Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml requests

      - name: Run Auto Reporter
        # CRITICAL FIX: Inline PYTHONPATH ensures Python recognizes the 'src' package
        run: PYTHONPATH=${{ github.workspace }} python src/tools/auto_reporter.py

      - name: Commit and Push Reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Reporter"
          git config user.email "reporter@psivi.com"
          git add reports/ data/
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: processed instructions and generated reports"
            
            # Prevents concurrent push rejections
            git pull --rebase origin main
            
            git push
          else
            echo "ℹ️ No new reports to commit."
          fi
