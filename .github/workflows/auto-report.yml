name: Auto-Report Generation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/processed_instructions/**'

permissions:
  contents: write

jobs:
  generate-report:
    name: Generate Scientific Report
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml requests python-dateutil

      - name: Run Auto Reporter (Module Mode)
        run: python -m src.tools.auto_reporter

      - name: Commit Reports (Conflict-Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Reporter"
          git config user.email "reporter@psivi.com"
          
          # 1. Fetch the absolute latest state from the remote repository
          git fetch origin main
          
          # 2. Soft reset to the remote main to prevent push rejections
          git reset --soft origin/main
          
          # 3. Stage the reports directory
          git add reports/
          
          # 4. Branchless execution: Commit and push ONLY if there are actual changes
          git diff --staged --quiet || (git commit -m "auto: generated new scientific report" && git push origin main)
