name: Auto-Report Generation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/processed_instructions/**'

permissions:
  contents: write

jobs:
  generate-report:
    name: Generate Scientific Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run Auto Reporter
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/tools/auto_reporter.py

      - name: Commit Reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Reporter"
          git config user.email "reporter@psivi.com"
          git add reports/
          if ! git diff --staged --quiet; then
            git commit -m "auto: generated new scientific report"
            git push
          fi
