name: Auto-Report & Instruction Handling

on:
  schedule:
    - cron: '0 * * * *' # Hourly instruction processing
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  handle-instructions:
    name: Handle Instructions & Generate Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # CRITICAL FIX: Added PyNaCl to resolve the 'nacl' module import error
          pip install numpy pyyaml requests PyNaCl

      - name: Run Auto Reporter
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Current directory: $(pwd)"
          echo "PYTHONPATH: $PYTHONPATH"
          # CRITICAL: Using '-m' ensures Python recognizes 'src' as a package
          python -m src.tools.auto_reporter

      - name: Commit and Push Reports (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Reporter"
          git config user.email "reporter@psivi.com"
          git add reports/ data/
          
          if ! git diff --staged --quiet; then
            # [skip ci] is CRITICAL here to prevent this push from triggering this same workflow in an infinite loop
            git commit -m "auto: processed instructions and generated reports [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            # Combines pull and push into a single atomic retry loop.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Reports committed and pushed."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new reports to commit."
          fi
