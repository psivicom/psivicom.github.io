name: Auto-Report & Instruction Handling

on:
  schedule:
    - cron: '0 * * * *' # Hourly instruction processing
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  handle-instructions:
    name: Handle Instructions & Generate Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Minimal Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml requests

      - name: Run Auto Reporter
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Current directory: $(pwd)"
          echo "PYTHONPATH: $PYTHONPATH"
          # CRITICAL: Using '-m' ensures Python recognizes 'src' as a package
          python -m src.tools.auto_reporter

      - name: Commit and Push Reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Reporter"
          git config user.email "reporter@psivi.com"
          git add reports/ data/
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: processed instructions and generated reports"
            
            # Prevents concurrent push rejections
            git pull --rebase origin main
            
            git push
            echo "✅ Reports committed and pushed."
          else
            echo "ℹ️ No new reports to commit."
          fi
