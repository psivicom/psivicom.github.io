name: WENDY Self-Bootstrap

on:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-permissions-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: 🔧 Set Executable Permissions Autonomously
        run: |
          chmod +x scripts/*.sh 2>/dev/null || true
          echo "✅ Executable permissions set"
      
      - name: 🎯 Audit All Workflows for Autorun Button
        run: |
          set -euo pipefail
          
          echo "🔍 Scanning all workflows for workflow_dispatch trigger..."
          
          MODIFIED=0
          
          for file in .github/workflows/*.yml; do
            [ -f "$file" ] || continue
            
            if grep -q 'workflow_dispatch' "$file"; then
              echo "✅ $(basename $file): already has autorun button"
              continue
            fi
            
            echo "➕ $(basename $file): adding autorun button..."
            
            # Insert workflow_dispatch: after the on: block ends
            awk '
              /^on:/ { in_on=1 }
              in_on && !/^ / && !/^on:/ && !/^$/ {
                print "  workflow_dispatch:"
                in_on=0
              }
              { print }
            ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
            
            MODIFIED=1
            echo "✅ $(basename $file): autorun button added"
          done
          
          if [ "$MODIFIED" -eq 0 ]; then
            echo "🟢 All workflows already have autorun buttons"
          else
            echo "🔧 Some workflows were updated"
          fi
          
          echo "modified=$MODIFIED" >> $GITHUB_ENV
      
      - name: 💾 Commit and Push (Race-Safe)
        if: env.modified == '1' || !env.modified
        run: |
          git config --global user.name "WENDY Autonomous Agent"
          git config --global user.email "wendy@psivi.com"
          
          # Stage everything (permissions + workflow audits)
          git add scripts/ .github/workflows/
          
          if [[ -z $(git status --porcelain) ]]; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          # Craft descriptive commit message
          CHANGED_FILES=$(git diff --staged --name-only | wc -l)
          git commit -m "🔧 self-bootstrap: permissions + workflow autorun audit ($CHANGED_FILES files) [skip ci]"
          
          # Race-safe push with retry
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
            echo "⚠️ Push rejected (race condition). Rebasing..."
            git pull --rebase --autostash origin main || {
              echo "❌ Rebase failed. Aborting."
              git rebase --abort
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 2))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts"
          exit 1
