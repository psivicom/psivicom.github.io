name: WENDY Self-Bootstrap

on:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: 🔧 Set Executable Permissions Autonomously
        run: |
          chmod +x scripts/*.sh 2>/dev/null || true
          echo "✅ Executable permissions set"
          
      - name: 💾 Commit and Push (Race-Safe)
        run: |
          git config --global user.name "WENDY Autonomous Agent"
          git config --global user.email "wendy@psivi.com"
          
          git add scripts/
          
          if [[ -z $(git status --porcelain) ]]; then
            echo "✅ No permission changes to commit"
            exit 0
          fi
          
          git commit -m "🔧 self-bootstrap: autonomously set executable permissions [skip ci]"
          
          # Race-safe push
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
            echo "⚠️ Push rejected. Rebasing..."
            git pull --rebase --autostash origin main || {
              git rebase --abort
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 2))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts"
          exit 1
