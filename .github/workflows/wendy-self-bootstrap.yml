name: WENDY Self-Bootstrap

on:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: 🔧 Set Executable Permissions
        run: |
          chmod +x scripts/*.sh 2>/dev/null || true
          echo "✅ Executable permissions set"
          
      - name: 💾 Commit and Push (Race-Safe)
        run: |
          # Source coordinator
          source scripts/wendy_coordinator.sh
          
          # CRITICAL: Configure git identity BEFORE any git operations
          configure_git_identity "WENDY Autonomous Agent" "wendy@psivi.com"
          
          git add scripts/
          
          if [[ -z $(git status --porcelain) ]]; then
            echo "✅ No permission changes to commit"
            exit 0
          fi
          
          # Now safe_push will work
          safe_push "🔧 self-bootstrap: autonomously set executable permissions"
