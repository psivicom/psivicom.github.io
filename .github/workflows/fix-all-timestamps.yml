name: Fix ALL timestamps to millis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: Run Native Zulu Fixer
        run: |
          echo "⚡ Compiling and running native Go Zulu fixer..."
          cd wendy-go
          go run cmd/fix-zulu/main.go ../

      - name: Update README live timestamp
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          echo "Setting README to $NOW"
          sed -i "s/^\*Last updated:.*/*Last updated: $NOW*/" README.md || echo "*Last updated: $NOW*" >> README.md

      - name: Commit and push
        run: |
          git config user.name "Louis-Philippe Audette"
          git config user.email "louis@psivi.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: normalize ALL to sssZ via Go - $(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          git push
