name: Workflow Security Guardian

on:
  pull_request:
    paths:
      - '.github/workflows/**/*.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-constitution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Score Files Against Agent Constitution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(".github/workflows")
          violations = []

          for path in sorted(root.glob("*.yml")) + sorted(root.glob("*.yaml")):
              if path.name == "workflow-security-guardian.yml":
                  continue

              text = path.read_text(encoding="utf-8")
              for lineno, raw_line in enumerate(text.splitlines(), 1):
                  line = raw_line.strip()

                  if not line or line.startswith("#") or "echo " in raw_line:
                      continue

                  if "git push" in line and "git pull --rebase" not in line:
                      violations.append(f"❌ Naked 'git push' in `{path}:{lineno}`")

                  if "git commit" in line and "[skip ci]" not in line:
                      violations.append(f"❌ Automated commit missing '[skip ci]' in `{path}:{lineno}`")

                  if re.search(r"uses:\s*[A-Za-z0-9._/-]+@(v[0-9]+|main|master)\b", raw_line):
                      violations.append(f"❌ Unpinned Action in `{path}:{lineno}`")

          if violations:
              with open("violations.txt", "w") as f:
                  f.write("\n".join(violations))
              print(f"Found {len(violations)} violations. Recording for report.")
          else:
              print("✅ All workflow files comply with the Agent Constitution.")
          PY

      - name: Notify WENDY AI
        if: hashFiles('violations.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Combine violations into a clean markdown list
          REPORT=$(cat violations.txt | sed 's/^/- /')
          MESSAGE="### 🚨 Agent Constitution Audit\n\nWENDY AI, the following violations were found:\n\n$REPORT\n\n**Please apply the required fixes and push again.**"
          
          # Only comment if we are in a Pull Request context
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body "$MESSAGE"
          else
            echo "Violations found on main branch push. Please check logs."
            echo "$REPORT"
          fi
