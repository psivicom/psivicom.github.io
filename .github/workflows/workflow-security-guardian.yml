name: Workflow Security Guardian

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  # STRICTLY READ-ONLY. This workflow is mathematically forbidden from mutating other workflows.
  contents: read 

jobs:
  check-pinned-actions:
    name: Verify Immutable Action SHAs & Enforce Constitution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan for Unpinned Actions (Recursive)
        run: |
          echo "🛡️ Recursively scanning .github/workflows/ for unpinned actions..."
          
          # 1. Find ALL .yml and .yaml files recursively in .github/workflows/
          # 2. Strip ALL comment lines (lines starting with #)
          # 3. Search the remaining pure code for mutable tags like @v4 or @v5
          UNPINNED=$(find .github/workflows/ -type f \( -name "*.yml" -o -name "*.yaml" \) -exec grep -H -v '^[[:space:]]*#' {} + | grep -E 'uses:\s*.*@[vV][0-9]' || true)
          
          if [ -n "$UNPINNED" ]; then
            echo "❌ SECURITY VIOLATION: Unpinned actions detected!"
            echo "All GitHub Actions must be pinned to a full 40-character commit SHA to prevent supply-chain attacks."
            echo ""
            echo "Found mutable references:"
            echo "$UNPINNED"
            echo ""
            echo "🛠️ FIX: Please update these to their secure SHAs manually."
            exit 1
          else
            echo "✅ SUCCESS: All GitHub Actions across all subdirectories are securely pinned to immutable SHAs."
          fi

      - name: Enforce Agent Constitution (New Files)
        run: |
          echo "🛡️ Scoring newly generated files against the Agent Constitution..."
          VIOLATIONS=0
          
          # 1. Check for naked git push without rebase loop in new/modified yml files
          if grep -rn "git push" .github/workflows/ | grep -v "git pull --rebase"; then
            echo "❌ VIOLATION: Naked 'git push' detected without rebase shield."
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          
          # 2. Check for missing [skip ci] in automated commits
          if grep -rn "git commit" .github/workflows/ | grep -v "\[skip ci\]"; then
            echo "❌ VIOLATION: Automated commit missing '[skip ci]' flag."
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          
          # 3. Check for mutable action tags (@v4, @v5, @main)
          if grep -rnE "uses:\s*.*@[vV0-9]|uses:\s*.*@main" .github/workflows/ | grep -v "^[[:space:]]*#"; then
            echo "❌ VIOLATION: Unpinned GitHub Action detected."
            VIOLATIONS=$((VIOLATIONS+1))
          fi

          if [ $VIOLATIONS -gt 0 ]; then
            echo "🚨 Agent Constitution violated. Commit rejected."
            exit 1
          else
            echo "✅ All new files comply with the Agent Constitution."
          fi
