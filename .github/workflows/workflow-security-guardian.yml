name: Workflow Security Guardian

on:
  pull_request:
    paths:
      - '.github/workflows/**/*.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.yml'

permissions:
  contents: read

jobs:
  validate-constitution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Score Files Against Agent Constitution
        run: |
          echo "🛡️ Scoring newly generated files against the Agent Constitution..."
          VIOLATIONS=0
          
          # 1. Check for naked git push without rebase loop 
          # CRITICAL: Exclude this guardian file, comments, and echo statements to prevent self-flagging
          if grep -rn "git push" .github/workflows/ --exclude="workflow-security-guardian.yml" | grep -v "git pull --rebase" | grep -v "^[[:space:]]*#" | grep -v "echo"; then
            echo "❌ VIOLATION: Naked 'git push' detected without rebase shield."
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          
          # 2. Check for missing [skip ci] in automated commits
          # CRITICAL: Exclude this guardian file, comments, and echo statements
          if grep -rn "git commit" .github/workflows/ --exclude="workflow-security-guardian.yml" | grep -v "\[skip ci\]" | grep -v "^[[:space:]]*#" | grep -v "echo"; then
            echo "❌ VIOLATION: Automated commit missing '[skip ci]' flag."
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          
          # 3. Check for mutable action tags (@v4, @v5, @main, @master)
          if grep -rnE "uses:\s*[^\s]+@(v[0-9]+|main|master)\b" .github/workflows/ | grep -v "^[[:space:]]*#"; then
            echo "❌ VIOLATION: Unpinned GitHub Action detected."
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          
          if [ $VIOLATIONS -gt 0 ]; then
            echo "🚨 Agent Constitution violated. Commit rejected."
            exit 1
          else
            echo "✅ All new files comply with the Agent Constitution."
          fi
