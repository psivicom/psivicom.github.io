name: Workflow Security Guardian

on:
  pull_request:
    paths:
      - '.github/workflows/**/*.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.yml'

permissions:
  contents: read # Explicitly declare read-only access for the entire workflow

jobs:
  validate-constitution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1 # Optimized: Read-only validation doesn't need full history

      - name: Score Files Against Agent Constitution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(".github/workflows")
          violations = 0

          for path in sorted(root.glob("*.yml")) + sorted(root.glob("*.yaml")):
              if path.name == "workflow-security-guardian.yml":
                  continue

              text = path.read_text(encoding="utf-8")
              for lineno, raw_line in enumerate(text.splitlines(), 1):
                  line = raw_line.strip()

                  # Ignore blank lines, comments, and echo noise.
                  if not line or line.startswith("#") or "echo " in raw_line:
                      continue

                  # Bare git push requires a rebase shield.
                  if "git push" in line and "git pull --rebase" not in line:
                      print(f"❌ VIOLATION: Naked 'git push' detected in {path}:{lineno}")
                      violations += 1

                  # Automated commits must skip CI.
                  if "git commit" in line and "[skip ci]" not in line:
                      print(f"❌ VIOLATION: Automated commit missing '[skip ci]' in {path}:{lineno}")
                      violations += 1

                  # Actions must be pinned to immutable SHAs.
                  if re.search(r"uses:\s*[A-Za-z0-9._/-]+@(v[0-9]+|main|master)\b", raw_line):
                      print(f"❌ VIOLATION: Unpinned GitHub Action detected in {path}:{lineno}")
                      violations += 1

          if violations:
              print(f"\n🚨 Agent Constitution violated ({violations} violation(s)). Commit rejected.")
              raise SystemExit(1)

          print("✅ All workflow files comply with the Agent Constitution.")
          PY