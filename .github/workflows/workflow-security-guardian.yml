name: Workflow Security Guardian

on:
  pull_request:
    paths:
      - '.github/workflows/**/*.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.yml'

permissions:
  contents: read # Explicitly declare read-only access for the entire workflow

jobs:
  validate-constitution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1 # Optimized: Read-only validation doesn't need full history

      - name: Score Files Against Agent Constitution
        shell: bash
        run: |
          set -euo pipefail

          echo "🛡️ Scoring workflow files against the Agent Constitution..."
          VIOLATIONS=0

          # 1. Check for naked git push without rebase loop
          # CRITICAL: Exclude this guardian file, comments, and echo statements.
          # The standard is: "git pull --rebase ... && git push ..."
          if grep -RIn --exclude="workflow-security-guardian.yml" --include="*.yml" --include="*.yaml" \
            "git push" .github/workflows/ \
            | grep -vE "git pull --rebase|^[[:space:]]*#|echo " \
            | grep -q "."; then
            echo "❌ VIOLATION: Naked 'git push' detected without rebase shield."
            VIOLATIONS=$((VIOLATIONS+1))
          fi

          # 2. Check for missing [skip ci] in automated commits
          if grep -RIn --exclude="workflow-security-guardian.yml" --include="*.yml" --include="*.yaml" \
            "git commit" .github/workflows/ \
            | grep -vE "\[skip ci\]|^[[:space:]]*#|echo " \
            | grep -q "."; then
            echo "❌ VIOLATION: Automated commit missing '[skip ci]' flag."
            VIOLATIONS=$((VIOLATIONS+1))
          fi

          # 3. Check for mutable action tags (@v4, @v5, @main, @master)
          if grep -RInE "uses:[[:space:]]*[A-Za-z0-9._/-]+@(v[0-9]+|main|master)\b" .github/workflows/ \
            | grep -vE "^[[:space:]]*#" \
            | grep -q "."; then
            echo "❌ VIOLATION: Unpinned GitHub Action detected."
            VIOLATIONS=$((VIOLATIONS+1))
          fi

          if [ $VIOLATIONS -gt 0 ]; then
            echo "🚨 Agent Constitution violated. Commit rejected."
            exit 1
          else
            echo "✅ All workflow files comply with the Agent Constitution."
          fi