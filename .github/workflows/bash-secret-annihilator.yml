name: Bash Secret Annihilator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  annihilate:
    name: Bash-Native Secret Eradication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.WENDY_AUDITOR_PAT }}
          fetch-depth: 0

      - name: Execute Bash Annihilation
        run: |
          echo "🔍 Scanning and sanitizing workflows with native bash..."
          
          # 1. Nuke ANY hardcoded github_pat_ tokens (any length)
          find .github/workflows -type f -name "*.yml" -exec sed -i -E 's/github_pat_[a-zA-Z0-9_]+/\${{ secrets.WENDY_AUDITOR_PAT }}/g' {} \;
          
          # 2. Nuke ANY classic GitHub tokens (ghp_, gho_, ghu_, ghs_, ghr_)
          find .github/workflows -type f -name "*.yml" -exec sed -i -E 's/gh[pousr]_[a-zA-Z0-9_]+/\${{ secrets.WENDY_AUDITOR_PAT }}/g' {} \;
          
          # 3. Force ALL 'token:' lines to use the secure variable
          find .github/workflows -type f -name "*.yml" -exec sed -i -E 's/(token:[[:space:]]*).*/\1\${{ secrets.WENDY_AUDITOR_PAT }}/g' {} \;
          
          # 4. Force ALL 'GITHUB_TOKEN:' lines in env blocks to use the secure variable
          find .github/workflows -type f -name "*.yml" -exec sed -i -E 's/(GITHUB_TOKEN:[[:space:]]*).*/\1\${{ secrets.WENDY_AUDITOR_PAT }}/g' {} \;

          # 5. Fix hallucinated 38-char SHAs with verified 40-char SHAs
          find .github/workflows -type f -name "*.yml" -exec sed -i 's/a26af69be951a213d495a4c3e4e4022e16d87065/0a5c61591373683505ea898e09a3ea4f39ef2b9c/g' {} \;
          find .github/workflows -type f -name "*.yml" -exec sed -i 's/11d5960a326750d5838078e36cf38b85af677262/11bd71901bbe5b1630ceea73d27597364c9af683/g' {} \;

          # 6. Replace heavy requirements with tiny requirements (except exempt files)
          for file in .github/workflows/*.yml; do
            filename=$(basename "$file")
            case "$filename" in
              wendy-deep-cognition.yml|intelligence-agent.yml|literature-ingest.yml|ingest-knowledge-base.yml|wendy-reactive-cognition.yml|neuroplasticity.yml|bash-secret-annihilator.yml)
                echo "🛡️ Exempting $filename"
                ;;
              *)
                sed -i 's/pip install -r requirements-ml\.txt/pip install -r requirements-tiny.txt/g' "$file"
                sed -i 's/pip install -r requirements\.txt/pip install -r requirements-tiny.txt/g' "$file"
                echo "🧹 Purged bloat from $filename"
                ;;
            esac
          done
          
          echo "🏁 Annihilation complete."

      - name: Commit and Push Sovereign State
        env:
          GITHUB_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          git config user.name "WENDY Bash Annihilator"
          git config user.email "annihilator@psivi.com"
          
          # Stage all changes
          git add .github/workflows/
          
          # NUCLEAR OPTION: Explicitly unstage THIS file to guarantee it is NOT in the commit
          git reset HEAD .github/workflows/bash-secret-annihilator.yml 2>/dev/null || true
          git checkout HEAD -- .github/workflows/bash-secret-annihilator.yml 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: bash-native annihilation of hardcoded secrets and bloat [skip ci]"
            
            # Clean rebase and push (no self-conflict possible)
            git pull --rebase origin main
            git push origin main
            
            echo "✅ Push successful. The repository is now sovereign."
          else
            echo "ℹ️ No artifacts or secrets detected. System is already sovereign."
          fi
