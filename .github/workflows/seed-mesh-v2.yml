name: Seed Mesh V2

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Run Mesh Seeder
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.mesh.mesh_seeder

      - name: Commit seed data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Seed Mesh"
          git config user.email "seed@users.noreply.github.com"
          mkdir -p data
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "seed: initialized monthly mesh seed [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          else
            echo "ℹ️ No new seed data to commit."
          fi
