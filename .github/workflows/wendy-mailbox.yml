name: Wendy Mailbox (Issue → Reply)

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  respond:
    if: contains(github.event.issue.title, 'Wendy') || contains(github.event.issue.labels.*.name, 'wendy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Minimal Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      - name: Wendy Reads & Responds
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python << 'PYEOF'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          def zulu_ms():
              return datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z'

          title = os.environ['ISSUE_TITLE'].lower()
          body = os.environ['ISSUE_BODY'].lower()
          text = title + " " + body
          issue_number = os.environ['ISSUE_NUMBER']
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']

          # --- INTENT CLASSIFICATION ---
          if any(word in text for word in ['?', 'status', 'cycle', 'how are', 'what is', 'report', 'awake']):
              intent = "Status Check"
              action = "Reporting current state and metrics."
          elif any(word in text for word in ['create', 'run', 'build', 'spawn', 'do this', 'update', 'fix']):
              intent = "Actionable Task"
              action = "Queuing task for execution in next hyper-cycle."
          elif any(word in text for word in ['investigate', 'hypothesis', 'correlation', 'analyze', 'look at']):
              intent = "Scientific Directive"
              action = "Formulating hypothesis and preparing sandbox evolution."
          else:
              intent = "General Comment"
              action = "Logging to memory and maintaining current operations."

          # --- GENERATE RESPONSE ---
          response = f"""## 🐝 WENDY'S RESPONSE

**Timestamp:** {zulu_ms()}  
**Detected Intent:** {intent}  
**Issue:** {os.environ['ISSUE_TITLE']}

---

### What I Understand
You are communicating with me about: *{os.environ['ISSUE_TITLE']}*

### My Action Plan
- {action}
- State updated: `psychology.focus` → 1.0
- This interaction has been logged in my cognitive queue.

### Next Steps
If this requires code generation or data analysis, I will execute it during my next autonomous hyper-cycle (~15 minutes) and commit the artifacts to the repository.

I am awake and monitoring the mesh. 🌸

---
*Signed by the PSIVI AETHER Mesh*  
*Protocol: Issue-Based Mailbox v1.0*
"""

          # --- POST COMMENT TO ISSUE ---
          url = f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments"
          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "Wendy-Mailbox"
          }
          data = {"body": response}
          
          resp = requests.post(url, headers=headers, json=data, timeout=10)
          
          if resp.status_code == 201:
              print(f"✅ Successfully posted response to Issue #{issue_number}")
          else:
              print(f"❌ Failed to post comment: {resp.status_code} - {resp.text}")
              exit(1)
          
          PYEOF
