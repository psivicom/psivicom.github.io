name: Wendy Mailbox & Instruction Processor

on:
  schedule:
    - cron: '*/10 * * * *' # Check for instructions every 10 minutes
  workflow_dispatch:
  push:
    paths:
      - 'data/instruction_queue/**'

permissions:
  contents: write

jobs:
  process-instructions:
    name: Read • Think • Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📬 Process Instruction Queue
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.instruction_agent

      - name: 💾 Commit Built Artifacts (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Mailbox"
          git config user.email "mailbox@psivi.com"
          git add .github/workflows/ data/processed_instructions/ reports/scientific_reports/
          
          if ! git diff --staged --quiet; then
            # [skip ci] is CRITICAL here to prevent this push from triggering other workflows in an infinite loop
            git commit -m "auto: instruction-processed | Self-architecture complete [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            # The standard rebase loop safely handles concurrency without fragile git stash commands.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Instructions processed and artifacts committed."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "💤 No new instructions to process."
          fi
