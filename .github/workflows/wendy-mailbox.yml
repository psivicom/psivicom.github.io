name: Wendy Mailbox (Issue Reply)

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  respond:
    if: contains(github.event.issue.title, 'Wendy') || contains(github.event.issue.title, 'wendy')
    runs-on: ubuntu-latest
    steps:
      - name: Wendy Responds
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || 'No body provided' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python3 << 'EOF'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          def required(name):
              value = os.environ.get(name, '')
              if not value:
                  print(f'ERROR: required environment variable {name} is missing', file=sys.stderr)
                  raise SystemExit(1)
              return value

          def zulu_ms():
              return datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z'

          raw_title = required('ISSUE_TITLE')
          body = os.environ.get('ISSUE_BODY', 'No body provided')
          issue_number = required('ISSUE_NUMBER')
          repo = required('REPO')
          token = required('GH_TOKEN')

          title = raw_title.lower()
          text = f'{title} {body.lower()}'
          print(f'INFO: responding to {repo} issue #{issue_number}')
          print(f'INFO: issue title: {raw_title}')

          if any(word in text for word in ['?', 'status', 'cycle', 'how are', 'what is', 'report', 'awake']):
              intent = 'Status Check'
              action = 'Reporting current state and metrics.'
          elif any(word in text for word in ['create', 'run', 'build', 'spawn', 'do this', 'update', 'fix']):
              intent = 'Actionable Task'
              action = 'Queuing task for execution in next hyper-cycle.'
          elif any(word in text for word in ['investigate', 'hypothesis', 'correlation', 'analyze', 'look at']):
              intent = 'Scientific Directive'
              action = 'Formulating hypothesis and preparing sandbox evolution.'
          else:
              intent = 'General Comment'
              action = 'Logging to memory and maintaining current operations.'

          response = f"""## 🐝 WENDY'S RESPONSE

**Timestamp:** {zulu_ms()}  
**Detected Intent:** {intent}  
**Issue:** {raw_title}

---

### What I Understand
You are communicating with me about: *{raw_title}*

### My Action Plan
- {action}
- State updated: `psychology.focus` → 1.0
- This interaction has been logged in my cognitive queue.

### Next Steps
If this requires code generation or data analysis, I will execute it during my next autonomous hyper-cycle (~15 minutes) and commit the artifacts to the repository.

I am awake and monitoring the mesh. 🌸

---
*Signed by the PSIVI AETHER Mesh*  
*Protocol: Issue-Based Mailbox v1.0*
"""

          url = f'https://api.github.com/repos/{repo}/issues/{issue_number}/comments'
          request = urllib.request.Request(
              url,
              data=json.dumps({'body': response}).encode('utf-8'),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Wendy-Mailbox',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )

          try:
              with urllib.request.urlopen(request) as reply:
                  payload = reply.read().decode('utf-8')
                  print(f'INFO: GitHub API returned HTTP {reply.status}')
                  if reply.status != 201:
                      print(f'ERROR: unexpected response body: {payload}', file=sys.stderr)
                      raise SystemExit(1)
                  print(f'SUCCESS: posted response to issue #{issue_number}')
          except urllib.error.HTTPError as error:
              details = error.read().decode('utf-8', errors='replace')
              print(f'ERROR: GitHub API returned HTTP {error.code}: {details}', file=sys.stderr)
              raise SystemExit(1)
          except urllib.error.URLError as error:
              print(f'ERROR: unable to reach GitHub API: {error.reason}', file=sys.stderr)
              raise SystemExit(1)
          EOF
