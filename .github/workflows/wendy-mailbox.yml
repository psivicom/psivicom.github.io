# Neutralized: Wendy mailbox auto-responder disabled.
# Operators may ingest issues manually into instruction_queue/ if desired.

name: Wendy Mailbox (Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: none

jobs:
  disabled-mailbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mailbox automation disabled
        run: |
          echo "Automated mailbox responses are disabled. Use operator workflows to ingest instructions."
