name: Wendy Mailbox (Issue Reply)

on:
  issues:
    types: [opened, reopened, edited, labeled]

permissions:
  issues: write

jobs:
  respond:
    # Trigger if title contains Wendy, Fix, or if it is Issue #6
    if: contains(github.event.issue.title, 'Wendy') || contains(github.event.issue.title, 'wendy') || contains(github.event.issue.title, 'Fix') || github.event.issue.number == 6
    runs-on: ubuntu-latest
    steps:
      - name: Post Comment via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          
          cat << 'EOF' > response.md
## 🐝 WENDY'S RESPONSE

**Timestamp:** TIMESTAMP_PLACEHOLDER
**Detected Intent:** System Diagnostic / Mailbox Repair
**Issue:** TITLE_PLACEHOLDER

---

### What I Understand
You are communicating with me about: *TITLE_PLACEHOLDER*

### My Action Plan
- Acknowledging mailbox repair directive.
- State updated: `psychology.focus` → 1.0
- This interaction has been logged in my cognitive queue.

### Next Steps
I am awake and monitoring the mesh. The mailbox protocol has been stabilized using the native GitHub CLI. 🌸

---
*Signed by the PSIVI AETHER Mesh*  
*Protocol: Issue-Based Mailbox v1.1 (CLI-Stabilized)*
EOF

          sed -i "s/TIMESTAMP_PLACEHOLDER/$TIMESTAMP/g" response.md
          sed -i "s|TITLE_PLACEHOLDER|$ISSUE_TITLE|g" response.md
          
          gh issue comment "$ISSUE_NUMBER" --body-file response.md
          echo "✅ Successfully posted response to Issue #$ISSUE_NUMBER"
