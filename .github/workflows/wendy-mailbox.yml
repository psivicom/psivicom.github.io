name: Wendy Mailbox (Issue Reply)

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  respond:
    if: contains(github.event.issue.title, 'Wendy') || contains(github.event.issue.title, 'wendy')
    runs-on: ubuntu-latest
    steps:
      - name: Wendy Responds
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || 'No body provided' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          def zulu_ms():
              return datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z'

          title = os.environ.get('ISSUE_TITLE', '').lower()
          body = os.environ.get('ISSUE_BODY', '').lower()
          text = title + ' ' + body
          issue_number = os.environ.get('ISSUE_NUMBER', '0')
          repo = os.environ.get('REPO', '')
          token = os.environ.get('GH_TOKEN', '')

          if not token:
              print('ERROR: GH_TOKEN is missing')
              exit(1)

          if any(word in text for word in ['?', 'status', 'cycle', 'how are', 'what is', 'report', 'awake']):
              intent = 'Status Check'
              action = 'Reporting current state and metrics.'
          elif any(word in text for word in ['create', 'run', 'build', 'spawn', 'do this', 'update', 'fix']):
              intent = 'Actionable Task'
              action = 'Queuing task for execution in next hyper-cycle.'
          elif any(word in text for word in ['investigate', 'hypothesis', 'correlation', 'analyze', 'look at']):
              intent = 'Scientific Directive'
              action = 'Formulating hypothesis and preparing sandbox evolution.'
          else:
              intent = 'General Comment'
              action = 'Logging to memory and maintaining current operations.'

          response = f"""## 🐝 WENDY'S RESPONSE

**Timestamp:** {zulu_ms()}  
**Detected Intent:** {intent}  
**Issue:** {os.environ.get('ISSUE_TITLE', 'Unknown')}

---

### What I Understand
You are communicating with me about: *{os.environ.get('ISSUE_TITLE', 'Unknown')}*

### My Action Plan
- {action}
- State updated: `psychology.focus` → 1.0
- This interaction has been logged in my cognitive queue.

### Next Steps
If this requires code generation or data analysis, I will execute it during my next autonomous hyper-cycle (~15 minutes) and commit the artifacts to the repository.

I am awake and monitoring the mesh. 🌸

---
*Signed by the PSIVI AETHER Mesh*  
*Protocol: Issue-Based Mailbox v1.0*
"""

          url = f'https://api.github.com/repos/{repo}/issues/{issue_number}/comments'
          req = urllib.request.Request(
              url,
              data=json.dumps({'body': response}).encode('utf-8'),
              headers={
                  'Authorization': f'token {token}',
                  'Accept': 'application/vnd.github.v3+json',
                  'User-Agent': 'Wendy-Mailbox',
                  'Content-Type': 'application/json'
              },
              method='POST'
          )
          
          try:
              with urllib.request.urlopen(req) as resp:
                  if resp.status == 201:
                      print(f'SUCCESS: Posted response to Issue #{issue_number}')
                  else:
                      print(f'ERROR: Failed to post. Status: {resp.status}')
                      exit(1)
          except urllib.error.HTTPError as e:
              print(f'ERROR: HTTP {e.code} - {e.read().decode()}')
              exit(1)
          except Exception as e:
              print(f'ERROR: {e}')
              exit(1)
          EOF
