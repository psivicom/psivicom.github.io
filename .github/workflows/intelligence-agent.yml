name: Intelligence Agent

on:
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours for temporal synchronization and auditing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Optimized: Auditing and reporting only require core utilities.
          # This skips the massive ML/CUDA stack, saving CI time and resources.
          pip install -r requirements-core.txt

      - name: Run Intelligence Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.intelligence_agent

      - name: Commit Intelligent Fixes (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Intelligence Agent"
          git config user.email "ai-auditor@users.noreply.github.com"
          
          # CRITICAL: Ensure reports directory exists to prevent git add errors
          mkdir -p reports
          
          # Safely stage the index and the entire reports directory
          git add index.html reports/
          
          if ! git diff --staged --quiet; then
            git commit -m "ai-auditor: synchronized temporal drift and generated audit report [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          else
            echo "ℹ️ No new audit fixes to commit."
          fi
