name: Intelligence Agent

on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history so the AI can read git logs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Intelligence Agent
        run: |
          python intelligence_agent.py

      - name: Commit Intelligent Fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Intelligence Agent"
          git config user.email "ai-auditor@users.noreply.github.com"
          git add index.html reports/ai_audit.md
          git diff --staged --quiet || git commit -m "ai-auditor: synchronized temporal drift and generated audit report"
          git push
