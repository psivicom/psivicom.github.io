name: Intelligence Agent

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Intelligence Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.intelligence_agent
        
      - name: Commit Intelligent Fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Intelligence Agent"
          git config user.email "ai-auditor@users.noreply.github.com"
          git add index.html reports/ai_audit.md
          git diff --staged --quiet || git commit -m "ai-auditor: synchronized temporal drift and generated audit report"
          git push
