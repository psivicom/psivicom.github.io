name: Intelligence Agent

on:
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours for temporal synchronization and auditing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Intelligence Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.intelligence_agent
        
      - name: Commit Intelligent Fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Intelligence Agent"
          git config user.email "ai-auditor@users.noreply.github.com"
          git add index.html reports/ai_audit.md
          git diff --staged --quiet || git commit -m "ai-auditor: synchronized temporal drift and generated audit report"
          git push
