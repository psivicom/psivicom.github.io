name: Void Metrics (Dark Matter Sensing)

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight Zulu
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  sense-void:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Generate OIDC Identity Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('psivi.com');
            core.setOutput('token', token);

      - name: Execute Void Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python -m src.agents.void_agent

      - name: Commit Void Metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "WENDY Void Sense"
          git config user.email "void@psivi.com"
          git add data/void_metrics.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(void): daily dark matter update [skip ci]"
            git push origin main
          fi
