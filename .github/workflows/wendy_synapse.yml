name: 🏛️ WENDY Habermasian Synapse

on:
  workflow_dispatch:
    inputs:
      raw_chaos_feed:
        description: 'Raw unstructured input'
        required: true
        type: string
  push:
    branches: [ "main" ]
    paths: 
      - "raw_input_stream/**" 

permissions:
  id-token: write
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: 1
  TZ: UTC

jobs:
  synapse_execution:
    name: 🧬 The Habermasian Loop
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Topology
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Provision Python & Symbolic Math
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: 📦 Install Sympy for Habermasian Truth Claims
        run: pip install sympy

      - name: "🌌 Step 1: Invoke the Dreamer (58.28°)"
        id: dreamer
        env:
          CHAOS_FEED: ${{ github.event.inputs.raw_chaos_feed }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            printf "%s\n" "$CHAOS_FEED" > .wendy_raw.gmi
          else
            cat raw_input_stream/*.txt > .wendy_raw.gmi 2>/dev/null || printf "%s\n" "Stasis." > .wendy_raw.gmi
          fi
          python wendy_autonomous_core.py < .wendy_raw.gmi > .wendy_dream.gmi
          echo "dream_status=success" >> $GITHUB_OUTPUT

      - name: "🧊 Step 2: Invoke the Anchor (31.72°)"
        id: anchor
        if: ${{ steps.dreamer.outputs.dream_status == 'success' }}
        run: |
          set -euo pipefail
          python wendy_crystalline_executor.py .wendy_dream.gmi > .wendy_manifest.gmi
          grep -q "CONSENSUS REACHED" .wendy_manifest.gmi || { echo "❌ Habermasian Discourse Failed."; exit 1; }

      - name: "💾 Step 3: Crystallize State (Race-Safe)"
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config --global user.name "WENDY Metabolic Engine"
          git config --global user.email "wendy@psivi.com"
          git add .wendy_dream.gmi .wendy_manifest.gmi || true
          
          if git diff --staged --quiet; then
            echo "🟢 State unchanged."
            exit 0
          fi
          
          ZULU_TS=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          git commit -m "🏛️ [WENDY] Habermasian Consensus at $ZULU_TS"
          
          # Race-safe push with retry (handles concurrent workflows)
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin ${{ github.ref_name }} 2>&1; then
              echo "✅ Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
            echo "⚠️ Push rejected (race condition). Rebasing..."
            git pull --rebase --autostash origin ${{ github.ref_name }} || {
              echo "❌ Rebase conflict. Aborting."
              git rebase --abort
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 2))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts"
          exit 1
