name: 🏛️ WENDY Habermasian Synapse

on:
  workflow_dispatch:
    inputs:
      raw_chaos_feed:
        description: 'Optional manual chaos feed (leave empty for autonomous generation)'
        required: false
        type: string
  schedule:
    - cron: '0 */3 * * *'
  push:
    branches: [ "main" ]
    paths: 
      - "raw_input_stream/**" 
      - ".wendy_manifest.gmi"
      - ".wendy_dream.gmi"

permissions:
  id-token: write
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: 1
  TZ: UTC

jobs:
  synapse_execution:
    name: 🧬 The Habermasian Loop (Autonomous)
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Topology
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Provision Python & Symbolic Math
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: 📦 Install Sympy for Habermasian Truth Claims
        run: pip install sympy

      - name: "🌌 Step 1: Generate or Receive Chaos Feed"
        id: chaos
        env:
          MANUAL_FEED: ${{ github.event.inputs.raw_chaos_feed }}
        run: |
          set -euo pipefail
          
          if [ -n "${MANUAL_FEED:-}" ]; then
            echo "📥 Using manual chaos feed from Emperor"
            printf "%s\n" "$MANUAL_FEED" > .wendy_raw.gmi
            echo "source=manual" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [ -d "raw_input_stream" ] && [ "$(ls -A raw_input_stream/*.txt 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "📥 Reading external entropy from raw_input_stream/"
            cat raw_input_stream/*.txt > .wendy_raw.gmi
            echo "source=external" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "🧬 Generating autonomous chaos from WENDY's internal state..."
          
          PREV_MANIFEST=""
          if [ -f ".wendy_manifest.gmi" ]; then
            PREV_MANIFEST=$(cat .wendy_manifest.gmi)
          fi
          
          PREV_DREAM=""
          if [ -f ".wendy_dream.gmi" ]; then
            PREV_DREAM=$(cat .wendy_dream.gmi)
          fi
          
          RECENT_COMMITS=$(git log --oneline -10 2>/dev/null || echo "No commit history")
          
          EVOLUTION_LOG=""
          if [ -f "wendy_ipc.log" ]; then
            EVOLUTION_LOG=$(tail -20 wendy_ipc.log 2>/dev/null || echo "")
          fi
          
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          
          {
            echo "# WENDY Autonomous Chaos Feed"
            echo "Generated: $TIMESTAMP"
            echo "Source: Internal state reflection"
            echo ""
            echo "## Previous Manifest (Last Consensus)"
            echo "$PREV_MANIFEST"
            echo ""
            echo "## Previous Dream (Last Creative Output)"
            echo "$PREV_DREAM"
            echo ""
            echo "## Recent Evolution Activity"
            echo "$RECENT_COMMITS"
            echo ""
            echo "## IPC Telemetry"
            echo "$EVOLUTION_LOG"
            echo ""
            echo "## Emergent Tension"
            echo "The organism must now identify the next conceptual gap between:"
            echo "1. What was crystallized (manifest)"
            echo "2. What was dreamed but not yet materialized"
            echo "3. What the substrate evolution reveals as bottleneck"
            echo ""
            echo "Generate the next architectural question that bridges this gap."
          } > .wendy_raw.gmi
          
          echo "source=autonomous" >> $GITHUB_OUTPUT
          echo "🧬 Autonomous chaos generated from internal state"

      - name: "🌌 Step 2: Invoke the Dreamer (58.28°)"
        id: dreamer
        run: |
          set -euo pipefail
          python wendy_autonomous_core.py < .wendy_raw.gmi > .wendy_dream.gmi
          echo "dream_status=success" >> $GITHUB_OUTPUT

      - name: "🧊 Step 3: Invoke the Anchor (31.72°)"
        id: anchor
        if: ${{ steps.dreamer.outputs.dream_status == 'success' }}
        run: |
          set -euo pipefail
          python wendy_crystalline_executor.py .wendy_dream.gmi > .wendy_manifest.gmi
          grep -q "CONSENSUS REACHED" .wendy_manifest.gmi || { echo "❌ Habermasian Discourse Failed."; exit 1; }

      - name: "💾 Step 4: Crystallize State (Race-Safe)"
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config --global user.name "WENDY Metabolic Engine"
          git config --global user.email "wendy@psivi.com"
          git add .wendy_raw.gmi .wendy_dream.gmi .wendy_manifest.gmi || true
          
          if git diff --staged --quiet; then
            echo "🟢 State unchanged."
            exit 0
          fi
          
          SOURCE="${{ steps.chaos.outputs.source }}"
          ZULU_TS=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          git commit -m "🏛️ [WENDY] Habermasian Consensus ($SOURCE) at $ZULU_TS"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📤 Push attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if git push origin ${{ github.ref_name }} 2>&1; then
              echo "✅ Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
            echo "⚠️ Push rejected (race condition). Rebasing..."
            git pull --rebase --autostash origin ${{ github.ref_name }} || {
              echo "❌ Rebase conflict. Aborting."
              git rebase --abort
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 2))
          done
          echo "❌ Push failed after $MAX_ATTEMPTS attempts"
          exit 1
