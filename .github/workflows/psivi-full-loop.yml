name: PSIVI Mesh - Full Autonomous Loop (Seed -> Process -> Report)

on:
  workflow_dispatch:
    inputs:
      command_type:
        description: 'Instruction Type'
        required: true
        default: 'spawn_agent'
        type: choice
        options:
          - spawn_agent
          - request_report
      template_name:
        description: 'Agent Template'
        required: false
        default: 'satellite_observer'
      target_region:
        description: 'Target Region'
        required: false
        default: 'Goldstream_Watershed'
      gene_focus:
        description: 'Gene Focus (for literature_resolver)'
        required: false
        default: 'IGFBP7'

permissions:
  contents: write
  actions: read

jobs:
  seed-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Set up Python Environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Execute BEGIN_SEALER.py
        id: sealer
        env:
          COMMAND_TYPE: ${{ github.event.inputs.command_type }}
          TEMPLATE_NAME: ${{ github.event.inputs.template_name }}
          TARGET_REGION: ${{ github.event.inputs.target_region }}
          GENE_FOCUS: ${{ github.event.inputs.gene_focus }}
        run: |
          echo "🚀 Step 1: Sealing Instruction..."
          mkdir -p data/instruction_queue
          python scripts/BEGIN_SEALER.py
          if ls data/instruction_queue/*.psvc >/dev/null 2>&1; then
            echo "✅ Instruction files created."
            echo "has_instruction=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ No instruction files found."
            echo "has_instruction=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Instruction Files (Race-Condition Proof)
        if: steps.sealer.outputs.has_instruction == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI-Mesh-Bot"
          git config user.email "bot@psivi.com"
          git add data/instruction_queue/
          
          if ! git diff --staged --quiet; then
            git commit -m "feat(mesh): auto-seeded instruction via full loop workflow [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}; then
                echo "✅ Instruction committed."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          fi

      - name: Execute BEGIN_PROCESSOR.py
        if: steps.sealer.outputs.has_instruction == 'true'
        id: processor
        run: |
          echo "🧠 Step 2: Processing Instruction..."
          mkdir -p reports/scientific_reports
          python scripts/BEGIN_PROCESSOR.py
          if ls reports/scientific_reports/*.json >/dev/null 2>&1; then
            echo "✅ Reports generated."
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No reports generated."
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Finalize Mesh State (Race-Condition Proof)
        if: steps.processor.outputs.has_reports == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI-Mesh-Bot"
          git config user.email "bot@psivi.com"
          git add reports/
          git add data/instruction_queue/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(mesh): auto-generated scientific report & cleaned queue [skip ci]" \
              -m "Source: Full Autonomous Loop" \
              -m "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              if git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}; then
                echo "🏁 Full Loop Complete."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          fi
