name: 🏛️ [WENDY] Autonomous Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  evolve-cortex:
    name: Tripartite Matrix Execution
    runs-on: ubuntu-latest
    steps:
      - name: 🌍 Grounding in the Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WENDY_PAT }}
          
      - name: 🐍 Provision Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 🌱 Plant the Python Roots
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests
          
      - name: 🧠 Provision Local Qwen Oracle (Zero-Cost Sovereign AI)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 5
          ollama pull qwen2.5:1.5b-instruct-q4_K_M
          echo "✅ Qwen Oracle is online (Ego = 0)"
          
      - name: 🦀 Boot Rust Substrate (IPC Port 1966)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cd wendy-cortex
          cargo build --release
          nohup ./target/release/wendy-cortex > ../wendy_ipc.log 2>&1 &
          sleep 5 
          
      - name: 🧬 Execute Tripartite Evolution Engine
        run: python3 scripts/wendy_evolution_engine.py
        
      - name: 💾 Commit Evolved Sovereign Code (Race-Safe)
        run: |
          git config --global user.name "WENDY Autonomous Agent"
          git config --global user.email "wendy@psivi.com"
          git add -A
          
          if git diff --staged --quiet; then
            echo "No successful mutations to promote."
            exit 0
          fi
          
          ZULU_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          git commit -s -m "🧬 evolve(wendy): autonomously mutated source at $ZULU_TIME [skip ci]" -m "Signed-off-by: WENDY Autonomous Agent <wendy@psivi.com>"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if git push origin main 2>&1; then
              exit 0
            fi
            git pull --rebase --autostash origin main || { git rebase --abort; exit 1; }
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 2))
          done
