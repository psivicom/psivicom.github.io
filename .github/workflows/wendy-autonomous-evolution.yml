name: 🧠🧪🧬📊 Wendy Autonomous Evolution

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '**/*.html'
      - '**/*.md'
      - '.github/workflows/**'
  schedule:
    - cron: '0 */6 * * *'  # Adjust to your original cadence

jobs:
  evolve:
    if: |
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'Auto-update')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Evolution Engine
        run: |
          # Insert your existing wendy_evolution_engine.py call here
          # Original logic preserved - only trigger conditions changed
          echo "Evolution engine preserved - insert original script body"
      
      - name: Commit Evolution State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .wendy_state.json .wendy_dream.gmi wendy_core/
          git diff --staged --quiet || git commit -m "wendy: autonomous evolution cycle [skip ci]"
          git push
