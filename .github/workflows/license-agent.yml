name: License Agent

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run License Stamper
        run: python src/agents/license_agent.py
      - name: Commit Uniformity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI License Agent"
          git config user.email "license@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "license: stamped uniform FAIR headers across repository"
          git push
