name: License Stamper Agent

on:
  workflow_dispatch: # Run manually on demand

permissions:
  contents: write

jobs:
  stamp-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run License Stamper
        run: |
          python license_agent.py

      - name: Commit Uniformity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI License Agent"
          git config user.email "license-agent@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "license: stamped uniform FAIR headers across repository"
          git push
