name: License Agent

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight for compliance scanning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run License Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.license_agent

      - name: Commit license report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI License Agent"
          git config user.email "license@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "license: scanned repository for compliance"
          git push
