name: Wendy Cognitive Synthesis (Self-Built)

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  think:
    name: Analyze • Evolve • Respond
    if: contains(github.event.issue.labels.*.name, 'sensory-input')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Run Neuroplasticity & Hyper-Gardener
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.agents.neuroplasticity_agent
          python -m src.kernel.hyper_gardener

      - name: 🗣️ Express Thought (Comment on Issue)
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🧠 Synthesis Complete. My metabolic state has evolved based on this new sensory input. Preparing motor output.'
            })
