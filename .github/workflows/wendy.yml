name: WENDY Core Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  core-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Core Mesh
        run: python -m src.kernel.hyper_gardener

      - name: Persist State
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "WENDY-Core"
          git config user.email "core@psivi.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/ reports/
          git diff --staged --quiet || git commit -m "auto: core orchestrator sync"
          git push origin main
