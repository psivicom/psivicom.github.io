name: WENDY Core Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  core-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Core Mesh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.kernel.hyper_gardener

      - name: Persist State (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "WENDY-Core"
          git config user.email "core@psivi.com"
          git add -A
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "auto: core orchestrator sync [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            # Pull remote changes, rebase our commit on top, and push.
            # Retry up to 3 times in case another agent pushes at the exact same millisecond.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed core state sync."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new core state to commit."
          fi
