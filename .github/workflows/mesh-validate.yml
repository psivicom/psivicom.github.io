name: Mesh Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**/*.py'
      - 'data/**/*.jsonl'

permissions:
  contents: read # Explicitly declare read-only access for security compliance

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1 # Read-only validation doesn't need full history, saving clone time
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Core dependencies for schema validation, parsing, and mesh integrity checks
          pip install -r requirements-core.txt

      - name: Run Mesh Validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Using '-m' ensures Python correctly resolves the 'src' package hierarchy
          python -m src.tools.validate_mesh
