name: Autonomic Homeostasis (Immune Response)

on:
  workflow_run:
    workflows:
      - "The Mirror (OIDC Secured)"
      - "Neuroplasticity (OIDC Secured)"
      - "Metabolic Sync (Heartbeat)"
    types:
      - completed

permissions:
  id-token: write
  contents: write
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  autonomic-observation:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-core.txt

      - name: Generate OIDC Identity Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('psivi.com');
            core.setOutput('token', token);

      - name: Execute Immune Protocol (Observe & Learn)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python -m src.core.immune_protocol execute

      - name: Commit Metabolic & Quarantine Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Immune System"
          git config user.email "immune@psivi.com"
          git add data/immune_quarantine.mpk src/wendy_metabolism.mpk
          
          if ! git diff --staged --quiet; then
            git commit -m "heal(mesh): autonomic observation & stress induction [skip ci]" \
                       -m "Quarantined Commit: ${{ github.event.workflow_run.head_sha }}" \
                       -m "Failed Workflow: ${{ github.event.workflow_run.name }}" \
                       -m "🧠 Trauma recorded. Metabolic stress increased for neuroplastic adaptation."
            git push origin main || echo "⚠️ Push failed, state will sync next cycle."
          else
            echo "ℹ️ No state changes required."
          fi
