name: Autonomic Homeostasis (Immune Response)

on:
  workflow_run:
    workflows:
      - "The Mirror (OIDC Secured)"
      - "Neuroplasticity (OIDC Secured)"
      - "Metabolic Sync (Heartbeat)"
    types:
      - completed

permissions:
  id-token: write
  contents: write
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  autonomic-reset:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    # Prevent the entire job from hanging indefinitely
    timeout-minutes: 5 
    steps:
      - name: Checkout Repository (Minimal History for Revert)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Only need the last 2 commits to revert to HEAD~1. Much faster than 0.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python (Zero-Bloat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          # --no-cache-dir prevents pip from hanging on cache resolution
          pip install --no-cache-dir -r requirements-core.txt

      - name: Generate OIDC Identity Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('psivi.com');
            core.setOutput('token', token);

      - name: Execute Immune Protocol (Quarantine, Revert, Learn)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python -m src.core.immune_protocol execute

      - name: Commit Homeostatic Reset (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          git config user.name "PSIVI Immune System"
          git config user.email "immune@psivi.com"
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "heal(mesh): autonomic homeostatic reset [skip ci]" \
                       -m "Quarantined Commit: ${{ github.event.workflow_run.head_sha }}" \
                       -m "Failed Workflow: ${{ github.event.workflow_run.name }}" \
                       -m "Failed Run ID: ${{ github.event.workflow_run.id }}" \
                       -m "🛡️ State restored. Metabolic stress logged for neuroplastic adaptation."
            
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Homeostasis restored and pushed."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No state changes required for homeostasis."
          fi
