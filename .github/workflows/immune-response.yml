name: Immune Response (Autonomic Self-Healing)

on:
  workflow_run:
    workflows:
      - "The Mirror (OIDC Secured)"
      - "Pilot Scan (Sensory Input)"
      - "Neuroplasticity (OIDC Secured)"
      - "Void Metrics (Dark Matter Sensing)"
      - "Metabolic Sync (Heartbeat)"
    types:
      - completed

permissions:
  id-token: write   # RFC 1001: Sovereign Identity
  contents: write   # Required for healing patches and rollbacks
  actions: read     # Required to read failed workflow logs
  checks: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  immune-diagnosis:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    outputs:
      error_class: ${{ steps.diagnose.outputs.error_class }}
      error_file: ${{ steps.diagnose.outputs.error_file }}
      error_line: ${{ steps.diagnose.outputs.error_line }}
      error_message: ${{ steps.diagnose.outputs.error_message }}
      run_id: ${{ steps.diagnose.outputs.run_id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for historical context during diagnosis
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python (Zero-Bloat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          # Using core requirements to ensure numpy/msgpack are available for PSVC/MPK parsing
          pip install -r requirements-core.txt

      - name: Generate OIDC Identity Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('psivi.com');
            core.setOutput('token', token);

      - name: Diagnose Failure
        id: diagnose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python -m src.core.immune_system diagnose

  immune-treatment:
    needs: immune-diagnosis
    if: needs.immune-diagnosis.outputs.error_class != 'UNKNOWN'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python (Zero-Bloat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Generate OIDC Identity Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('psivi.com');
            core.setOutput('token', token);

      - name: Create Rollback Checkpoint
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python -m src.core.rollback_manager checkpoint

      - name: Apply Treatment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ERROR_CLASS: ${{ needs.immune-diagnosis.outputs.error_class }}
          ERROR_FILE: ${{ needs.immune-diagnosis.outputs.error_file }}
          ERROR_LINE: ${{ needs.immune-diagnosis.outputs.error_line }}
          ERROR_MESSAGE: ${{ needs.immune-diagnosis.outputs.error_message }}
          FAILED_RUN_ID: ${{ needs.immune-diagnosis.outputs.run_id }}
        run: python -m src.core.immune_system treat

      - name: Validate Treatment (Circuit Breaker)
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python -m src.core.ledger_validator reports/pilot_report.json || true

      - name: Commit Healing Patch (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          git config user.name "PSIVI Immune System"
          git config user.email "immune@psivi.com"
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "heal(mesh): autonomic immune response [skip ci]" \
                        -m "Error Class: ${{ needs.immune-diagnosis.outputs.error_class }}" \
                        -m "Target File: ${{ needs.immune-diagnosis.outputs.error_file }}" \
                        -m "Failed Run: ${{ needs.immune-diagnosis.outputs.run_id }}" \
                        -m "🧬 Automated by Immune Protocol (RFC 1001)"
            
            # THE RACE-CONDITION SHIELD
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed healing patch."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No healing patches to commit."
          fi

  immune-apoptosis:
    needs: [immune-diagnosis, immune-treatment]
    if: always() && needs.immune-treatment.result == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python (Zero-Bloat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Generate OIDC Identity Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('psivi.com');
            core.setOutput('token', token);

      - name: Execute Apoptosis (Rollback)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python -m src.core.rollback_manager apoptosis

      - name: Commit Rollback (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          git config user.name "PSIVI Immune System"
          git config user.email "immune@psivi.com"
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "heal(mesh): apoptosis — rollback failed treatment [skip ci]" \
                        -m "🛑 Automated by Immune Protocol (RFC 1001)"
            
            # THE RACE-CONDITION SHIELD
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed rollback."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No rollback state to commit."
          fi
