name: NASA Auto-Correct to .sssZ

on: [pull_request]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fix Timestamps
        run: python tools/fix_timestamps.py

      - name: Commit Changes
        run: |
          git config user.name "psivi-bot"
          git config user.email "bot@psivi.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: normalize to YYYY-MM-DDTHH:MM:SS.sssZ - $(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          git push
