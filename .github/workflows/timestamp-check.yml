name: NASA Auto-Correct to .sssZ

on: [pull_request]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fix Timestamps
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/fix_timestamps.py

      - name: Commit Changes (PR-Safe Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "psivi-bot"
          git config user.email "bot@psivi.com"
          git add -A
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering other workflows unnecessarily
            git commit -m "auto: normalize to YYYY-MM-DDTHH:MM:SS.sssZ [skip ci]"
            
            # THE PR-SAFE RACE-CONDITION SHIELD:
            # Uses git pull --rebase to satisfy the Security Guardian's strict text matching
            for i in 1 2 3; do
              if git pull --rebase origin ${{ github.head_ref }} && git push origin HEAD:${{ github.head_ref }}; then
                echo "✅ Successfully pushed timestamp fixes to PR."
                break
              else
                echo "⚠️ Concurrent push detected on PR branch. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No timestamps needed normalization."
          fi
