# .github/workflows/timestamp-check.yml
name: NASA Auto-Correct to .sssZ

on: [pull_request]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fix Timestamps
        run: python tools/fix_timestamps.py

      - name: Commit Changes
        run: |
          git config user.name "psivi-bot"
          git config user.email "bot@psivi.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: normalize to YYYY-MM-DDTHH:MM:SS.sssZ - $(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          git push
