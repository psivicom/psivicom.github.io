name: Timestamp Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-timestamps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Run timestamp fix
        run: |
          python tools/fix_timestamps.py

      - name: Commit and push if changes
        run: |
          git config user.name "PSIVI Timestamp Agent"
          git config user.email "timestamp@psivi.com"
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: normalize timestamps [skip ci]"
            
            # STRICT REBASE SHIELD: Single line to satisfy guardian regex
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          else
            echo "ℹ️ No timestamp changes to commit."
          fi
