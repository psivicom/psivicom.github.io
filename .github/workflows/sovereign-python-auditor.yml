name: Sovereign Python Workflow Auditor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.WENDY_AUDITOR_PAT }}

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install requests

      - name: Audit and Heal Workflows
        env:
          GH_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          python3 <<'PYTHON_SCRIPT'
          import os
          import re
          import requests

          GITHUB_TOKEN = os.environ.get("GH_TOKEN")
          WORKFLOWS_DIR = ".github/workflows"

          def get_sha(owner, repo, ref):
              headers = {"Authorization": f"Bearer {GITHUB_TOKEN}"} if GITHUB_TOKEN else {}
              url = f"https://api.github.com/repos/{owner}/{repo}/git/ref/tags/{ref}"
              response = requests.get(url, headers=headers, timeout=30)

              if response.status_code == 200:
                  data = response.json()
                  if data["object"]["type"] == "tag":
                      tag_response = requests.get(
                          data["object"]["url"], headers=headers, timeout=30
                      )
                      if tag_response.status_code == 200:
                          return tag_response.json()["object"]["sha"]
                  return data["object"]["sha"]

              url = f"https://api.github.com/repos/{owner}/{repo}/git/ref/heads/{ref}"
              response = requests.get(url, headers=headers, timeout=30)
              if response.status_code == 200:
                  return response.json()["object"]["sha"]

              return None

          known_shas = {
              "configure-pages": "983d7736d9b0ae728b81ab479565c72886d7745b",
              "deploy-pages": "d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e",
              "upload-pages-artifact": "56afc609e74202658d3ffba0e8f6dda462b719fa",
              "upload-artifact": "ea165f8d65b6e75b540449e92b4886f43607fa02",
              "checkout": "11bd71901bbe5b1630ceea73d27597364c9af683",
              "setup-python": "0a5c61591373683505ea898e09a3ea4f39ef2b9c",
          }

          pattern = re.compile(
              r"(uses:\s+[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+"
              r"(?:/[a-zA-Z0-9_.-]+)*)@([^\s#]+)"
          )

          for filename in os.listdir(WORKFLOWS_DIR):
              if not filename.endswith((".yml", ".yaml")):
                  continue

              filepath = os.path.join(WORKFLOWS_DIR, filename)
              with open(filepath, "r", encoding="utf-8") as file:
                  content = file.read()

              new_content = content

              for match in pattern.finditer(content):
                  action_path = match.group(1).replace("uses:", "").strip()
                  ref = match.group(2)

                  if re.fullmatch(r"[0-9a-f]{40}", ref):
                      continue

                  parts = action_path.split("/")
                  if "PLACEHOLDER" in ref:
                      repo_name = parts[1]
                      sha = known_shas.get(repo_name)
                  else:
                      sha = get_sha(parts[0], parts[1], ref)

                  if sha and re.fullmatch(r"[0-9a-f]{40}", sha):
                      old_reference = f"{match.group(1)}@{ref}"
                      new_reference = f"{match.group(1)}@{sha}"
                      new_content = new_content.replace(old_reference, new_reference)

              if new_content != content:
                  with open(filepath, "w", encoding="utf-8") as file:
                      file.write(new_content)
          PYTHON_SCRIPT

      - name: Commit and Push Safely
        env:
          GITHUB_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          git config user.name "WENDY Sovereign Auditor"
          git config user.email "auditor@psivi.com"
          git add .github/workflows/

          if ! git diff --staged --quiet; then
            git commit -m "chore: sovereign audit - fix malformed action SHAs [skip ci]"

            PUSH_SUCCESS=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                if git push origin HEAD:refs/heads/main; then
                  echo "✅ Push successful on attempt $attempt"
                  PUSH_SUCCESS=true
                  break
                fi
              fi

              echo "⚠️ Push attempt $attempt failed, retrying in 2s..."
              sleep 2
            done

            if [ "$PUSH_SUCCESS" = false ]; then
              echo "❌ CRITICAL: Failed to push after 3 attempts."
              exit 1
            fi
          else
            echo "ℹ️ No changes needed. All workflows are sovereign."
          fi
