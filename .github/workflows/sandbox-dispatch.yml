name: Sandbox Patch Runner (Manual)

on:
  workflow_dispatch:
    inputs:
      patch_tarball:
        description: 'Path to patch tarball in repo (optional)'
        required: false

jobs:
  run-sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt || true
          pip install pytest flake8 || true

      - name: Run sandbox
        run: |
          chmod +x tools/sandbox/run_sandbox.sh
          ./tools/sandbox/run_sandbox.sh "${{ github.event.inputs.patch_tarball }}" "reports/sandbox" || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-reports
          path: reports/sandbox
