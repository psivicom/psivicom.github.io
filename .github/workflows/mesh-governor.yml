name: Mesh Governor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Governor
        run: python src/orchestrator/mesh_governor.py
      - name: Commit enforcement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Governor"
          git config user.email "governor@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "governor: enforced pico protocol and scanned for violations"
          git push
