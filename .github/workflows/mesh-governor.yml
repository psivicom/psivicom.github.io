name: Mesh Governor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Governor
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.mesh.mesh_governor

      - name: Commit enforcement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Governor"
          git config user.email "governor@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "governor: enforced pico protocol and scanned for violations"
          git push
