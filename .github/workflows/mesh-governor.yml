name: Mesh Governor (Resource & Policy Enforcement)

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours to audit mesh health
  workflow_dispatch:
  push:
    paths:
      - 'src/mesh/mesh_governor.py'
      - 'config/psvc-manifest.yml'

permissions:
  contents: write
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  enforce-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Read System Versions
        id: versions
        run: |
          echo "python_version=$(jq -r '.python.version' config/system_versions.json)" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python_version }}

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Execute Mesh Governance Audit
        run: |
          echo "🛡️ Initiating Mesh Governor audit cycle..."
          python -m src.mesh.mesh_governor

      - name: Commit Governance Artifacts (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Governor"
          git config user.email "governor@psivi.com"
          
          git add config/ reports/ data/
          
          if ! git diff --staged --quiet; then
            git commit -m "governance: sealed resource audit and policy enforcement [skip ci]"
            
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed governance artifacts."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ Mesh is within policy thresholds. No artifacts to commit."
          fi
