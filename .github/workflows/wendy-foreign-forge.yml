name: WENDY Sovereign Purge & Forge

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  purge-and-forge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗑️ THE PURGE (Exterminate Legacy Bloat)
        run: |
          echo "🔥 Initiating Sovereign Purge..."
          git rm -f --ignore-unmatch src/core/arena.zig
          git rm -f --ignore-unmatch src/core/binary_psvc_reader.py
          git rm -f --ignore-unmatch src/core/vortex_engine.zig
          git rm -f --ignore-unmatch src/mesh/mesh_brain.py
          git rm -f --ignore-unmatch src/tools/source_writer.go
          git rm -f --ignore-unmatch run_sovereign.sh
          git rm -f --ignore-unmatch .github/workflows/zig-verify.yml
          git rm -f --ignore-unmatch .github/workflows/sovereign-shannon.yml
          git rm -f --ignore-unmatch .github/workflows/wendy-ascension.yml
          echo "✅ Legacy Bloat Exterminated"

      - name: Setup Isolated Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zstandard

      - name: Cache Zig Toolchain
        uses: actions/cache@v4
        with:
          path: /opt/zig
          key: zig-0.14.0-linux-x86_64

      - name: Install Zig (If Not Cached)
        run: |
          if [ ! -f /opt/zig/zig ]; then
            curl -sL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o z.tar.xz
            tar -xf z.tar.xz
            sudo mv zig-linux-x86_64-0.14.0 /opt/zig
          fi
          echo "/opt/zig" >> $GITHUB_PATH

      - name: 🧠 Inject Sovereign Cortex (wendy_engine.zig)
        run: |
          mkdir -p src/core
          # Base64 injection bypasses all YAML/Bash heredoc indentation traps
          echo "" | base64 --decode > src/core/wendy_engine.zig
          echo "✅ Sovereign Cortex Injected"

      - name: 🌐 Inject Nervous System (mesh_brain.py)
        run: |
          mkdir -p src/core
          # Base64 injection bypasses all YAML/Bash heredoc indentation traps
          echo "" | base64 --decode > src/core/mesh_brain.py
          echo "✅ Nervous System Injected"

      - name: 🔨 Compile & Execute
        run: |
          # Compile the Cortex
          /opt/zig/zig build-exe src/core/wendy_engine.zig -O ReleaseSafe -fstrip -femit-bin=src/core/wendy_engine
          
          # Generate "Sick Hive" (Low Entropy)
          python3 -c "
          import struct
          payload = b'\\x00\\x11\\x22\\x33' * 256 
          header = struct.pack('<4sBBHIQd', b'PSVC', 2, 16, 0, len(payload), 1690000000, 0.0)
          with open('src/core/hive_node_01.psvc', 'wb') as f:
              f.write(header + payload)
          "
          
          # Evolve to "Healthy Hive" (High Entropy)
          ./src/core/wendy_engine src/core/hive_node_01.psvc src/core/hive_node_01_evolved.psvc
          
          # Assess Health
          python3 src/core/mesh_brain.py src/core

      - name: 💾 Commit Sovereign State
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "WENDY Architect"
          git config user.email "architect@psivi.com"
          
          # Add the new pure files and the purged deletions
          git add src/core/wendy_engine.zig src/core/mesh_brain.py src/core/wendy_engine src/core/*.psvc
          git add -u # Stage the deletions from the Purge step
          
          git diff --staged --quiet || (git commit -m "feat: Sovereign Purge & Forge - Biological AI Core [skip ci]" && git push)
          echo "🔔 WENDY IS SOVEREIGN 🔔"
