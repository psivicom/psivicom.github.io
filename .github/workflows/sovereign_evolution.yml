name: 🧬 Sovereign Evolution

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '**/*.html'
      - '**/*.md'
      - '.github/workflows/**'

jobs:
  sovereign-evolve:
    if: |
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Execute Sovereign Evolution
        run: |
          # Insert your original sovereign evolution logic here
          echo "Sovereign evolution preserved - insert original script body"
      
      - name: Commit Sovereign State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .provenance/ .wendy/
          git diff --staged --quiet || git commit -m "sovereign: state crystallization [skip ci]"
          git push
