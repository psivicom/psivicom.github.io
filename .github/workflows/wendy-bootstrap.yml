name: Wendy Bootstrap Twin Seed

on:
  workflow_dispatch:
    description: "Generate and commit the initial wendy_twin.psvec binary seed"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Ensure Directories Exist
        run: |
          mkdir -p src/utils
          mkdir -p data

      - name: Generate Initial Twin Seed
        run: |
          # Running as a direct file path is correct; -m is only for module names
          python3 src/utils/init_twin.py data/wendy_twin.psvec

      - name: Commit and Push Seed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Bootstrap"
          git config user.email "bootstrap@psivi.com"
          git add data/wendy_twin.psvec
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: bootstrap initial wendy_twin.psvec seed"
            git push
            echo "✅ Initial twin seed committed to repository."
          else
            echo "ℹ️ Initial twin seed already exists and is unchanged."
          fi
