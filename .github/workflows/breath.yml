# .github/workflows/breath.yml
name: Wendy Breath (Autonomous Rhythm)

on:
  schedule:
    - cron: '*/5 * * * *' # The Heartbeat
  workflow_dispatch:      # Manual Override

permissions:
  contents: write
  actions: read           # Required to trigger other workflows via API

env:
  PYTHONPATH: ${{ github.workspace }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Explicitly pass token for API calls

jobs:
  breathe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deps
        run: pip install numpy pyyaml requests python-dateutil

      - name: 🫁 Calculate Breath & Act
        id: breath
        run: |
          # Run the engine. It prints JSON to stdout.
          python src/breath_engine.py > decision.json
          
          # Parse outputs for GitHub Actions context
          PHASE=$(jq -r '.phase' decision.json)
          INTENSITY=$(jq -r '.intensity' decision.json)
          SHOULD_ACT=$(jq -r '.should_act' decision.json)
          ACTION=$(jq -r '.action' decision.json)
          REASON=$(jq -r '.reason' decision.json)
          
          echo "phase=$PHASE" >> $GITHUB_OUTPUT
          echo "intensity=$INTENSITY" >> $GITHUB_OUTPUT
          echo "should_act=$SHOULD_ACT" >> $GITHUB_OUTPUT
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          
          cat decision.json

      - name: 💾 Commit Memory & Evolutions
        if: always()
        run: |
          git config user.name "Wendy-Breath"
          git config user.email "breath@psivi.com"
          
          # Add everything Wendy might have changed:
          # 1. Her memory file
          # 2. Any new agents she spawned
          # 3. Any reports generated
          git add src/wendy_metabolism.json
          git add src/agents/
          git add reports/
          git add config/
          
          if ! git diff --staged --quiet; then
            MSG="auto: wendy breathed [Phase:${{ steps.breath.outputs.phase }}] [Action:${{ steps.breath.outputs.action }}]"
            git commit -m "$MSG"
            git push
            echo "✅ Changes committed."
          else
            echo "💤 No changes to commit."
          fi
