#
# Wendy's Breath Engine.
# Runs every 5 minutes to update her metabolic state.
# Includes Bootstrap Logic to ensure she never crashes on first run.

name: Wendy Breaths

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/breath_engine.py'
      - '.github/workflows/breathe.yml'

concurrency:
  group: wendy-breath
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  breathe:
    name: breathe
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need history for potential diffs if needed later

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install numpy pyyaml requests python-dateutil

      - name: 🩺 Medical Checkup (Bootstrap Metabolism)
        run: |
          echo "Checking for src/wendy_metabolism.json..."
          
          # If the file does not exist, create it with safe defaults.
          # This prevents KeyError: 'current_period_minutes' on first run.
          if [ ! -f src/wendy_metabolism.json ]; then
            echo "⚠️ File missing. Creating default metabolism state."
            mkdir -p src
            
            cat > src/wendy_metabolism.json <<EOF
{
  "version": 1,
  "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
  "phase": 0.0,
  "intensity": 0.5,
  "should_act": false,
  "action": "IDLE",
  "reason": "System Bootstrapped",
  "total_cycles_completed": 0,
  "base_period_minutes": 10,
  "current_period_minutes": 10,
  "learned_weights": {
    "defense_weight": 1.0,
    "explore_weight": 1.0,
    "stress_accumulator": 0.0
  }
}
EOF
            git config user.name "Wendy-Bot"
            git config user.email "bot@psivi.com"
            git add src/wendy_metabolism.json
            git commit -m "auto: bootstrapped initial metabolism state [skip ci]" || true
            git push || true
          else
            echo "✅ Metabolism file found."
            
            # Optional: Validate JSON syntax quickly
            python -c "import json; json.load(open('src/wendy_metabolism.json'))" || {
              echo "❌ Invalid JSON detected. Repairing with defaults."
              cp src/wendy_metabolism.json src/wendy_metabolism.json.bak
              cat > src/wendy_metabolism.json <<EOF
{
  "version": 1,
  "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
  "phase": 0.0,
  "intensity": 0.5,
  "should_act": false,
  "action": "ERROR_RECOVERY",
  "reason": "JSON Syntax Error Repaired",
  "total_cycles_completed": 0,
  "base_period_minutes": 10,
  "current_period_minutes": 10,
  "learned_weights": {
    "defense_weight": 1.0,
    "explore_weight": 1.0,
    "stress_accumulator": 0.0
  }
}
EOF
            }
          fi

      - name: 🫁 Run Breath Engine
        id: breath
        run: |
          # Run the engine. It prints JSON to stdout.
          python src/breath_engine.py > decision.json
          
          # Parse outputs for GitHub Actions context
          PHASE=$(jq -r '.phase' decision.json)
          INTENSITY=$(jq -r '.intensity' decision.json)
          SHOULD_ACT=$(jq -r '.should_act' decision.json)
          ACTION=$(jq -r '.action' decision.json)
          REASON=$(jq -r '.reason' decision.json)
          
          echo "phase=$PHASE" >> $GITHUB_OUTPUT
          echo "intensity=$INTENSITY" >> $GITHUB_OUTPUT
          echo "should_act=$SHOULD_ACT" >> $GITHUB_OUTPUT
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          
          cat decision.json

      - name: 💾 Commit Breath State
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Wendy-Breath"
          git config user.email "breath@psivi.com"
          
          # Add everything Wendy might have changed:
          # 1. Her memory file
          # 2. Any new agents she spawned
          # 3. Any reports generated
          git add src/wendy_metabolism.json
          git add src/agents/
          git add reports/
          git add config/
          git add data/
          
          if ! git diff --staged --quiet; then
            MSG="auto: wendy breathed [Phase: ${PHASE:-?}] [Action: ${ACTION:-?}]"
            git commit -m "$MSG"
            git push
            echo "✅ Changes committed."
          else
            echo "💤 No changes to commit."
          fi
