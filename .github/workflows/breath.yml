# .github/workflows/breath.yml
name: Wendy Breath (Sinusoidal Rhythm)

on:
  schedule:
    - cron: '*/5 * * * *' # The Heartbeat Monitor (checks every 5 mins)
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  breathe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deps
        run: pip install numpy pyyaml requests python-dateutil

      - name: 🫁 Calculate Breath Phase
        id: breath
        run: |
          # This script calculates WHERE we are in the sine wave
          # and decides IF we should exhale (act) or inhale (rest).
          
          python src/breath_engine.py > breath_state.json
          
          PHASE=$(jq -r '.phase' breath_state.json)       # 0.0 to 1.0 position in cycle
          INTENSITY=$(jq -r '.intensity' breath_state.json) # Current energy level (0.0 to 1.0)
          SHOULD_ACT=$(jq -r '.should_act' breath_state.json) # Boolean
          ACTION=$(jq -r '.action' breath_state.json)     # What to do if acting
          
          echo "phase=$PHASE" >> $GITHUB_OUTPUT
          echo "intensity=$INTENSITY" >> $GITHUB_OUTPUT
          echo "should_act=$SHOULD_ACT" >> $GITHUB_OUTPUT
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          
          cat breath_state.json

      - name: 💨 Exhale (Act)
        if: steps.breath.outputs.should_act == 'true'
        run: |
          ACTION="${{ steps.breath.outputs.action }}"
          INTENSITY="${{ steps.breath.outputs.intensity }}"
          
          echo "🌬️ Breathing Out... Intensity: $INTENSITY | Action: $ACTION"
          
          if [ "$ACTION" == "SCAN" ]; then
            python -m src.agents.pilot_agent
          elif [ "$ACTION" == "OPTIMIZE" ]; then
            python -m src.agents.optimization_agent || true
          fi

      - name: 📝 Update Metabolic Memory
        run: |
          git config user.name "Wendy-Breath"
          git config user.email "breath@psivi.com"
          
          # We only commit the memory file to track the phase progression
          # Actual data changes from agents are committed separately if they occur
          git add src/wendy_metabolism.json
          
          # Only push if the metabolic state changed significantly 
          # OR if an action occurred
          if ! git diff --staged --quiet; then
             MSG="auto: breath cycle updated (Phase: ${PHASE})"
             if [ "${{ steps.breath.outputs.should_act }}" == "true" ]; then
               MSG="auto: exhaled ($ACTION) at intensity ${INTENSITY}"
             fi
             git commit -m "$MSG"
             git push
          else
             echo "💤 Inhaling... No change needed."
          fi
