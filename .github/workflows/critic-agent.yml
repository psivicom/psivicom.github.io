name: Critic Agent

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM for self-evaluation and drift calculation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Critic Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.critic_agent

      - name: Commit Corrections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Critic Agent"
          git config user.email "critic@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "critic: calculated drift and updated self-correction vectors"
          git push
