name: Critic Agent

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM for self-evaluation and drift calculation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Critic Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.critic_agent

      - name: Commit Corrections (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Critic Agent"
          git config user.email "critic@users.noreply.github.com"
          git add reports/
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "critic: calculated drift and updated self-correction vectors [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed critic corrections."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new drift corrections to commit."
          fi
