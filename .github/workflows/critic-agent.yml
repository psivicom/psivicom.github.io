name: Critic Agent (Self-Improvement)

on:
  schedule:
    - cron: '0 2 * * *' # 7 PM PST (After the day's weather is finalized)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Critic Agent
        run: |
          pip install requests numpy
          python src/agents/critic_agent.py

      - name: Commit Corrections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Critic Agent"
          git config user.email "critic@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "critic: calculated drift and updated self-correction vectors"
          git push
