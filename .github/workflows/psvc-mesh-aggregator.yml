name: Sovereign Mesh Aggregator (Heartbeat)

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes to update the mesh dashboard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Core dependencies for mesh aggregation, logging, and cryptographic verification
          pip install -r requirements-core.txt

      - name: Run Sovereign Mesh Aggregator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.mesh.mesh_aggregator

      - name: Commit Status Report (Guardian-Compliant)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "psvc-mesh-bot"
          git config user.email "mesh-bot@psivi.com"
          
          # CRITICAL: Ensure directory exists to prevent git add edge-case failures
          mkdir -p reports
          
          # Safely stage the reports directory (avoids fatal errors if specific file is missing)
          git add reports/
          
          # Only proceed if there are actual changes
          if ! git diff --staged --quiet; then
            
            # Commit FIRST. This safely packages our changes.
            # [skip ci] prevents this push from triggering an infinite loop of workflows.
            git commit -m "chore(mesh): auto-update sovereign status report [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            # Pull remote changes, rebase our new commit on top, and push.
            # Retry up to 3 times in case another agent pushes at the exact same millisecond.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed mesh status."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
            
          else
            echo "ℹ️ No changes to mesh status."
          fi
