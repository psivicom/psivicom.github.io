name: Seed Mesh

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Seed Mesh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.mesh.seed_mesh
      - name: Commit seed data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Seed Mesh"
          git config user.email "seed@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "seed: initialized monthly mesh seed"
          git push
