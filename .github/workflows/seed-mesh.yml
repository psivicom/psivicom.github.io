name: Seed Pico Mesh

on:
  workflow_dispatch: # Manual trigger only

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate .psvc containers
        run: |
          pip install numpy
          python seed_mesh.py

      - name: Commit containers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Seeder"
          git config user.email "seeder@psivi.com"
          git add reports/pico_containers/
          git diff --staged --quiet || git commit -m "pico: seeded initial .psvc binary containers"
          git push
