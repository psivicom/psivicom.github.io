name: Seed Mesh

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly on the 1st at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Seed Mesh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.mesh.seed_mesh

      - name: Commit seed data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Seed Mesh"
          git config user.email "seed@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "seed: initialized monthly mesh seed"
          git push
