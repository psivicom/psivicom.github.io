name: Seed Pico Mesh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: "3.11"

      - name: Generate .psvc containers
        run: |
          python -m pip install numpy
          python seed_mesh.py

      - name: Commit and Push Containers
        run: |
          set -euo pipefail
          git config user.name "PSIVI Mesh Seeder"
          git config user.email "seeder@psivi.com"
          git add reports/pico_containers/

          if ! git diff --staged --quiet; then
            git commit -m "pico: seeded initial .psvc binary containers"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No container changes to commit."
          fi
