name: Compile Zig Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Zig Manually
        run: |
          # Download the Zig tarball for Linux x86_64
          # Replace 0.14.0 with your required version
          wget https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz
          
          # Extract the archive
          tar -xf zig-linux-x86_64-0.14.0.tar.xz
          
          # Add Zig to the system PATH so the Python script can find the 'zig' command
          echo "$(pwd)/zig-linux-x86_64-0.14.0" >> $GITHUB_PATH

      - name: Make script executable
        run: chmod +x src/core/compile_zig.py

      - name: Run Compilation Script
        run: python3 src/core/compile_zig.py

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: zig-binaries
          path: src/core/ # This saves all the binaries generated by your script
