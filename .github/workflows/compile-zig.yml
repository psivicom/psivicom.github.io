name: zig-compile-no-mlugg

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    env:
      # Change this if you need a different Zig version.
      # If unsure, you can try "master".
      ZIG_VERSION: "0.14.1"

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install Zig from official download
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y jq xz-utils curl

          json=$(curl -sL https://ziglang.org/download/index.json)

          url=$(echo "$json" | jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].tarball // empty')

          if [ -z "$url" ]; then
            url=$(echo "$json" | jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux-musl"].tarball // empty')
          fi

          if [ -z "$url" ]; then
            echo "Could not find Zig version $ZIG_VERSION for Linux x86_64."
            echo "Try changing ZIG_VERSION to another version, or use master."
            exit 1
          fi

          echo "Downloading Zig from: $url"
          curl -L -o zig.tar.xz "$url"

          tar -xf zig.tar.xz

          zigbin=$(find . -maxdepth 3 -type f -name zig | head -n 1)

          if [ -z "$zigbin" ]; then
            echo "Could not find the zig executable after extracting the download."
            exit 1
          fi

          chmod +x "$zigbin" || true

          zigdir=$(dirname "$zigbin")
          echo "$PWD/${zigdir#./}" >> "$GITHUB_PATH"

      - name: Show Zig version
        run: zig version

      - name: Compile main.zig
        run: zig build-exe main.zig -femit-bin=app

      - name: Upload compiled program
        uses: actions/upload-artifact@v4
        with:
          name: zig-app
          path: app