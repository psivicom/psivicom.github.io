name: COMPILE ZIG

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      
  workflow_dispatch:

jobs:
  verify:
    name: Zig Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Make Script Executable
        run: chmod +x src/core/compile_zig.py

      - name: Run Compilation Script
        run: python3 src/core/compile_zig.py

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: zig-binaries
          path: src/core/
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
