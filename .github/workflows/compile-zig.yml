name: Compile Zig Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Zig
        uses: zigvm/setup-zig@v0.5.0
        with:
          zig-version: '0.14.0' # Change this to your specific Zig version

      - name: Make script executable
        run: chmod +x src/core/compile_zig.py

      - name: Run Compilation Script
        run: python3 src/core/compile_zig.py

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: zig-binaries
          path: src/core/ # This saves all the binaries generated by your script
