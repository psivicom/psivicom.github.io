name: LiDAR Agent

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topo-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run LiDAR Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.lidar_agent
      - name: Commit mutation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI LiDAR Agent"
          git config user.email "lidar@users.noreply.github.com"
          git add maps/ reports/
          git diff --staged --quiet || git commit -m "lidar: processed elevation and point cloud data"
          git push
