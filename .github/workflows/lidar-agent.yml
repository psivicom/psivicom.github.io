name: LiDAR Agent

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 8 AM for topographic scanning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topo-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run LiDAR Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.lidar_agent

      - name: Commit mutation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI LiDAR Agent"
          git config user.email "lidar@users.noreply.github.com"
          git add maps/ reports/
          git diff --staged --quiet || git commit -m "lidar: processed elevation and point cloud data"
          git push
