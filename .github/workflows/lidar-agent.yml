name: LiDAR Agent

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 8 AM for topographic scanning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topo-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Read System Versions
        id: versions
        run: |
          echo "python_version=$(jq -r '.python.version' config/system_versions.json)" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python_version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # CRITICAL: LiDAR processing requires the full ML/CV stack (opencv, scikit-image, etc.)
          # Do not change this to requirements-core.txt.
          pip install -r requirements-tiny.txt

      - name: Run LiDAR Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.lidar_agent

      - name: Commit mutation (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI LiDAR Agent"
          git config user.email "lidar@users.noreply.github.com"
          
          mkdir -p maps reports
          git add maps/ reports/
          
          if ! git diff --staged --quiet; then
            git commit -m "lidar: processed elevation and point cloud data [skip ci]"
            
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed LiDAR data."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new LiDAR data to commit."
          fi
