name: LiDAR Agent

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topo-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run LiDAR Agent
        run: |
          pip install requests
          python lidar_agent.py

      - name: Commit mutation
        run: |
          git config user.name "PSIVI LiDAR Agent"
          git config user.email "lidar-agent@users.noreply.github.com"
          git add mesh_state.json
          git diff --staged --quiet || git commit -m "lidar: telemetry deposited"
          git push
