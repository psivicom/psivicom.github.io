name: Update tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate colored tree files
        run: |
          chmod +x scripts/fast-tree.sh
          ./scripts/fast-tree.sh

      - name: Inject tree.md into README.md
        run: |
          awk '
            /^<!-- TREE START -->$/ { print; system("cat tree.md"); skip=1; next }
            /^<!-- TREE END -->$/   { skip=0 }
            !skip                   { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Inject colored tree into index.html
        run: |
          awk '
            /<!-- BRENT START -->/ { 
              print; 
              print "<pre id=\"brent-tree\" style=\"font-family: monospace; background: #1e1e1e; color: #ccc; padding: 10px;\"></pre>";
              print "<script>";
              print "fetch('tree_clean.txt').then(r=>r.text()).then(t=>{";
              print "  let html = t.replace(/\\033\\[([0-9;]*)m/g, (m, c) => {";
              print "    if(c.includes('34')) return \'<span style=\'color:#569cd6\'>\';"; 
              print "    if(c.includes('32')) return \'<span style=\'color:#6a9955\'>\';"; 
              print "    if(c.includes('37')) return \'<span style=\'color:#d4d4d4\'>\';"; 
              print "    return \'</span>\';";
              print "  }).replace(/\\n/g, \'<br>\');";
              print "  document.getElementById(\'brent-tree\').innerHTML = html;";
              print "});";
              print "</script>";
              skip=1; 
              next 
            }
            /<!-- BRENT END -->/   { skip=0 }
            !skip                  { print }
          ' index.html > index.tmp && mv index.tmp index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TREE tree.json tree.md tree_clean.txt README.md index.html scripts/fast-tree.sh
          git diff --staged --quiet || git commit -m "Update tree" && git push
