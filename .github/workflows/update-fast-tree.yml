      - name: Generate TREE.md
        run: go run ./scripts/update-tree/main.go

      # 👇 ADD THIS LINE 👇
      - name: Strip color codes from README.md
        run: sed -i 's/\x1b\[[0-9;]*m//g' README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TREE.md README.md .tree.hash
          git diff --cached --quiet || git commit -m "chore: auto-update tree [skip ci]"
          git push
