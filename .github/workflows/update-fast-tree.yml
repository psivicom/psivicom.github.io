# .github/workflows/update-tree.yml
name: Update TREE.md

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Generate TREE.md
        run: go run ./scripts/update-tree/main.go

      - name: Strip ANSI color codes from TREE.md
        run: sed -i 's/\x1b\[[0-9;]*m//g' TREE.md

      - name: Strip ANSI color codes from README.md
        run: sed -i 's/\x1b\[[0-9;]*m//g' README.md || true

      - name: Strip ANSI color codes from index.html
        run: sed -i 's/\x1b\[[0-9;]*m//g' index.html || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TREE.md README.md index.html .tree.hash
          git diff --cached --quiet || git commit -m "chore: auto-update tree, README, and index.html [skip ci]"
          git push
