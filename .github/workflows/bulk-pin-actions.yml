name: Bulk Pin GitHub Actions to SHAs

on:
  workflow_dispatch:
    description: "Run once to pin all vX actions to secure SHAs"

permissions:
  contents: write
  workflows: write

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Pin Actions in all workflows
        run: |
          cd .github/workflows
          find . -name "*.yml" -exec sed -i -E 's|actions/checkout@v[0-9]+|actions/checkout@11d5960a326750d5838078e36cf38b85af677262|g' {} +
          find . -name "*.yml" -exec sed -i -E 's|actions/cache@v[0-9]+|actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830|g' {} +
          find . -name "*.yml" -exec sed -i -E 's|actions/setup-python@v[0-9]+|actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065|g' {} +
          find . -name "*.yml" -exec sed -i -E 's|actions/setup-go@v[0-9]+|actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff|g' {} +
          find . -name "*.yml" -exec sed -i -E 's|actions/upload-artifact@v[0-9]+|actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1|g' {} +
          find . -name "*.yml" -exec sed -i -E 's|actions/download-artifact@v[0-9]+|actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16|g' {} +
          find . -name "*.yml" -exec sed -i -E 's|actions/github-script@v[0-9]+|actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea|g' {} +

      - name: Commit and Push Changes
        run: |
          git config user.name "Wendy-Security-Bot"
          git config user.email "security@psivi.com"
          git add .github/workflows/
          if git diff --staged --quiet; then
            echo "No changes needed."
          else
            git commit -m "chore: bulk pin all GitHub Actions to secure SHAs"
            git push
          fi
