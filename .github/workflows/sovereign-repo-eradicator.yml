name: Sovereign Repository Eradicator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eradicate-disasters:
    name: Surgical Artifact & Secret Annihilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.WENDY_AUDITOR_PAT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: '3.12'

      - name: Execute Sovereign Annihilation
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import re
          from pathlib import Path

          workflows_dir = Path('.github/workflows')
          
          # Verified 40-character SHAs
          SHA_CHECKOUT = '11bd71901bbe5b1630ceea73d27597364c9af683'
          SHA_PYTHON = '0a5c61591373683505ea898e09a3ea4f39ef2b9c'
          
          # Hallucinated 38-character SHAs to eradicate
          BAD_SHAS = [
              'a26af69be951a213d495a4c3e4e4022e16d87065',
              '11d5960a326750d5838078e36cf38b85af677262'
          ]

          # Workflows that genuinely require the heavy ML stack
          ml_exempt_workflows = {
              'wendy-deep-cognition.yml',
              'intelligence-agent.yml',
              'literature-ingest.yml',
              'ingest-knowledge-base.yml',
              'wendy-reactive-cognition.yml',
              'neuroplasticity.yml'
          }

          changes_made = 0
          print("🔍 Scanning repository for hardcoded secrets and big AI artifacts...")

          for wf in workflows_dir.glob('*.yml'):
              content = wf.read_text()
              new_content = content
              
              # 1. Eradicate Hallucinated SHAs
              for bad_sha in BAD_SHAS:
                  if 'actions/checkout' in new_content and bad_sha in new_content:
                      new_content = new_content.replace(bad_sha, SHA_CHECKOUT)
                  if 'actions/setup-python' in new_content and bad_sha in new_content:
                      new_content = new_content.replace(bad_sha, SHA_PYTHON)

              # 2. Eradicate Thermodynamic Bloat (unless exempt)
              if wf.name not in ml_exempt_workflows:
                  new_content = re.sub(
                      r'pip install -r requirements(-ml)?\.txt',
                      'pip install -r requirements-tiny.txt',
                      new_content
                  )

              # 3. HYPER-AGGRESSIVE SECRET ANNIHILATION
              # Catch ANY fine-grained PAT (github_pat_...) regardless of length
              new_content = re.sub(
                  r'github_pat_[a-zA-Z0-9_]+',
                  '${{ secrets.WENDY_AUDITOR_PAT }}',
                  new_content,
                  flags=re.IGNORECASE
              )
              
              # Catch ANY classic GitHub token (ghp_, gho_, ghu_, ghs_, ghr_)
              new_content = re.sub(
                  r'\bgh[pousr]_[a-zA-Z0-9_]+\b',
                  '${{ secrets.WENDY_AUDITOR_PAT }}',
                  new_content,
                  flags=re.IGNORECASE
              )

              # Force ALL 'token:' fields in checkout steps to use the secure variable
              new_content = re.sub(
                  r'(token:\s*)[^\n]+',
                  r'\1${{ secrets.WENDY_AUDITOR_PAT }}',
                  new_content
              )
              
              # Force ALL 'GITHUB_TOKEN:' fields in env blocks to use the secure variable
              new_content = re.sub(
                  r'(GITHUB_TOKEN:\s*)[^\n]+',
                  r'\1${{ secrets.WENDY_AUDITOR_PAT }}',
                  new_content
              )

              if new_content != content:
                  wf.write_text(new_content)
                  changes_made += 1
                  print(f"🧹 HEALED: {wf.name}")

          print(f"\n🏁 Annihilation complete. Healed {changes_made} workflow(s).")
          PYTHON_SCRIPT

      - name: Commit and Push Sovereign State
        env:
          GITHUB_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          git config user.name "WENDY Sovereign Eradicator"
          git config user.email "eradicator@psivi.com"
          git add .github/workflows/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: annihilate hardcoded secrets and big AI artifacts [skip ci]"
            
            PUSH_SUCCESS=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                if git push origin main; then
                  echo "✅ Push successful on attempt $attempt"
                  PUSH_SUCCESS=true
                  break
                fi
              fi
              echo "⚠️ Push attempt $attempt failed, retrying in 2s..."
              sleep 2
            done
            
            if [ "$PUSH_SUCCESS" = false ]; then
              echo "❌ CRITICAL: Failed to push sovereign state."
              exit 1
            fi
          else
            echo "ℹ️ No artifacts or secrets detected. System is already sovereign."
          fi
