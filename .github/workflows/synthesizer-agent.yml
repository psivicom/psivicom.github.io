name: Mesh Synthesizer

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Synthesizer
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.agents.synthesizer_agent
      - name: Commit synthesis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Synthesizer"
          git config user.email "synthesizer@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "synthesizer: generated weekly scientific insight"
          git push
