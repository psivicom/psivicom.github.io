name: Mesh Synthesizer

on:
  schedule:
    - cron: '0 18 * * *' # 11 AM PST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Synthesizer
        run: |
          pip install requests
          python src/agents/synthesizer_agent.py

      - name: Commit synthesis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Synthesizer Agent"
          git config user.email "synthesizer@users.noreply.github.com"
          git add reports/ index.html
          git diff --staged --quiet || git commit -m "synthesizer: generated weekly scientific insight"
          git push
