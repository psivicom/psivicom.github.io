name: WENDY Pure Go Mesh Tests

on:
  workflow_dispatch: # <-- THIS ADDS THE "RUN WORKFLOW" BUTTON
  push:
    paths:
      - 'wendy-go/**'
  pull_request:
    paths:
      - 'wendy-go/**'

jobs:
  test-and-benchmark:
    name: Prove Correctness and Speed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go 1.22
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: Run Safety Tests (Prove Math is Correct)
        working-directory: wendy-go
        run: go test ./pkg/aether -v

      - name: Run Benchmarks (Prove Speed Upgrade)
        working-directory: wendy-go
        run: go test ./pkg/aether -bench=. -benchmem
