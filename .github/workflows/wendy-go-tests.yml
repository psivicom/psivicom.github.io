name: WENDY Pure Go Mesh Tests

on:
  push:
    paths:
      - 'wendy-go/**'
  pull_request:
    paths:
      - 'wendy-go/**'

jobs:
  test-and-benchmark:
    name: Prove Correctness and Speed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Safety Tests (Prove Math is Correct)
        working-directory: wendy-go/pkg/aether
        run: go test -v

      - name: Run Benchmarks (Prove Speed Upgrade)
        working-directory: wendy-go/pkg/aether
        run: go test -bench=. -benchmem
