name: The Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  reflect-and-correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install numpy pyyaml requests python-dateutil

      - name: Reflect and Correct (Race-Condition Proof)
        run: |
          python src/mirror_agent.py
          
          git config user.name "Wendy-Mirror"
          git config user.email "mirror@psivi.com"
          git add -A
          
          # Only commit if there are actual changes
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "auto: mirror corrected state inconsistency [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            # Pull remote changes, rebase our commit on top, and push.
            # Retry up to 3 times in case another agent pushes at the exact same millisecond.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed mirror corrections."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No state inconsistencies to correct."
          fi
