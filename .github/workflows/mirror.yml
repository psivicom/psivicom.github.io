name: The Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  reflect-and-correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install numpy pyyaml requests python-dateutil

      - name: Reflect and Correct
        run: |
          python src/mirror_agent.py
          git config user.name "Wendy-Mirror"
          git config user.email "mirror@psivi.com"
          git diff --quiet || (git add . && git commit -m "auto: mirror corrected state inconsistency" && git push)
