name: Space-Grade Zig Self-Healing Compiler

on:
  push:
    branches: [ main ]
    paths:
      - 'src/core/*.zig'
      - 'src/core/*.py'
      - 'src/mesh/*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (Industry Standard)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          echo "🔥 Installing dependencies in isolated Python environment..."
          python -m pip install --upgrade pip
          python -m pip install pynacl h5py bitshuffle numpy
          python -c "import nacl.signing; print('✅ SUCCESS: PyNaCl is installed and verified')"

      - name: Cache Zig Toolchain
        uses: actions/cache@v4
        with:
          path: /opt/zig
          key: zig-0.13.0-linux-x86_64

      - name: Install Zig Toolchain
        run: |
          if [ ! -f /opt/zig/zig ]; then
            curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o z.tar.xz
            tar -xf z.tar.xz
            sudo mv zig-linux-x86_64-0.13.0 /opt/zig
          fi
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Autonomous Compilation
        run: |
          for file in src/core/wendy_engine.zig src/core/psvc_sealer.zig src/core/vector_engine.zig src/core/actuation_engine.zig src/core/zulu_clock.zig; do
            if [ -f "$file" ]; then
              echo "Compiling $file..."
              /opt/zig/zig build-exe "$file" -O ReleaseSafe -fstrip -femit-bin="${file%.zig}"
            fi
          done

      - name: Execute Mesh Brain
        run: |
          echo "🔥 Executing Mesh Brain with verified environment..."
          python -m src.mesh.mesh_brain

      - name: Commit Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "WENDY Architect"
          git config user.email "architect@psivi.com"
          git add src/core/*.zig src/core/*.py src/core/*
          git diff --staged --quiet || (git commit -m "feat: architectural redesign with lazy imports and setup-python [skip ci]" && git push origin HEAD:refs/heads/main)
          echo "🔔 PRODUCTION SEAL APPLIED 🔔"
