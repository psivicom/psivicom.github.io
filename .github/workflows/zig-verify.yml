name: Verify and Package Zig Edge Node Clock

on:
  push:
    paths:
      - 'src/core/zulu_clock.zig'
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Repository (STRICT SHA PINNED)
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Download Zig directly (No unapproved third-party actions)
      - name: Download Zig Toolchain
        run: |
          echo "⬇️ Downloading Zig 0.11.0 static binary..."
          curl -L https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.11.0" >> $GITHUB_PATH

      # 3. Verify Installation
      - name: Verify Zig Version
        run: zig version

      # 4. Compile Zulu Clock for Edge Nodes
      - name: Compile Zulu Clock
        run: |
          echo "🔨 Compiling pure-Zig Zulu Clock for pico-workers..."
          zig build-exe src/core/zulu_clock.zig -O ReleaseSafe -fstrip

      # 5. Run Unit Tests
      - name: Run Zig Unit Tests
        run: |
          echo "🧪 Running Zig unit tests..."
          zig test src/core/zulu_clock.zig

      # 6. Execute and Verify Output
      - name: Execute and Verify Output
        run: |
          echo "⏱️ Testing execution..."
          ./zulu_clock

      # 7. 🌟 NEW: Upload the compiled binary as an Artifact
      - name: Upload Compiled Binary
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: zulu-clock-pico-worker-linux
          path: ./zulu_clock
          retention-days: 90
