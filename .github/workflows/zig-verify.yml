name: Space-Grade Zig Self-Healing Compiler

on:
  push:
    paths:
      - 'src/core/*.zig'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WENDY_AUDITOR_PAT }}

      - name: Install Zig Toolchain
        run: |
          curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o z.tar.xz
          tar -xf z.tar.xz
          sudo mv zig-linux-x86_64-0.13.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygments

      - name: Autonomous Compilation and Refactoring
        run: |
          python src/tools/refactor_engine.py

      - name: Commit Production-Ready Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          git config user.name "WENDY Architect"
          git config user.email "architect@psivi.com"
          git add src/core/*.zig src/core/*
          if ! git diff --staged --quiet; then
            git commit -m "feat: autonomous refinement and space-grade compilation [skip ci]"
            git push origin HEAD:refs/heads/main
            echo "🔔 PRODUCTION SEAL APPLIED 🔔"
          fi
