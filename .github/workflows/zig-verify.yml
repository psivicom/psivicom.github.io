name: Intelligent Zig Binary Compiler
on:
  push:
    paths:
      - 'src/core/*.zig'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig
        run: curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o z.tar.xz && tar -xf z.tar.xz && sudo mv zig-linux-x86_64-0.13.0 /opt/zig && echo "/opt/zig" >> $GITHUB_PATH && /opt/zig/zig version
      - name: Heal and Scribe
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.tools.zig_compiler_healer && python -m src.tools.zig_evolution_engine && python -m src.tools.zig_sovereign_scribe
      - name: Compile
        run: for f in src/core/*.zig; do /opt/zig/zig build-exe "$f" -O ReleaseSafe -fstrip -femit-bin="src/core/$(basename "$f" .zig)"; done
      - name: Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config user.name "PSIVI Zig Compiler" && git config user.email "zig-compiler@psivi.com" && git add src/core/ docs/ || true && if ! git diff --staged --quiet; then git commit -m "chore: auto-update compiled Zig binaries [skip ci]" && git push origin main; fi
