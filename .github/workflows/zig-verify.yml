name: Space-Grade Zig Self-Healing Compiler

on:
  push:
    paths:
      - 'src/core/*.zig'
      - 'src/tools/*.go'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # <-- ADD THIS LINE

      - name: Install Zig Toolchain
        run: |
          curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o z.tar.xz
          tar -xf z.tar.xz
          sudo mv zig-linux-x86_64-0.13.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Go Source Translation
        run: |
          # Initialize go module if missing to ensure 'go run' works
          cd src/tools
          if [ ! -f go.mod ]; then
            go mod init wendy_tools
          fi
          
          # Run the translator
          go run source_writer.go
          
          # Verify the content was written correctly
          echo "Verifying wendy_engine.zig..."
          grep "const zero" wendy_engine.zig && echo "✅ Const Zero Verified" || echo "❌ Const Zero Missing"

      - name: Autonomous Compilation
        run: |
          shopt -s nullglob
          for file in src/core/*.zig; do
            echo "Compiling $file..."
            /opt/zig/zig build-exe "$file" -O ReleaseSafe -fstrip -femit-bin="${file%.zig}"
          done

      - name: Commit Production-Ready Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "WENDY Architect"
          git config user.email "architect@psivi.com"
          git add src/core/*.zig src/core/*
          if ! git diff --staged --quiet; then
            git commit -m "feat: sovereign cognitive core injection [skip ci]"
            git push origin HEAD:refs/heads/main
            echo "🔔 PRODUCTION SEAL APPLIED 🔔"
          fi
