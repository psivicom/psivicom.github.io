name: Intelligent Zig Binary Compiler

on:
  push:
    paths:
      - "src/core/*.zig"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.WENDY_AUDITOR_PAT }}

      - name: Install Zig Toolchain
        run: |
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            --output z.tar.xz
          tar -xf z.tar.xz
          sudo mv zig-linux-x86_64-0.13.0 /opt/zig
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version

      - name: Nuke Invalid Bytes and BOM
        run: |
          python3 -c "
          import sys
          path = 'src/core/actuation_engine.zig'
          with open(path, 'rb') as f:
              data = f.read()
          idx = data.find(b'const std')
          if idx != -1:
              data = data[idx:]
          with open(path, 'wb') as f:
              f.write(data)
          print('✅ Nuked invalid bytes and BOM.')
          "

      - name: Compile Binaries
        run: |
          shopt -s nullglob
          files=(src/core/*.zig)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Zig source files found in src/core."
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Compiling $file..."
            /opt/zig/zig build-exe "$file" \
              -O ReleaseSafe \
              -fstrip \
              -femit-bin="src/core/$(basename "$file" .zig)"
          done

      - name: Commit and Push Safely
        env:
          GITHUB_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          git config user.name "PSIVI Zig Compiler"
          git config user.email "zig-compiler@psivi.com"
          git add src/core/

          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update compiled Zig binaries [skip ci]"

            PUSH_SUCCESS=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                if git push origin HEAD:refs/heads/main; then
                  echo "✅ Push successful on attempt $attempt"
                  PUSH_SUCCESS=true
                  break
                fi
              fi
              echo "⚠️ Push attempt $attempt failed, retrying in 2s..."
              sleep 2
            done

            if [ "$PUSH_SUCCESS" = false ]; then
              echo "❌ CRITICAL: Failed to push after 3 attempts."
              exit 1
            fi
          else
            echo "ℹ️ No changes to commit."
          fi
