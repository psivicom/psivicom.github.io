name: Intelligent Zig Binary Compiler

on:
  push:
    paths:
      - "src/core/*.zig"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: "3.12"

      - name: Install Zig Toolchain
        run: |
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            --output z.tar.xz
          tar -xf z.tar.xz
          sudo mv zig-linux-x86_64-0.13.0 /opt/zig
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version

      - name: Heal and Scribe
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.tools.zig_compiler_healer
          python -m src.tools.zig_evolution_engine
          python -m src.tools.zig_sovereign_scribe

      - name: Compile Binaries
        run: |
          shopt -s nullglob
          files=(src/core/*.zig)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Zig source files found in src/core."
            exit 1
          fi

          for file in "${files[@]}"; do
            /opt/zig/zig build-exe "$file" \
              -O ReleaseSafe \
              -fstrip \
              -femit-bin="src/core/$(basename "$file" .zig)"
          done

      - name: Commit and Push Safely
        run: |
          git config user.name "PSIVI Zig Compiler"
          git config user.email "zig-compiler@psivi.com"
          git add src/core/ docs/

          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update compiled Zig binaries [skip ci]"

            PUSH_SUCCESS=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                if git push origin HEAD:refs/heads/main; then
                  echo "✅ Push successful on attempt $attempt"
                  PUSH_SUCCESS=true
                  break
                fi
              fi

              echo "⚠️ Push attempt $attempt failed, retrying in 2s..."
              sleep 2
            done

            if [ "$PUSH_SUCCESS" = false ]; then
              echo "❌ CRITICAL: Failed to push after 3 attempts."
              exit 1
            fi
          else
            echo "ℹ️ No changes to commit."
          fi
