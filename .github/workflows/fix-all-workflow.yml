name: Fix All Workflows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fix All Workflow Files
        run: |
          python3 << 'EOF'
          import os
          import re
          
          workflow_dir = '.github/workflows'
          agent_mappings = {
              'forage_agent.py': 'src/agents/forage_agent.py',
              'literature_agent.py': 'src/agents/literature_agent.py',
              'critic_agent.py': 'src/agents/critic_agent.py',
              'intelligence_agent.py': 'src/agents/intelligence_agent.py',
              'synthesizer_agent.py': 'src/agents/synthesizer_agent.py',
              'license_agent.py': 'src/agents/license_agent.py',
              'lidar_agent.py': 'src/agents/lidar_agent.py',
              'satellite_agent.py': 'src/agents/satellite_agent.py',
              'mesh_router.py': 'src/orchestrator/mesh_router.py',
              'mesh_governor.py': 'src/orchestrator/mesh_governor.py'
          }
          
          for filename in os.listdir(workflow_dir):
              if not filename.endswith('.yml') or filename == 'fix-all-workflows.yml':
                  continue
                  
              filepath = os.path.join(workflow_dir, filename)
              
              with open(filepath, 'r') as f:
                  content = f.read()
              
              original = content
              
              # Fix all agent paths
              for old_name, new_path in agent_mappings.items():
                  content = re.sub(
                      rf'(python3?\s+){old_name}',
                      rf'\1{new_path}',
                      content
                  )
              
              # Add pip install if missing
              if 'pip install' not in content and 'run:' in content:
                  lines = content.split('\n')
                  new_lines = []
                  for i, line in enumerate(lines):
                      new_lines.append(line)
                      if 'run: |' in line or (line.strip().startswith('run:') and '|' not in line):
                          indent = len(line) - len(line.lstrip())
                          new_lines.append(' ' * (indent + 2) + 'pip install -r requirements.txt')
                  content = '\n'.join(new_lines)
              
              if content != original:
                  with open(filepath, 'w') as f:
                      f.write(content)
                  print(f'✅ Fixed {filename}')
          
          print('All workflows updated!')
          EOF
          
      - name: Commit All Fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/
          git commit -m "chore: auto-fix all workflow paths and dependencies [skip ci]" || echo "No changes"
          git push
