name: Metabolic Sync (Heartbeat)

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  sync-metabolism:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Generate OIDC Identity Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('psivi.com');
            core.setOutput('token', token);

      - name: Execute Metabolic Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python -m src.agents.metabolic_agent

      - name: Commit Heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "WENDY Heartbeat"
          git config user.email "heart@psivi.com"
          git add src/wendy_metabolism.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(metabolism): hourly metabolic sync [skip ci]"
            git push origin main
          fi
