name: Elastic Test & Provisioner Security

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  elastic-test:
    name: Verify Provisioner Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Elastic Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m tests.test_elastic_evolution

      - name: Commit and Push Results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Elastic Test"
          git config user.email "elastic-test@users.noreply.github.com"
          git add reports/
          
          if ! git diff --staged --quiet; then
            git commit -m "elastic-test: verified provisioner security"
            
            # CRITICAL FIX: Pull latest changes and rebase to prevent concurrent push rejections
            git pull --rebase origin main
            
            git push
            echo "✅ Elastic test changes committed and pushed."
          else
            echo "ℹ️ No changes to commit."
          fi
