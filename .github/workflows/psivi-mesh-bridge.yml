name: PSIVI Mesh - Autonomous Listener (Push Trigger)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/instruction_queue/*.psvc'
      - 'data/instruction_queue/*.json'

permissions:
  contents: write

jobs:
  process-incoming-instructions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Set up Python Environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Execute BEGIN_PROCESSOR.py
        id: processor
        run: |
          echo "🚀 Incoming Instruction Detected. Starting Processor..."
          
          # Ensure directories exist
          mkdir -p reports/scientific_reports
          
          # Run the processor script which reads queue and generates reports
          python scripts/BEGIN_PROCESSOR.py
          
          # Check if reports were generated
          if ls reports/scientific_reports/*.json >/dev/null 2>&1; then
            echo "✅ Reports generated."
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No new reports generated (queue might have been empty or already processed)."
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Generated Reports & Cleanup (Race-Condition Proof)
        if: steps.processor.outputs.has_reports == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI-Mesh-Bot"
          git config user.email "bot@psivi.com"
          
          # Add new reports
          git add reports/
          
          # Stage changes in instruction_queue (moves to .processed/)
          git add data/instruction_queue/
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "chore(mesh): auto-generated scientific report via listener trigger [skip ci]" \
              -m "Source: Push Event (External AI / Manual Drop)" \
              -m "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -m "🤖 Automated by GitHub Actions"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed generated reports."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new changes to commit."
          fi
          
          echo "🏁 Listener Loop Complete."
