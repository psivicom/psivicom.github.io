name: PSIVI Mesh - Seed Initial Instruction

on:
  workflow_dispatch:
    inputs:
      command_type:
        description: 'Type of instruction to seed'
        required: true
        default: 'spawn_agent'
        type: choice
        options:
          - spawn_agent
          - request_report
      template_name:
        description: 'Agent Template (if spawn_agent)'
        required: false
        default: 'satellite_observer'
      target_region:
        description: 'Target Region for Satellite Observer'
        required: false
        default: 'Goldstream_Watershed'

permissions:
  contents: write

jobs:
  seed-and-process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Set up Python Environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Execute BEGIN_SEALER.py (Create Instruction)
        id: sealer
        env:
          COMMAND_TYPE: ${{ github.event.inputs.command_type }}
          TEMPLATE_NAME: ${{ github.event.inputs.template_name }}
          TARGET_REGION: ${{ github.event.inputs.target_region }}
        run: |
          echo "🚀 Seeding New Instruction..."
          
          # Ensure directories exist
          mkdir -p data/instruction_queue
          
          # Run the sealer script which creates the .psvc and .json files
          python scripts/BEGIN_SEALER.py
          
          echo "✅ Instruction Created."

      - name: Commit Generated Instruction Files (Race-Condition Proof)
        id: commit_instruction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND_TYPE: ${{ github.event.inputs.command_type }}
        run: |
          git config user.name "PSIVI-Mesh-Bot"
          git config user.email "bot@psivi.com"
          
          # Check if there are new files in instruction_queue
          if [[ -n "$(git status --porcelain data/instruction_queue/)" ]]; then
            git add data/instruction_queue/
            
            # [skip ci] is CRITICAL here to prevent this push from triggering instruction-handler or psivi-mesh-bridge in an infinite loop
            git commit -m "feat(mesh): seed initial instruction via workflow_dispatch [skip ci]" \
              -m "Type: ${COMMAND_TYPE}" \
              -m "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -m "🤖 Automated by GitHub Actions"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}; then
                echo "✅ Successfully pushed seeded instruction."
                echo "committed=true" >> "$GITHUB_OUTPUT"
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new instruction files generated."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Processor Workflow (Native API)
        if: steps.commit_instruction.outputs.committed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Triggering psivi-mesh-bridge.yml via native GitHub API..."
          
          # Native, zero-dependency way to trigger a workflow_dispatch event
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/psivi-mesh-bridge.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
          
          echo "✅ Processor workflow triggered successfully."
