# .github/workflows/chain-orchestrator.yml
name: Chain Orchestrator

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/orchestrator/chain_orchestrator.py'
      - 'src/agents/*.py'

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
      
      - name: Run Chain Orchestrator
        run: |
          python src/orchestrator/chain_orchestrator.py
