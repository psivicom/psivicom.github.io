name: Chain Orchestrator (Sequential Execution)

on:
  schedule:
    - cron: '0 18 * * *' # Every day at 10 AM PST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Chain Orchestrator
        run: |
          pip install numpy
          python chain_orchestrator.py

      - name: Commit Chain Results and Spawned Agents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Chain Orchestrator"
          git config user.email "chain@psivi.com"
          # Add the new vectors AND any newly spawned agent Python files
          git add reports/pico_containers/ *_agent.py
          git diff --staged --quiet || git commit -m "chain: executed dynamic multi-agent workflow and spawned new agents"
          git push
