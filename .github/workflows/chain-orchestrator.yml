name: Chain Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *' # Every hour at the 30-minute mark

permissions:
  contents: read # Explicitly declare read-only access for security compliance

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1 # Read-only workflows don't need full history, saving clone time

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Standard core dependencies for orchestration, config parsing, and logging
          pip install numpy pyyaml requests loguru pynacl

      - name: Execute Chain Orchestrator
        run: python -m src.orchestrator.chain_orchestrator
