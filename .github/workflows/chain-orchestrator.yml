name: Chain Orchestrator

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Chain Orchestrator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.orchestrator.chain_orchestrator
      - name: Commit orchestration log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Chain Orchestrator"
          git config user.email "orchestrator@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "orchestrator: executed agent chain"
          git push
