name: Autonomous Mesh Orchestrator

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/agents/**'
      - 'src/tools/**'
      - 'src/mesh/**'
      - 'src/core/**'
      - 'config/system_versions.json'

permissions:
  contents: write
  actions: write

jobs:
  orchestrate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Read System Versions
        id: versions
        run: |
          echo "python_version=$(jq -r '.python.version' config/system_versions.json)" >> $GITHUB_OUTPUT
          echo "zig_version=$(jq -r '.zig.version' config/system_versions.json)" >> $GITHUB_OUTPUT
          echo "zig_os=$(jq -r '.zig.os' config/system_versions.json)" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python_version }}

      - name: Install Zig Toolchain (Absolute Path Fail-Safe)
        run: |
          ZIG_VER="${{ steps.versions.outputs.zig_version }}"
          ZIG_OS="${{ steps.versions.outputs.zig_os }}"
          echo "Downloading Zig ${ZIG_VER}..."
          curl -sL "https://ziglang.org/download/${ZIG_VER}/zig-${ZIG_OS}-${ZIG_VER}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          EXTRACTED_DIR="zig-${ZIG_OS}-${ZIG_VER}"
          sudo mv "${EXTRACTED_DIR}" /opt/zig
          if [ -f /opt/zig/zig ]; then
            echo "Zig binary verified at /opt/zig/zig"
            /opt/zig/zig version
            echo "/opt/zig" >> $GITHUB_PATH
          else
            echo "CRITICAL: Zig binary not found after extraction!"
            ls -la /opt/
            exit 1
          fi

      - name: Compile WENDY Zig Cortex (Sequential Sovereign Build)
        run: |
          echo "Running sequential Zig cortex compiler..."
          python src/tools/zig_cortex_compiler.py
          echo "Compiled binaries saved in src/core/:"
          ls -la src/core/*.bin 2>/dev/null || echo "No binaries produced"

      - name: Restore WENDY Twin Continuity State
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: data/wendy_twin_state.json
          key: wendy-twin-continuity-main
          restore-keys: |
            wendy-twin-continuity-

      - name: WENDY Autonomous Execution
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          python -m src.tools.autonomous_mesh_orchestrator

      - name: Save WENDY Twin Continuity State
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: data/wendy_twin_state.json
          key: wendy-twin-continuity-main

      - name: Commit Generated Artifacts, Binaries, and Healed Source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Autonomous Orchestrator"
          git config user.email "orchestrator@psivi.com"
          git add src/ reports/ data/ config/
          git reset HEAD -- .github/workflows/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "auto: sovereign binaries compiled, artifacts sealed, source healed [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          else
            echo "No new artifacts or binaries to commit."
          fi

      - name: WENDY Autonomous Memory Governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          python -m src.tools.cache_governor
