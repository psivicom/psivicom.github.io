name: Neuroplasticity

on:
  schedule:
    - cron: '30 */6 * * *' # Every 6 hours for deep neural adaptation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  neuroplasticity-update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # CRITICAL: Use Fine-Grained PAT for autonomous push authority
          token: ${{ secrets.WENDY_AUDITOR_PAT }}
          fetch-depth: 0

      - name: Setup Python
        # CORRECTED: Full 40-character verified SHA
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Neuroplasticity requires the full ML stack (torch, transformers, etc.)
          pip install -r requirements.txt

      - name: Execute Neuroplasticity Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: python -m src.agents.neuroplasticity_agent

      - name: Validate Ledger Before Commit (Circuit Breaker)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.core.ledger_validator reports/pilot_report.json

      - name: Commit State Changes (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.WENDY_AUDITOR_PAT }}
        run: |
          git config user.name "WENDY Neuroplasticity"
          git config user.email "neuro@psivi.com"
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(mesh): neuroplasticity vector update [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed neuroplasticity updates."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new neuroplasticity vectors to commit."
          fi
