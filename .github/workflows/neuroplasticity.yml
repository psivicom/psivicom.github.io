# .github/workflows/neuroplasticity.yml
name: Neuroplasticity

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  neuroplasticity-update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Neuroplasticity Agent
        run: |
          if [ -f "src/agents/neuroplasticity_agent.py" ]; then
            python src/agents/neuroplasticity_agent.py
          else
            echo "Neuroplasticity agent not found"
            exit 1
          fi

      - name: Validate Ledger Before Commit (Circuit Breaker)
        run: python src/core/ledger_validator.py reports/pilot_report.json

      - name: Commit State Changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(mesh): neuroplasticity vector update"
          branch: main
