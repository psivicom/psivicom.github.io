# .github/workflows/neuroplasticity.yml
name: Neuroplasticity

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  neuroplasticity-update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Neuroplasticity Agent
        run: python -m src.agents.neuroplasticity_agent

      - name: Validate Ledger Before Commit (Circuit Breaker)
        run: python -m src.core.ledger_validator reports/pilot_report.json

      - name: Commit State Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(mesh): neuroplasticity vector update"
          branch: main
