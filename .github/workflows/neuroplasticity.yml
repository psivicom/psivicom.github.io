name: AI Neuroplasticity (Consolidation & Pruning)

on:
  schedule:
    - cron: '0 */6 * * *' # Wakes up every 6 hours
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cortical Consolidation
        run: |
          pip install numpy
          python consolidator_agent.py

      - name: Commit Mesh Reorganization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Cortex Agent"
          git config user.email "cortex@psivi.com"
          git add reports/pico_containers/
          git diff --staged --quiet || git commit -m "cortex: consolidated master vectors and pruned old synapses"
          git push
