name: Wendy Deep Cognition (ML Cycle)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours for deep thinking

jobs:
  cognitive-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache ML Binary Wheels
        id: cache-ml
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ml-binaries-${{ hashFiles('requirements-ml.txt') }}
          restore-keys: |
            ${{ runner.os }}-ml-binaries-

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install ML Stack (From Local Cache)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Restore Cognitive Twin
        id: cache-twin
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/wendy_twin.psvec
          key: wendy-twin-${{ hashFiles('wendy-go/pkg/twin/psvc.go') }}

      - name: Execute Deep Cognitive Tasks
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.agents.neuroplasticity_agent
          python -m src.kernel.hyper_gardener

      - name: Save Cognitive Twin
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/wendy_twin.psvec
          key: wendy-twin-${{ hashFiles('wendy-go/pkg/twin/psvc.go') }}-${{ github.run_id }}
