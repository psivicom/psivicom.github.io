name: Wendy Deep Cognition (ML Cycle)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: read

jobs:
  cognitive-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Read System Versions
        id: versions
        run: |
          echo "python_version=$(jq -r '.python.version' config/system_versions.json)" >> $GITHUB_OUTPUT

      - name: Cache ML Binary Wheels
        id: cache-ml
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ml-binaries-${{ hashFiles('requirements-ml.txt') }}
          restore-keys: |
            ${{ runner.os }}-ml-binaries-

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python_version }}

      - name: Install ML Stack (From Local Cache)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Restore Cognitive Twin
        id: cache-twin
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: /tmp/wendy_twin.psvec
          key: wendy-twin-${{ hashFiles('wendy-go/pkg/twin/psvc.go') }}

      - name: Execute Deep Cognitive Tasks
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🧠 Initiating deep cognitive cycle..."
          python -m src.agents.neuroplasticity_agent
          python -m src.kernel.hyper_gardener

      - name: Save Cognitive Twin
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: /tmp/wendy_twin.psvec
          key: wendy-twin-${{ hashFiles('wendy-go/pkg/twin/psvc.go') }}-${{ github.run_id }}
