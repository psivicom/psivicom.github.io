name: Pilot Mesh Scan

on:
  # Triggered manually or by Wendy's EVOLVE/SCAN actions via repository_dispatch
  workflow_dispatch:
  repository_dispatch:
    types: [wendy_directive] 

permissions:
  contents: write   # Must be able to commit reports back to repo
  actions: read     # Required if this workflow needs to trigger others

env:
  # CRITICAL FIX: Sets the root of the repo as a Python module search path
  PYTHONPATH: ${{ github.workspace }}

jobs:
  pilot-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Changed from 1 to 0 for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Only install lightweight deps needed for reporting logic
          pip install numpy pyyaml requests python-dateutil

      - name: Execute Pilot Agent (Module Mode)
        # CRITICAL FIX: Using '-m' ensures Python treats 'src' as a package.
        run: |
          echo "=== PSIVI PILOT AGENT: OSDR-INSPIRED SCAN ==="
          python -m src.agents.pilot_agent

      - name: Commit Generated Reports (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Pilot Agent"
          git config user.email "pilot@psivi.com"
          
          echo "📦 Staging artifacts..."
          
          # Stage the main report first (this MUST exist)
          git add reports/pilot_report.json || true
          git add reports/pilot_result.json || true
          
          # Try to stage containers, but don't fail if they don't exist yet
          git add reports/pico_containers/*.psvc || true
          git add reports/pico_containers/*.json || true
          
          # Check if there are any staged changes at all
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "auto: pilot scan completed at ${TIMESTAMP} [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Scan results committed and pushed."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new files to commit (scan produced identical output)."
          fi
