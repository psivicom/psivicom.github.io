name: Pilot Scan (Sensory Input)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'config/**'

permissions:
  id-token: write
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  sensory-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt numpy pyyaml requests pynacl zstandard

      - name: Generate OIDC Identity Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('psivi.com');
            core.setOutput('token', token);

      - name: Execute Pilot Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python -m src.agents.pilot_agent

      - name: Upload Sensory Report
        uses: actions/upload-artifact@v4
        with:
          name: pilot-report
          path: reports/pilot_report.json
          retention-days: 1
