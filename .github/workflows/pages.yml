name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # Do NOT use bundler-cache here because there is no Gemfile in the repo root.
          # The GitHub Pages environment provides its own gems via the jekyll-build-pages action or system packages.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies and Build
        run: |
          # Since there is no Gemfile, we rely on the pre-installed github-pages gem 
          # which includes Jekyll and all standard plugins.
          # We explicitly install it to ensure availability if not present in base image.
          gem install github-pages --no-document
          
          # Build using the github-pages wrapper which handles config and plugins automatically
          bundle exec jekyll build --destination _site --baseurl "${{ steps.pages.outputs.base_path }}" || \
          jekyll build --destination _site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
