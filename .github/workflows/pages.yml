name: Deploy GitHub Pages (Sanitized & Sovereign)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Sanitize Build Output (Ultimate Cleanup)
        run: |
          echo "🧹 Sanitizing _site/ directory..."
          rm -rf _site_clean
          cp -rL _site _site_clean
          rm -rf _site
          mv _site_clean _site
          rm -rf _site/.git
          rm -rf _site/.jekyll-cache
          rm -rf _site/.sass-cache
          rm -rf _site/.jekyll-metadata
          find _site -name ".*" -type f -delete || true
          chmod -R 755 _site
          echo "📦 Final _site size:"
          du -sh _site
          echo "✅ Build output fully sanitized."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
