name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@217c988b8c2bf2bacb2d5c78a7e7b18f8c34daed # v1.207.0
        with:
          ruby-version: '3.3'

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install dependencies and Build
        run: |
          gem install github-pages --no-document
          jekyll build --destination _site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Sanitize Build Output (Remove All Links)
        run: |
          echo "🧹 Sanitizing _site/ directory (dereferencing all links)..."
          
          # Create a completely clean copy. 
          # The '-L' flag forces cp to follow and dereference ALL symbolic links, 
          # turning them into regular files. This also inherently breaks any hard links.
          rm -rf _site_clean
          cp -rL _site _site_clean
          
          # Replace the original _site with the sanitized version
          rm -rf _site
          mv _site_clean _site
          
          # Verify the size is well under the 10GB limit
          du -sh _site
          
          echo "✅ Build output fully sanitized. No symlinks or hard links remain."

      - name: Upload artifact (SHA-Pinned)
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: github-pages
          path: _site/
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
