      - name: Sanitize Build Output (Ultimate Cleanup)
        run: |
          echo "🧹 Sanitizing _site/ directory..."
          
          # 1. Dereference all symlinks and break hard links
          rm -rf _site_clean
          cp -rL _site _site_clean
          rm -rf _site
          mv _site_clean _site
          
          # 2. Remove hidden files and Jekyll caches that trigger this generic GitHub error
          rm -rf _site/.git
          rm -rf _site/.jekyll-cache
          rm -rf _site/.sass-cache
          rm -rf _site/.jekyll-metadata
          find _site -name ".*" -type f -delete || true
          
          # 3. Ensure all files have standard, readable permissions
          chmod -R 755 _site
          
          # 4. Verify size (MUST be under 10GB, usually it's < 100MB)
          echo "📦 Final _site size:"
          du -sh _site
          
          echo "✅ Build output fully sanitized."
