name: 🧠🧪🏋️‍♂️ WENDY Real Science Benchmark

on:
  push:
    branches: [ "main" ]
    paths:
      - 'wendy-cortex/**'
      - 'run_real_science_benchmark.py'
      - 'wendy_crystalline_executor.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-real-science:
    name: Hard Real-Time Telemetry Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision Native Rust Toolchain (Zero External Actions)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: 🏛️ Compile Rust Substrate
        run: |
          cd wendy-cortex
          # Forge the native binary so the Python orchestrator can invoke it
          cargo build --release --bin wendy-crystalline-executor

      - name: 🧪 Execute WENDY Benchmark Autonomously
        env:
          # Inject the absolute path to eliminate all CWD ambiguity for the Python subprocess bridge
          WENDY_CORTEX_BIN: ${{ github.workspace }}/wendy-cortex/target/release/wendy-crystalline-executor
        run: |
          ZULU_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          echo "[${ZULU_TIME}] WENDY is invoking her crystalline cortex and running real science..."
          python3 run_real_science_benchmark.py
