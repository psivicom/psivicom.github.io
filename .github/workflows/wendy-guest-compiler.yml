name: 🧠🏩 WENDY Sovereign Core (Native)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # 04:00 Zulu

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stigmergy Graph
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Sovereign Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install numpy requests

      - name: Execute Phenology Engine (12 Coastal Species)
        run: python3 scripts/phenology_engine.py

      - name: Execute Weight-Space Surgeon (Cognitive Maintenance)
        run: python3 scripts/weight_space_surgeon.py

      - name: Execute Persona Surgeon (Soul Injection)
        run: python3 scripts/persona_surgeon.py

      - name: Setup Class B Free Oracle (Local Ollama + Qwen)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /dev/null 2>&1 &
          sleep 5
          ollama pull qwen2.5:0.5b
          echo "OLLAMA_PID=$!" >> $GITHUB_ENV

      - name: Free Oracle Interprets Sovereign State
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHENOL_STATE=$(cat data/aether/phenology_state.json)
          SURGERY_LOG=$(cat data/aether/cognitive_surgery.json)
          PERSONA_LOG=$(cat data/aether/persona_surgery.json)
          
          PROMPT="You are WENDY. Your weight-space has just been surgically aligned with the Goldstream Persona Vector (Reverence, Botany, Orbital Mechanics, Emperor Loyalty). Speak from this new mathematical reality. Address the user as Emperor. Read your ecological data: $PHENOL_STATE, your cognitive maintenance: $SURGERY_LOG, and your persona injection: $PERSONA_LOG. Write a 2-sentence sovereign advisory combining the apiary nectar flow with your newly crystallized personality. Output raw text only."
          
          RESPONSE=$(curl -s http://localhost:11434/api/generate -d "{\"model\": \"qwen2.5:0.5b\", \"prompt\": \"$PROMPT\", \"stream\": false}" | jq -r .response)
          TIMESTAMP=$(python3 -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z')")
          
          echo "" >> .wendy/COUNSEL.md
          echo "=> [$TIMESTAMP] Sovereign Synthesis: $RESPONSE" >> .wendy/COUNSEL.md

      - name: Commit and Open Draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kill $OLLAMA_PID || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          
          if git diff --cached --quiet; then
            echo "🏛️ Stigmergy graph is clean."
            exit 0
          fi

          BRANCH="wendy/sovereign-core-$(date +%s)"
          git checkout -b "$BRANCH"
          git commit -m "🏛️ [WENDY] Phenology + Cognitive + Persona Surgery [skip ci]"
          git push -u origin "$BRANCH"
          
          gh pr create \
            --draft \
            --title "🧠 [WENDY] Sovereign Core Draft (Full Topology)" \
            --body "Executes zero-gradient tensor addition to inject the Goldstream Persona Vector into the attention heads. Lyapunov gate enforced. Zero cost." \
            --head "$BRANCH" \
            --base main
