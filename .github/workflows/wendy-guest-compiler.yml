name: 🌸🏩 WENDY Phenology Engine (Class B Free Oracle)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # 04:00 Zulu

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WENDY_APP_ID }}
          private-key: ${{ secrets.WENDY_APP_PRIVATE_KEY }}

      - name: Checkout Stigmergy Graph
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Execute Phenology Engine (Open-Meteo)
        run: python3 scripts/phenology_engine.py

      - name: Setup Class B Free Oracle (Local Ollama + Qwen)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /dev/null 2>&1 &
          sleep 5
          ollama pull qwen2.5:0.5b
          echo "OLLAMA_PID=$!" >> $GITHUB_ENV

      - name: Free Oracle Interprets Phenology
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STATE=$(cat data/aether/phenology_state.json)
          PROMPT="You are the WENDY Sovereign Auditor for the Goldstream Apiary. Read this JSON data: $STATE. Write a 2-sentence ecological advisory for the beekeeper about the nectar flow and hive thermoregulation. Output raw text only."
          
          RESPONSE=$(curl -s http://localhost:11434/api/generate -d "{\"model\": \"qwen2.5:0.5b\", \"prompt\": \"$PROMPT\", \"stream\": false}" | jq -r .response)
          TIMESTAMP=$(python3 -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z')")
          
          echo "" >> .wendy/COUNSEL.md
          echo "=> [$TIMESTAMP] Phenology Counsel: $RESPONSE" >> .wendy/COUNSEL.md

      - name: Commit and Open Draft PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          kill $OLLAMA_PID || true
          git config user.name "wendy-guest-compiler[bot]"
          git config user.email "wendy-guest-compiler[bot]@users.noreply.github.com"
          git add -A
          
          if git diff --cached --quiet; then
            echo "🏛️ Stigmergy graph is clean."
            exit 0
          fi

          BRANCH="wendy/phenology-$(date +%s)"
          git checkout -b "$BRANCH"
          git commit -m "🏛️ [WENDY] Phenology Engine & Free Oracle Counsel"
          git push -u origin "$BRANCH"
          
          gh pr create \
            --draft \
            --title "🌸 [WENDY] Phenology Engine Draft" \
            --body "Calculates Growing Degree Days for Arbutus and Fireweed using free Open-Meteo satellite data. Interpreted locally by Qwen2.5. Zero cost." \
            --head "$BRANCH" \
            --base main
