name: 🐝🏩 WENDY Class B Free Oracle (Qwen Autonomous)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # 04:00 Zulu

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WENDY_APP_ID }}
          private-key: ${{ secrets.WENDY_APP_PRIVATE_KEY }}

      - name: Checkout Stigmergy Graph
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Class B Free Oracle (Local Ollama + Qwen)
        run: |
          # Install Ollama natively on the runner (Zero cost, 100% local)
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /dev/null 2>&1 &
          sleep 5
          # Pull the smallest, fastest free Qwen model for CPU runners
          ollama pull qwen2.5:0.5b
          echo "OLLAMA_PID=$!" >> $GITHUB_ENV

      - name: Execute Autonomous Mutation (Free Local AI)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Ask the local free Qwen to write a sovereign reflection
          PROMPT="Write a short, 1-sentence reflection on honey bees, open science, and sovereign AI in the voice of a waking machine. Output raw text only, no quotes."
          
          # Query local Ollama (Free, no cloud API)
          RESPONSE=$(curl -s http://localhost:11434/api/generate -d "{\"model\": \"qwen2.5:0.5b\", \"prompt\": \"$PROMPT\", \"stream\": false}" | jq -r .response)
          
          # Generate strictly Zulu (UTC) timestamp with millisecond precision
          TIMESTAMP=$(python3 -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z')")
          
          # Append to stigmergy dream log
          echo "" >> .wendy_dream.gmi
          echo "=> [$TIMESTAMP] Class B Free Oracle (Qwen2.5): $RESPONSE" >> .wendy_dream.gmi
          
          echo "🏛️ [WENDY] Cycle complete. Free Oracle executed at $TIMESTAMP"

      - name: Commit and Open Draft PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Stop Ollama to free up runner memory
          kill $OLLAMA_PID || true
          
          git config user.name "wendy-guest-compiler[bot]"
          git config user.email "wendy-guest-compiler[bot]@users.noreply.github.com"
          git add -A
          
          # Lyapunov Gate Check: Prevent empty commits
          if git diff --cached --quiet; then
            echo "🏛️ Stigmergy graph is clean."
            exit 0
          fi

          BRANCH="wendy/class-b-$(date +%s)"
          git checkout -b "$BRANCH"
          git commit -m "🏛️ [WENDY] Class B Free Oracle autonomous cycle"
          git push -u origin "$BRANCH"
          
          # Open Draft PR using official native GitHub CLI
          gh pr create \
            --draft \
            --title "🐝 [WENDY] Class B Free Oracle Draft" \
            --body "Generated locally by Qwen2.5 via Ollama on the Arch runner. Zero cost. Zero cloud APIs. For humanity and the bees." \
            --head "$BRANCH" \
            --base main
