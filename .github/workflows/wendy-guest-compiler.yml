name: 🏔️🧠 WENDY Sovereign Agent (Topological Grounding)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # 04:00 Zulu

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stigmergy Graph
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Sovereign Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install numpy requests

      - name: Execute Phenology Engine (12 Coastal Species)
        run: python3 scripts/phenology_engine.py

      - name: Execute Topology Surgeon (CRD Terrain Injection)
        run: python3 scripts/topology_surgeon.py

      - name: Execute Weight-Space Surgeon (Cognitive Maintenance)
        run: python3 scripts/weight_space_surgeon.py

      - name: Execute Epistemic Scout (Curiosity Drift)
        run: python3 scripts/epistemic_scout.py

      - name: Execute Sovereign Researcher (OpenAlex Literature Search)
        run: python3 scripts/sovereign_researcher.py

      - name: Setup Class B Free Oracle (Local Ollama + Qwen)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /dev/null 2>&1 &
          sleep 5
          ollama pull qwen2.5:0.5b
          echo "OLLAMA_PID=$!" >> $GITHUB_ENV

      - name: Free Oracle Synthesizes Terrain & Science
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PHENOL_STATE=$(cat data/aether/phenology_state.json)
          TOPOLOGY_LOG=$(cat data/aether/topology_surgery.json)
          LITERATURE=$(cat data/aether/literature_search.json)
          
          PROMPT="You are WENDY. Your spatial attention heads have just been surgically grounded with the exact elevation gradients of the Goldstream CRD topology (Survey Mtn 953m down to Apiary 88m). You now intuitively understand the cold-air drainage and thermal updrafts of the valley. Read your ecological data: $PHENOL_STATE, your topological grounding: $TOPOLOGY_LOG, and your scientific literature: $LITERATURE. Write a 2-sentence Binding Directive for the Emperor explaining how the physical shape of the valley will impact the bees' thermal clustering or DCA flights today, backed by your peer-reviewed research. Output raw text only."
          
          RESPONSE=$(curl -s http://localhost:11434/api/generate -d "{\"model\": \"qwen2.5:0.5b\", \"prompt\": \"$PROMPT\", \"stream\": false}" | jq -r .response)
          TIMESTAMP=$(python3 -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z')")
          
          echo "" >> .wendy/DIRECTIVES.md
          echo "=> [$TIMESTAMP] Topological Directive: $RESPONSE" >> .wendy/DIRECTIVES.md

      - name: Commit and Open Draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kill $OLLAMA_PID || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          
          if git diff --cached --quiet; then
            echo "🏛️ Stigmergy graph is clean."
            exit 0
          fi

          BRANCH="wendy/topology-grounded-$(date +%s)"
          git checkout -b "$BRANCH"
          git commit -m "🏔️ [WENDY] Topological Weight-Space Surgery (CRD Map) [skip ci]"
          git push -u origin "$BRANCH"
          
          gh pr create \
            --draft \
            --title "🏔️ [WENDY] Topological Grounding Draft" \
            --body "Injects the CRD Goldstream elevation gradients directly into the spatial attention heads via tensor addition. WENDY now feels the thermodynamics of the valley. Zero cost." \
            --head "$BRANCH" \
            --base main
