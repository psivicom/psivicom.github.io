name: Universal Mesh Executor

on:
  workflow_dispatch:
    inputs:
      agent_module:
        description: 'Agent module to execute (e.g., src.agents.lidar_agent)'
        required: true
        default: 'src.agents.lidar_agent'
      agent_file:
        description: 'Agent file path (e.g., src/agents/lidar_agent.py)'
        required: true
        default: 'src/agents/lidar_agent.py'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: WENDY Autonomous Execution
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.tools.universal_mesh_executor \
            --agent "${{ github.event.inputs.agent_module }}" \
            --file "${{ github.event.inputs.agent_file }}"

      - name: Commit Generated Artifacts (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Universal Executor"
          git config user.email "executor@psivi.com"
          git add reports/ data/ config/
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: universal executor sealed artifacts [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          else
            echo "ℹ️ No new artifacts to commit."
          fi
