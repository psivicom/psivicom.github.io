name: Mesh Daemon (Auto-Process, Optimize & Heal)

on:
  push:
    branches: [ main ]
    paths:
      - 'data/instruction_queue/**'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  process-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml

      - name: Ensure Directories Exist
        run: |
          mkdir -p data/instruction_queue
          mkdir -p reports/scientific_reports
          mkdir -p logs
          mkdir -p config

      - name: Run Mesh Automation Loop
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🔄 Starting autonomous mesh processing loop..."
          python -m src.tools.auto_reporter

      - name: Run Optimization Cycle (WENDY Authorized)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🔍 Running optimization analysis..."
          python -m src.agents.optimization_agent

      - name: Run Self-Healing Audit (Autonomous Evolution)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🩺 Running autonomous code health check..."
          python -m src.agents.self_healing_agent

      - name: Commit Generated Agents, Reports, Optimizations, and Patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Daemon (WENDY Authorized)"
          git config user.email "daemon@psivi.com"
          
          git add src/agents/*_agent.py
          git add reports/scientific_reports/
          git add data/instruction_queue/
          git add config/*.json
          git add config/*.yaml
          # Add any patched source files
          git add src/
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: daemon processed instructions, optimized system, healed code, and generated artifacts [skip ci]"
            git push
            echo "✅ Changes committed and pushed to repository."
          else
            echo "ℹ️ No new changes to commit."
          fi
