name: Mesh Daemon (Auto-Process, Optimize & Heal)

on:
  push:
    branches: [ main ]
    paths:
      - 'data/instruction_queue/**'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  process-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml requests python-dateutil

      - name: Ensure Directories Exist
        run: |
          mkdir -p data/instruction_queue
          mkdir -p data/processed_instructions
          mkdir -p reports/scientific_reports
          mkdir -p logs
          mkdir -p config

      - name: Compile Shannon-Z Kernel (Zero-Allocation Go Bridge)
        run: |
          echo "🔨 Compiling Shannon-Z kernel for native Python bridge..."
          cd src/kernel
          go build -o libshannon.so -buildmode=c-shared shannon_z.go
          echo "✅ Shannon-Z kernel compiled successfully: $(ls -lh libshannon.so)"

      - name: Run Mesh Automation Loop
        run: python -m src.tools.auto_reporter

      - name: Run Optimization Cycle (WENDY Authorized)
        run: python -m src.agents.optimization_agent

      - name: Run Self-Healing Audit (Autonomous Evolution)
        run: python -m src.agents.self_healing_agent

      - name: Execute Pending Mesh Queue Locally (Fallback Guarantee)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/local_mesh_executor.py

      - name: Commit Generated Artifacts (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Daemon (WENDY Authorized)"
          git config user.email "daemon@psivi.com"
          
          # Stage all autonomous changes
          git add src/agents/*_agent.py reports/ data/instruction_queue/ data/processed_instructions/ config/*.json config/*.yaml src/ || true
          
          if ! git diff --staged --quiet; then
            # [skip ci] prevents this push from triggering an infinite loop of workflows
            git commit -m "auto: daemon processed instructions, optimized system, healed code, and generated artifacts [skip ci]"
            
            # THE RACE-CONDITION SHIELD:
            # Replaces the dangerous 'git reset --soft' and '||' chain with a safe, proven rebase loop.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed daemon artifacts."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new daemon artifacts to commit."
          fi
