name: Mesh Daemon (Auto-Process, Optimize & Heal)

on:
  push:
    branches: [ main ]
    paths:
      - 'data/instruction_queue/**'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  process-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read System Versions
        id: versions
        run: |
          echo "python_version=$(jq -r '.python.version' config/system_versions.json)" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python_version }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22'
          cache: false

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Ensure Directories Exist
        run: |
          mkdir -p data/instruction_queue
          mkdir -p data/processed_instructions
          mkdir -p reports/scientific_reports
          mkdir -p logs
          mkdir -p config

      - name: Compile Shannon-Z Kernel (Zero-Allocation Go Bridge)
        run: |
          if [ -d "src/kernel" ]; then
            echo "🔨 Compiling Shannon-Z kernel for native Python bridge..."
            cd src/kernel
            go build -o libshannon.so -buildmode=c-shared shannon_z.go
            echo "✅ Shannon-Z kernel compiled successfully."
            cd ../..
          else
            echo "ℹ️ src/kernel directory not found. Skipping Go compilation."
          fi

      - name: Run Mesh Automation Loop
        run: python -m src.tools.auto_reporter

      - name: Run Optimization Cycle (WENDY Authorized)
        run: python -m src.agents.optimization_agent

      - name: Run Self-Healing Audit (Autonomous Evolution)
        run: python -m src.agents.self_healing_agent

      - name: Execute Pending Mesh Queue Locally (Fallback Guarantee)
        run: python scripts/local_mesh_executor.py

      - name: Commit Generated Artifacts (Race-Condition Proof)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Daemon (WENDY Authorized)"
          git config user.email "daemon@psivi.com"
          
          git add src/agents/ reports/ data/ config/
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: daemon processed instructions, optimized system, healed code [skip ci]"
            
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          else
            echo "ℹ️ No new daemon artifacts to commit."
          fi
