# .github/workflows/mesh-daemon.yml
name: Mesh Daemon (Auto-Process Instructions)

on:
  push:
    branches: [ main ]
    paths:
      - 'data/instruction_queue/**'
  workflow_dispatch:

jobs:
  process-instructions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Mesh Governor
        run: |
          if [ -f "src/mesh/mesh_governor.py" ]; then
            python src/mesh/mesh_governor.py
          elif [ -f "src/mesh/pico_mesh.py" ]; then
            python src/mesh/pico_mesh.py
          else
            echo "Mesh daemon not found"
            exit 1
          fi

      - name: Validate Ledger Before Commit (Circuit Breaker)
        run: python src/core/ledger_validator.py reports/pilot_report.json

      - name: Commit State Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(mesh): daemon auto-process execution"
          branch: main
