name: Mesh Daemon (Auto-Process, Optimize & Heal)

on:
  schedule:
    - cron: '0 */2 * * *' # Run every 2 hours
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  daemon-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-core.txt

      - name: Generate OIDC Identity Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('psivi.com');
            core.setOutput('token', token);

      - name: Ensure Directory Structure
        run: |
          mkdir -p data/instruction_queue data/processed_instructions reports/scientific_reports logs config

      - name: Execute Automation Loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python -m src.tools.auto_reporter

      - name: Execute Optimization & Self-Healing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          python -m src.agents.optimization_agent
          python -m src.agents.self_healing_agent

      - name: Execute Local Mesh Executor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/local_mesh_executor.py

      - name: Commit Daemon Artifacts (Sovereign Autonomic)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "PSIVI Mesh Daemon (WENDY Authorized)"
          git config user.email "daemon@psivi.com"
          
          # SOVEREIGN APPROACH: Stage ALL legitimate changes made by WENDY's organs
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: daemon processed instructions, optimized system, healed code [skip ci]"
            
            # Race-Condition Shield
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Successfully pushed daemon artifacts."
                break
              else
                echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
                sleep 2
              fi
            done
          else
            echo "ℹ️ No new daemon artifacts to commit."
          fi
