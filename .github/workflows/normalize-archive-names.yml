name: Normalize archive filenames

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # Daily at 3:17 AM UTC

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0 # CRITICAL: Required for safe rebasing

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Core dependencies for script execution, logging, and path manipulation
          pip install -r requirements-core.txt

      - name: Remove leading whitespace from archive filenames
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 scripts/fix_archive_names.py

      - name: Commit any changes (Race-Condition Proof)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Elegant early exit if there are no changes
          if git diff --quiet --exit-code; then
            echo "ℹ️ No archive filename changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          
          # [skip ci] prevents this push from triggering an infinite loop of workflows
          git commit -m "chore: normalize archive filenames [skip ci]"
          
          # THE RACE-CONDITION SHIELD:
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "✅ Successfully pushed archive filename normalizations."
              break
            else
              echo "⚠️ Concurrent push detected. Rebasing and retrying in 2s..."
              sleep 2
            fi
          done
