name: Normalize archive filenames

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove leading whitespace from archive filenames
        shell: bash
        run: |
          python3 scripts/fix_archive_names.py

      - name: Commit any changes
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "No archive filename changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize archive filenames"
          git push
