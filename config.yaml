# ============================================================================
# PSIVI OPEN SCIENCE MESH CONFIGURATION
# ============================================================================

metadata:
  project: "psivicom.github.io"
  version: "1.0.0"
  author: "Louis-Philippe Audette"
  license: "CC-BY-4.0"
  rfc1001_compliant: true
  created: "2026-09-20"

# ============================================================================
# AGENT CONFIGURATION
# ============================================================================

agents:
  forage:
    name: "forage_agent"
    layer: "INGESTION"
    capabilities:
      - fetch_weather
      - fetch_satellite
      - fetch_lidar
      - fetch_literature
    embedding:
      vocab_size: 32000
      embedding_dim: 4096
      dtype: "float16"
    
  satellite:
    name: "satellite_agent"
    layer: "INGESTION"
    data_sources:
      - name: "RADARSAT"
        endpoint: "https://api.radsat.ca"
        auth: "${RADSAT_API_KEY}"
      - name: "NASA_EARTH_DATA"
        endpoint: "https://api.earthdata.nasa.gov"
        auth: "${NASA_API_KEY}"
    
  lidar:
    name: "lidar_agent"
    layer: "INGESTION"
    point_cloud:
      max_points: 1000000
      voxel_size: 0.1
    
  literature:
    name: "literature_agent"
    layer: "INGESTION"
    sources:
      - "arxiv"
      - "semantic_scholar"
      - "crossref"
    
  critic:
    name: "critic_agent"
    layer: "VALIDATION"
    validation_rules:
      - check_tensor_integrity
      - check_receipt_chain
      - check_fair_compliance
    
  intelligence:
    name: "intelligence_agent"
    layer: "VALIDATION"
    memory_operations:
      - read_vector_mesh
      - read_pico_mesh
      - generate_report
    
  consolidator:
    name: "consolidator_agent"
    layer: "SYNTHESIS"
    aggregation_method: "weighted_average"
    
  synthesizer:
    name: "synthesizer_agent"
    layer: "SYNTHESIS"
    output_formats:
      - "json"
      - "markdown"
      - "pdf"
    
  license:
    name: "license_agent"
    layer: "GOVERNANCE"
    fair_stamping:
      license: "CC-BY-4.0"
      author: "Louis-Philippe Audette"
      project: "psivicom.github.io"
      findable: true
      accessible: true
      interoperable: true
      reusable: true

# ============================================================================
# ORCHESTRATION CONFIGURATION
# ============================================================================

orchestration:
  chain_orchestrator:
    dynamic_planning: true
    max_pipeline_depth: 10
    timeout_seconds: 3600
    
  agent_factory:
    auto_spawn: true
    llm_backend: "ollama"
    model: "codellama:7b-code"
    temperature: 0.2
    max_tokens: 2048
    
  mesh_router:
    routing_strategy: "content_aware"
    load_balancing: "round_robin"
    retry_attempts: 3
    
  mesh_governor:
    rfc1001_enforcement: true
    audit_level: "strict"
    verification_checks:
      - tensor_integrity
      - receipt_signature
      - fair_compliance
      - provenance_chain

# ============================================================================
# VECTOR MESH CONFIGURATION
# ============================================================================

vector_mesh:
  tiered_storage:
    vram_mesh:
      device: "cuda:0"
      max_capacity_gb: 16
      eviction_policy: "lru"
      
    pico_mesh:
      distributed: true
      replication_factor: 3
      consistency: "eventual"
      
    persistent_store:
      backend: "sqlite"
      path: "./data/vector_mesh.db"
      index_type: "hnsw"
      
    seed_mesh:
      immutable: true
      archive_path: "./data/seed_mesh/"
      compression: "zstd"
  
  pixelizer:
    shard_size: 128
    quantization: "int8"
    enable_compression: true
    
  provisioner:
    shard_dispatch_strategy: "round_robin"
    min_replicas: 2
    max_replicas: 10

# ============================================================================
# .psvc CONTAINER CONFIGURATION
# ============================================================================

psvc_containers:
  schema_version: "1.0"
  binary_format:
    header_prefix_length: 4  # bytes
    endianness: "big"
    compression: "none"
    
  verification:
    hash_algorithm: "sha256"
    signature_secret: "${PSVC_SIGNATURE_SECRET}"
    verify_on_receipt: true
    verify_on_dispatch: true
    
  fair_metadata:
    required_fields:
      - schema_version
      - content_type
      - fair_license
      - author
      - project
    default_license: "CC-BY-4.0"
    
  mathematical_state:
    track_vram_address: true
    track_flops: true
    track_tensor_shape: true
    track_dtype: true

# ============================================================================
# DISTRIBUTED MESH CONFIGURATION
# ============================================================================

distributed_mesh:
  mesh_brain:
    orchestration_backend: "pytorch"
    enable_gpu: true
    gpu_device: "cuda:0"
    
  pico_worker:
    worker_type: "compute_shard"
    max_concurrent_tasks: 4
    heartbeat_interval_seconds: 30
    
  volunteer_node:
    enable_volunteer_compute: true
    registration_endpoint: "https://mesh.psivicom.github.io/register"
    contribution_tracking: true
    
  volunteer_worker:
    validation_required: true
    receipt_verification: true
    reward_mechanism: "contribution_points"

# ============================================================================
# LLM / AUTOMATION CONFIGURATION
# ============================================================================

llm_automation:
  enabled: true
  backend: "ollama"
  
  ollama:
    host: "localhost"
    port: 11434
    model: "codellama:7b-code"
    timeout_seconds: 60
    
  code_generation:
    temperature: 0.1
    max_tokens: 2048
    validate_syntax: true
    require_seal_calls: true
    require_base_agent_inheritance: true
    
  capability_resolution:
    auto_resolve: true
    cache_generated_agents: true
    max_resolution_attempts: 3

# ============================================================================
# FAIR COMPLIANCE CONFIGURATION
# ============================================================================

fair_compliance:
  findable:
    persistent_identifiers: true
    rich_metadata: true
    searchable_index: true
    
  accessible:
    open_protocols: true
    authentication_optional: true
    metadata_always_accessible: true
    
  interoperable:
    standard_formats:
      - "json"
      - "parquet"
      - "numpy"
    vocabularies:
      - "schema.org"
      - "dc_terms"
      
  reusable:
    clear_license: true
    provenance_tracking: true
    domain_relevant: true

# ============================================================================
# RFC 1001 COMPLIANCE CONFIGURATION
# ============================================================================

rfc1001:
  enforcement_level: "strict"
  
  audit_requirements:
    - all_operations_sealed
    - provenance_chain_complete
    - fair_metadata_present
    - tensor_integrity_verified
    
  receipt_requirements:
    agent_id_required: true
    layer_required: true
    operation_required: true
    payload_hash_required: true
    timestamp_required: true
    parent_hash_optional: true
    
  violation_handling:
    on_tamper_detection: "reject_and_log"
    on_missing_receipt: "reject_and_log"
    on_fair_violation: "warn_and_stamp"
    log_path: "./logs/rfc1001_audit.log"

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================

security:
  container_signing:
    enabled: true
    algorithm: "sha256"
    secret_env_var: "PSVC_SIGNATURE_SECRET"
    
  mesh_authentication:
    enabled: true
    method: "mutual_tls"
    
  volunteer_verification:
    proof_of_work: true
    reputation_system: true
    minimum_reputation: 0

# ============================================================================
# LOGGING AND MONITORING
# ============================================================================

logging:
  level: "INFO"
  format: "json"
  outputs:
    - type: "file"
      path: "./logs/psivi.log"
    - type: "stdout"
      enabled: true
    
  audit_trail:
    enabled: true
    path: "./logs/audit_trail.jsonl"
    include_receipts: true
    include_hashes: true

monitoring:
  metrics_enabled: true
  prometheus_endpoint: "/metrics"
  metrics:
    - container_creation_rate
    - verification_failures
    - mesh_latency
    - vram_usage
    - agent_spawn_count

# ============================================================================
# STORAGE CONFIGURATION
# ============================================================================

storage:
  base_path: "./data"
  
  directories:
    psvc_containers: "./data/containers"
    vector_mesh: "./data/vectors"
    seed_mesh: "./data/seed"
    logs: "./logs"
    cache: "./cache"
    
  retention:
    containers_days: 90
    logs_days: 365
    cache_hours: 24

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================

performance:
  batch_processing:
    enabled: true
    batch_size: 32
    max_batch_bytes: 1048576  # 1MB
    
  caching:
    enabled: true
    backend: "redis"
    ttl_seconds: 3600
    
  parallelism:
    container_serialization_workers: 4
    verification_workers: 4
    mesh_dispatch_workers: 8

# ============================================================================
# TESTING CONFIGURATION
# ============================================================================

testing:
  unit_tests:
    enabled: true
    coverage_threshold: 80
    
  integration_tests:
    enabled: true
    test_pipeline: true
    
  tamper_detection_tests:
    enabled: true
    test_cases:
      - flip_tensor_byte
      - modify_receipt_hash
      - remove_fair_metadata
      - break_provenance_chain
