<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Solar Panels -->
  <rect x="20" y="40" width="25" height="20" rx="2" fill="#4A90E2" stroke="#333" stroke-width="2"/>
  <rect x="55" y="40" width="25" height="20" rx="2" fill="#4A90E2" stroke="#333" stroke-width="2"/>
  
  <!-- Panel Connectors -->
  <line x1="45" y1="50" x2="50" y2="50" stroke="#333" stroke-width="2"/>
  <line x1="55" y1="50" x2="60" y2="50" stroke="#333" stroke-width="2"/>
  
  <!-- Main Satellite Body -->
  <rect x="42" y="35" width="16" height="30" rx="4" fill="#D1D1D1" stroke="#333" stroke-width="2"/>
  
  <!-- Communication Dish -->
  <path d="M45 35 Q50 20 55 35" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="50" cy="28" r="3" fill="#BDBDBD" stroke="#333" stroke-width="1"/>
  
  <!-- Detail Lines on Panels -->
  <line x1="20" y1="46" x2="45" y2="46" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="54" x2="45" y2="54" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="55" y1="46" x2="80" y2="46" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="55" y1="54" x2="80" y2="54" stroke="#333" stroke-width="1" opacity="0.5"/>
</svg>
