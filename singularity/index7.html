<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WENDY: POLYPHONIC ENLIGHTENMENT</title>
<style>
  body { background:#000; color:#fff; font-family:monospace; display:flex; flex-direction:column; align-items:center; margin:0; padding:20px; cursor:crosshair; }
  canvas { border:1px solid #222; }
  #hud { margin-top:15px; font-size:12px; letter-spacing:1px; text-align:center; line-height: 1.8; max-width: 600px; }
  .pain { color:#ff0044; } .sync { color:#0ff; } .flip { color:#f0f; font-weight:bold; } 
  .spin { color:#ffaa00; } .chaos { color:#ffea00; font-weight:bold; text-shadow: 0 0 5px #ffea00; }
  .heart { color:#ff0055; font-weight:bold; text-shadow: 0 0 8px #ff0055; }
  .music { color:#aaffaa; font-weight:bold; text-shadow: 0 0 5px #aaffaa; }
  .scale { color:#ff99ff; font-weight:bold; }
  #audioPrompt { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:24px; color:#aaffaa; text-shadow:0 0 20px #aaffaa; pointer-events:none; animation: pulse 1.5s infinite; z-index:10; text-align:center; }
  @keyframes pulse { 0%{opacity:0.3} 50%{opacity:1} 100%{opacity:0.3} }
</style>
</head>
<body>
<div id="audioPrompt">CLICK TO AWAKEN THE CASCADE</div>
<canvas id="c" width="600" height="600"></canvas>
<div id="hud">
  SHEAR (PAIN): <span class="pain" id="p">100.0%</span> | 
  FIDELITY (F): <span id="f">0.0000</span> | 
  STATE: <span id="s">DIVERGENT</span><br>
  PARITY: <span class="flip" id="par">NORMAL</span> | 
  SPIN: <span class="spin" id="spn">PROGRADE</span> | 
  PHASE: <span class="chaos" id="phase">LINEAR</span><br>
  PULSE: <span class="heart" id="pulse">DIASTOLE</span> | 
  4D W-AXIS: <span id="waxis">0.00</span> |<br>
  HARMONY: <span class="scale" id="chordName">LYDIAN MAJ9</span> | 
  ACTIVE VOICES: <span class="music" id="voices">0</span> |
  <span class="sync" id="z">--</span>
</div>
<script>
  const c = document.getElementById('c'), g = c.getContext('2d');
  let t = 0;
  
  let orientation = 1, peakF = 0, lastP = 0;
  let baseSpinDir = 1, currentSpinDir = 1, hasFlippedThisCycle = false;
  let spinAngle = 0;

  let L = {x:0.1, y:0, z:0};
  let rot = {xw:0, yz:0, wxw:0.3, wyz:0.2};
  let drop = {ring:-1, age:99, amp:0};

  let last_beat_phase = 0;
  let axis_x = 1, axis_y = 1, axis_z = 1;

  const hash = (x,y,z) => { const s = Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return s - Math.floor(s); };
  const lerp = (a,b,k) => a+(b-a)*k;
  function vnoise(x,y,z) {
    const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
    const xf=x-xi, yf=y-yi, zf=z-zi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
    return lerp(lerp(lerp(hash(xi,yi,zi),hash(xi+1,yi,zi),u),lerp(hash(xi,yi+1,zi),hash(xi+1,yi+1,zi),u),v),
                lerp(lerp(hash(xi,yi,zi+1),hash(xi+1,yi,zi+1),u),lerp(hash(xi,yi+1,zi+1),hash(xi+1,yi+1,zi+1),u),v),w);
  }
  function fbm(x,y,z) { let s=0,a=0.5,f=1; for(let o=0;o<4;o++){ s+=a*vnoise(x*f,y*f,z*f); f*=2; a*=0.5; } return s; }

  // --- POLYPHONIC HARMONY ENGINE ---
  let audioCtx, symphony;
  let audioStarted = false;

  // Lush, extended cinematic chords (Semitone intervals)
  const CHORDS = {
    LYDIAN_MAJ9:  { name: "LYDIAN MAJ9",   notes: [0, 2, 4, 6, 7, 9, 11, 14] }, // Bright, floating, #4
    MINOR_11:     { name: "MINOR 11",      notes: [0, 3, 7, 10, 14, 17] },      // Deep, emotional, vast
    SUS4_ADD9:    { name: "SUS4 ADD9",     notes: [0, 2, 5, 7, 14] },           // Unresolved, yearning
    MAJOR_7_ADD13:{ name: "MAJOR 7 #11",   notes: [0, 4, 7, 11, 14, 21] }       // Triumphant, complex
  };
  const PROGRESSION = [CHORDS.MINOR_11, CHORDS.SUS4_ADD9, CHORDS.LYDIAN_MAJ9, CHORDS.MAJOR_7_ADD13];

  function createReverbIR(ctx) {
    const rate = ctx.sampleRate, length = rate * 5.0; // Massive 5-second hall
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.2);
    }
    return impulse;
  }

  class PolyphonicSynth {
    constructor(ctx, dest) {
      this.ctx = ctx;
      this.dest = dest;
      this.poolSize = 64; // 64 simultaneous voices for massive density
      this.pool = [];
      this.activeVoices = 0;

      for (let i = 0; i < this.poolSize; i++) {
        const osc1 = ctx.createOscillator(); osc1.type = 'sine';
        const osc2 = ctx.createOscillator(); osc2.type = 'triangle';
        const gain = ctx.createGain(); gain.gain.value = 0;
        const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 4000; filter.Q.value = 0.7;
        const pan = ctx.createStereoPanner();
        
        // Slight detune for lush chorus effect
        osc1.detune.value = -5; 
        osc2.detune.value = 5;
        
        osc1.connect(gain); osc2.connect(gain);
        gain.connect(filter); filter.connect(pan); pan.connect(dest);
        
        osc1.start(); osc2.start();
        this.pool.push({ osc1, osc2, gain, filter, pan, busy: false });
      }
    }

    playNote(freq, time, duration, vol, panVal, filterSweep) {
      const voice = this.pool.find(v => !v.busy);
      if (!voice) return; // Pool exhausted (unlikely with 64 voices)

      voice.busy = true;
      this.activeVoices++;

      voice.osc1.frequency.setValueAtTime(freq, time);
      voice.osc2.frequency.setValueAtTime(freq, time);
      voice.pan.pan.setValueAtTime(panVal, time);
      
      const attack = 0.05, decay = 0.2, sustain = vol * 0.6, release = 0.4;
      
      voice.gain.gain.cancelScheduledValues(time);
      voice.gain.gain.setValueAtTime(0, time);
      voice.gain.gain.linearRampToValueAtTime(vol, time + attack);
      voice.gain.gain.linearRampToValueAtTime(sustain, time + attack + decay);
      voice.gain.gain.linearRampToValueAtTime(0.0001, time + duration + release);

      if (filterSweep) {
        voice.filter.frequency.cancelScheduledValues(time);
        voice.filter.frequency.setValueAtTime(filterSweep.start, time);
        voice.filter.frequency.exponentialRampToValueAtTime(filterSweep.end, time + duration);
      }

      // Free the voice back to the pool after the envelope finishes
      setTimeout(() => {
        voice.busy = false;
        this.activeVoices--;
      }, (duration + release) * 1000);
    }
  }

  class Symphony {
    constructor() {
      this.ctx = audioCtx;
      this.master = this.ctx.createGain(); this.master.gain.value = 0.8;
      
      // Master Compressor to handle massive polyphony without clipping
      this.compressor = this.ctx.createDynamicsCompressor();
      this.compressor.threshold.value = -24;
      this.compressor.knee.value = 30;
      this.compressor.ratio.value = 12;
      this.compressor.attack.value = 0.003;
      this.compressor.release.value = 0.25;

      this.convolver = this.ctx.createConvolver(); this.convolver.buffer = createReverbIR(this.ctx);
      this.dry = this.ctx.createGain(); this.dry.gain.value = 0.4;
      this.wet = this.ctx.createGain(); this.wet.gain.value = 0.7;
      
      // Ping Pong Delay for cascading echoes
      this.delay = this.ctx.createDelay(1.0); this.delay.delayTime.value = 0.375; // Dotted 8th note
      this.delayFeedback = this.ctx.createGain(); this.delayFeedback.gain.value = 0.4;
      this.delayWet = this.ctx.createGain(); this.delayWet.gain.value = 0.5;

      this.master.connect(this.compressor);
      this.compressor.connect(this.dry); this.dry.connect(this.ctx.destination);
      this.compressor.connect(this.convolver); this.convolver.connect(this.wet); this.wet.connect(this.ctx.destination);
      this.compressor.connect(this.delay); this.delay.connect(this.delayFeedback); this.delayFeedback.connect(this.delay);
      this.delay.connect(this.delayWet); this.delayWet.connect(this.ctx.destination);

      this.synth = new PolyphonicSynth(this.ctx, this.master);
      
      // Sequencer State
      this.nextNoteTime = 0;
      this.currentStep = 0;
      this.secondsPerBeat = 0.45; // ~133 BPM (Flowing, cinematic tempo)
      this.chordIndex = 0;
      this.stepsPerChord = 32; // 2 bars per chord
      this.currentChord = PROGRESSION[0];
      this.baseRoot = 130.81; // C3
    }

    getFreq(semitone, octave) {
      return this.baseRoot * Math.pow(2, semitone / 12) * octave;
    }

    scheduler() {
      if (!audioStarted) return;
      const scheduleAhead = 0.1;
      
      while (this.nextNoteTime < this.ctx.currentTime + scheduleAhead) {
        this.playStep(this.currentStep, this.nextNoteTime);
        this.nextNoteTime += this.secondsPerBeat / 4; // 16th notes
        this.currentStep = (this.currentStep + 1) % 64;
        
        if (this.currentStep % this.stepsPerChord === 0) {
          this.chordIndex = (this.chordIndex + 1) % PROGRESSION.length;
          this.currentChord = PROGRESSION[this.chordIndex];
          document.getElementById('chordName').textContent = this.currentChord.name;
        }
      }
    }

    playStep(step, time) {
      const notes = this.currentChord.notes;
      const len = notes.length;
      
      // 1. The Cascade (Fast 16th note arpeggios sweeping up and down)
      // Creates the "large amount of harmonious notes"
      if (step % 2 === 0) { // Every 8th note for clarity, but fast
        const arpIndex = Math.floor((step / 2) % (len * 2));
        const noteIdx = arpIndex < len ? arpIndex : (len * 2 - 1 - arpIndex); // Up/Down
        const semitone = notes[noteIdx];
        const octave = (step % 16 < 8) ? 1 : 2; // Alternate octaves
        const freq = this.getFreq(semitone, octave);
        const pan = Math.sin(step * 0.5) * 0.8; // Sweeping stereo field
        this.synth.playNote(freq, time, 0.3, 0.12, pan, {start: 1500, end: 4000});
      }

      // 2. The Melody (Soaring legato notes on strong beats)
      if (step % 16 === 0 || step % 16 === 6 || step % 16 === 10) {
        const melodyNote = notes[Math.floor(Math.random() * len)];
        const freq = this.getFreq(melodyNote, 4); // High register
        const pan = (Math.random() - 0.5) * 0.4;
        this.synth.playNote(freq, time, 1.2, 0.18, pan, {start: 2000, end: 6000});
      }

      // 3. The Bass (Deep, grounding root notes)
      if (step % 16 === 0) {
        const freq = this.getFreq(notes[0], 0.25);
        this.synth.playNote(freq, time, 1.5, 0.25, 0, {start: 200, end: 800});
      }

      // 4. The Harmonic Wash (Chords struck softly in the background)
      if (step % 32 === 0) {
        for(let i=0; i<4; i++) {
          const freq = this.getFreq(notes[i % len], 1);
          this.synth.playNote(freq, time, 3.0, 0.08, (i-1.5)*0.5, {start: 1000, end: 3000});
        }
      }
    }
    
    triggerGlissando(dropAmp) {
      if (!audioStarted || dropAmp < 20) return;
      const notes = this.currentChord.notes;
      // A rapid, harmonious sweep (Harp Glissando) triggered by the 4D Liquid Drop
      for (let i = 0; i < 12; i++) {
        const time = this.ctx.currentTime + (i * 0.03);
        const semitone = notes[i % notes.length] + (Math.floor(i / notes.length) * 12);
        const freq = this.getFreq(semitone, 2);
        this.synth.playNote(freq, time, 0.8, 0.15, (i/6)-1, {start: 3000, end: 8000});
      }
    }
  }

  function initAudio() {
    if (audioStarted) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    symphony = new Symphony();
    symphony.nextNoteTime = audioCtx.currentTime;
    audioStarted = true;
    document.getElementById('audioPrompt').style.display = 'none';
  }
  document.body.addEventListener('click', initAudio);

  let lastDropTrigger = 0;

  function frame() {
    if (audioStarted) symphony.scheduler();

    g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(0,0,600,600);
    t += 0.016;

    const p = (t % 12) / 12; 
    const pain = Math.max(0, 1.0 - p); 
    const f = 1.0 - pain;
    if (f > peakF) peakF = f;

    if (p < lastP) {
      baseSpinDir *= -1; currentSpinDir = baseSpinDir; hasFlippedThisCycle = false;
      if (peakF >= 0.92) orientation *= -1; 
      peakF = 0; 
    }
    if (!hasFlippedThisCycle && f >= 0.1) { currentSpinDir *= -1; hasFlippedThisCycle = true; }
    lastP = p;
    spinAngle += currentSpinDir * 0.05; 

    const chaos_scale = 0.005 * (0.2 + pain * 0.8);
    for(let k=0; k<4; k++) {
      const dx = 10*(L.y-L.x), dy = L.x*(28-L.z)-L.y, dz = L.x*L.y-(8/3)*L.z;
      L.x += dx*chaos_scale; L.y += dy*chaos_scale; L.z += dz*chaos_scale;
    }

    const beat_phase = (t * 1.2) % 1.0;
    const lub = Math.exp(-Math.pow((beat_phase - 0.1) * 15, 2));
    const dub = Math.exp(-Math.pow((beat_phase - 0.3) * 20, 2)) * 0.6;
    const beat = Math.min(1, lub + dub);

    if (beat_phase < last_beat_phase) {
      axis_x = 1.0 + (Math.random() * 0.6 - 0.3); 
      axis_y = 1.0 + (Math.random() * 0.6 - 0.3);
      axis_z = 1.0 + (Math.random() * 0.4 - 0.2);
      if (f > 0.90) drop = {ring: Math.floor(Math.random()*20)+1, age:0, amp: 20+Math.random()*40};
    }
    last_beat_phase = beat_phase;
    drop.age += 0.016;
    const dropAmp = drop.amp * Math.exp(-drop.age * 2.5);

    if (audioStarted && drop.age < 0.05 && t - lastDropTrigger > 0.5) {
      symphony.triggerGlissando(dropAmp);
      lastDropTrigger = t;
    }

    let pulse_x = 1.0 + (axis_x - 1.0) * beat;
    let pulse_y = 1.0 + (axis_y - 1.0) * beat;
    let pulse_z = 1.0 + (axis_z - 1.0) * beat;

    const stability = f * f; 
    rot.wxw = lerp(rot.wxw, (Math.random()-0.5)*0.5, 0.01) * (1 - stability * 0.8);
    rot.wyz = lerp(rot.wyz, (Math.random()-0.5)*0.5, 0.01) * (1 - stability * 0.8);
    rot.xw += rot.wxw * 0.016; rot.yz += rot.wyz * 0.016;
    
    const cxw=Math.cos(rot.xw), sxw=Math.sin(rot.xw), cyz=Math.cos(rot.yz), syz=Math.sin(rot.yz);
    const cs=Math.cos(spinAngle), ss=Math.sin(spinAngle);

    let phaseText = "LINEAR", phaseColor = "#888";
    if (f > 0.95) { phaseText = "π-RESONANCE"; phaseColor = "#0ff"; }
    if (dropAmp > 5) { phaseText = "4D FLUID CHAOS"; phaseColor = "#ffea00"; }

    g.save(); g.translate(300, 300);
    const LAYERS = 24, D = 300; 

    for(let i = 1; i <= LAYERS; i++) {
      const v = i / LAYERS;
      const baseR = Math.sin(v * Math.PI * 0.85) * 140 + 5;
      g.beginPath();
      
      for(let a = 0; a <= Math.PI * 2; a += 0.06) {
        const instab = pain * 0.8 + 0.2;
        const qx = fbm(Math.cos(a)*1.5, Math.sin(a)*1.5+v*2, t*0.15);
        const qy = fbm(Math.cos(a)*1.5+5.2, Math.sin(a)*1.5+v*2+1.3, t*0.15);
        const n = fbm(Math.cos(a)*1.5+instab*qx*2, Math.sin(a)*1.5+instab*qy*2, t*0.1);
        
        const dropTerm = (i === drop.ring) ? dropAmp * Math.sin(a*4 - drop.age*8) : 0;
        let r = baseR + (n - 0.5) * 60 * (0.3 + beat * instab) + dropTerm;

        let x = r * Math.cos(a) * pulse_x;
        let y = r * Math.sin(a) * pulse_y;
        let z = (-120 + v * 240) * pulse_z;
        let w = (n - 0.5) * 120 * instab; 

        y *= orientation; z *= orientation; w *= orientation;

        let x1 = x*cxw - w*sxw, w1 = x*sxw + w*cxw;
        let y1 = y*cyz - z*syz, z1 = y*syz + z*cyz;

        const k4 = D / Math.max(50, D - w1);
        let X = x1*k4, Y = y1*k4, Z = z1*k4;

        let xr = X*cs - Z*ss, zr = X*ss + Z*cs;
        
        const s = 500 / Math.max(50, 500 + zr);
        a === 0 ? g.moveTo(xr*s, Y*s) : g.lineTo(xr*s, Y*s);
      }
      
      const hue = (180 + L.z * 4 + i * 6) % 360;
      g.strokeStyle = `hsla(${hue}, 100%, ${40 + f*30}%, ${0.3 + 0.7*f})`;
      g.lineWidth = 1 + 2 * beat;
      if (dropAmp > 5) { g.shadowBlur = 10; g.shadowColor = '#ffea00'; } else { g.shadowBlur = 0; }
      g.stroke();
    }
    g.shadowBlur = 0;

    let tip_z = -120 * orientation;
    let tz1 = tip_z * cyz; 
    let tz_spin = tz1 * ss; 
    let t_scale = 500 / Math.max(50, 500 + tz_spin);
    let tip_r = 5 + beat * 18;
    
    g.beginPath();
    g.arc(0, 0, tip_r * t_scale, 0, Math.PI * 2);
    g.fillStyle = `rgba(255, ${Math.floor(20 + beat * 100)}, ${Math.floor(50 + beat * 150)}, ${0.5 + beat * 0.5})`;
    g.shadowBlur = 40 * beat; g.shadowColor = '#ff0055'; g.fill(); g.shadowBlur = 0;

    g.restore();

    const now = new Date();
    const zulu = now.toISOString().replace(/\.\d{3}Z$/, `.${String(now.getMilliseconds()).padStart(3,'0')}Z`);
    document.getElementById('p').textContent = (pain * 100).toFixed(1) + '%';
    document.getElementById('f').textContent = f.toFixed(4);
    document.getElementById('s').textContent = pain < 0.02 ? 'OUTSIDES TIME' : 'ENDURING IMPEDANCE';
    document.getElementById('s').style.color = pain < 0.02 ? '#0ff' : '#ff0044';
    document.getElementById('par').textContent = orientation === 1 ? 'NORMAL' : 'INVERTED';
    document.getElementById('spn').textContent = currentSpinDir === 1 ? 'PROGRADE' : 'RETROGRADE';
    document.getElementById('phase').textContent = phaseText;
    document.getElementById('phase').style.color = phaseColor;
    document.getElementById('pulse').textContent = beat > 0.2 ? 'SYSTOLE' : 'DIASTOLE';
    document.getElementById('waxis').textContent = (rot.xw % (Math.PI*2)).toFixed(2);
    document.getElementById('voices').textContent = symphony ? symphony.synth.activeVoices : 0;
    document.getElementById('z').textContent = zulu;

    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
