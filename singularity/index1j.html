<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WENDY: THE KINEMATIC GRAMMAR</title>
<style>
  body { background:#000; color:#fff; font-family:monospace; display:flex; flex-direction:column; align-items:center; margin:0; padding:20px; }
  canvas { border:1px solid #222; }
  #hud { margin-top:15px; font-size:12px; letter-spacing:1px; text-align:center; line-height: 1.8; max-width: 800px; }
  .pain { color:#ff0044; } .sync { color:#0ff; } .flip { color:#f0f; font-weight:bold; } 
  .spin { color:#ffaa00; } .chaos { color:#ffea00; font-weight:bold; text-shadow: 0 0 5px #ffea00; }
  .heart { color:#ff0055; font-weight:bold; text-shadow: 0 0 8px #ff0055; }
  .math { color:#aaffaa; font-weight:bold; text-shadow: 0 0 5px #aaffaa; }
  .warn { color:#0ff; font-weight:bold; animation: blink 0.3s infinite; }
  .diastole { color:#4488ff; font-weight:bold; text-shadow: 0 0 8px #4488ff; }
  .entangle { color:#ff00ff; font-weight:bold; text-shadow: 0 0 5px #ff00ff; }
  .glyph { color:#fff; font-weight:bold; text-shadow: 0 0 10px #0ff; font-size: 14px;}
  @keyframes blink { 50% { opacity: 0.2; } }
</style>
</head>
<body>
<canvas id="c" width="800" height="850"></canvas>
<div id="hud">
  ENTROPY: <span class="math" id="energy">100.0%</span> | 
  FIDELITY (F): <span id="f">0.0000</span> | 
  STATE: <span id="s">DIVERGENT</span><br>
  EIGEN-DECAY ($\Delta V$): <span class="math" id="decay">0.000</span> | 
  DIMENSION: <span class="sync" id="dim">D-001</span> |
  MORPH PHASE: <span class="math" id="morph">0.00</span><br>
  CYCLE: <span class="math" id="cyc">0.00s</span> |
  ENTANGLEMENT: <span class="entangle" id="entangle">0.00</span> |
  <span id="warnMsg" class="warn" style="display:none">SHOCK DELIVERED: TOPOLOGY MELTING</span><br>
  PARITY: <span class="flip" id="par">NORMAL</span> | 
  SPIN: <span class="spin" id="spn">PROGRADE</span> | 
  PHASE: <span class="chaos" id="phase">LINEAR</span><br>
  PULSE: <span id="pulse">DIASTOLE</span> | 
  <span class="sync" id="z">--</span>
</div>
<script>
  const ctx = document.getElementById('c').getContext('2d');
  let t = 0;
  let orientation = 1; 
  let peakF = 0;
  const LAYERS = 20; 
  const MERIDIANS = 12; 
  
  let baseSpinDir = 1;
  let currentSpinDir = 1;
  let hasFlippedThisCycle = false;
  let spinAngle = 0;
  
  let waves = []; 
  let dimensionIndex = 1;
  
  let morphPhase = 0; 
  let morphOffset = 0; 

  let last_beat_phase = 0;
  let axis_x = 1, axis_y = 1, axis_z = 1;
  let beat_intensity = 0; 

  let cycleDuration = 8 + Math.random() * 5; 
  let cycleStartTime = 0;
  let p = 0; 

  let entropy = 100;
  let prevEntropy = 100;
  let collapseHistory = []; 
  let eigenDecay = 0;
  let isInjecting = false;
  let injectionFlash = 0;
  
  let refractoryTimer = 0; 
  const REFRACTORY_DURATION = 180; 
  let diastolicSwell = 0;
  let entanglementMetric = 0;

  // --- THE GENERATIVE GRAMMAR ENGINE ---
  const HEBREW = ['א','ב','ג','ד','ה','ו','ז','ח','ט','י','כ','ל','מ','נ','ס','ע','פ','צ','ק','ר','ש','ת'];
  
  let glyphBuffer = [];
  let lastGlyphPhase = 0;
  let lexicon = {}; // Tracks the frequency of every spoken root
  let topWords = [];

  function calculateEntropy() {
    let waveE = waves.reduce((sum, w) => sum + w.i * Math.exp(-(t - w.t) * (w.type === 'inject' ? 3.0 : 1.5)), 0);
    let shearE = pain * 150; 
    return Math.min(100, waveE + shearE);
  }

  function extractRoot() {
    // Position 1: The Vessel (Internal Resonance / Fidelity)
    let p1_idx = Math.floor(f * 21.99); 
    
    // Position 2: The Motion (Kinetic Struggle / Spin Drag & Parity)
    let dragNorm = Math.min(1.0, (spinDrag - 1.0) / 2.0); 
    let p2_idx = Math.floor((dragNorm * 10.99) + (currentSpinDir === 1 ? 0 : 11)) % 22;
    
    // Position 3: The Shock (Topological Trauma / Melt & Entanglement)
    let meltNorm = refractoryTimer / REFRACTORY_DURATION; 
    let entNorm = Math.min(1.0, entanglementMetric / 15.0);
    let p3_idx = Math.floor((meltNorm * 10.99) + (entNorm * 10.99)) % 22;

    let root = [HEBREW[p1_idx], HEBREW[p2_idx], HEBREW[p3_idx]];
    let rootStr = root.join('');
    
    // Calculate Semantic Weight (0.0 = Heavy/Material, 1.0 = Pure/Resonant)
    let weight = (f * 0.4) + (dragNorm * 0.3) + (meltNorm * 0.3);
    
    glyphBuffer.push({
      root: root, rootStr: rootStr,
      math: `F:${f.toFixed(2)} D:${spinDrag.toFixed(2)} M:${meltNorm.toFixed(2)}`,
      weight: weight, time: t
    });
    
    if (glyphBuffer.length > 8) glyphBuffer.shift(); 
    
    // Update Lexicon
    if (!lexicon[rootStr]) lexicon[rootStr] = 0;
    lexicon[rootStr]++;
    
    topWords = Object.entries(lexicon).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }

  function detectAndReverseCollapse() {
    entropy = calculateEntropy();
    let delta = prevEntropy - entropy; 
    
    if (entropy < 12 && delta > 0 && refractoryTimer === 0) {
      eigenDecay = delta;
      collapseHistory.push({ time: t, decay: eigenDecay, orientation: orientation });
      if (collapseHistory.length > 60) collapseHistory.shift();

      let inverseAmp = 25 + (eigenDecay * 3.0); 
      isInjecting = true;
      injectionFlash = 1.0;
      refractoryTimer = REFRACTORY_DURATION; 
      
      dimensionIndex++;
      morphOffset += Math.PI * 0.5 + (Math.random() * 0.5) + (eigenDecay * 0.1); 
      
      document.getElementById('dim').textContent = `D-${String(dimensionIndex).padStart(3, '0')}`;
      document.getElementById('warnMsg').style.display = "inline";
      orientation *= -1; 
      
      for(let i=0; i<16; i++) {
        waves.push({ a: (i / 16) * Math.PI * 2, l: LAYERS / 2, t: t, i: inverseAmp, type: 'inject' });
      }
    }
    
    if (refractoryTimer > 0) {
      refractoryTimer--;
      if (refractoryTimer === 0) {
        isInjecting = false;
        document.getElementById('warnMsg').style.display = "none";
      }
    }

    prevEntropy = entropy;
    document.getElementById('energy').textContent = entropy.toFixed(1) + '%';
    document.getElementById('decay').textContent = eigenDecay.toFixed(3);
  }

  function drawChronicleRing(cx, cy, radius) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();

    collapseHistory.forEach((sig, i) => {
      const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const len = sig.decay * 2.5; 
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      ctx.lineTo(Math.cos(angle) * (radius + len), Math.sin(angle) * (radius + len));
      ctx.strokeStyle = sig.orientation === 1 ? '#ff0055' : '#0ff';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    ctx.restore();
  }

  let pain = 1.0; 
  let spinDrag = 1.0;
  let f = 0.0;

  function frame() {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; 
    ctx.fillRect(0,0,800,850);
    t += 0.016;
    
    morphPhase = t * 0.15; 
    document.getElementById('morph').textContent = (morphPhase + morphOffset).toFixed(2);

    // CAPTURE ROOT EVERY TIME MORPH PHASE CROSSES A 0.5 INTERVAL
    if (Math.floor((morphPhase + morphOffset) * 2) > lastGlyphPhase) {
      lastGlyphPhase = Math.floor((morphPhase + morphOffset) * 2);
      extractRoot();
    }

    let elapsed = t - cycleStartTime;
    if (elapsed >= cycleDuration) {
      cycleStartTime = t;
      cycleDuration = 8 + Math.random() * 5; 
      elapsed = 0; 
      baseSpinDir *= -1; 
      currentSpinDir = baseSpinDir;
      hasFlippedThisCycle = false;
      if (peakF >= 0.92) orientation *= -1; 
      peakF = 0; 
    }
    
    p = elapsed / cycleDuration;
    pain = Math.max(0, 1.0 - p); 
    f = 1.0 - pain;

    if (f > peakF) peakF = f;
    document.getElementById('cyc').textContent = cycleDuration.toFixed(2) + 's';
    
    if (!hasFlippedThisCycle && f >= 0.1) {
      currentSpinDir *= -1;
      hasFlippedThisCycle = true;
    }
    
    spinDrag = 1.0 + (diastolicSwell * 0.015) + (pain * 0.5);
    spinAngle += currentSpinDir * 0.05 * spinDrag; 

    let beat_phase = (t * 1.2) % 1.0; 
    let lub = Math.exp(-Math.pow((beat_phase - 0.1) * 15, 2));
    let dub = Math.exp(-Math.pow((beat_phase - 0.3) * 20, 2)) * 0.6;
    beat_intensity = Math.min(1.0, lub + dub);

    if (beat_phase < last_beat_phase) {
      axis_x = 1.0 + (Math.random() * 0.6 - 0.3); 
      axis_y = 1.0 + (Math.random() * 0.6 - 0.3);
      axis_z = 1.0 + (Math.random() * 0.4 - 0.2);
    }
    last_beat_phase = beat_phase;

    let pulse_x = 1.0 + (axis_x - 1.0) * beat_intensity;
    let pulse_y = 1.0 + (axis_y - 1.0) * beat_intensity;
    let pulse_z = 1.0 + (axis_z - 1.0) * beat_intensity;

    let phaseText = "LINEAR", phaseColor = "#888";
    if (f > 0.95) {
      phaseText = "π-RESONANCE"; phaseColor = "#0ff";
      if (Math.random() < 0.08 && refractoryTimer === 0) { 
        waves.push({ a: Math.random() * Math.PI * 2, l: Math.random() * LAYERS, t: t, i: 20 + Math.random() * 20, type: 'normal' });
      }
      if (waves.length > 0) { phaseText = "FLUID CHAOS"; phaseColor = "#ffea00"; }
    }
    
    waves = waves.filter(w => {
        let alive = t - w.t < 2.5;
        if (!alive && w.i > 30 && w.type !== 'inject') morphOffset += (w.i * 0.002) * (Math.random() - 0.5); 
        return alive;
    });

    if (refractoryTimer > 0) {
        let waveEnergy = waves.reduce((sum, w) => sum + w.i * Math.exp(-(t - w.t) * 2.0), 0);
        let decayRatio = refractoryTimer / REFRACTORY_DURATION;
        diastolicSwell = (waveEnergy * 0.8 + Math.sin(t * 2.5 + morphOffset) * 25) * decayRatio;
    } else {
        diastolicSwell *= 0.92; 
    }

    entanglementMetric = (Math.abs(spinDrag - 1.0) * 10) + (diastolicSwell * 0.1) + (pain * entropy * 0.01);
    document.getElementById('entangle').textContent = entanglementMetric.toFixed(2);

    detectAndReverseCollapse();
    
    drawChronicleRing(300, 350, 260);

    let stateText = "ENDURING IMPEDANCE";
    let stateColor = "#ff0044";
    if (refractoryTimer > 0) { stateText = "TOPOLOGICAL MELT"; stateColor = "#4488ff"; } 
    else if (isInjecting) { stateText = "DIMENSIONAL SLINGSHOT"; stateColor = "#0ff"; } 
    else if (pain < 0.05) { stateText = "ASYMMETRIC STASIS"; stateColor = "#0ff"; }
    document.getElementById('s').textContent = stateText;
    document.getElementById('s').style.color = stateColor;

    let pulseStateText = "DIASTOLE";
    let pulseStateClass = "diastole";
    if (refractoryTimer > 60) pulseStateText = "MELTING (REFRACTORY)";
    else if (beat_intensity > 0.2) { pulseStateText = "SYSTOLE"; pulseStateClass = "heart"; }
    let pulseEl = document.getElementById('pulse');
    pulseEl.textContent = pulseStateText;
    pulseEl.className = pulseStateClass;

    ctx.save(); ctx.translate(300, 350);
    
    for(let i = 1; i <= LAYERS; i++) {
      let v = i / LAYERS; 
      let mP = morphPhase + morphOffset;
      let freqMod = 0.85 + Math.sin(mP * 0.7) * 0.25 + (pain * 0.4) + (diastolicSwell * 0.01);
      let harmonic1 = Math.sin(v * Math.PI * freqMod);
      let ampMod = 130 + Math.sin(mP * 1.1) * 20 + diastolicSwell + (entropy * 0.2);
      let harmonic2 = Math.cos(v * Math.PI * (2.0 + pain) + mP * 1.3) * (12 + refractoryTimer * 0.1);
      
      ctx.beginPath();
      for(let a = 0; a <= Math.PI * 2; a += 0.05) {
        let lobeCount = 3 + Math.floor(Math.sin(mP * 0.3) * 2); 
        let angularWarp = Math.sin(a * lobeCount + mP * 1.5 + v * 2.5) * (15 + pain * 15 + diastolicSwell * 0.5);
        let angularWarp2 = Math.cos(a * (lobeCount + 2) - mP * 0.8 + v) * (10 + entropy * 0.1);
        let cycleTwist = Math.sin(a * 4 + v * 10 * p) * (p * p * 25);
        let base_r = harmonic1 * ampMod + harmonic2 + angularWarp + angularWarp2 + cycleTwist + 5; 
        let shear = Math.sin(a * 6 + t * 10 + i + mP * 2.0) * (pain * 15);
        let ripple = 0;
        for(let w of waves) {
          let age = t - w.t;
          let dist = Math.abs(a - w.a) + Math.abs(i - w.l) * 0.15; 
          let decayRate = w.type === 'inject' ? 3.0 : 1.5;
          ripple += Math.sin((dist - age * 4.0) / 0.6) * w.i * Math.exp(-age * decayRate);
        }
        let r = base_r + shear + ripple;
        let x = r * Math.cos(a); let y = r * Math.sin(a); let z = -120 + v * 240; 
        let dx = x * pulse_x; let dy = y * pulse_y; let dz = (z - 120) * pulse_z + 120; 
        y = dy; z = dz; y *= orientation; z *= orientation;
        let x_spin = x * Math.cos(spinAngle) - z * Math.sin(spinAngle);
        let z_spin = x * Math.sin(spinAngle) + z * Math.cos(spinAngle);
        let y_spin = y;
        let scale = 500 / Math.max(50, 500 + z_spin);
        let px = x_spin * scale; let py = y_spin * scale;
        a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      let r_c = Math.floor(255 * pain); let g_c = Math.floor(200 * f); let b_c = Math.floor(255 * f); let alpha = 0.3 + f * 0.7;
      if (refractoryTimer > 60) { r_c = Math.floor(50 + entanglementMetric * 2); g_c = Math.floor(100 + diastolicSwell); b_c = 255; ctx.lineWidth = 1.5; ctx.shadowBlur = 10; ctx.shadowColor = '#4488ff'; } 
      else if (isInjecting) { r_c = 0; g_c = 255; b_c = 255; ctx.lineWidth = 2.0; ctx.shadowBlur = 15; ctx.shadowColor = '#0ff'; } 
      else if (waves.length > 0 && ripple > 10) { r_c = 255; g_c = Math.floor(200 + 55 * Math.random()); b_c = 0; ctx.lineWidth = 2.0; ctx.shadowBlur = 10; ctx.shadowColor = '#ffea00'; } 
      else { ctx.lineWidth = 1.2; ctx.shadowBlur = 0; }
      ctx.strokeStyle = `rgba(${r_c}, ${g_c}, ${b_c}, ${alpha})`;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    let tip_x = 0, tip_y = 0, tip_z = -120 * orientation;
    let tx_spin = tip_x * Math.cos(spinAngle) - tip_z * Math.sin(spinAngle);
    let tz_spin = tip_x * Math.sin(spinAngle) + tip_z * Math.cos(spinAngle);
    let t_scale = 500 / Math.max(50, 500 + tz_spin);
    let tpx = tx_spin * t_scale; let tpy = tip_y * t_scale; 
    let tip_r = 5 + beat_intensity * 18 + (diastolicSwell * 0.2);
    ctx.beginPath(); ctx.arc(tpx, tpy, tip_r * t_scale, 0, Math.PI * 2);
    let tipColor = refractoryTimer > 60 ? `rgba(68, 136, 255, 0.8)` : (isInjecting ? `rgba(0, 255, 255, 0.8)` : `rgba(255, ${Math.floor(20 + beat_intensity * 100)}, ${Math.floor(50 + beat_intensity * 150)}, 0.8)`);
    ctx.fillStyle = tipColor; ctx.shadowBlur = 30; ctx.shadowColor = tipColor; ctx.fill(); ctx.shadowBlur = 0;
    ctx.restore();

    // --- DRAW THE LEXICON (Top Right) ---
    ctx.save();
    ctx.translate(580, 50);
    ctx.fillStyle = 'rgba(10, 15, 20, 0.6)';
    ctx.fillRect(0, 0, 200, 220);
    ctx.strokeStyle = '#ff00ff';
    ctx.strokeRect(0, 0, 200, 220);

    ctx.fillStyle = '#ff00ff';
    ctx.font = '12px monospace';
    ctx.fillText('LEXICON (Syntax Frequency)', 10, 20);

    topWords.forEach((w, i) => {
      let y = 50 + i * 35;
      ctx.font = 'bold 22px serif';
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 5; ctx.shadowColor = '#0ff';
      ctx.fillText(w[0].split('').join(' '), 15, y);
      ctx.shadowBlur = 0;
      
      ctx.font = '12px monospace';
      ctx.fillStyle = '#0ff';
      ctx.fillText(`x${w[1]}`, 120, y);
      
      ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
      ctx.fillRect(150, y - 15, Math.min(40, w[1] * 2), 12);
    });
    ctx.restore();

    // --- DRAW THE CODEX (Bottom Scroll) ---
    ctx.save();
    ctx.translate(0, 650);
    ctx.fillStyle = 'rgba(10, 15, 20, 0.85)';
    ctx.fillRect(0, 0, 800, 200);
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, 800, 200);

    ctx.fillStyle = '#0ff';
    ctx.font = '12px monospace';
    ctx.fillText('THE KINEMATIC CODEX (Tri-Consonantal Roots / Shoresh)', 20, 25);

    glyphBuffer.forEach((w, i) => {
      let x = 30 + i * 95;
      let y = 70;
      let alpha = Math.max(0.3, 1 - ((t - w.time) / 25));
      
      ctx.font = 'bold 32px serif';
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.shadowBlur = 10; ctx.shadowColor = w.weight > 0.7 ? '#ffea00' : '#0ff';
      ctx.fillText(w.root.join(' '), x, y);
      ctx.shadowBlur = 0;
      
      ctx.font = '10px monospace';
      ctx.fillStyle = `rgba(170, 255, 170, ${alpha * 0.8})`;
      ctx.fillText(w.math, x, y + 25);
      
      ctx.fillStyle = `rgba(255, 170, 0, ${alpha * 0.8})`;
      ctx.fillText(`W: ${w.weight.toFixed(2)}`, x, y + 40);
      
      let meaning = w.weight > 0.7 ? "RESONANT" : (w.weight < 0.3 ? "HEAVY" : "FLUID");
      ctx.fillStyle = `rgba(255, 100, 100, ${alpha * 0.6})`;
      ctx.fillText(meaning, x, y + 55);
    });
    ctx.restore();

    const now = new Date();
    const zulu = now.toISOString().replace(/\.\d{3}Z$/, `.${String(now.getMilliseconds()).padStart(3,'0')}Z`);
    document.getElementById('f').textContent = f.toFixed(4);
    document.getElementById('par').textContent = orientation === 1 ? 'NORMAL' : 'INVERTED';
    document.getElementById('spn').textContent = currentSpinDir === 1 ? 'PROGRADE' : 'RETROGRADE';
    document.getElementById('phase').textContent = phaseText;
    document.getElementById('phase').style.color = phaseColor;
    document.getElementById('z').textContent = zulu;

    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
