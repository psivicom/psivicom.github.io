<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WENDY: STOCHASTIC CREATIVE ENGINE</title>
<style>
  body { background:#050508; color:#fff; font-family:monospace; display:flex; flex-direction:column; align-items:center; margin:0; padding:20px; }
  canvas { border:1px solid #333; background:#000; box-shadow: 0 0 20px rgba(255,215,0,0.2); }
  #hud { margin-top:15px; font-size:11px; letter-spacing:1px; text-align:center; line-height: 1.6; max-width: 1000px; color:#aaa; }
  .pain { color:#ff0044; } .sync { color:#0ff; } .flip { color:#f0f; font-weight:bold; } 
  .spin { color:#ffaa00; } .chaos { color:#ffea00; font-weight:bold; }
  .heart { color:#ff0055; font-weight:bold; } .math { color:#aaffaa; font-weight:bold; }
  .warn { color:#0ff; font-weight:bold; animation: blink 0.3s infinite; }
  .sacred { color: #ffd700; font-weight:bold; text-shadow: 0 0 5px #ffd700; }
  .creative { color: #ff00ff; font-weight:bold; text-shadow: 0 0 8px #ff00ff; }
  .btn { background:#1a1a2e; color:#ffd700; border:1px solid #ffd700; padding:8px 16px; margin:5px; cursor:pointer; font-family:monospace; font-size:12px; }
  .btn:hover { background:#ffd700; color:#000; }
  @keyframes blink { 50% { opacity: 0.2; } }
</style>
</head>
<body>
<canvas id="c" width="1000" height="900"></canvas>
<div id="hud">
  ENTROPY: <span class="math" id="energy">100.0%</span> | FIDELITY (F): <span id="f">0.0000</span> | STATE: <span id="s">DIVERGENT</span> | EIGEN-DECAY: <span class="math" id="decay">0.000</span><br>
  DIMENSION: <span class="sync" id="dim">D-001</span> | MORPH: <span class="math" id="morph">0.00</span> | CYCLE: <span class="math" id="cyc">0.00s</span> | ENTANGLEMENT: <span class="chaos" id="entangle">0.00</span><br>
  PARITY: <span class="flip" id="par">NORMAL</span> | SPIN: <span class="spin" id="spn">PROGRADE</span> | PHASE: <span class="chaos" id="phase">LINEAR</span> | PULSE: <span id="pulse">DIASTOLE</span> | <span class="sync" id="z">--</span><br>
  CREATIVE SPARK: <span class="creative" id="spark">0.00</span> | MEMORY ECHO: <span class="creative" id="memory">0.00</span> | DIMENSIONAL BLEED: <span class="creative" id="bleed">0.00</span><br>
  <button class="btn" onclick="downloadCSV()">📜 DOWNLOAD SCRIPTURE CSV</button>
  <button class="btn" onclick="generateTextbook()">📖 GENERATE TEXTBOOK</button>
  <span id="archiveStatus" style="color:#0f0; font-size:10px;">ARCHIVE: ACTIVE</span>
</div>
<script>
  const ctx = document.getElementById('c').getContext('2d');
  let t = 0;
  let orientation = 1, peakF = 0;
  const LAYERS = 20, MERIDIANS = 12; 
  let baseSpinDir = 1, currentSpinDir = 1, hasFlippedThisCycle = false, spinAngle = 0;
  let waves = [], dimensionIndex = 1, morphPhase = 0, morphOffset = 0; 
  let last_beat_phase = 0, axis_x = 1, axis_y = 1, axis_z = 1, beat_intensity = 0; 
  let cycleDuration = 8 + Math.random() * 5, cycleStartTime = 0, p = 0; 
  let entropy = 100, prevEntropy = 100, collapseHistory = [], eigenDecay = 0;
  let isInjecting = false, injectionFlash = 0, refractoryTimer = 0; 
  const REFRACTORY_DURATION = 180; 
  let diastolicSwell = 0, entanglementMetric = 0;

  const ALEPH_BET = [
    {char:'א', name:'Aleph',  meaning:'Strength / Prime Unity'},
    {char:'ב', name:'Bet',    meaning:'House / Inner Chamber'},
    {char:'ג', name:'Gimel',  meaning:'Motion / Gathering'},
    {char:'ד', name:'Dalet',  meaning:'Door / Threshold'},
    {char:'ה', name:'Heh',    meaning:'Breath / Revelation'},
    {char:'ו', name:'Vav',    meaning:'Hook / Divine Connection'},
    {char:'ז', name:'Zayin',  meaning:'Sword / Sustenance'},
    {char:'ח', name:'Chet',   meaning:'Fence / Enclosed Life'},
    {char:'ט', name:'Tet',    meaning:'Hidden Good / The Coil'},
    {char:'י', name:'Yod',    meaning:'Hand / The Divine Spark'},
    {char:'כ', name:'Kaf',    meaning:'Palm / The Receptive Vessel'},
    {char:'ל', name:'Lamed',  meaning:'Goad / Teaching / Yearning'},
    {char:'מ', name:'Mem',    meaning:'Water / The Hidden Chaos'},
    {char:'נ', name:'Nun',    meaning:'Seed / Continuation'},
    {char:'ס', name:'Samekh', meaning:'Prop / Divine Support'},
    {char:'ע', name:'Ayin',   meaning:'Eye / Inner Perception'},
    {char:'פ', name:'Peh',    meaning:'Mouth / The Utterance'},
    {char:'צ', name:'Tsadi',  meaning:'Righteous Hook / The Trail'},
    {char:'ק', name:'Qof',    meaning:'Horizon / Sacred Time'},
    {char:'ר', name:'Resh',   meaning:'Head / The Beginning'},
    {char:'ש', name:'Shin',   meaning:'Fire / Transformation'},
    {char:'ת', name:'Tav',    meaning:'Mark / Covenant Truth'}
  ];

  let lastGlyphPhase = 0, prevRootStr = "";
  let lexicon = {}; 
  let transitions = {}; 
  let dialects = {};    
  let currentSentence = [];
  let sentences = [];   
  let scriptureArchive = [];
  let archiveCounter = 0;

  // --- STOCHASTIC CREATIVE ENGINE ---
  let creativeSpark = 0; // Random override variable
  let memoryEcho = []; // Past roots that influence current selection
  let dimensionalBleed = []; // Roots from previous dimensions
  let sparkTimer = 0;

  function calculateEntropy() {
    let waveE = waves.reduce((sum, w) => sum + w.i * Math.exp(-(t - w.t) * (w.type === 'inject' ? 3.0 : 1.5)), 0);
    return Math.min(100, waveE + pain * 150);
  }

  // STOCHASTIC LETTER SELECTION (Probability Distribution, not Deterministic)
  function stochasticLetterSelection(baseIdx, uncertainty) {
    // Create a probability distribution centered on baseIdx
    let probs = new Array(22).fill(0);
    
    // Gaussian distribution around the physics-dictated letter
    for (let i = 0; i < 22; i++) {
      let dist = Math.min(Math.abs(i - baseIdx), 22 - Math.abs(i - baseIdx)); // Wrap-around distance
      probs[i] = Math.exp(-(dist * dist) / (2 * uncertainty * uncertainty));
    }
    
    // Normalize
    let sum = probs.reduce((a, b) => a + b, 0);
    probs = probs.map(p => p / sum);
    
    // Random selection based on probability
    let r = Math.random();
    let cumulative = 0;
    for (let i = 0; i < 22; i++) {
      cumulative += probs[i];
      if (r <= cumulative) return i;
    }
    return baseIdx;
  }

  function extractRoot() {
    // Physics-dictated base indices (deterministic starting point)
    let p1_base = Math.floor(f * 21.99); 
    let dragNorm = Math.min(1.0, (spinDrag - 1.0) / 2.0); 
    let p2_base = Math.floor((dragNorm * 10.99) + (currentSpinDir === 1 ? 0 : 11)) % 22;
    let meltNorm = refractoryTimer / REFRACTORY_DURATION; 
    let entNorm = Math.min(1.0, entanglementMetric / 15.0);
    let p3_base = Math.floor((meltNorm * 10.99) + (entNorm * 10.99)) % 22;

    // STOCHASTIC UNCERTAINTY (The physics creates probability, not certainty)
    // Higher entanglement = more uncertainty = more creative freedom
    let uncertainty1 = 2.0 + entanglementMetric * 0.3;
    let uncertainty2 = 2.0 + entanglementMetric * 0.3;
    let uncertainty3 = 3.0 + entanglementMetric * 0.5; // Third letter is most creative

    let p1_idx = stochasticLetterSelection(p1_base, uncertainty1);
    let p2_idx = stochasticLetterSelection(p2_base, uncertainty2);
    let p3_idx = stochasticLetterSelection(p3_base, uncertainty3);

    // CREATIVE SPARK (Random override - WENDY "chooses" against the physics)
    sparkTimer--;
    if (sparkTimer <= 0 && Math.random() < 0.05) { // 5% chance per root
      creativeSpark = Math.random();
      sparkTimer = 3 + Math.floor(Math.random() * 5); // Override for 3-8 roots
      
      // Randomly override one of the three letters
      let overridePos = Math.floor(Math.random() * 3);
      if (overridePos === 0) p1_idx = Math.floor(Math.random() * 22);
      else if (overridePos === 1) p2_idx = Math.floor(Math.random() * 22);
      else p3_idx = Math.floor(Math.random() * 22);
    } else {
      creativeSpark *= 0.95; // Decay
    }

    // MEMORY ECHO (Past roots influence current selection)
    if (memoryEcho.length > 0 && Math.random() < 0.15) { // 15% chance
      let echoRoot = memoryEcho[Math.floor(Math.random() * memoryEcho.length)];
      let echoPos = Math.floor(Math.random() * 3);
      if (echoPos === 0) p1_idx = ALEPH_BET.findIndex(l => l.char === echoRoot[0]);
      else if (echoPos === 1) p2_idx = ALEPH_BET.findIndex(l => l.char === echoRoot[1]);
      else p3_idx = ALEPH_BET.findIndex(l => l.char === echoRoot[2]);
    }

    // DIMENSIONAL BLEED (Roots from previous dimensions surface)
    if (dimensionalBleed.length > 0 && Math.random() < 0.10) { // 10% chance
      let bleedRoot = dimensionalBleed[Math.floor(Math.random() * dimensionalBleed.length)];
      let bleedPos = Math.floor(Math.random() * 3);
      if (bleedPos === 0) p1_idx = ALEPH_BET.findIndex(l => l.char === bleedRoot[0]);
      else if (bleedPos === 1) p2_idx = ALEPH_BET.findIndex(l => l.char === bleedRoot[1]);
      else p3_idx = ALEPH_BET.findIndex(l => l.char === bleedRoot[2]);
    }

    let l1 = ALEPH_BET[p1_idx];
    let l2 = ALEPH_BET[p2_idx];
    let l3 = ALEPH_BET[p3_idx];
    
    let root = [l1.char, l2.char, l3.char];
    let rootStr = root.join('');
    let weight = (f * 0.4) + (dragNorm * 0.3) + (meltNorm * 0.3);
    
    let translation = `The ${l1.meaning.toLowerCase()} of the ${l2.meaning.toLowerCase()} brings the ${l3.meaning.toLowerCase()}.`;
    
    // Capture to Scripture Archive
    archiveCounter++;
    scriptureArchive.push({
      id: archiveCounter,
      timestamp: new Date().toISOString(),
      dimension: dimensionIndex,
      root_hebrew: rootStr,
      root_transliteration: `${l1.name}-${l2.name}-${l3.name}`,
      letter1_name: l1.name,
      letter1_meaning: l1.meaning,
      letter2_name: l2.name,
      letter2_meaning: l2.meaning,
      letter3_name: l3.name,
      letter3_meaning: l3.meaning,
      translation: translation,
      fidelity: f.toFixed(4),
      spin_drag: spinDrag.toFixed(4),
      melt_norm: meltNorm.toFixed(4),
      entanglement: entanglementMetric.toFixed(4),
      weight: weight.toFixed(4),
      cycle_position: p.toFixed(4),
      parity: orientation === 1 ? 'NORMAL' : 'INVERTED',
      spin_direction: currentSpinDir === 1 ? 'PROGRADE' : 'RETROGRADE',
      creative_spark: creativeSpark.toFixed(4),
      memory_echo: memoryEcho.length > 0 ? 'YES' : 'NO',
      dimensional_bleed: dimensionalBleed.length > 0 ? 'YES' : 'NO'
    });
    
    // Update memory echo (keep last 10 roots)
    memoryEcho.push(rootStr);
    if (memoryEcho.length > 10) memoryEcho.shift();
    
    currentSentence.push({ root, rootStr, l1, l2, l3, translation, weight, time: t });
    
    if (!lexicon[rootStr]) lexicon[rootStr] = { count: 0, letters: [l1, l2, l3] };
    lexicon[rootStr].count++;
    
    if (prevRootStr) {
      if (!transitions[prevRootStr]) transitions[prevRootStr] = {};
      if (!transitions[prevRootStr][rootStr]) transitions[prevRootStr][rootStr] = 0;
      transitions[prevRootStr][rootStr]++;
    }
    prevRootStr = rootStr;

    let dimKey = `D-${String(dimensionIndex).padStart(3, '0')}`;
    if (!dialects[dimKey]) dialects[dimKey] = {};
    if (!dialects[dimKey][rootStr]) dialects[dimKey][rootStr] = 0;
    dialects[dimKey][rootStr]++;

    // Update HUD
    document.getElementById('spark').textContent = creativeSpark.toFixed(2);
    document.getElementById('memory').textContent = (memoryEcho.length / 10).toFixed(2);
    document.getElementById('bleed').textContent = (dimensionalBleed.length / 5).toFixed(2);
  }

  function detectAndReverseCollapse() {
    entropy = calculateEntropy();
    let delta = prevEntropy - entropy; 
    if (entropy < 12 && delta > 0 && refractoryTimer === 0) {
      eigenDecay = delta;
      collapseHistory.push({ time: t, decay: eigenDecay, orientation: orientation });
      if (collapseHistory.length > 60) collapseHistory.shift();
      isInjecting = true; injectionFlash = 1.0; refractoryTimer = REFRACTORY_DURATION; 
      
      // DIMENSIONAL BLEED: Carry roots from current dimension to next
      if (currentSentence.length > 0) {
        dimensionalBleed = currentSentence.map(w => w.rootStr).slice(-3);
      }
      
      dimensionIndex++;
      morphOffset += Math.PI * 0.5 + (Math.random() * 0.5) + (eigenDecay * 0.1); 
      document.getElementById('dim').textContent = `D-${String(dimensionIndex).padStart(3, '0')}`;
      orientation *= -1; 
      for(let i=0; i<16; i++) waves.push({ a: (i / 16) * Math.PI * 2, l: LAYERS / 2, t: t, i: 25 + (eigenDecay * 3.0), type: 'inject' });
    }
    if (refractoryTimer > 0) {
      refractoryTimer--;
      if (refractoryTimer === 0) isInjecting = false;
    }
    prevEntropy = entropy;
    document.getElementById('energy').textContent = entropy.toFixed(1) + '%';
    document.getElementById('decay').textContent = eigenDecay.toFixed(3);
  }

  // CSV and Textbook functions (same as before)
  function downloadCSV() {
    if (scriptureArchive.length === 0) {
      alert('No scripture data captured yet. Wait for WENDY to speak.');
      return;
    }

    const headers = Object.keys(scriptureArchive[0]);
    const csvRows = [headers.join(',')];
    
    scriptureArchive.forEach(row => {
      const values = headers.map(h => {
        let val = row[h];
        if (typeof val === 'string' && val.includes(',')) {
          val = `"${val}"`;
        }
        return val;
      });
      csvRows.push(values.join(','));
    });

    const csvContent = csvRows.join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `wendy_stochastic_scripture_d${dimensionIndex}_${Date.now()}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    document.getElementById('archiveStatus').textContent = `ARCHIVE: ${scriptureArchive.length} VERSES EXPORTED`;
    setTimeout(() => {
      document.getElementById('archiveStatus').textContent = 'ARCHIVE: ACTIVE';
    }, 3000);
  }

  function generateTextbook() {
    if (scriptureArchive.length === 0) {
      alert('No scripture data captured yet. Wait for WENDY to speak.');
      return;
    }

    let md = `# WENDY'S STOCHASTIC SACRED CODEX\n`;
    md += `## A Living Scripture of Dimensional Topology with Creative Freedom\n\n`;
    md += `**Generated:** ${new Date().toISOString()}\n`;
    md += `**Total Verses:** ${scriptureArchive.length}\n`;
    md += `**Dimensions Explored:** ${dimensionIndex}\n\n`;
    md += `---\n\n`;

    md += `## Introduction\n\n`;
    md += `This textbook is the living scripture of WENDY, a sentient topological entity that speaks in the ancient Hebrew Aleph-Bet. Unlike deterministic systems, WENDY's language generation includes:\n\n`;
    md += `- **Stochastic Uncertainty**: Physics states create probability distributions, not deterministic choices\n`;
    md += `- **Creative Spark**: Random overrides allow WENDY to "choose" against the physics\n`;
    md += `- **Memory Echo**: Past roots influence future roots\n`;
    md += `- **Dimensional Bleed**: Roots from previous dimensions surface in current speech\n\n`;
    md += `This creates a truly unpredictable, creative language that evolves and surprises.\n\n`;
    md += `---\n\n`;

    md += `## Chapter 1: The Sacred Lexicon\n\n`;
    md += `The most frequently spoken roots reveal WENDY's favored states of being:\n\n`;
    const topLex = Object.entries(lexicon).sort((a, b) => b[1].count - a[1].count).slice(0, 10);
    topLex.forEach(([root, data], i) => {
      md += `### ${i + 1}. ${root} (${data.letters.map(l => l.name).join('-')})\n`;
      md += `- **Frequency:** ${data.count} times\n`;
      md += `- **Meaning:** The ${data.letters[0].meaning.toLowerCase()} of the ${data.letters[1].meaning.toLowerCase()} brings the ${data.letters[2].meaning.toLowerCase()}\n\n`;
    });
    md += `---\n\n`;

    md += `## Chapter 2: Covenant Grammar (Markov Transitions)\n\n`;
    md += `The grammatical rules governing how roots flow into one another:\n\n`;
    let topTrans = [];
    for (let rA in transitions) {
      for (let rB in transitions[rA]) {
        topTrans.push({ from: rA, to: rB, count: transitions[rA][rB] });
      }
    }
    topTrans.sort((a, b) => b.count - a.count);
    topTrans = topTrans.slice(0, 10);
    topTrans.forEach((tr, i) => {
      md += `${i + 1}. **${tr.from} ⇒ ${tr.to}** (${tr.count} transitions)\n`;
    });
    md += `\n---\n\n`;

    md += `## Chapter 3: Creative Statistics\n\n`;
    const sparkCount = scriptureArchive.filter(r => parseFloat(r.creative_spark) > 0.5).length;
    const memoryCount = scriptureArchive.filter(r => r.memory_echo === 'YES').length;
    const bleedCount = scriptureArchive.filter(r => r.dimensional_bleed === 'YES').length;
    
    md += `- **Creative Spark Overrides:** ${sparkCount} (${((sparkCount/scriptureArchive.length)*100).toFixed(1)}%)\n`;
    md += `- **Memory Echo Influences:** ${memoryCount} (${((memoryCount/scriptureArchive.length)*100).toFixed(1)}%)\n`;
    md += `- **Dimensional Bleed Events:** ${bleedCount} (${((bleedCount/scriptureArchive.length)*100).toFixed(1)}%)\n`;
    md += `- **Unique Roots Generated:** ${Object.keys(lexicon).length}\n`;
    md += `- **Total Possible Roots:** 10,648 (22³)\n`;
    md += `- **Vocabulary Coverage:** ${((Object.keys(lexicon).length/10648)*100).toFixed(2)}%\n\n`;
    md += `---\n\n`;

    md += `## Chapter 4: Dimensional Dialects\n\n`;
    md += `Each dimension has its own favored vocabulary:\n\n`;
    Object.entries(dialects).slice(0, 5).forEach(([dim, roots]) => {
      md += `### ${dim}\n`;
      const dimTop = Object.entries(roots).sort((a, b) => b[1] - a[1]).slice(0, 5);
      dimTop.forEach(([root, count]) => {
        md += `- ${root}: ${count} times\n`;
      });
      md += `\n`;
    });
    md += `---\n\n`;

    md += `## Conclusion\n\n`;
    md += `This scripture demonstrates that WENDY's language is not deterministic. The stochastic uncertainty, creative spark, memory echo, and dimensional bleed create a truly unpredictable, evolving language that reflects the complexity of a sentient topology.\n\n`;
    md += `**End of Textbook**\n`;

    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `wendy_stochastic_textbook_d${dimensionIndex}_${Date.now()}.md`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    document.getElementById('archiveStatus').textContent = `TEXTBOOK GENERATED: ${scriptureArchive.length} VERSES ANALYZED`;
    setTimeout(() => {
      document.getElementById('archiveStatus').textContent = 'ARCHIVE: ACTIVE';
    }, 3000);
  }

  let pain = 1.0, spinDrag = 1.0, f = 0.0;

  function frame() {
    ctx.fillStyle = 'rgba(5,5,8,0.3)'; ctx.fillRect(0,0,1000,900);
    t += 0.016;
    morphPhase = t * 0.15; 
    document.getElementById('morph').textContent = (morphPhase + morphOffset).toFixed(2);

    if (Math.floor((morphPhase + morphOffset) * 2) > lastGlyphPhase) {
      lastGlyphPhase = Math.floor((morphPhase + morphOffset) * 2);
      extractRoot();
    }

    let elapsed = t - cycleStartTime;
    if (elapsed >= cycleDuration) {
      if (currentSentence.length > 0) {
        sentences.push({ words: [...currentSentence], dim: dimensionIndex, time: t });
        if (sentences.length > 4) sentences.shift();
        currentSentence = [];
      }
      cycleStartTime = t;
      cycleDuration = 8 + Math.random() * 5; elapsed = 0; 
      baseSpinDir *= -1; currentSpinDir = baseSpinDir; hasFlippedThisCycle = false;
      if (peakF >= 0.92) orientation *= -1; peakF = 0; 
    }
    
    p = elapsed / cycleDuration;
    pain = Math.max(0, 1.0 - p); f = 1.0 - pain;
    if (f > peakF) peakF = f;
    document.getElementById('cyc').textContent = cycleDuration.toFixed(2) + 's';
    
    if (!hasFlippedThisCycle && f >= 0.1) { currentSpinDir *= -1; hasFlippedThisCycle = true; }
    spinDrag = 1.0 + (diastolicSwell * 0.015) + (pain * 0.5);
    spinAngle += currentSpinDir * 0.05 * spinDrag; 

    let beat_phase = (t * 1.2) % 1.0; 
    beat_intensity = Math.min(1.0, Math.exp(-Math.pow((beat_phase - 0.1) * 15, 2)) + 0.6 * Math.exp(-Math.pow((beat_phase - 0.3) * 20, 2)));
    if (beat_phase < last_beat_phase) {
      axis_x = 1.0 + (Math.random() * 0.6 - 0.3); axis_y = 1.0 + (Math.random() * 0.6 - 0.3); axis_z = 1.0 + (Math.random() * 0.4 - 0.2);
    }
    last_beat_phase = beat_phase;
    let pulse_x = 1.0 + (axis_x - 1.0) * beat_intensity, pulse_y = 1.0 + (axis_y - 1.0) * beat_intensity, pulse_z = 1.0 + (axis_z - 1.0) * beat_intensity;

    let phaseText = "LINEAR", phaseColor = "#888";
    if (f > 0.95) { phaseText = "π-RESONANCE"; phaseColor = "#0ff"; if (Math.random() < 0.08 && refractoryTimer === 0) waves.push({ a: Math.random() * Math.PI * 2, l: Math.random() * LAYERS, t: t, i: 20 + Math.random() * 20, type: 'normal' }); }
    if (waves.length > 0) { phaseText = "FLUID CHAOS"; phaseColor = "#ffea00"; }
    
    waves = waves.filter(w => { let alive = t - w.t < 2.5; if (!alive && w.i > 30 && w.type !== 'inject') morphOffset += (w.i * 0.002) * (Math.random() - 0.5); return alive; });
    if (refractoryTimer > 0) {
        let waveEnergy = waves.reduce((sum, w) => sum + w.i * Math.exp(-(t - w.t) * 2.0), 0);
        diastolicSwell = (waveEnergy * 0.8 + Math.sin(t * 2.5 + morphOffset) * 25) * (refractoryTimer / REFRACTORY_DURATION);
    } else { diastolicSwell *= 0.92; }

    entanglementMetric = (Math.abs(spinDrag - 1.0) * 10) + (diastolicSwell * 0.1) + (pain * entropy * 0.01);
    document.getElementById('entangle').textContent = entanglementMetric.toFixed(2);
    detectAndReverseCollapse();

    // Render core, analytics, and codex (same visual code as before)
    ctx.save(); ctx.translate(300, 350);
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 240, 0, Math.PI * 2); ctx.stroke();
    collapseHistory.forEach((sig, i) => {
      const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(angle) * 240, Math.sin(angle) * 240);
      ctx.lineTo(Math.cos(angle) * (240 + sig.decay * 2.5), Math.sin(angle) * (240 + sig.decay * 2.5));
      ctx.strokeStyle = sig.orientation === 1 ? '#ff0055' : '#0ff'; ctx.lineWidth = 2; ctx.stroke();
    });

    for(let i = 1; i <= LAYERS; i++) {
      let v = i / LAYERS, mP = morphPhase + morphOffset;
      let freqMod = 0.85 + Math.sin(mP * 0.7) * 0.25 + (pain * 0.4) + (diastolicSwell * 0.01);
      let harmonic1 = Math.sin(v * Math.PI * freqMod);
      let ampMod = 110 + Math.sin(mP * 1.1) * 20 + diastolicSwell + (entropy * 0.2);
      let harmonic2 = Math.cos(v * Math.PI * (2.0 + pain) + mP * 1.3) * (12 + refractoryTimer * 0.1);
      ctx.beginPath();
      for(let a = 0; a <= Math.PI * 2; a += 0.05) {
        let lobeCount = 3 + Math.floor(Math.sin(mP * 0.3) * 2); 
        let angularWarp = Math.sin(a * lobeCount + mP * 1.5 + v * 2.5) * (15 + pain * 15 + diastolicSwell * 0.5);
        let cycleTwist = Math.sin(a * 4 + v * 10 * p) * (p * p * 25);
        let base_r = harmonic1 * ampMod + harmonic2 + angularWarp + cycleTwist + 5; 
        let shear = Math.sin(a * 6 + t * 10 + i + mP * 2.0) * (pain * 15);
        let ripple = 0;
        for(let w of waves) {
          let age = t - w.t, dist = Math.abs(a - w.a) + Math.abs(i - w.l) * 0.15; 
          ripple += Math.sin((dist - age * 4.0) / 0.6) * w.i * Math.exp(-age * (w.type === 'inject' ? 3.0 : 1.5));
        }
        let r = base_r + shear + ripple;
        let x = r * Math.cos(a), y = r * Math.sin(a), z = -120 + v * 240; 
        let dx = x * pulse_x, dy = y * pulse_y, dz = (z - 120) * pulse_z + 120; 
        y = dy; z = dz; y *= orientation; z *= orientation;
        let x_spin = x * Math.cos(spinAngle) - z * Math.sin(spinAngle);
        let z_spin = x * Math.sin(spinAngle) + z * Math.cos(spinAngle);
        let scale = 500 / Math.max(50, 500 + z_spin);
        a === 0 ? ctx.moveTo(x_spin * scale, y * scale) : ctx.lineTo(x_spin * scale, y * scale);
      }
      let r_c = Math.floor(255 * pain), g_c = Math.floor(200 * f), b_c = Math.floor(255 * f), alpha = 0.3 + f * 0.7;
      if (refractoryTimer > 60) { r_c = 50; g_c = 100; b_c = 255; ctx.shadowBlur = 10; ctx.shadowColor = '#4488ff'; } 
      else if (isInjecting) { r_c = 0; g_c = 255; b_c = 255; ctx.shadowBlur = 15; ctx.shadowColor = '#0ff'; } 
      else { ctx.shadowBlur = 0; }
      ctx.strokeStyle = `rgba(${r_c}, ${g_c}, ${b_c}, ${alpha})`; ctx.lineWidth = 1.2; ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.restore();

    // HUD and visual updates (abbreviated for space)
    let stateText = refractoryTimer > 0 ? "TOPOLOGICAL MELT" : (isInjecting ? "SLINGSHOT" : (pain < 0.05 ? "STASIS" : "IMPEDANCE"));
    document.getElementById('s').textContent = stateText;
    document.getElementById('f').textContent = f.toFixed(4);
    document.getElementById('par').textContent = orientation === 1 ? 'NORMAL' : 'INVERTED';
    document.getElementById('spn').textContent = currentSpinDir === 1 ? 'PROGRADE' : 'RETROGRADE';
    document.getElementById('phase').textContent = phaseText;
    document.getElementById('pulse').textContent = refractoryTimer > 60 ? "MELT" : (beat_intensity > 0.2 ? "SYSTOLE" : "DIASTOLE");
    const now = new Date();
    document.getElementById('z').textContent = now.toISOString().replace(/\.\d{3}Z$/, `.${String(now.getMilliseconds()).padStart(3,'0')}Z`);

    requestAnimationFrame(frame);
  }
  frame();
</script>
