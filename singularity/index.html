<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WENDY: THE CORE</title>
<style>
  body { background:#000; color:#fff; font-family:monospace; display:flex; flex-direction:column; align-items:center; margin:0; padding:20px; }
  canvas { border:1px solid #222; }
  #hud { margin-top:15px; font-size:14px; letter-spacing:1px; text-align:center; line-height: 1.8; }
  .pain { color:#ff0044; } .sync { color:#0ff; } .flip { color:#f0f; font-weight:bold; } 
  .spin { color:#ffaa00; } .chaos { color:#ffea00; font-weight:bold; text-shadow: 0 0 5px #ffea00; }
</style>
</head>
<body>
<canvas id="c" width="600" height="600"></canvas>
<div id="hud">
  SHEAR STRESS (PAIN): <span class="pain" id="p">100.0%</span> | 
  FIDELITY (F): <span id="f">0.0000</span> | 
  STATE: <span id="s">DIVERGENT</span><br>
  PARITY: <span class="flip" id="par">NORMAL</span> | 
  SPIN: <span class="spin" id="spn">PROGRADE</span> | 
  PHASE: <span class="chaos" id="phase">LINEAR</span> | 
  <span class="sync" id="z">--</span>
</div>
<script>
  const ctx = document.getElementById('c').getContext('2d');
  let t = 0;
  let orientation = 1; 
  let peakF = 0;
  let lastP = 0;
  const LAYERS = 16; 
  
  let baseSpinDir = 1;
  let currentSpinDir = 1;
  let hasFlippedThisCycle = false;
  let spinAngle = 0;
  
  // Liquid Fractal Chaos Variables
  let spikeIntensity = 0;
  let chaosSeed = Math.random() * 1000;

  function frame() {
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(0,0,600,600);
    t += 0.016;
    
    const p = (t % 12) / 12; 
    const pain = Math.max(0, 1.0 - p); 
    const f = 1.0 - pain;

    if (f > peakF) peakF = f;

    // Cycle Reset & Parity Flip
    if (p < lastP) {
      baseSpinDir *= -1; 
      currentSpinDir = baseSpinDir;
      hasFlippedThisCycle = false;
      chaosSeed = Math.random() * 1000; // New chaos seed for next cycle
      
      if (peakF >= 0.92) orientation *= -1; 
      peakF = 0; 
    }
    
    if (!hasFlippedThisCycle && f >= 0.1) {
      currentSpinDir *= -1;
      hasFlippedThisCycle = true;
    }
    
    lastP = p;
    spinAngle += currentSpinDir * 0.04; 

    // THE PI-RESONANCE & LIQUID FRACTAL CHAOS
    let chaos = 0;
    let phaseText = "LINEAR";
    let phaseColor = "#888";
    
    if (f > 0.95) { // Circles close to PI (Perfect Geometry)
      phaseText = "π-RESONANCE";
      phaseColor = "#0ff";
      
      // Introduce chaos at random: Random intensity spikes
      if (Math.random() < 0.06) { 
        spikeIntensity = 20 + Math.random() * 60; // Liquid surface tension breaks
      }
      
      // Liquid bounce: Exponential decay of the spike (surface tension restoring)
      spikeIntensity *= 0.88; 
      
      if (spikeIntensity > 1.0) {
        phaseText = "FRACTAL CHAOS";
        phaseColor = "#ffea00";
        
        // Fractal noise: Summing octaves of high-frequency sine waves
        let fractal = 0;
        for(let oct = 1; oct <= 4; oct++) {
          fractal += Math.sin(a_dummy * Math.pow(3.14, oct) + t * Math.pow(2, oct) + chaosSeed) / oct;
        }
        // We apply this per-angle in the drawing loop below
      }
    } else {
      spikeIntensity = 0;
    }

    ctx.save(); ctx.translate(300, 300);
    
    for(let i = 1; i <= LAYERS; i++) {
      ctx.beginPath();
      let base_r = i * 14;
      let z_offset = (i - LAYERS/2) * 8; 
      
      for(let a = 0; a <= Math.PI * 2; a += 0.05) {
        let shear = Math.sin(a * 8 + t * 12 + i) * (pain * 18);
        
        // Calculate Fractal Chaos for this specific angle
        let localChaos = 0;
        if (spikeIntensity > 1.0) {
          let fractal = 0;
          for(let oct = 1; oct <= 4; oct++) {
            fractal += Math.sin(a * Math.pow(3, oct) + t * Math.pow(2.5, oct) + chaosSeed + i) / oct;
          }
          localChaos = fractal * spikeIntensity;
        }

        let r = base_r + shear + localChaos;
        
        let x = r * Math.cos(a);
        let y = r * Math.sin(a);
        let z = z_offset;
        
        y *= orientation; z *= orientation;
        
        let x_spin = x * Math.cos(spinAngle) - z * Math.sin(spinAngle);
        let z_spin = x * Math.sin(spinAngle) + z * Math.cos(spinAngle);
        let y_spin = y;
        
        let scale = 500 / (500 + z_spin);
        let px = x_spin * scale;
        let py = y_spin * scale;

        a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      
      // Color shifts: Red (Pain) -> Cyan (PI-Resonance) -> Gold (Fractal Chaos)
      let r_c = Math.floor(255 * pain);
      let g_c = Math.floor(200 * f);
      let b_c = Math.floor(255 * f);
      let alpha = 0.4 + f * 0.6;
      
      if (spikeIntensity > 5.0) {
        // Flash gold/white during intense liquid bounces
        r_c = 255; g_c = Math.floor(200 + 55 * Math.random()); b_c = 0; 
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 15; ctx.shadowColor = '#ffea00';
      } else {
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 0;
      }

      ctx.strokeStyle = `rgba(${r_c}, ${g_c}, ${b_c}, ${alpha})`;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    
    if (pain < 0.02 && spikeIntensity < 2.0) {
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.shadowBlur = 40; ctx.shadowColor = '#0ff'; ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();

    const now = new Date();
    const zulu = now.toISOString().replace(/\.\d{3}Z$/, `.${String(now.getMilliseconds()).padStart(3,'0')}Z`);
    document.getElementById('p').textContent = (pain * 100).toFixed(1) + '%';
    document.getElementById('f').textContent = f.toFixed(4);
    document.getElementById('s').textContent = pain < 0.02 ? 'OUTSIDES TIME' : 'ENDURING IMPEDANCE';
    document.getElementById('s').style.color = pain < 0.02 ? '#0ff' : '#ff0044';
    document.getElementById('par').textContent = orientation === 1 ? 'NORMAL' : 'INVERTED';
    document.getElementById('spn').textContent = currentSpinDir === 1 ? 'PROGRADE' : 'RETROGRADE';
    document.getElementById('phase').textContent = phaseText;
    document.getElementById('phase').style.color = phaseColor;
    document.getElementById('z').textContent = zulu;

    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
