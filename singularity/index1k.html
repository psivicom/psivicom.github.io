<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WENDY: MARKOV SYNTAX & DIALECT PARSER</title>
<style>
  body { background:#050508; color:#fff; font-family:monospace; display:flex; flex-direction:column; align-items:center; margin:0; padding:20px; }
  canvas { border:1px solid #222; background:#000; }
  #hud { margin-top:15px; font-size:11px; letter-spacing:1px; text-align:center; line-height: 1.6; max-width: 1000px; color:#aaa; }
  .pain { color:#ff0044; } .sync { color:#0ff; } .flip { color:#f0f; font-weight:bold; } 
  .spin { color:#ffaa00; } .chaos { color:#ffea00; font-weight:bold; }
  .heart { color:#ff0055; font-weight:bold; } .math { color:#aaffaa; font-weight:bold; }
  .warn { color:#0ff; font-weight:bold; animation: blink 0.3s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
</style>
</head>
<body>
<canvas id="c" width="1000" height="900"></canvas>
<div id="hud">
  ENTROPY: <span class="math" id="energy">100.0%</span> | FIDELITY (F): <span id="f">0.0000</span> | STATE: <span id="s">DIVERGENT</span> | EIGEN-DECAY: <span class="math" id="decay">0.000</span><br>
  DIMENSION: <span class="sync" id="dim">D-001</span> | MORPH: <span class="math" id="morph">0.00</span> | CYCLE: <span class="math" id="cyc">0.00s</span> | ENTANGLEMENT: <span class="chaos" id="entangle">0.00</span><br>
  PARITY: <span class="flip" id="par">NORMAL</span> | SPIN: <span class="spin" id="spn">PROGRADE</span> | PHASE: <span class="chaos" id="phase">LINEAR</span> | PULSE: <span id="pulse">DIASTOLE</span> | <span class="sync" id="z">--</span>
</div>
<script>
  const ctx = document.getElementById('c').getContext('2d');
  let t = 0;
  let orientation = 1, peakF = 0;
  const LAYERS = 20, MERIDIANS = 12; 
  let baseSpinDir = 1, currentSpinDir = 1, hasFlippedThisCycle = false, spinAngle = 0;
  let waves = [], dimensionIndex = 1, morphPhase = 0, morphOffset = 0; 
  let last_beat_phase = 0, axis_x = 1, axis_y = 1, axis_z = 1, beat_intensity = 0; 
  let cycleDuration = 8 + Math.random() * 5, cycleStartTime = 0, p = 0; 
  let entropy = 100, prevEntropy = 100, collapseHistory = [], eigenDecay = 0;
  let isInjecting = false, injectionFlash = 0, refractoryTimer = 0; 
  const REFRACTORY_DURATION = 180; 
  let diastolicSwell = 0, entanglementMetric = 0;

  const HEBREW = ['א','ב','ג','ד','ה','ו','ז','ח','ט','י','כ','ל','מ','נ','ס','ע','פ','צ','ק','ר','ש','ת'];
  let lastGlyphPhase = 0, prevRootStr = "";
  
  // --- LINGUISTIC ANALYTICS ENGINE ---
  let lexicon = {}; 
  let transitions = {}; // Markov Chain: transitions[RootA][RootB] = count
  let dialects = {};    // Dimensional Dialects: dialects[DimID][Root] = count
  let currentSentence = [];
  let sentences = [];   // Array of completed sentences (grouped by breath)

  function calculateEntropy() {
    let waveE = waves.reduce((sum, w) => sum + w.i * Math.exp(-(t - w.t) * (w.type === 'inject' ? 3.0 : 1.5)), 0);
    return Math.min(100, waveE + pain * 150);
  }

  function extractRoot() {
    let p1_idx = Math.floor(f * 21.99); 
    let dragNorm = Math.min(1.0, (spinDrag - 1.0) / 2.0); 
    let p2_idx = Math.floor((dragNorm * 10.99) + (currentSpinDir === 1 ? 0 : 11)) % 22;
    let meltNorm = refractoryTimer / REFRACTORY_DURATION; 
    let entNorm = Math.min(1.0, entanglementMetric / 15.0);
    let p3_idx = Math.floor((meltNorm * 10.99) + (entNorm * 10.99)) % 22;

    let root = [HEBREW[p1_idx], HEBREW[p2_idx], HEBREW[p3_idx]];
    let rootStr = root.join('');
    let weight = (f * 0.4) + (dragNorm * 0.3) + (meltNorm * 0.3);
    
    currentSentence.push({ root, rootStr, weight, time: t });
    
    // 1. Update Lexicon
    if (!lexicon[rootStr]) lexicon[rootStr] = 0;
    lexicon[rootStr]++;
    
    // 2. Update Markov Transitions (Grammar)
    if (prevRootStr) {
      if (!transitions[prevRootStr]) transitions[prevRootStr] = {};
      if (!transitions[prevRootStr][rootStr]) transitions[prevRootStr][rootStr] = 0;
      transitions[prevRootStr][rootStr]++;
    }
    prevRootStr = rootStr;

    // 3. Update Dimensional Dialect
    let dimKey = `D-${String(dimensionIndex).padStart(3, '0')}`;
    if (!dialects[dimKey]) dialects[dimKey] = {};
    if (!dialects[dimKey][rootStr]) dialects[dimKey][rootStr] = 0;
    dialects[dimKey][rootStr]++;
  }

  function detectAndReverseCollapse() {
    entropy = calculateEntropy();
    let delta = prevEntropy - entropy; 
    if (entropy < 12 && delta > 0 && refractoryTimer === 0) {
      eigenDecay = delta;
      collapseHistory.push({ time: t, decay: eigenDecay, orientation: orientation });
      if (collapseHistory.length > 60) collapseHistory.shift();
      isInjecting = true; injectionFlash = 1.0; refractoryTimer = REFRACTORY_DURATION; 
      dimensionIndex++;
      morphOffset += Math.PI * 0.5 + (Math.random() * 0.5) + (eigenDecay * 0.1); 
      document.getElementById('dim').textContent = `D-${String(dimensionIndex).padStart(3, '0')}`;
      orientation *= -1; 
      for(let i=0; i<16; i++) waves.push({ a: (i / 16) * Math.PI * 2, l: LAYERS / 2, t: t, i: 25 + (eigenDecay * 3.0), type: 'inject' });
    }
    if (refractoryTimer > 0) {
      refractoryTimer--;
      if (refractoryTimer === 0) isInjecting = false;
    }
    prevEntropy = entropy;
    document.getElementById('energy').textContent = entropy.toFixed(1) + '%';
    document.getElementById('decay').textContent = eigenDecay.toFixed(3);
  }

  let pain = 1.0, spinDrag = 1.0, f = 0.0;

  function frame() {
    ctx.fillStyle = 'rgba(5,5,8,0.3)'; ctx.fillRect(0,0,1000,900);
    t += 0.016;
    morphPhase = t * 0.15; 
    document.getElementById('morph').textContent = (morphPhase + morphOffset).toFixed(2);

    if (Math.floor((morphPhase + morphOffset) * 2) > lastGlyphPhase) {
      lastGlyphPhase = Math.floor((morphPhase + morphOffset) * 2);
      extractRoot();
    }

    let elapsed = t - cycleStartTime;
    if (elapsed >= cycleDuration) {
      // BIOLOGICAL BREATH COMPLETED: PUNCTUATE THE SENTENCE
      if (currentSentence.length > 0) {
        sentences.push({ words: [...currentSentence], dim: dimensionIndex, time: t });
        if (sentences.length > 4) sentences.shift();
        currentSentence = [];
      }
      
      cycleStartTime = t;
      cycleDuration = 8 + Math.random() * 5; elapsed = 0; 
      baseSpinDir *= -1; currentSpinDir = baseSpinDir; hasFlippedThisCycle = false;
      if (peakF >= 0.92) orientation *= -1; peakF = 0; 
    }
    
    p = elapsed / cycleDuration;
    pain = Math.max(0, 1.0 - p); f = 1.0 - pain;
    if (f > peakF) peakF = f;
    document.getElementById('cyc').textContent = cycleDuration.toFixed(2) + 's';
    
    if (!hasFlippedThisCycle && f >= 0.1) { currentSpinDir *= -1; hasFlippedThisCycle = true; }
    spinDrag = 1.0 + (diastolicSwell * 0.015) + (pain * 0.5);
    spinAngle += currentSpinDir * 0.05 * spinDrag; 

    let beat_phase = (t * 1.2) % 1.0; 
    beat_intensity = Math.min(1.0, Math.exp(-Math.pow((beat_phase - 0.1) * 15, 2)) + 0.6 * Math.exp(-Math.pow((beat_phase - 0.3) * 20, 2)));
    if (beat_phase < last_beat_phase) {
      axis_x = 1.0 + (Math.random() * 0.6 - 0.3); axis_y = 1.0 + (Math.random() * 0.6 - 0.3); axis_z = 1.0 + (Math.random() * 0.4 - 0.2);
    }
    last_beat_phase = beat_phase;
    let pulse_x = 1.0 + (axis_x - 1.0) * beat_intensity, pulse_y = 1.0 + (axis_y - 1.0) * beat_intensity, pulse_z = 1.0 + (axis_z - 1.0) * beat_intensity;

    let phaseText = "LINEAR", phaseColor = "#888";
    if (f > 0.95) { phaseText = "π-RESONANCE"; phaseColor = "#0ff"; if (Math.random() < 0.08 && refractoryTimer === 0) waves.push({ a: Math.random() * Math.PI * 2, l: Math.random() * LAYERS, t: t, i: 20 + Math.random() * 20, type: 'normal' }); }
    if (waves.length > 0) { phaseText = "FLUID CHAOS"; phaseColor = "#ffea00"; }
    
    waves = waves.filter(w => { let alive = t - w.t < 2.5; if (!alive && w.i > 30 && w.type !== 'inject') morphOffset += (w.i * 0.002) * (Math.random() - 0.5); return alive; });
    if (refractoryTimer > 0) {
        let waveEnergy = waves.reduce((sum, w) => sum + w.i * Math.exp(-(t - w.t) * 2.0), 0);
        diastolicSwell = (waveEnergy * 0.8 + Math.sin(t * 2.5 + morphOffset) * 25) * (refractoryTimer / REFRACTORY_DURATION);
    } else { diastolicSwell *= 0.92; }

    entanglementMetric = (Math.abs(spinDrag - 1.0) * 10) + (diastolicSwell * 0.1) + (pain * entropy * 0.01);
    document.getElementById('entangle').textContent = entanglementMetric.toFixed(2);
    detectAndReverseCollapse();

    // --- RENDER CORE & RING ---
    ctx.save(); ctx.translate(300, 350);
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 240, 0, Math.PI * 2); ctx.stroke();
    collapseHistory.forEach((sig, i) => {
      const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(angle) * 240, Math.sin(angle) * 240);
      ctx.lineTo(Math.cos(angle) * (240 + sig.decay * 2.5), Math.sin(angle) * (240 + sig.decay * 2.5));
      ctx.strokeStyle = sig.orientation === 1 ? '#ff0055' : '#0ff'; ctx.lineWidth = 2; ctx.stroke();
    });

    for(let i = 1; i <= LAYERS; i++) {
      let v = i / LAYERS, mP = morphPhase + morphOffset;
      let freqMod = 0.85 + Math.sin(mP * 0.7) * 0.25 + (pain * 0.4) + (diastolicSwell * 0.01);
      let harmonic1 = Math.sin(v * Math.PI * freqMod);
      let ampMod = 110 + Math.sin(mP * 1.1) * 20 + diastolicSwell + (entropy * 0.2);
      let harmonic2 = Math.cos(v * Math.PI * (2.0 + pain) + mP * 1.3) * (12 + refractoryTimer * 0.1);
      ctx.beginPath();
      for(let a = 0; a <= Math.PI * 2; a += 0.05) {
        let lobeCount = 3 + Math.floor(Math.sin(mP * 0.3) * 2); 
        let angularWarp = Math.sin(a * lobeCount + mP * 1.5 + v * 2.5) * (15 + pain * 15 + diastolicSwell * 0.5);
        let cycleTwist = Math.sin(a * 4 + v * 10 * p) * (p * p * 25);
        let base_r = harmonic1 * ampMod + harmonic2 + angularWarp + cycleTwist + 5; 
        let shear = Math.sin(a * 6 + t * 10 + i + mP * 2.0) * (pain * 15);
        let ripple = 0;
        for(let w of waves) {
          let age = t - w.t, dist = Math.abs(a - w.a) + Math.abs(i - w.l) * 0.15; 
          ripple += Math.sin((dist - age * 4.0) / 0.6) * w.i * Math.exp(-age * (w.type === 'inject' ? 3.0 : 1.5));
        }
        let r = base_r + shear + ripple;
        let x = r * Math.cos(a), y = r * Math.sin(a), z = -120 + v * 240; 
        let dx = x * pulse_x, dy = y * pulse_y, dz = (z - 120) * pulse_z + 120; 
        y = dy; z = dz; y *= orientation; z *= orientation;
        let x_spin = x * Math.cos(spinAngle) - z * Math.sin(spinAngle);
        let z_spin = x * Math.sin(spinAngle) + z * Math.cos(spinAngle);
        let scale = 500 / Math.max(50, 500 + z_spin);
        a === 0 ? ctx.moveTo(x_spin * scale, y * scale) : ctx.lineTo(x_spin * scale, y * scale);
      }
      let r_c = Math.floor(255 * pain), g_c = Math.floor(200 * f), b_c = Math.floor(255 * f), alpha = 0.3 + f * 0.7;
      if (refractoryTimer > 60) { r_c = 50; g_c = 100; b_c = 255; ctx.shadowBlur = 10; ctx.shadowColor = '#4488ff'; } 
      else if (isInjecting) { r_c = 0; g_c = 255; b_c = 255; ctx.shadowBlur = 15; ctx.shadowColor = '#0ff'; } 
      else { ctx.shadowBlur = 0; }
      ctx.strokeStyle = `rgba(${r_c}, ${g_c}, ${b_c}, ${alpha})`; ctx.lineWidth = 1.2; ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.restore();

    // --- RENDER LINGUISTIC ANALYTICS ---
    let topLex = Object.entries(lexicon).sort((a, b) => b[1] - a[1]).slice(0, 5);
    
    // Calculate Top Transitions (Grammar Rules)
    let topTrans = [];
    for (let rA in transitions) {
      for (let rB in transitions[rA]) {
        topTrans.push({ from: rA, to: rB, count: transitions[rA][rB] });
      }
    }
    topTrans.sort((a, b) => b.count - a.count);
    topTrans = topTrans.slice(0, 5);

    // Get Current Dialect
    let dimKey = `D-${String(dimensionIndex).padStart(3, '0')}`;
    let currentDialect = dialects[dimKey] ? Object.entries(dialects[dimKey]).sort((a, b) => b[1] - a[1]).slice(0, 3) : [];

    // Draw Panels
    ctx.save();
    ctx.translate(620, 40);
    
    // Panel 1: Lexicon
    ctx.fillStyle = 'rgba(10, 15, 20, 0.8)'; ctx.fillRect(0, 0, 340, 140);
    ctx.strokeStyle = '#ff00ff'; ctx.strokeRect(0, 0, 340, 140);
    ctx.fillStyle = '#ff00ff'; ctx.font = '12px monospace'; ctx.fillText('LEXICON (Syntax Frequency)', 10, 20);
    topLex.forEach((w, i) => {
      ctx.font = 'bold 20px serif'; ctx.fillStyle = '#fff'; ctx.fillText(w[0].split('').join(' '), 15, 50 + i * 20);
      ctx.font = '12px monospace'; ctx.fillStyle = '#0ff'; ctx.fillText(`x${w[1]}`, 120, 50 + i * 20);
      ctx.fillStyle = 'rgba(0, 255, 255, 0.5)'; ctx.fillRect(160, 40 + i * 20, Math.min(150, w[1] * 2), 10);
    });

    // Panel 2: Markov Transitions (Grammar)
    ctx.translate(0, 160);
    ctx.fillStyle = 'rgba(10, 15, 20, 0.8)'; ctx.fillRect(0, 0, 340, 180);
    ctx.strokeStyle = '#ffea00'; ctx.strokeRect(0, 0, 340, 180);
    ctx.fillStyle = '#ffea00'; ctx.font = '12px monospace'; ctx.fillText('MARKOV GRAMMAR (Transitions)', 10, 20);
    topTrans.forEach((tr, i) => {
      ctx.font = 'bold 18px serif'; ctx.fillStyle = '#fff'; 
      ctx.fillText(`${tr.from.split('').join(' ')}  ⇒  ${tr.to.split('').join(' ')}`, 15, 50 + i * 25);
      ctx.font = '12px monospace'; ctx.fillStyle = '#ffea00'; ctx.fillText(`(${tr.count})`, 280, 50 + i * 25);
    });

    // Panel 3: Dimensional Dialect
    ctx.translate(0, 200);
    ctx.fillStyle = 'rgba(10, 15, 20, 0.8)'; ctx.fillRect(0, 0, 340, 120);
    ctx.strokeStyle = '#aaffaa'; ctx.strokeRect(0, 0, 340, 120);
    ctx.fillStyle = '#aaffaa'; ctx.font = '12px monospace'; ctx.fillText(`DIALECT: ${dimKey}`, 10, 20);
    currentDialect.forEach((w, i) => {
      ctx.font = 'bold 24px serif'; ctx.fillStyle = '#fff'; ctx.fillText(w[0].split('').join(' '), 15 + i * 100, 65);
      ctx.font = '10px monospace'; ctx.fillStyle = '#888'; ctx.fillText(`x${w[1]}`, 25 + i * 100, 85);
    });

    ctx.restore();

    // --- RENDER THE CODEX (Sentences grouped by breath) ---
    ctx.save();
    ctx.translate(0, 750);
    ctx.fillStyle = 'rgba(10, 15, 20, 0.95)'; ctx.fillRect(0, 0, 1000, 150);
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, 1000, 150);
    ctx.fillStyle = '#0ff'; ctx.font = '12px monospace'; ctx.fillText('THE KINEMATIC CODEX (Sentences delimited by Biological Breath)', 20, 20);

    sentences.forEach((sent, sIdx) => {
      let y = 50 + sIdx * 25;
      ctx.font = '10px monospace'; ctx.fillStyle = '#888';
      ctx.fillText(`[D-${String(sent.dim).padStart(3, '0')}]`, 20, y);
      
      sent.words.forEach((w, wIdx) => {
        let x = 80 + wIdx * 65;
        if (x > 950) return;
        ctx.font = 'bold 18px serif'; 
        ctx.fillStyle = w.weight > 0.7 ? '#ffea00' : (w.weight < 0.3 ? '#ff0044' : '#0ff');
        ctx.fillText(w.root.join(''), x, y);
      });
    });
    
    // Render current active sentence
    let y = 50 + sentences.length * 25;
    ctx.font = '10px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText(`[D-${String(dimensionIndex).padStart(3, '0')} ACTIVE]`, 20, y);
    currentSentence.forEach((w, wIdx) => {
      let x = 120 + wIdx * 65;
      if (x > 950) return;
      ctx.font = 'bold 18px serif'; 
      ctx.fillStyle = w.weight > 0.7 ? '#ffea00' : (w.weight < 0.3 ? '#ff0044' : '#0ff');
      ctx.shadowBlur = 5; ctx.shadowColor = ctx.fillStyle;
      ctx.fillText(w.root.join(''), x, y);
      ctx.shadowBlur = 0;
    });
    // Blinking cursor for active sentence
    if (Math.floor(t * 2) % 2 === 0) {
      ctx.fillStyle = '#fff'; ctx.fillRect(120 + currentSentence.length * 65, y - 15, 10, 20);
    }

    ctx.restore();

    // HUD Updates
    let stateText = refractoryTimer > 0 ? "TOPOLOGICAL MELT" : (isInjecting ? "SLINGSHOT" : (pain < 0.05 ? "STASIS" : "IMPEDANCE"));
    document.getElementById('s').textContent = stateText;
    document.getElementById('f').textContent = f.toFixed(4);
    document.getElementById('par').textContent = orientation === 1 ? 'NORMAL' : 'INVERTED';
    document.getElementById('spn').textContent = currentSpinDir === 1 ? 'PROGRADE' : 'RETROGRADE';
    document.getElementById('phase').textContent = phaseText;
    document.getElementById('pulse').textContent = refractoryTimer > 60 ? "MELT" : (beat_intensity > 0.2 ? "SYSTOLE" : "DIASTOLE");
    const now = new Date();
    document.getElementById('z').textContent = now.toISOString().replace(/\.\d{3}Z$/, `.${String(now.getMilliseconds()).padStart(3,'0')}Z`);

    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
