<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>4D Liquid Mix</title>
<style>
body{background:#000;color:#ccc;font-family:monospace;margin:0;display:flex;flex-direction:column;align-items:center;padding:10px}
canvas{border:1px solid #222}
</style></head>
<body>
<canvas id="c" width="600" height="600"></canvas>
<div id="hud"></div>
<script>
const c=document.getElementById('c'), g=c.getContext('2d');
let t=0, L={x:0.1,y:0,z:0};
let rot={xw:0,yz:0,wxw:0.3,wyz:0.2}; // 4D rotation angles and rates
let drop={ring:-1,age:99,amp:0};     // random impulse that decays

const hash=(x,y,z)=>{const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return s-Math.floor(s);};
const lerp=(a,b,k)=>a+(b-a)*k;
function vnoise(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  const xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  return lerp(lerp(lerp(hash(xi,yi,zi),hash(xi+1,yi,zi),u),lerp(hash(xi,yi+1,zi),hash(xi+1,yi+1,zi),u),v),
              lerp(lerp(hash(xi,yi,zi+1),hash(xi+1,yi,zi+1),u),lerp(hash(xi,yi+1,zi+1),hash(xi+1,yi+1,zi+1),u),v),w);
}
function fbm(x,y,z){let s=0,a=0.5,f=1;for(let o=0;o<4;o++){s+=a*vnoise(x*f,y*f,z*f);f*=2;a*=0.5;}return s;}

function frame(){
  g.fillStyle='rgba(0,0,0,0.2)'; g.fillRect(0,0,600,600);
  t+=0.016;

  // Lorenz chaos (deterministic, but sensitive to tiny changes)
  for(let k=0;k<4;k++){
    const dt=0.005;
    const dx=10*(L.y-L.x), dy=L.x*(28-L.z)-L.y, dz=L.x*L.y-(8/3)*L.z;
    L.x+=dx*dt; L.y+=dy*dt; L.z+=dz*dt;
  }

  // Heartbeat envelope
  const phase=(t*1.2)%1;
  const beat=Math.min(1, Math.exp(-Math.pow((phase-0.1)*15,2))+0.6*Math.exp(-Math.pow((phase-0.3)*20,2)));

  // Random impulse on each beat: new 4D spin rates and a drop on a random ring
  if(phase<0.02 && drop.age>1){
    rot.wxw=(Math.random()-0.5)*1.2;
    rot.wyz=(Math.random()-0.5)*1.2;
    drop={ring:Math.floor(Math.random()*20)+1, age:0, amp:20+Math.random()*60};
  }
  drop.age+=0.016;
  const dropAmp=drop.amp*Math.exp(-drop.age*2.5);

  // 4D rotation angles advance at their random rates
  rot.xw+=rot.wxw*0.016; rot.yz+=rot.wyz*0.016;
  const cxw=Math.cos(rot.xw), sxw=Math.sin(rot.xw), cyz=Math.cos(rot.yz), syz=Math.sin(rot.yz);

  // Instability grows over time, so the liquid destabilizes gradually
  const instab=0.2+0.8*(1-Math.exp(-t*0.08));
  const sx=1+0.25*beat*(L.x/20), sy=1+0.25*beat*(L.y/20), sz=1+0.25*beat*(L.z/30);
  const cs=Math.cos(t*0.3), ss=Math.sin(t*0.3);

  g.save(); g.translate(300,300);
  const LAYERS=20, D=300; // 4D projection distance
  for(let i=1;i<=LAYERS;i++){
    const v=i/LAYERS;
    const baseR=Math.sin(v*Math.PI*0.85)*140+5;
    g.beginPath();
    for(let a=0;a<=Math.PI*2;a+=0.06){
      // Liquid: domain-warped fractal noise, so the surface flows
      const qx=fbm(Math.cos(a)*1.5, Math.sin(a)*1.5+v*2, t*0.15);
      const qy=fbm(Math.cos(a)*1.5+5.2, Math.sin(a)*1.5+v*2+1.3, t*0.15);
      const n=fbm(Math.cos(a)*1.5+instab*qx*2, Math.sin(a)*1.5+instab*qy*2, t*0.1);
      const dropTerm=(i===drop.ring)?dropAmp*Math.sin(a*4-drop.age*8):0;
      const r=baseR+(n-0.5)*60*(0.3+beat*instab)+dropTerm;

      // 3D point on the surface
      let x=r*Math.cos(a)*sx, y=r*Math.sin(a)*sy, z=(-120+v*240)*sz;
      // Fourth coordinate w, from the noise
      let w=(n-0.5)*120*instab;

      // 4D rotation: XW plane, then YZ plane
      let x1=x*cxw-w*sxw, w1=x*sxw+w*cxw;
      let y1=y*cyz-z*syz, z1=y*syz+z*cyz;

      // Project 4D -> 3D
      const k4=D/(D-w1);
      let X=x1*k4, Y=y1*k4, Z=z1*k4;

      // 3D spin, then project 3D -> 2D
      const xr=X*cs-Z*ss, zr=X*ss+Z*cs;
      const s=500/Math.max(50,500+zr);
      a===0 ? g.moveTo(xr*s,Y*s) : g.lineTo(xr*s,Y*s);
    }
    g.strokeStyle=`hsla(${(180+L.z*4+i*6)%360},100%,60%,${0.3+0.7*beat})`;
    g.lineWidth=1+2*beat;
    g.stroke();
  }
  g.restore();

  document.getElementById('hud').textContent=
    `LORENZ z:${L.z.toFixed(2)} | 4D ROT xw:${(rot.xw%(2*Math.PI)).toFixed(2)} yz:${(rot.yz%(2*Math.PI)).toFixed(2)} | INSTABILITY ${(instab*100).toFixed(0)}% | ${beat>0.2?'SYSTOLE':'DIASTOLE'}`;
  requestAnimationFrame(frame);
}
frame();
</script>
</body></html>
