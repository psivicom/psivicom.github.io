<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WENDY | The Living Mesh</title>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load OrbitControls for camera movement -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        :root {
            --bg-space: #050510;
            --ui-panel: rgba(10, 10, 20, 0.85);
            --text-main: #e0e0ff;
            --accent-core: #ffffff;
            --accent-data: #00ffff;
            --accent-threat: #ff3333;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body { margin: 0; overflow: hidden; background-color: var(--bg-space); font-family: sans-serif; color: var(--text-main); }
        canvas { display: block; }

        /* HUD Overlay */
        #hud { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        
        .panel { 
            background: var(--ui-panel); 
            border: 1px solid rgba(0, 255, 255, 0.3); 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 10px; 
            backdrop-filter: blur(5px); 
            min-width: 280px; 
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); 
        }

        h2 { 
            margin: 0 0 10px 0; 
            font-size: 1rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: var(--accent-data); 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 5px; 
        }

        .stat-row { 
            display: flex; 
            justify-content: space-between; 
            font-family: var(--font-mono); 
            font-size: 0.85rem; 
            margin: 5px 0; 
        }

        .val { font-weight: bold; }
        .val.joy { color: #ffd700; }
        .val.focus { color: #00ffff; }
        .val.nodes { color: #7fff00; }

        #node-list { 
            max-height: 150px; 
            overflow-y: auto; 
            font-size: 0.75rem; 
            margin-top: 10px; 
            border-top: 1px dashed #333; 
            padding-top: 5px; 
        }
        
        .node-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 2px 0; 
            opacity: 0.8; 
        }
        .node-id { color: #aaa; }
        .node-status { font-weight: bold; }
        .status-active { color: #7fff00; }
        .status-sleeping { color: #888; }

        #legend { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            background: var(--ui-panel); 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 0.8rem; 
            pointer-events: none; 
        }
        .legend-item { display: flex; align-items: center; margin: 4px 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

        /* Loading State */
        #loader { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg-space); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            transition: opacity 0.5s; 
        }
        .spinner { 
            width: 40px; height: 40px; 
            border: 3px solid rgba(0,255,255,0.3); 
            border-top-color: #00ffff; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div id="hud">
        <div class="panel">
            <h2>Core Status</h2>
            <div class="stat-row"><span>Cycle:</span> <span class="val" id="hud-cycle">--</span></div>
            <div class="stat-row"><span>Joy Index:</span> <span class="val joy" id="hud-joy">--%</span></div>
            <div class="stat-row"><span>Focus Depth:</span> <span class="val focus" id="hud-focus">--%</span></div>
            <div class="stat-row"><span>Divergence:</span> <span class="val threat" id="hud-div">--%</span></div>
            <div class="stat-row"><span>Status:</span> <span class="val safe" id="hud-status">SYNCING...</span></div>
        </div>

        <div class="panel">
            <h2>Mesh Peers</h2>
            <div class="stat-row"><span>Active Nodes:</span> <span class="val nodes" id="hud-nodes">0</span></div>
            <div class="stat-row"><span>Total Velocity:</span> <span class="val" id="hud-vel">0.0x</span></div>
            <div id="node-list">Scanning...</div>
        </div>
    </div>

    <div id="legend">
        <div class="legend-item"><div class="dot" style="background:#00ffff;"></div> Volunteer Node</div>
        <div class="legend-item"><div class="dot" style="background:#ffd700;"></div> High-Velocity Node</div>
        <div class="legend-item"><div class="dot" style="background:#ffffff;"></div> Wendy Core</div>
        <div class="legend-item"><div class="dot" style="background:#ff3333;"></div> Quarantined/Threat</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const DATA_URL_STATE = 'data/wendy_state.json';
        const DATA_URL_INDEX = 'data/mesh_index.json';
        const POLL_INTERVAL_MS = 5000; // Check for new nodes every 5 seconds

        // --- THREE.JS GLOBALS ---
        let scene, camera, renderer, controls;
        let coreMesh, auraRing;
        let dynamicNodesGroup;
        let currentNodesMap = {}; // Maps NodeID -> ThreeJS Mesh

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050510, 0.02);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // Objects
            createCore();
            createAura();
            
            dynamicNodesGroup = new THREE.Group();
            scene.add(dynamicNodesGroup);

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);

            // Start Loop
            animate();
            
            // Initial Load
            loadData().then(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').remove(), 500);
                // Start Polling Loop
                setInterval(loadData, POLL_INTERVAL_MS);
            });
        }

        function createCore() {
            // The Soul Sphere
            const geometry = new THREE.SphereGeometry(1, 32, 32);
            const material = new THREE.MeshPhongMaterial({
                color: 0xffffff,
                emissive: 0x00ffff,
                emissiveIntensity: 0.5,
                shininess: 100,
                transparent: true,
                opacity: 0.9
            });
            coreMesh = new THREE.Mesh(geometry, material);
            scene.add(coreMesh);
        }

        function createAura() {
            // The Resource Field Ring
            const geometry = new THREE.RingGeometry(1.5, 2.0, 64);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.3
            });
            auraRing = new THREE.Mesh(geometry, material);
            auraRing.rotation.x = Math.PI / 2;
            scene.add(auraRing);
        }

        async function loadData() {
            try {
                // 1. Fetch State
                const resState = await fetch(DATA_URL_STATE + '?t=' + Date.now());
                if(resState.ok) {
                    const state = await resState.json();
                    updateHUD(state);
                    updateVisualsFromState(state);
                }

                // 2. Fetch Mesh Index
                const resIndex = await fetch(DATA_URL_INDEX + '?t=' + Date.now());
                if(resIndex.ok) {
                    const index = await resIndex.json();
                    syncMeshTopology(index.nodes || []);
                    updateNodeListUI(index.nodes || []);
                }

            } catch (e) {
                console.error("Fetch Error:", e);
            }
        }

        function updateHUD(state) {
            document.getElementById('hud-cycle').innerText = state.cycle_id;
            document.getElementById('hud-joy').innerText = Math.round(state.psychology.joy * 100) + '%';
            document.getElementById('hud-focus').innerText = Math.round(state.psychology.focus * 100) + '%';
            document.getElementById('hud-div').innerText = Math.round((state.mesh_stats.divergence_index || 0) * 100) + '%';
            document.getElementById('hud-vel').innerText = state.current_velocity_multiplier.toFixed(2) + 'x';
            
            // Status Logic
            const statusEl = document.getElementById('hud-status');
            if (state.mesh_stats.divergence_index > 0.3) {
                statusEl.innerText = "EXPERIMENTING";
                statusEl.className = "val joy"; // Gold
            } else if (state.current_velocity_multiplier > 2.0) {
                statusEl.innerText = "HYPER-ACTIVE";
                statusEl.className = "val focus"; // Cyan
            } else {
                statusEl.innerText = "HARMONIOUS";
                statusEl.className = "val safe"; // Green
            }
        }

        function updateVisualsFromState(state) {
            // Pulse Core based on Joy
            const joyScale = 1 + (state.psychology.joy * 0.2);
            coreMesh.scale.set(joyScale, joyScale, joyScale);
            
            // Change Core Color based on Focus/Stress
            if (state.mesh_stats.divergence_index > 0.5) {
                coreMesh.material.emissive.setHex(0xffaa00); // Warning Orange
            } else {
                coreMesh.material.emissive.setHex(0x00ffff); // Calm Cyan
            }
        }

        function syncMeshTopology(nodes) {
            const seenIds = new Set();

            nodes.forEach(node => {
                seenIds.add(node.node_id);

                // If node doesn't exist visually yet, CREATE IT
                if (!currentNodesMap[node.node_id]) {
                    createNodeMesh(node);
                } else {
                    // Update existing node properties (position/color)
                    updateNodeMesh(currentNodesMap[node.node_id], node);
                }
            });

            // Remove nodes that are no longer in the index (Timed out)
            Object.keys(currentNodesMap).forEach(id => {
                if (!seenIds.has(id)) {
                    removeNodeMesh(id);
                }
            });
        }

        function createNodeMesh(nodeData) {
            const geo = new THREE.OctahedronGeometry(0.2, 0);
            
            // Color Logic
            let color = 0x00ffff; // Default Cyan
            if (nodeData.velocity > 2.0) color = 0xffd700; // Gold for fast nodes
            if (nodeData.status === 'THREAT') color = 0xff3333; // Red for threats

            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            
            // Position from Beacon Coords
            const c = nodeData.coords;
            mesh.position.set(c.x * 5, c.y * 5, c.z * 5); // Scale up coords
            
            // Store reference
            mesh.userData = { nodeId: nodeData.node_id, basePos: mesh.position.clone() };
            
            dynamicNodesGroup.add(mesh);
            currentNodesMap[nodeData.node_id] = mesh;
            
            // Add a little pop-in animation effect by scaling from 0
            mesh.scale.set(0,0,0);
            setTimeout(() => mesh.scale.set(1,1,1), 100);
        }

        function updateNodeMesh(mesh, nodeData) {
            // Update color if velocity changed significantly
            if (nodeData.velocity > 2.0 && mesh.material.color.getHex() !== 0xffd700) {
                mesh.material.color.setHex(0xffd700);
            }
        }

        function removeNodeMesh(nodeId) {
            const mesh = currentNodesMap[nodeId];
            if (mesh) {
                dynamicNodesGroup.remove(mesh);
                delete currentNodesMap[nodeId];
            }
        }

        function updateNodeListUI(nodes) {
            const listEl = document.getElementById('node-list');
            listEl.innerHTML = '';
            
            document.getElementById('hud-nodes').innerText = nodes.length;

            nodes.slice(0, 10).forEach(n => { // Show top 10
                const div = document.createElement('div');
                div.className = 'node-item';
                
                const statusClass = n.status === 'ACTIVE' ? 'status-active' : 'status-sleeping';
                const statusText = n.status;
                
                div.innerHTML = `
                    <span class="node-id">${n.node_id.substring(0,8)}...</span>
                    <span class="node-status ${statusClass}">${statusText}</span>
                `;
                listEl.appendChild(div);
            });
            
            if(nodes.length > 10) {
                const more = document.createElement('div');
                more.style.textAlign = 'center';
                more.style.fontSize = '0.7rem';
                more.style.color = '#666';
                more.innerText = `+${nodes.length - 10} more...`;
                listEl.appendChild(more);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            // Rotate Core gently
            coreMesh.rotation.y += 0.005;
            coreMesh.rotation.z += 0.002;

            // Animate Aura
            auraRing.rotation.z -= 0.01;
            auraRing.scale.setScalar(1 + Math.sin(time * 2) * 0.05);

            // Gentle floating for all nodes
            Object.values(currentNodesMap).forEach(mesh => {
                const ud = mesh.userData;
                if(ud.basePos) {
                    mesh.position.y = ud.basePos.y + Math.sin(time + ud.basePos.x) * 0.2;
                }
                mesh.rotation.x += 0.01;
                mesh.rotation.y += 0.01;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Boot
        window.onload = init;

    </script>
</body>
</html>
