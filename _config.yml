# _config.yml
# SPDX-License-Identifier: EUPL-1.2
# SPDX-FileCopyrightText: 2026 Louis-Philippe Audette | PSIVI.COM

title: PSIVI
description: Sovereign Intelligence and Autonomous Mesh Research
baseurl: ""
url: "https://psivicom.github.io"

theme: minima

# BULLETPROOF: Exclude autonomously generated files and directories from Jekyll Liquid parsing
# This prevents crashes when WENDY generates files containing raw JSON or GitHub Actions syntax with {{ }}
exclude:
  - "AGENTS.md"
  - "WENDY_QWEN_ZIG_MESH.md"
  - "WENDY_QWEN_ZIG_MESH.md.md"
  - "docs/QWEN/"
  - "docs/experimental_wendy_latency.md"
  - "reports/"
  - "data/"
  - "src/"
  - "config/"
  - "dist/"
  - "*.psvc"
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules/"
  - "vendor/"
  - ".github/"

# Markdown and Plugins
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Default Front Matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
