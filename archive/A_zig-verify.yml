name: Build and Commit Zig Edge Node Clock

on:
  push:
    paths:
      - 'src/core/zulu_clock.zig'
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the binary back to the repo
    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Download Zig Toolchain
      - name: Download Zig Toolchain
        run: |
          echo "⬇️ Downloading Zig 0.11.0..."
          curl -sL https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.11.0" >> $GITHUB_PATH

      # 3. Compile & Test
      - name: Compile & Test
        run: |
          echo "🔨 Compiling pure-Zig Zulu Clock..."
          zig build-exe src/core/zulu_clock.zig -O ReleaseSafe -fstrip
          zig test src/core/zulu_clock.zig
          ./zulu_clock

      # 4. 🌟 Move to src/core/ and Commit Back to Repo
      - name: Commit Binary to src/core/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Move the compiled binary to the source directory
          mv ./zulu_clock ./src/core/zulu_clock
          
          # Configure Git for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add and commit only the binary
          git add src/core/zulu_clock
          git commit -m "chore: auto-update compiled zulu_clock binary in src/core/" || echo "No changes to commit"
          
          # Push back to the repository
          git push
