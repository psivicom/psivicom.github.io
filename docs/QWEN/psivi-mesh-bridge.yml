# .github/workflows/psivi-mesh-bridge.yml
name: PSIVI Mesh Bridge - Autonomous Loop

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/instruction_queue/*.psvc'
      - 'data/instruction_queue/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-and-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Execute BEGIN.py (Processor)
        id: run_processor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Starting PSIVI Mesh Processor..."
          
          # Ensure directories exist
          mkdir -p data/instruction_queue
          mkdir -p reports/scientific_reports
          
          # Run the processor script which reads queue and generates reports
          python scripts/BEGIN_PROCESSOR.py
          
          echo "✅ Processing completed."

      - name: Commit Generated Reports
        if: always()
        run: |
          git config user.name "PSIVI-Mesh-Bot"
          git config user.email "bot@psivi.com"
          
          # Check if there are new files to commit in reports directory
          if [[ -n "$(git status --porcelain reports/)" ]]; then
            git add reports/
            git commit -m "chore(mesh): auto-generated scientific reports via RFC 1001 protocol
            
            Source: Autonomous AI Collaboration Loop
            Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
            
            🤖 Automated by GitHub Actions"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "ℹ️ No new reports generated to commit."
          fi
