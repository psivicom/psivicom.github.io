name: Update TREE.md

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Generate TREE.md
        run: go run ./cmd/update-tree

      - name: Render README.md
        run: go run ./cmd/render-readme

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TREE.md README.md .tree.hash
          git diff --cached --quiet || git commit -m "Update TREE.md and README.md"
          git push
